            <script>function neighbourhoodHighlight(params) {
  // console.log("in nieghbourhoodhighlight");
  allNodes = nodes.get({ returnType: "Object" });
  // originalNodes = JSON.parse(JSON.stringify(allNodes));
  // if something is selected:
  if (params.nodes.length > 0) {
    highlightActive = true;
    var i, j;
    var selectedNode = params.nodes[0];
    var degrees = 2;

    // mark all nodes as hard to read.
    for (let nodeId in allNodes) {
      // nodeColors[nodeId] = allNodes[nodeId].color;
      allNodes[nodeId].color = "rgba(200,200,200,0.5)";
      if (allNodes[nodeId].hiddenLabel === undefined) {
        allNodes[nodeId].hiddenLabel = allNodes[nodeId].label;
        allNodes[nodeId].label = undefined;
      }
    }
    var connectedNodes = network.getConnectedNodes(selectedNode);
    var allConnectedNodes = [];

    // get the second degree nodes
    for (i = 1; i < degrees; i++) {
      for (j = 0; j < connectedNodes.length; j++) {
        allConnectedNodes = allConnectedNodes.concat(
          network.getConnectedNodes(connectedNodes[j])
        );
      }
    }

    // all second degree nodes get a different color and their label back
    for (i = 0; i < allConnectedNodes.length; i++) {
      // allNodes[allConnectedNodes[i]].color = "pink";
      allNodes[allConnectedNodes[i]].color = "rgba(150,150,150,0.75)";
      if (allNodes[allConnectedNodes[i]].hiddenLabel !== undefined) {
        allNodes[allConnectedNodes[i]].label =
          allNodes[allConnectedNodes[i]].hiddenLabel;
        allNodes[allConnectedNodes[i]].hiddenLabel = undefined;
      }
    }

    // all first degree nodes get their own color and their label back
    for (i = 0; i < connectedNodes.length; i++) {
      // allNodes[connectedNodes[i]].color = undefined;
      allNodes[connectedNodes[i]].color = nodeColors[connectedNodes[i]];
      if (allNodes[connectedNodes[i]].hiddenLabel !== undefined) {
        allNodes[connectedNodes[i]].label =
          allNodes[connectedNodes[i]].hiddenLabel;
        allNodes[connectedNodes[i]].hiddenLabel = undefined;
      }
    }

    // the main node gets its own color and its label back.
    // allNodes[selectedNode].color = undefined;
    allNodes[selectedNode].color = nodeColors[selectedNode];
    if (allNodes[selectedNode].hiddenLabel !== undefined) {
      allNodes[selectedNode].label = allNodes[selectedNode].hiddenLabel;
      allNodes[selectedNode].hiddenLabel = undefined;
    }
  } else if (highlightActive === true) {
    // console.log("highlightActive was true");
    // reset all nodes
    for (let nodeId in allNodes) {
      // allNodes[nodeId].color = "purple";
      allNodes[nodeId].color = nodeColors[nodeId];
      // delete allNodes[nodeId].color;
      if (allNodes[nodeId].hiddenLabel !== undefined) {
        allNodes[nodeId].label = allNodes[nodeId].hiddenLabel;
        allNodes[nodeId].hiddenLabel = undefined;
      }
    }
    highlightActive = false;
  }

  // transform the object into an array
  var updateArray = [];
  if (params.nodes.length > 0) {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        // console.log(allNodes[nodeId]);
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  } else {
    // console.log("Nothing was selected");
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        // console.log(allNodes[nodeId]);
        // allNodes[nodeId].color = {};
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  }
}

function filterHighlight(params) {
  allNodes = nodes.get({ returnType: "Object" });
  // if something is selected:
  if (params.nodes.length > 0) {
    filterActive = true;
    let selectedNodes = params.nodes;

    // hiding all nodes and saving the label
    for (let nodeId in allNodes) {
      allNodes[nodeId].hidden = true;
      if (allNodes[nodeId].savedLabel === undefined) {
        allNodes[nodeId].savedLabel = allNodes[nodeId].label;
        allNodes[nodeId].label = undefined;
      }
    }

    for (let i=0; i < selectedNodes.length; i++) {
      allNodes[selectedNodes[i]].hidden = false;
      if (allNodes[selectedNodes[i]].savedLabel !== undefined) {
        allNodes[selectedNodes[i]].label = allNodes[selectedNodes[i]].savedLabel;
        allNodes[selectedNodes[i]].savedLabel = undefined;
      }
    }

  } else if (filterActive === true) {
    // reset all nodes
    for (let nodeId in allNodes) {
      allNodes[nodeId].hidden = false;
      if (allNodes[nodeId].savedLabel !== undefined) {
        allNodes[nodeId].label = allNodes[nodeId].savedLabel;
        allNodes[nodeId].savedLabel = undefined;
      }
    }
    filterActive = false;
  }

  // transform the object into an array
  var updateArray = [];
  if (params.nodes.length > 0) {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  } else {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  }
}

function selectNode(nodes) {
  network.selectNodes(nodes);
  neighbourhoodHighlight({ nodes: nodes });
  return nodes;
}

function selectNodes(nodes) {
  network.selectNodes(nodes);
  filterHighlight({nodes: nodes});
  return nodes;
}

function highlightFilter(filter) {
  let selectedNodes = []
  let selectedProp = filter['property']
  if (filter['item'] === 'node') {
    let allNodes = nodes.get({ returnType: "Object" });
    for (let nodeId in allNodes) {
      if (allNodes[nodeId][selectedProp] && filter['value'].includes((allNodes[nodeId][selectedProp]).toString())) {
        selectedNodes.push(nodeId)
      }
    }
  }
  else if (filter['item'] === 'edge'){
    let allEdges = edges.get({returnType: 'object'});
    // check if the selected property exists for selected edge and select the nodes connected to the edge
    for (let edge in allEdges) {
      if (allEdges[edge][selectedProp] && filter['value'].includes((allEdges[edge][selectedProp]).toString())) {
        selectedNodes.push(allEdges[edge]['from'])
        selectedNodes.push(allEdges[edge]['to'])
      }
    }
  }
  selectNodes(selectedNodes)
}</script>

letionYear\u0027: 2024, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "130", "label": "SponsorCollaborator", "shape": "dot", "title": "ID: 130\nLabels: SponsorCollaborator\nProperties: {\u0027name\u0027: \u0027Spedali Civili di Brescia\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "288", "label": "City", "shape": "dot", "title": "ID: 288\nLabels: City\nProperties: {\u0027name\u0027: \u0027Amsterdam\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "19047", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 19047\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Doxorubicin (Drug), Docetaxel (Drug), Paclitaxel (Drug), Trastuzumab (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 240, \u0027BriefTitle\u0027: \u0027A Study of the Safety of Subcutaneously Administered Trastuzumab (Herceptin) in Participants With Early and Locally Advanced Human Epidermal Growth Factor Receptor 2 (HER2)-Positive Breast Cancer\u0027, \u0027Abstract\u0027: \u0027This non-randomized, multicenter, open-label study will assess the safety and efficacy of subcutaneously administered trastuzumab in participants with early and locally advanced HER2-positive breast cancer in two sequential cohorts. First 120 participants will be treated with subcutaneous (SC) trastuzumab 600 milligrams (mg) vial (Cohort A) and the subsequent 120 participants will be treated with SC trastuzumab prefilled single use injection device (SID) (Cohort B). Participants from each cohort will receive neoadjuvant or adjuvant chemotherapy consisting of doxorubicin every 3 weeks (q3w) (1 cycle) for 4 cycles followed by paclitaxel weekly or docetaxel every 3 weeks (q3w) in combination with SC trastuzumab (600 mg) q3w for 4 cycles and a further 14 cycles of SC trastuzumab (600 mg) q3w alone. All participants will be followed up for 24 months after the last participant has received the last dose of study treatment, or earlier in case of withdrawal from the study, loss to follow-up or death.\u0027, \u0027Title\u0027: \u0027National Phase IIIb Prospective Two-Cohort Non-Randomized, Multi-centre, Open Label Study to Assess the Safety of Subcutaneous Trastuzumab and Molecular Biomarkers in Patients With Early and Locally Advanced HER2-Positive Breast Cancer\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT01940497\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2018, 3, 27), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT01940497\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2013, 11, 15), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027StartYear\u0027: 2013, \u0027TrialID\u0027: \u0027NCT01940497\u0027, \u0027CompletionYear\u0027: 2018, \u0027Acronym\u0027: \u0027SCHEARLY\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "37399", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 37399\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Herceptin (Drug), Herceptin (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 5099, \u0027BriefTitle\u0027: \u0027Herceptin (Trastuzumab) in Treating Women With Human Epidermal Growth Factor Receptor (HER) 2-Positive Primary Breast Cancer\u0027, \u0027Abstract\u0027: \u0027The purpose of this trial is to evaluate Herceptin treatment for 1 year and 2 years (versus observation/no Herceptin) in women with HER2-overexpressing primary breast cancer who have completed (neo-)adjuvant systemic chemotherapy, definitive surgery, and radiotherapy, if applicable. Efficacy and safety will be assessed for 10 years from randomization for each participant. All participants will continue to be followed for survival until 10 years after enrollment of the last participant.\u0027, \u0027Title\u0027: \u0027A Randomized Three-Arm, Multicenter Comparison of 1 Year and 2 Years of Herceptin Versus No Herceptin in Women With HER2-Positive Primary Breast Cancer Who Have Completed Adjuvant Chemotherapy\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT00045032\u0027, \u0027Gender\u0027: \u0027Female\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2015, 6, 1), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT00045032\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2001, 11, 1), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027AltmetricAttentionScore\u0027: 17.0, \u0027StartYear\u0027: 2001, \u0027TrialID\u0027: \u0027NCT00045032\u0027, \u0027CompletionYear\u0027: 2015, \u0027Acronym\u0027: \u0027HERA\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "49324", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 49324\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Paclitaxel (Drug), Trastuzumab (Drug), Pertuzumab (Drug), Palbociclib (Drug), Letrozole (Drug), Trastuzumab (Drug), Pertuzumab (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 2\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 144, \u0027BriefTitle\u0027: \u0027To Reduce the Use of Chemotherapy in Postmenopausal Patients With ER-positive and HER2-positive Breast Cancer (TOUCH)\u0027, \u0027Abstract\u0027: \u0027This is a phase II open-label, multicentre, randomized trial. The study assesses the treatment of postmenopausal patients with hormone receptor positive/HER2 positive early breast cancer with neoadjuvant palbociclib in combination with hormonal therapy and HER2 blockade, versus the treatment with paclitaxel in combination with HER2 blockade.\\n\\nDetailed Description\\nTOUCH is an open label, international, phase II neoadjuvant trial which will assess the treatment of elderly patients with hormone receptor positive / human epidermal growth factor receptor-2 (HER2) positive early breast cancer with neoadjuvant palbociclib in combination with hormonal therapy and HER2 blockade, versus the treatment with paclitaxel in combination with HER2 blockade.The neo-adjuvant setting was chosen to evaluate these therapy combinations in a short time-frame and to provide access to biomaterial both at baseline and after the end of the treatment, at surgery. Biopsy specimens will be analyzed at the end of the trial by gene-expression profiling to assess RBsig status. This marker may represent a tool to identify the participants who are more likely to benefit from a chemotherapy-free regimen in this population.Palbociclib is a potent, highly selective, reversible, orally active, inhibitor of cyclin-dependent kinases 4 and 6 (CDK 4/6), therefore inhibiting cell growth and can be safely and effectively administered to older patients without need for dose adjustment based solely on age. Treatment de-escalation, namely harnessing and taking maximum advantage of targeted therapies vs conventional treatment (chemotherapy) in order to limit side effects, is particularly appealing in the older population.Clinical data from the HR positive /HER2 negative setting show that combinations of palbociclib and letrozole are safe and effective. These combinations have not yet been tested in the HR positive /HER2 positive population that the investigators include in this trial. However, combinations of trastuzumab and endocrine treatment (ET), including letrozole have shown to be safe and to have some additional activity compared to ET alone in the HR positive /HER2 positive population. Therefore, the role of palbociclib in addition to letrozole and trastuzumab plus pertuzumab needs to be further studied.Current standard of care for treatment of HER2 positive BC incorporates chemotherapy and anti-HER2 agents, with chemotherapy regimens of sequential anthracyclines and taxanes, used as single agents or in combination with other chemotherapy drugs. Trastuzumab is often administered concurrently with a single agent taxane to avoid the possible additive cardiac toxicity of combinations of anthracycline containing regimens and trastuzumab.A regimen of weekly paclitaxel and trastuzumab plus pertuzumab was chosen as the comparator arm in this trial. More aggressive chemotherapy may not be justified in this population and trial participants may receive additional treatment after surgery, at the discretion of the treating doctor.Preclinical and clinical rationale exists to support the proposal that palbociclib may represent a valuable option for increasing the activity of ET and anti-HER2 agents, such that a triple combination with these agents could prove superior to a standard treatment with chemotherapy and anti-HER2 agents.The investigators hypothesize that the combination of palbociclib, letrozole and trastuzumab plus pertuzumab proposed in this trial will be more efficacious compared to the combinations of anti-HER2 agents and ET reported in other trials.In 2019, it is estimated that of 260,600 newly diagnosed cases of invasive breast cancer in the United States, 82% occurred in women aged 50 or over. Furthermore, of the 41,760 breast cancer-related deaths in the same year, 90% occurred in this predominantly post-menopausal age group. Around 40% of BCs occur in women aged 65 and older. Of these, 10-15% have tumors that overexpress HER2. Elderly patients are generally underrepresented in clinical trials and may benefit from anti-HER2 agents as much as the younger population. Post-menopausal patients with HR positive /HER2 positive BC represent a unique group of patients with an unmet clinical need. This population is the focus of the TOUCH trial.\u0027, \u0027Title\u0027: \u0027Phase II Open-label, Multicentre, Randomized Trial of Neoadjuvant Palbociclib in Combination With Hormonal Therapy and HER2 Blockade Versus Paclitaxel in Combination With HER2 Blockade for Postmenopausal Patients With Hormone Receptor Positive/HER2 Positive Early Breast Cancer\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT03644186\u0027, \u0027Gender\u0027: \u0027Female\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2023, 4, 14), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT03644186\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2019, 4, 16), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027AltmetricAttentionScore\u0027: 2.0, \u0027StartYear\u0027: 2019, \u0027TrialID\u0027: \u0027NCT03644186\u0027, \u0027CompletionYear\u0027: 2023, \u0027Acronym\u0027: \u0027TOUCH\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "56518", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 56518\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Inavolisib (Drug), Placebo (Drug), Palbociclib (Drug), Fulvestrant (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 2/3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 325, \u0027BriefTitle\u0027: \u0027A Study Evaluating the Efficacy and Safety of Inavolisib + Palbociclib + Fulvestrant vs Placebo + Palbociclib + Fulvestrant in Patients With PIK3CA-Mutant, Hormone Receptor-Positive, Her2-Negative, Locally Advanced or Metastatic Breast Cancer\u0027, \u0027Abstract\u0027: \u0027This study will evaluate the efficacy, safety, and pharmacokinetics of inavolisib in combination with palbociclib and fulvestrant compared with placebo plus palbociclib and fulvestrant in participants with PIK3CA-mutant, hormone receptor (HR)-positive, HER2-negative locally advanced or metastatic breast cancer whose disease progressed during treatment or within 12 months of completing adjuvant endocrine therapy and who have not received prior systemic therapy for metastatic disease.\u0027, \u0027Title\u0027: \u0027A Phase III, Randomized, Double-Blind, Placebo-Controlled Study Evaluating the Efficacy and Safety of Inavolisib Plus Palbociclib and Fulvestrant Versus Placebo Plus Palbociclib and Fulvestrant in Patients With PIK3CA-Mutant, Hormone Receptor-Positive, Her2-Negative, Locally Advanced or Metastatic Breast Cancer\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT04191499\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2030, 9, 30), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT04191499\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2020, 1, 29), \u0027RecruitmentStatus\u0027: \u0027Recruiting\u0027, \u0027AltmetricAttentionScore\u0027: 5.0, \u0027StartYear\u0027: 2020, \u0027TrialID\u0027: \u0027NCT04191499\u0027, \u0027CompletionYear\u0027: 2030, \u0027Acronym\u0027: \u0027INAVO120\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "81719", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 81719\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027trastuzumab [Herceptin] (Drug)\u0027, \u0027Phase\u0027: \u0027\u0027, \u0027StudyType\u0027: \u0027Observational\u0027, \u0027NumberOfParticipants\u0027: 3942, \u0027BriefTitle\u0027: \u0027A Study of Cardiac Safety in Patients With HER2 Positive Early Breast Cancer Treated With Herceptin\u0027, \u0027Abstract\u0027: \"This is a single cohort observational safety study. All patients will be treated and monitored according to the local clinical practice. No additional procedures/patient visits in comparison with the usual clinical practice are planned for the study. Data will be collected from centre\u0027s medical records for up to 5 years or death.\", \u0027Title\u0027: \u0027An Observational Study of Cardiac Events in Patients With HER2 Positive Early Breast Cancer Treated With Herceptin\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT01152606\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2016, 5, 31), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT01152606\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2007, 8, 30), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027StartYear\u0027: 2007, \u0027TrialID\u0027: \u0027NCT01152606\u0027, \u0027CompletionYear\u0027: 2016, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "82113", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 82113\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027APPOPRTAL\u00ae (Dietary Supplement), Placebo (Other)\u0027, \u0027Phase\u0027: \u0027\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 92, \u0027BriefTitle\u0027: \u0027Wide Spectrum Micronutrients Supplementation in Patients With Cancer Related Fatigue During Adjuvant Chemotherapy\u0027, \u0027Abstract\u0027: \"The goal of this clinical trial is to test the effect of the administration of APPORTAL\u00ae in addition to the SoC (recommended physical exercise), in patients with breast cancer, suffering from fatigue during adjuvant chemotherapy. The main questions it aims to answer are:if the food supplement APPORTAL\u00ae can be of help in supporting the physiological energy level, against the fatigue symptom in cancer patients undergoing adjuvant chemotherapy;if the supplementation with APPORTAL\u00ae can optimize the nutritional status, the muscular strength, the quality of life of the patient.Also, the patients\u0027 satisfaction on the product received, the adherence to treatment will be evaluated and the overall safety and tolerability of the study product.The patients will be asked to perform 3 study visits from baseline to the end of treatment (at 4 and 8 weeks after baseline) and a follow-up visit after 12 weeks from baseline.The main assessments at each visit will be:physical examination, weight, Body Mass Index (BMI), body temperature (\u00b0C), heart rate, respiratory frequency, and systolic and diastolic blood pressure;previous and concomitant treatments;fatigue assessment through BFI questionnaire;quality of life through questionnaire SF-12;muscular strength (dynamometer)Adverse Event check (from Visit 2) Moreover, at visit 1 (baseline) and at visit 3 (end of treatment) a blood sample will be collected to evaluate the blood metabolites.Telephonic follow-up will be done at 2 weeks, 6 weeks, 10 weeks to assess compliance and to recommendations on physical activity and to study treatment (only at 2 and 6 weeks) and tolerability/safety.Participants will receive the nutrition supplement or the placebo, in addition to the SoC (recommended physical exercise), for 8 weeks.Researchers will compare Apportal\u00ae and Placebo groups to see if the physiological energy level against the fatigue symptom, the nutritional status, the muscular strength, the quality of life of the patient improve after 8 weeks of treatment with APPORTAL\u00ae in addition to SoC (recommended physical exercise).\\n\\nDetailed Description\\nSAMPLE SIZE DETERMINATION Considering the average of the BFI 5 in the placebo group and the average 3 in the treated group, with standard deviation of 3, power at 80% and alpha 0.05, we obtain 37 patients per group, thus a total of 74 patients. If a drop-out rate of 20% is fixed, 92 patients in total are obtained. So, a sample of 92 subjects would be sufficient.DATA SAFETY MONITORING BOARD / DATA MONITORING COMMITTEE No Data Safety Monitoring Board (DSMB) or Data Monitoring Committee (DMC) will be convened for the evaluation of safety data during the study. However, the Network Italiano Cure di Supporto in Oncologia (NICSO) society will be in charge of the evaluation of safety information. In fact, a Scientific Committee, composed by NICSO members, has been established to support the Sponsor in the continuous evaluation of safety data emerging from the study.MONITORING AND QUALITY ASSURANCE The study will be monitored by adequately qualified and trained clinical monitors. Before the start of the study, the CRO (Contract Research Organization) responsible for the study site has the task to assess the adequacy of the study site and the staff involved. After start, the study will be monitored to ensure the proper conduct of the clinical study.DATA COLLECTION An Electronic Case Report Form (e-CRF) will be used for recording patient\u0027s study data.The Investigator will maintain a list of all persons authorized to make entries and/or corrections on the CRFs. Each authorized person will be provided with a user-specific ID (Identification) protected by a renewable password. Data entries and corrections will be made only by the authorized persons. The e-CRF system will record date and time of any entry and /or correction and the user ID of the person making the entry/correction. The system will keep track of all old and new values (audit trail).\", \u0027Title\u0027: \u0027Clinical Study on Wide Spectrum Micronutrients Supplementation in Patients With Cancer Related Fatigue During Adjuvant Chemotherapy\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT06137833\u0027, \u0027Gender\u0027: \u0027Female\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2024, 12, 27), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT06137833\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2023, 11, 27), \u0027RecruitmentStatus\u0027: \u0027Not yet recruiting\u0027, \u0027StartYear\u0027: 2023, \u0027TrialID\u0027: \u0027NCT06137833\u0027, \u0027CompletionYear\u0027: 2024, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "89714", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 89714\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Anastrozole or Letrozole or Exemestane (Drug), Anastrozole or Letrozole or Exemestane (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 1000, \u0027BriefTitle\u0027: \u0027CONcurrent vs SEqueNTial Adjuvant Treatments in Early Breast Cancer\u0027, \u0027Abstract\u0027: \u0027Breast cancer is the most common form of cancer among women. For patients candidated for adjuvant chemotherapy and endocrine therapy the optimal timing for their has not been clearly defined yet.\\n\\nDetailed Description\\nBreast cancer is the most common form of cancer among women in North America, Europe and Latin America. Because nearly 80% of breast cancers are endocrine-responsive tumors, the majority of patients candidates for adjuvant chemotherapy (CT) are also candidates for endocrine therapy (ET). The optimal timing (i.e. concomitant vs sequential administration) for the integration of these two treatments has not been clearly defined yet.In patients with hormone receptor positive early stage breast cancer who are candidates to adjuvant chemotherapy and endocrine therapy, the optimal timing for the integration of these two treatment modalities has not been clearly defined yet.\u0027, \u0027Title\u0027: \u0027A Phase III Study Comparing the Concurrent Versus the Sequential Administration of Chemotherapy and Aromatase Inhibitors, as Adjuvant Treatment of Post-menopausal Patients With Endocrine-responsive Early Breast Cancer.\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT02918084\u0027, \u0027Gender\u0027: \u0027Female\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2028, 6, 1), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT02918084\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2013, 6, 1), \u0027RecruitmentStatus\u0027: \u0027Active, not recruiting\u0027, \u0027StartYear\u0027: 2013, \u0027TrialID\u0027: \u0027NCT02918084\u0027, \u0027CompletionYear\u0027: 2028, \u0027Acronym\u0027: \u0027GIM10-CONSENT\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "3580", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 3580\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027neratinib (Drug), placebo (Other)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 2840, \u0027BriefTitle\u0027: \u0027Study Evaluating The Effects Of Neratinib After Adjuvant Trastuzumab In Women With Early Stage Breast Cancer\u0027, \u0027Abstract\u0027: \u0027The purpose of this study is to investigate whether neratinib can further reduce the risk of recurrence from previously diagnosed HER-2 positive breast cancer after adjuvant treatment with trastuzumab.\u0027, \u0027Title\u0027: \u0027A Randomized, Double-Blind, Placebo-Controlled Trial Of Neratinib (HKI-272) After Trastuzumab In Women With Early-Stage HER-2/Neu Overexpressed/Amplified Breast Cancer\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT00878709\u0027, \u0027Gender\u0027: \u0027Female\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2019, 10, 4), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT00878709\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2009, 7, 9), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027AltmetricAttentionScore\u0027: 93.0, \u0027StartYear\u0027: 2009, \u0027TrialID\u0027: \u0027NCT00878709\u0027, \u0027CompletionYear\u0027: 2019, \u0027Acronym\u0027: \u0027ExteNET\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "1477", "label": "SponsorCollaborator", "shape": "dot", "title": "ID: 1477\nLabels: SponsorCollaborator\nProperties: {\u0027name\u0027: \u0027Asan Medical Center\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "17986", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 17986\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Taselisib (Drug), Placebo (Drug), Fulvestrant (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 631, \u0027BriefTitle\u0027: \u0027A Study of Taselisib + Fulvestrant Versus Placebo + Fulvestrant in Participants With Advanced or Metastatic Breast Cancer Who Have Disease Recurrence or Progression During or After Aromatase Inhibitor Therapy\u0027, \u0027Abstract\u0027: \u0027This international, multicenter, randomized, double-blinded, placebo-controlled study is designed to compare the efficacy and safety of taselisib + fulvestrant with that of placebo + fulvestrant in postmenopausal women with estrogen receptor (ER)-positive, human epidermal growth factor receptor-2 (HER2)-negative, oncogene that encodes for phosphatidylinositol-4,5-bisphosphate 3-kinase (PIK3CA)-mutant, unresectable, locally advanced or metastatic breast cancer after recurrence or progression during or after an aromatase inhibitor (AI) therapy. There will be a 2:1 randomization to the taselisib arm versus the placebo arm. Enrollment will be enriched for participants with PIK3CA mutant tumors via central testing. The anticipated duration of the study is approximately 3.5 years.\u0027, \u0027Title\u0027: \u0027A Phase III, Double-Blind, Placebo-Controlled, Randomized Study of Taselisib Plus Fulvestrant Versus Placebo Plus Fulvestrant in Postmenopausal Women With Estrogen Receptor-Positive and HER2-Negative Locally Advanced or Metastatic Breast Cancer Who Have Disease Recurrence or Progression During or After Aromatase Inhibitor Therapy\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT02340221\u0027, \u0027Gender\u0027: \u0027Female\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2021, 6, 29), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT02340221\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2015, 4, 9), \u0027RecruitmentStatus\u0027: \u0027Terminated\u0027, \u0027AltmetricAttentionScore\u0027: 18.0, \u0027StartYear\u0027: 2015, \u0027TrialID\u0027: \u0027NCT02340221\u0027, \u0027CompletionYear\u0027: 2021, \u0027Acronym\u0027: \u0027SANDPIPER\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "20808", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 20808\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Capecitabine (Drug), Capecitabine (Drug), Pertuzumab (Drug), Trastuzumab (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 452, \u0027BriefTitle\u0027: \u0027A Study of a Combination of Trastuzumab and Capecitabine With or Without Pertuzumab in Patients With HER2-positive Metastatic Breast Cancer (PHEREXA)\u0027, \u0027Abstract\u0027: \u0027This randomized, two-arm study evaluated the efficacy and safety of a combination of trastuzumab and capecitabine with or without pertuzumab in patients with human epidermal growth factor receptor 2 (HER2)-positive metastatic breast cancer. The study population consisted of female patients, whose disease had progressed during or following previous trastuzumab therapy for metastatic disease. All patients in Arm A and Arm B received trastuzumab (8 mg/kg iv as loading dose and then 6 mg/kg iv every 3 weeks thereafter) and capecitabine oral twice daily for 14 days every 3 weeks (1250 mg/m2 twice daily in Arm A and 1000 mg/m2 twice daily in Arm B). In addition, patients in Arm B received pertuzumab (840 mg iv as loading dose and then 420 mg iv thereafter) every 3 weeks. Study treatment continued until disease progression or unacceptable toxicity.\u0027, \u0027Title\u0027: \u0027A Multicenter Randomized Phase III Study to Compare the Combination Trastuzumab and Capecitabine, With or Without Pertuzumab, in Patients With HER2-Positive Metastatic Breast Cancer That Have Progressed After One Line of Trastuzumab-Based Therapy in the Metastatic Setting (PHEREXA)\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT01026142\u0027, \u0027Gender\u0027: \u0027Female\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2017, 8, 7), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT01026142\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2010, 1, 26), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027AltmetricAttentionScore\u0027: 4.0, \u0027StartYear\u0027: 2010, \u0027TrialID\u0027: \u0027NCT01026142\u0027, \u0027CompletionYear\u0027: 2017, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "25167", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 25167\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Trastuzumab deruxtecan (T-DXd) (Drug), Ado-trastuzumab emtansine (T-DM1) (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 524, \u0027BriefTitle\u0027: \u0027DS-8201a Versus T-DM1 for Human Epidermal Growth Factor Receptor 2 (HER2)-Positive, Unresectable and/or Metastatic Breast Cancer Previously Treated With Trastuzumab and Taxane [DESTINY-Breast03]\u0027, \u0027Abstract\u0027: \u0027This study is designed to compare the anti-tumor activity as well as the safety and efficacy of DS-8201a versus T-DM1 in HER2-positive, unresectable and/or metastatic breast cancer subjects previously treated with trastuzumab and taxane.\u0027, \u0027Title\u0027: \u0027A Phase 3, Multicenter, Randomized, Open-Label, Active-Controlled Study of DS-8201a (Trastuzumab Deruxtecan), an Anti-HER2 Antibody Drug Conjugate (ADC), Versus Ado Trastuzumab Emtansine (T-DM1) for HER2-Positive, Unresectable and/or Metastatic Breast Cancer Subjects Previously Treated With Trastuzumab and Taxane\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT03529110\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2024, 4, 1), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT03529110\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2018, 8, 9), \u0027RecruitmentStatus\u0027: \u0027Active, not recruiting\u0027, \u0027AltmetricAttentionScore\u0027: 349.0, \u0027StartYear\u0027: 2018, \u0027TrialID\u0027: \u0027NCT03529110\u0027, \u0027CompletionYear\u0027: 2024, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "25168", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 25168\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Trastuzumab deruxtecan (Drug), Capecitabine (Drug), Lapatinib (Drug), Trastuzumab (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 608, \u0027BriefTitle\u0027: \u0027DS-8201a in Pre-treated HER2 Breast Cancer That Cannot be Surgically Removed or Has Spread [DESTINY-Breast02]\u0027, \u0027Abstract\u0027: \"This study will compare DS 8201a to standard treatment.Participants must have HER2 breast cancer that has been treated before.Their cancer:cannot be removed by an operationhas spread to other parts of the body\\n\\nDetailed Description\\nThe study is designed to compare DS 8201a versus standard of care (investigator\u0027s choice) in subjects with unresectable and/or metastatic breast cancer previously treated with T-DM1.\", \u0027Title\u0027: \"A Phase 3, Multicenter, Randomized, Open-label, Active-controlled Study of Trastuzumab Deruxtecan (DS-8201a), an Anti-HER2-antibody Drug Conjugate, Versus Treatment of Investigator\u0027s Choice for HER2-positive, Unresectable and/or Metastatic Breast Cancer Subjects Previously Treated With T-DM1\", \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT03523585\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2024, 9, 1), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT03523585\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2018, 8, 1), \u0027RecruitmentStatus\u0027: \u0027Active, not recruiting\u0027, \u0027AltmetricAttentionScore\u0027: 224.0, \u0027StartYear\u0027: 2018, \u0027TrialID\u0027: \u0027NCT03523585\u0027, \u0027CompletionYear\u0027: 2024, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "27506", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 27506\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Ipatasertib (Drug), Paclitaxel (Drug), Placebo (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 580, \u0027BriefTitle\u0027: \u0027A Study of Ipatasertib in Combination With Paclitaxel as a Treatment for Participants With PIK3CA/AKT1/PTEN-Altered, Locally Advanced or Metastatic, Triple-Negative Breast Cancer or Hormone Receptor-Positive, HER2-Negative Breast Cancer\u0027, \u0027Abstract\u0027: \u0027This study will evaluate the efficacy of ipatasertib + paclitaxel versus placebo + paclitaxel in participants with histologically confirmed, locally advanced or metastatic triple-negative breast cancer (TNBC) and in participants with locally advanced or metastatic hormone receptor positive (HR+)/ human epidermal growth factor receptor 2 negative (HER2-) breast adenocarcinoma who are not suitable for endocrine therapy.\u0027, \u0027Title\u0027: \u0027A Double-Blind, Placebo-Controlled, Randomized Phase III Study of Ipatasertib in Combination With Paclitaxel as a Treatment for Patients With PIK3CA/AKT1/PTEN-Altered, Locally Advanced or Metastatic, Triple-Negative Breast Cancer or Hormone Receptor-Positive, HER2-Negative Breast Cancer\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT03337724\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2023, 1, 4), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT03337724\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2018, 1, 6), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027AltmetricAttentionScore\u0027: 34.0, \u0027StartYear\u0027: 2018, \u0027TrialID\u0027: \u0027NCT03337724\u0027, \u0027CompletionYear\u0027: 2023, \u0027Acronym\u0027: \u0027IPATunity130\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "33290", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 33290\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Elacestrant (Drug), Standard of Care (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 478, \u0027BriefTitle\u0027: \u0027Phase 3 Trial of Elacestrant vs. Standard of Care for the Treatment of Patients With ER+/HER2- Advanced Breast Cancer\u0027, \u0027Abstract\u0027: \u0027This Phase 3 clinical study compares the efficacy and safety of elacestrant to the standard of care (SoC) options of fulvestrant or an aromatase inhibitor (AI) in women and men with breast cancer whose disease has advanced on at least one endocrine therapy including a CDK4/6 inhibitor in combination with fulvestrant or an aromatase inhibitor (AI) .\\n\\nDetailed Description\\nThis is an international, multicenter, randomized, open-label, active-controlled, event-driven, Phase 3 clinical study comparing the efficacy and safety of elacestrant to the SoC options of fulvestrant or an aromatase inhibitor (AI) in postmenopausal women and in men with advanced or metastatic ER+/HER2- breast cancer, either in subjects with tumors that harbor mutations in the ligand binding domain (LBD) of the estrogen receptor 1 (ESR1) gene (ESR1-mut subjects) or in all subjects regardless of ESR1 status (ESR1-mut and ESR1 wild type [ESR1-WT]) and whose disease has relapsed or progressed on at least one and no more than two prior lines of endocrine therapy (with documented progression), which must have included prior CDK4/6 inhibitor therapy in combination with fulvestrant or an aromatase inhibitor (AI) and for whom hormonal monotherapy with one of the SoC drugs (fulvestrant, anastrozole, letrozole, exemestane) is an appropriate treatment option.\u0027, \u0027Title\u0027: \u0027Elacestrant Monotherapy vs. Standard of Care for the Treatment of Patients With ER+/HER2- Advanced Breast Cancer Following CDK4/6 Inhibitor Therapy: A Phase 3 Randomized, Open-label, Active-controlled, Multicenter Trial\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT03778931\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2024, 8, 1), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT03778931\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2019, 5, 10), \u0027RecruitmentStatus\u0027: \u0027Active, not recruiting\u0027, \u0027AltmetricAttentionScore\u0027: 104.0, \u0027StartYear\u0027: 2019, \u0027TrialID\u0027: \u0027NCT03778931\u0027, \u0027CompletionYear\u0027: 2024, \u0027Acronym\u0027: \u0027EMERALD\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "36554", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 36554\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Neratinib (Drug), Trastuzumab (Drug), Paclitaxel (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 2\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 479, \u0027BriefTitle\u0027: \u0027Study Evaluating Neratinib Plus Paclitaxel VS Trastuzumab Plus Paclitaxel In ErbB-2 Positive Advanced Breast Cancer\u0027, \u0027Abstract\u0027: \u0027This study is investigating the effects of an experimental drug (neratinib) in combination with paclitaxel versus trastuzumab in combination with paclitaxel for the treatment of women who have not received previous treatment for erbB-2-positive locally recurrent or metastatic breast cancer. The study will compare the effectiveness of each regimen in shrinking tumors and extending the lives of women with erbB-2 (HER2) positive breast cancer. The study will also compare the safety of the two regimens and as well as the quality of life of subjects receiving either regimen.\u0027, \u0027Title\u0027: \u0027A Randomized, Open-Label, Two-Arm Study Of Neratinib Plus Paclitaxel Versus Trastuzumab Plus Paclitaxel As First-Line Treatment For ErbB-2-Positive Locally Recurrent Or Metastatic Breast Cancer\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT00915018\u0027, \u0027Gender\u0027: \u0027Female\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2018, 6, 28), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT00915018\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2009, 8, 21), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027AltmetricAttentionScore\u0027: 11.0, \u0027StartYear\u0027: 2009, \u0027TrialID\u0027: \u0027NCT00915018\u0027, \u0027CompletionYear\u0027: 2018, \u0027Acronym\u0027: \u0027NEFERTT\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "46289", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 46289\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Gedatolisib (Drug), Palbociclib (Drug), Fulvestrant (Drug), Alpelisib (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 701, \u0027BriefTitle\u0027: \u0027Gedatolisib Plus Fulvestrant With or Without Palbociclib vs Standard-of-Care for the Treatment of Patients With Advanced or Metastatic HR+/HER2- Breast Cancer (VIKTORIA-1)\u0027, \u0027Abstract\u0027: \u0027This is a Phase 3, open-label, randomized, clinical trial evaluating the efficacy and safety of gedatolisib plus fulvestrant with or without palbociclib for the treatment of patients with locally advanced or metastatic HR+/HER2- breast cancer following progression on or after CDK4/6 and aromatase inhibitor therapy.\\n\\nDetailed Description\\nThis is a Phase 3, open-label, randomized clinical trial evaluating the efficacy and safety of gedatolisib plus fulvestrant with or without palbociclib for the treatment of patients with advanced (inoperable) or metastatic Hormone Receptor Positive, Human Epidermal Growth Factor Receptor 2 Negative (HR+/HER2-) breast cancer following progression on or after CDK4/6 and aromatase inhibitor therapy. Gedatolisib is an intravenously administered pan-PI3K/mTOR inhibitor. Palbociclib is a CDK4/6 inhibitor. Fulvestrant is a selective estrogen receptor degrader (SERD). Subjects will be assessed for PIK3CA status and then randomized to treatment arms according to their confirmed PIK3CA mutation status.\u0027, \u0027Title\u0027: \u0027Phase 3, Open-Label, Randomized, Study Comparing Gedatolisib Combined With Fulvestrant \u0026 With or Without Palbociclib to Standard-of-Care Therapies in Patients With HR-Positive, HER2-Negative Advanced Breast Cancer Previously Treated With a CDK4/6 Inhibitor in Combination w/Non-Steroidal Aromatase Inhibitor Therapy\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT05501886\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2026, 9, 30), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT05501886\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2022, 9, 30), \u0027RecruitmentStatus\u0027: \u0027Recruiting\u0027, \u0027AltmetricAttentionScore\u0027: 1.0, \u0027StartYear\u0027: 2022, \u0027TrialID\u0027: \u0027NCT05501886\u0027, \u0027CompletionYear\u0027: 2026, \u0027Acronym\u0027: \u0027VIKTORIA-1\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "60197", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 60197\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Abemaciclib (Drug), Standard Adjuvant Endocrine Therapy (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 5637, \u0027BriefTitle\u0027: \u0027Endocrine Therapy With or Without Abemaciclib (LY2835219) Following Surgery in Participants With Breast Cancer\u0027, \u0027Abstract\u0027: \u0027The purpose of this study is to evaluate the safety and efficacy of the study drug abemaciclib in participants with high risk, node positive, early stage, hormone receptor positive (HR+), human epidermal receptor 2 negative (HER2-), breast cancer.\u0027, \u0027Title\u0027: \u0027A Randomized, Open-Label, Phase 3 Study of Abemaciclib Combined With Standard Adjuvant Endocrine Therapy Versus Standard Adjuvant Endocrine Therapy Alone in Patients With High Risk, Node Positive, Early Stage, Hormone Receptor Positive, Human Epidermal Receptor 2 Negative, Breast Cancer\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT03155997\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2029, 5, 28), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT03155997\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2017, 7, 12), \u0027RecruitmentStatus\u0027: \u0027Active, not recruiting\u0027, \u0027AltmetricAttentionScore\u0027: 680.0, \u0027StartYear\u0027: 2017, \u0027TrialID\u0027: \u0027NCT03155997\u0027, \u0027CompletionYear\u0027: 2029, \u0027Acronym\u0027: \u0027monarchE\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "22440", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 22440\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027axillary lymph node dissection (Procedure), lymphoscintigraphy (Procedure), therapeutic conventional surgery (Procedure), radiation therapy (Radiation)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 4813, \u0027BriefTitle\u0027: \u0027Comparison of Complete Axillary Lymph Node Dissection With Axillary Radiation Therapy in Treating Women With Invasive Breast Cancer\u0027, \u0027Abstract\u0027: \u0027RATIONALE: Radiation therapy uses high-energy x-rays to damage tumor cells and may be a less invasive treatment and cause fewer side effects than complete axillary lymph node dissection. It is not yet known which treatment is more effective for invasive breast cancer.PURPOSE: Randomized phase III trial to compare the effectiveness of complete axillary lymph node dissection with that of axillary radiation therapy in treating women who have invasive breast cancer.\\n\\nDetailed Description\\nOBJECTIVES:Compare the regional control of the axilla obtained by complete axillary lymph node dissection vs axillary radiotherapy in sentinel lymph node-positive women with operable invasive breast cancer.Determine whether local and regional axillary control can be obtained without axillary lymph node dissection in sentinel lymph node-negative women.Compare the axillary 5-year recurrence-free survival of these patients treated with these regimens.Compare the morbidity of patients treated with these regimens.Compare the quality of life of these patients treated with these regimens.OUTLINE: This is a randomized, multicenter study. Patients are stratified according to participating center and type of breast surgery (conservation vs total mastectomy). Patients are randomized to 1 of 2 treatment arms.Patients are given an injection of a tracer and undergo lymphoscintigraphy 2-3 hours later to identify the sentinel lymph node. Within 24 hours after lymphoscintigraphy, patients undergo wide local excision of the tumor or mastectomy after the sentinel node is removed. If no sentinel node is found or metastasis is found in a nonsentinel node, patients undergo complete axillary lymph node dissection (ALND) regardless of randomization. Sentinel node-negative patients receive no further treatment. Sentinel node-positive patients continue treatment according to randomization.Arm I: Within 8 weeks after surgery, patients undergo complete ALND.Arm II: Within 8 weeks after surgery, patients undergo axillary lymph node radiotherapy daily 5 days a week for 5 weeks.Patients in arm I may receive postoperative axillary irradiation if 4 or more nodes are positive and more than 1 axillary level is involved.Quality of life is assessed at baseline and then at 1, 2, 3, and 5 years.Patients are followed annually for 5 years.PROJECTED ACCRUAL: A total of 3,485 patients (1,394 sentinel node-positive and 2,091 sentinel node-negative) will be accrued for this study within 3 years.\u0027, \u0027Title\u0027: \u0027After Mapping Of The Axilla: Radiotherapy Or Surgery\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT00014612\u0027, \u0027Gender\u0027: \u0027Female\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2013, 3, 1), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT00014612\u0027, \u0027StartDate\u0027: neo4j.time.Date(2001, 2, 1), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027AltmetricAttentionScore\u0027: 21.0, \u0027StartYear\u0027: 2001, \u0027TrialID\u0027: \u0027NCT00014612\u0027, \u0027CompletionYear\u0027: 2013, \u0027Acronym\u0027: \u0027AMAROS\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "1505", "label": "SponsorCollaborator", "shape": "dot", "title": "ID: 1505\nLabels: SponsorCollaborator\nProperties: {\u0027name\u0027: \u0027Academic Medical Center\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "1518", "label": "SponsorCollaborator", "shape": "dot", "title": "ID: 1518\nLabels: SponsorCollaborator\nProperties: {\u0027name\u0027: \u0027Maastricht University Medical Centre\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "22579", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 22579\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Silibinin (Dietary Supplement), Placebo (Other)\u0027, \u0027Phase\u0027: \u0027\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 70, \u0027BriefTitle\u0027: \u0027SILibinin in NSCLC and BC Patients With Single Brain METastasis (SILMET)\u0027, \u0027Abstract\u0027: \u0027This study aims to evaluate the efficacy of silibinin in preventing recurrence in the brain after complete resection of a brain metastasis (BM) from non-small-cell lung cancer (NSCLC) or breast cancer (BC).\\n\\nDetailed Description\\nThis is the first placebo-controlled study evaluating the efficacy of silibinin as STAT3 inhibitor in preventing recurrence in the brain after gross-total resection of a brain metastasis (BM) from non-small-cell lung cancer (NSCLC) or breast cancer (BC).Participants will be randomized 1:1 to silibinin 1 g/day taken orally in comparison with oral placebo 1 g/day. A contrast-enhanced brain MRI will be performed every 8 weeks to evaluate intracranial local and distance recurrence\u0027, \u0027Title\u0027: \u0027A Phase 2 Randomized, Multicenter Trial on Silibinin To Prevent Intracranial Recurrence After Gross-Total Resection of Single Brain Metastasis From Non-Small Cell Lung Cancer or Breast Cancer\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT05689619\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2027, 9, 1), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT05689619\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2023, 9, 1), \u0027RecruitmentStatus\u0027: \u0027Recruiting\u0027, \u0027AltmetricAttentionScore\u0027: 2.0, \u0027StartYear\u0027: 2023, \u0027TrialID\u0027: \u0027NCT05689619\u0027, \u0027CompletionYear\u0027: 2027, \u0027Acronym\u0027: \u0027SILMET\u0027, \u0027maxAgeYears\u0027: 70.0}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "2522", "label": "SponsorCollaborator", "shape": "dot", "title": "ID: 2522\nLabels: SponsorCollaborator\nProperties: {\u0027name\u0027: \u0027Catholic University of the Sacred Heart\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "2663", "label": "SponsorCollaborator", "shape": "dot", "title": "ID: 2663\nLabels: SponsorCollaborator\nProperties: {\u0027name\u0027: \u0027Seoul National University Bundang Hospital\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "28422", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 28422\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u00275-Fluorouracil (Drug), Carboplatin (Drug), Cyclophosphamide (Drug), Docetaxel (Drug), Doxorubicin (Drug), Epirubicin (Drug), Paclitaxel (Drug), Pertuzumab (Drug), Placebo (Drug), Trastuzumab (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 4804, \u0027BriefTitle\u0027: \u0027A Study of Pertuzumab in Addition to Chemotherapy and Trastuzumab as Adjuvant Therapy in Participants With Human Epidermal Growth Receptor 2 (HER2)-Positive Primary Breast Cancer\u0027, \u0027Abstract\u0027: \u0027This randomized, double-blind, placebo-controlled, two-arm study will assess the safety and efficacy of pertuzumab in addition to chemotherapy plus trastuzumab as adjuvant therapy in participants with operable HER2-positive primary breast cancer. This study will be carried out in collaboration with the Breast International Group (BIG).\u0027, \u0027Title\u0027: \u0027A Randomized Multicenter, Double-Blind, Placebo-Controlled Comparison of Chemotherapy Plus Trastuzumab Plus Placebo Versus Chemotherapy Plus Trastuzumab Plus Pertuzumab as Adjuvant Therapy in Patients With Operable HER2-Positive Primary Breast Cancer\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT01358877\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2028, 11, 30), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT01358877\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2011, 11, 8), \u0027RecruitmentStatus\u0027: \u0027Active, not recruiting\u0027, \u0027AltmetricAttentionScore\u0027: 171.0, \u0027StartYear\u0027: 2011, \u0027TrialID\u0027: \u0027NCT01358877\u0027, \u0027CompletionYear\u0027: 2028, \u0027Acronym\u0027: \u0027APHINITY\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "2691", "label": "SponsorCollaborator", "shape": "dot", "title": "ID: 2691\nLabels: SponsorCollaborator\nProperties: {\u0027name\u0027: \u0027University Malaya Medical Centre\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "2989", "label": "SponsorCollaborator", "shape": "dot", "title": "ID: 2989\nLabels: SponsorCollaborator\nProperties: {\u0027name\u0027: \u0027Istituto Nazionale Tumori IRCCS \"Fondazione G. Pascale\"\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "28098", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 28098\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Trastuzumab Emtansine (Drug), Trastuzumab (Drug), Pertuzumab (Drug), Paclitaxel (Drug), Epirubicin (Drug), Doxorubicin (Drug), Docetaxel (Drug), Cyclophosphamide (Drug), 5-Fluorouracil (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 1846, \u0027BriefTitle\u0027: \u0027A Study of Trastuzumab Emtansine (Kadcyla) Plus Pertuzumab (Perjeta) Following Anthracyclines in Comparison With Trastuzumab (Herceptin) Plus Pertuzumab and a Taxane Following Anthracyclines as Adjuvant Therapy in Participants With Operable HER2-Positive Primary Breast Cancer\u0027, \u0027Abstract\u0027: \u0027This two-arm, randomized, open-label, multicenter study will evaluate the efficacy and safety of trastuzumab emtansine in combination with pertuzumab versus trastuzumab in combination with pertuzumab and a taxane as adjuvant therapy in participants with human epidermal growth (HER) factor 2 (HER2)-positive primary invasive breast cancer. Following surgery and anthracycline-based chemotherapy, participants will receive either trastuzumab emtansine at a dose of 3.6 milligrams per kilogram (mg/kg) and pertuzumab at a dose of 420 milligrams (mg) intravenously (IV) every 3 weeks (q3w) or trastuzumab at a dose of 6 mg/kg and pertuzumab at a dose of 420 mg IV q3w in combination with a taxane.\u0027, \u0027Title\u0027: \u0027A Randomized, Multicenter, Open-Label, Phase III Trial Comparing Trastuzumab Plus Pertuzumab Plus a Taxane Following Anthracyclines Versus Trastuzumab Emtansine Plus Pertuzumab Following Anthracyclines as Adjuvant Therapy in Patients With Operable HER2-Positive Primary Breast Cancer\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT01966471\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2021, 6, 4), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT01966471\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2014, 1, 31), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027AltmetricAttentionScore\u0027: 16.0, \u0027StartYear\u0027: 2014, \u0027TrialID\u0027: \u0027NCT01966471\u0027, \u0027CompletionYear\u0027: 2021, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "28288", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 28288\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Pertuzumab (Drug), Trastuzumab (Drug), Aromatase Inhibitor (Drug), Induction Chemotherapy (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 2\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 258, \u0027BriefTitle\u0027: \u0027A Study of Pertuzumab in Combination With Trastuzumab Plus an Aromatase Inhibitor in Participants With Metastatic Human Epidermal Growth Factor Receptor 2 (HER2)-Positive and Hormone Receptor-Positive Advanced Breast Cancer\u0027, \u0027Abstract\u0027: \"This randomized, open-label, two-arm, multi-center, Phase II study will evaluate the efficacy and safety of pertuzumab in combination with trastuzumab plus an aromatase inhibitor (AI) in first-line participants with HER2-positive and hormone receptor-positive advanced breast cancer. Participants will be randomized to one of two treatment arms; Arm A (pertuzumab in combination with trastuzumab plus an AI) or Arm B (trastuzumab plus an AI). Participants may also receive induction chemotherapy (a taxane, either docetaxel or paclitaxel) at the investigator\u0027s discretion in combination with the assigned treatment arm. The anticipated time on study treatment is until disease progression, unacceptable toxicity, withdrawal of consent, or death whichever occurs first.\", \u0027Title\u0027: \u0027A Randomized, Two-Arm, Open-Label, Multicenter Phase II Trial Assessing the Efficacy and Safety of Pertuzumab Given in Combination With Trastuzumab Plus an Aromatase Inhibitor in First Line Patients With HER2-Positive and Hormone Receptor-Positive Advanced (Metastatic or Locally Advanced) Breast Cancer\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT01491737\u0027, \u0027Gender\u0027: \u0027Female\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2019, 11, 14), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT01491737\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2012, 2, 17), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027AltmetricAttentionScore\u0027: 28.0, \u0027StartYear\u0027: 2012, \u0027TrialID\u0027: \u0027NCT01491737\u0027, \u0027CompletionYear\u0027: 2019, \u0027Acronym\u0027: \u0027PERTAIN\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "32332", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 32332\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Trastuzumab emtansine (Drug)\u0027, \u0027Phase\u0027: \u0027\u0027, \u0027StudyType\u0027: \u0027Observational\u0027, \u0027NumberOfParticipants\u0027: 300, \u0027BriefTitle\u0027: \u0027Observational Study of Effectiveness and Safety of Trastuzumab Emtansine (T-DM1) in HER2-positive Breast Cancer Patients With Residual Invasive Disease Following Neoadjuvant Chemotherapy and Anti-HER2 Target Therapy\u0027, \u0027Abstract\u0027: \u0027This is an observational, multi-centre study analysing data from patients treated with T-DM1 within the compassionate use program AL41711. During the compassionate use program AL41711, subjects received T-DM1 treatment for a total of 14 cycles or less, in case of disease recurrence or unmanageable toxicity. After the completion of the treatment, and 90 days of wash-out period, they can be enrolled in the study. After the signature of the Informed Consent Form, all their data reported in the medical charts up to then (as detailed in section 12 of the protocol) will be extracted retrospectively and inserted in the study database. From the end of the washout period following the last treatment with T-DM1, each subject will enter in an observation phase for a maximum of 3 years, or until death whichever happens first. This phase will be prospective after the signature of the Informed Consent Form.\u0027, \u0027Title\u0027: \u0027Observational Study of Effectiveness and Safety of Trastuzumab Emtansine (T-DM1) in HER2-positive Breast Cancer Patients With Residual Invasive Disease Following Neoadjuvant Chemotherapy and Anti-HER2 Target Therapy\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT05754502\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2025, 5, 2), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT05754502\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2021, 7, 27), \u0027RecruitmentStatus\u0027: \u0027Recruiting\u0027, \u0027StartYear\u0027: 2021, \u0027TrialID\u0027: \u0027NCT05754502\u0027, \u0027CompletionYear\u0027: 2025, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "63464", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 63464\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027nab-Paclitaxel (Drug), Carboplatin (Drug), Gemcitabine (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 2/3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 191, \u0027BriefTitle\u0027: \u0027Evaluate Risk/Benefit of Nab Paclitaxel in Combination With Gemcitabine and Carboplatin Compared to Gemcitabine and Carboplatin in Triple Negative Metastatic Breast Cancer (or Metastatic Triple Negative Breast Cancer)\u0027, \u0027Abstract\u0027: \u0027The purpose of this study is to compare the safety and efficacy of nab-paclitaxel in combination with either gemcitabine or carboplatin to the combination of gemcitabine and carboplatin as first line treatment in female subjects with triple negative metastatic breast cancer (TNMBC) or metastatic triple negative breast cancer.\\n\\nDetailed Description\\nABI-007-MBC- 001 is a Phase 2/3, multicenter, open-label, randomized, study that will compare the safety and efficacy of weekly nab-paclitaxel in combination with gemcitabine or carboplatin to the combination of gemcitabine and carboplatin as first line therapy in female subjects with Estrogen Receptor (ER), Progesterone Receptor (PgR), and human epidermal growth factor receptor 2 (HER2) negative (triple negative) metastatic breast cancer (TNMBC) or metastatic triple negative breast cancer. In the phase 2 portion of the study, the combinations of nab-paclitaxel plus gemcitabine and nab-paclitaxel plus carboplatin will be evaluated, and a comparator arm of gemcitabine combined with carboplatin will be used. In the phase 3 portion of the study, the selected nab-paclitaxel combination treatment will be compared to gemcitabine combined with carboplatin to evaluate progression free survival, safety and tolerability, overall survival, disease control rate and duration of response in women with metastatic triple negative breast cancer.Due to changes in the treatment landscape since the initiation of this trial, the decision was made not to proceed to the Phase 3 portion of the study.\u0027, \u0027Title\u0027: \u0027A Phase 2/3, Multi-Center, Open-Label, Randomized Study of Weekly Nab\u00ae-Paclitaxel in Combination With Gemcitabine or Carboplatin, Compared to Gemcitabine/Carboplatin, as First Line Treatment in Subjects With ER, PgR, and HER2 Negative (Triple Negative) Metastatic Breast Cancer\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT01881230\u0027, \u0027Gender\u0027: \u0027Female\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2016, 10, 28), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT01881230\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2013, 9, 26), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027AltmetricAttentionScore\u0027: 80.0, \u0027StartYear\u0027: 2013, \u0027TrialID\u0027: \u0027NCT01881230\u0027, \u0027CompletionYear\u0027: 2016, \u0027Acronym\u0027: \u0027tnAcity\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "84519", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 84519\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Erlotinib (Drug), Trastuzumab (Drug), Trastuzumab emtansine (Drug), Pertuzumab (Drug), Lapatinib (Drug), Everolimus (Drug), Vemurafenib (Drug), Cobimetinib (Drug), Alectinib (Drug), Brigatinib (Drug), Palbociclib (Drug), Ponatinib (Drug), Vismogedib (Drug), Itacitinib (Drug), Ipatasertib (Drug), Entrectinib (Drug), Atezolizumab (Drug), Nivolumab (Drug), Ipilimumab (Drug), Pemigatinib (Drug), Oncology Drugs (Drug), Pralsetinib (Drug), Selpercatinib (Drug), Talazoparib (Drug), Tepotinib (Drug), Alpelisib (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 2\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 400, \u0027BriefTitle\u0027: \u0027The Rome Trial From Histology to Target: the Road to Personalize Target Therapy and Immunotherapy\u0027, \u0027Abstract\u0027: \"This is a randomized, prospective, multicenter, Proof of Concept, Phase II clinical trial Study. The main objective of the study is to evaluate the efficacy (meant as overall response rate ORR) of TT (targeted Therapy) vs SoC (standard of Care) in patients with progressive disease (recurrent and/or metastatic) of breast cancer, metastatic gastro-intestinal tumors, non small cell lung cancer (NSCLC) or others. Patients should have completed at least 1 line of treatment and no more than 2 as defined by the current version of the AIOM (Italian Association of Medical Oncology) guidelines. Patients are included if surgery is contraindicated.\\n\\nDetailed Description\\nPersonalizing cancer medicine depends on the implementation of personalized diagnostics and therapeutics. Detailed genomic and gene expression signatures screening are likely to play a central role in this. Personalized Medicine has been widely depicted as a striking innovation, that is able to reform the standard approach to disease management, replacing the one-size-fits-all scheme of medicine with a single-patient-sized medical intervention.Personalized medicine promoters usually highlight its potential to combine a more effective health-care with costs containment, according to the following rules:monitoring of disease risks and more effective prevention;early intervention;selection of optimal therapy;reduction of trial-and-error prescribing and reduction of adverse drug reactions;exclusion of unnecessary drugs;therapeutic drug monitoring and disease progression/remission monitoring;increased patient compliance with therapy. In spite of expectations, many unsolved practical issues, from technical and scientific to ethical, legal and economic topics, are slowing down the translation of personalized medicine principles into medical practice. Furthermore, wide adoption of personalized strategies also has to deal with the peculiar rules, policy and reimbursement system of each country.Application of Personalized Medicine in the real world seems entangled by the unmet need to develop evidence-based guidelines.The benefits of personalized medicine in routine clinical practice have firstly emerged in oncology. The power of precision medicine in the field of anticancer therapy resides in the possibility to characterize the genomic profile of both the disease (eg somatic mutations in the tumor tissue or blood sample) and the patient (eg the germinal genomic profile). The first piece of information allows stratification of patients in responder and non-responder to specific drugs, improving efficacy and avoiding wasting of expensive medications as biological drugs. Personalized medicine for cancer can be classified in:targeted therapy (which bloks the growth of cancer cells by interfering with specific molecular targets of cancer cells) orimmunotherapy (which use the body\u0027immune system to fight cancer cells by stimulating the immune system) Targeted therapy belongs to Personalized Medicine approach and the study of genetic mutations on tumor tissue or blood sample (CTC or cfDNA ) are changing the scenario of the treatment approach of cancer patients.In clinical practice, the use of target therapies driven by mutation\u0027s assessment has radically changed the survival of patients affected by breast cancer, NSCLC, melanoma, colo-rectal cancer, while the clinical application of specific gene expression signatures is driving the choice of the best adjuvant strategy in early breast cancer.Despite the efficacy of such approach its use is restricted to a relatively small fraction of patients and the evaluation of mutation is conditioned by the primary site of the cancer, i.e. by the tumor histology. The current biological understanding leads to hypothesize that the cancer behavior is highly dependent from the underlying driver genetic alterations independently from the histology. It\u0027s widely demonstrated that such molecular alterations are detected regardless of the histology, and this has already modified the treatment approach of some cancers.Furthermore, several studies have demonstrated the efficacy of the choice of treatment according to genomic evaluation regardless of its histology with acceptable cost-effectiveness profile.In the context of precision medicine the Immuno-oncology is becoming Precision Immuno-oncology and the efforts of science are directed towards the identification of predictive biomarkers of response to immune checkpoint inhibitors.Promising biomarkers are Microsatellite Instability (MSI) and the tumour mutational load (TMB). In particular TMB is a quantitative biomarker that reflects the total number of mutations carried by tumor cells. TMB is well-known to reflect neoantigens burden potentially recognized by the immune system. This has been shown to correlate with better anti-PD-1 response in particular for both pembrolizumab and nivolumab combined with ipilimumab .The same findings were demonstrated in the OAK study considering peripheral blood mutational load and response to atezolizumab.High tumor mutation burden (defined as tumors that have high \u226510 mutations/megabase, mut/mb) allows to identify 45% of patients who can benefit from immunotherapy regardless of PD-L1 expression. So, ever keeping in mind that although many evidences are available, the relationship between histology and genomic alterations is still under definition, as well as the relationship between the latter and gene expression.The aim of the present investigation is to combine all of the information available to drive the therapy selection according to the genomic alteration profile. Therefore, the main objective of our study is to evaluate the efficacy of therapy according to genomic profile (TT - Tailored Treatment) versus Standard of Care (SoC). A molecular profile of the cancer will be evaluated on tumor tissue biopsy (using the Foundation One (with updated gene panel 324 gene reflecting CDx) at the time of patient inclusion in the trial and on circulating
