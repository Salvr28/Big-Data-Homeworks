DNA fragments (i.e. using FoundationOne Liquid test) at the time of patient inclusion in the trial and at progression of disease.This study is a Phase II, randomized, multicenter, Proof of Concept, clinical trial. Patients with progressive disease (recurrent and/or metastatic) of breast cancer, metastatic gastro-intestinal tumors, non small cell lung cancer (NSCLC) or others will be included. Patients should have completed at least 1 line of treatment and no more than 2 as defined by the current version of the AIOM guidelines. Patients are included if surgery is contraindicated.Patients could have received targeted therapy for metastatic disease. A molecular profile of the cancer will be evaluated on tumor tissue biopsy and on ctDNA of around 1280 patients at patient inclusion.After FO evaluations patients with actionable mutations, not previous identified with other methods, for which approved drugs according to histotype are available, will be excluded.Once identified molecular abnormalities (not only those that are disease-specific), that can be modulated with target or immunotherapeutic intervention available within the present study, patients will be randomized to receive:ARM A: Therapy at choice of physician, according to Standard of Care (SoC) ARM B: Tailored treatment according to genomic profile (Tailored Treatment, TT)The Molecular Tumor Board (MTB) will define the target therapy and immunotherapy while standard treatment will be decided by study physicians.Patients should remain in the treatment phase of the study until investigator assesses radiographic or clinical progressive disease, unmanageable toxicity, or study termination.Tumor assessments will be conducted every 12 weeks from the date of randomization until any of the above events occurs.Delays in treatment administration will not impact the timing of the tumor assessments. If a tumor assessment must be performed early/late, subsequent assessments will be conducted according to the original schedule of every 12 weeks from the date of randomization.At the time of the first progression of disease:blood sample will be collected to evaluate the molecular profile of the cancer on circulating DNA fragments (i.e. using FoundationOne Liquid test)Study treatment (SoC or TT) will be interrupted waiting for the evaluations for the Rescue/Switched PhaseTumor assessments must be conducted until progressive disease (PD for RECIST 1.1 or iCPD for iRECIST if clinically indicated), even if treatment has been discontinued due to investigator-determined PD or unacceptable toxicity.After discontinuation of study treatment for reason different from progressive disease and withdrawal of consent, tumor assessments will continue until progression.In addition, patients will be followed for survival until death, loss to follow-up, withdrawal of consent, or study termination.\", \u0027Title\u0027: \u0027The Rome Trial From Histology to Target: the Road to Personalize Target Therapy and Immunotherapy\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT04591431\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2025, 6, 1), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT04591431\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2020, 10, 7), \u0027RecruitmentStatus\u0027: \u0027Active, not recruiting\u0027, \u0027AltmetricAttentionScore\u0027: 8.0, \u0027StartYear\u0027: 2020, \u0027TrialID\u0027: \u0027NCT04591431\u0027, \u0027CompletionYear\u0027: 2025, \u0027Acronym\u0027: \u0027ROME\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "89990", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 89990\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Trastuzumab Emtansine (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 2185, \u0027BriefTitle\u0027: \u0027A Study of Trastuzumab Emtansine in Participants With Human Epidermal Growth Factor Receptor 2 (HER2)-Positive Breast Cancer Who Have Received Prior Anti-HER2 And Chemotherapy-based Treatment\u0027, \u0027Abstract\u0027: \u0027This two-cohort, open-label, multicenter study will assess the safety, efficacy and tolerability of trastuzumab emtansine in participants with HER2-positive locally advanced breast cancer (LABC) or metastatic breast cancer (mBC) who have received prior anti-HER2 and chemotherapy-based treatment. Participants in Cohort 1 will be drawn from the general participant population; Cohort 2 will include only Asian participants.\u0027, \u0027Title\u0027: \u0027A Two-Cohort, Open-Label, Multicenter Study of Trastuzumab Emtansine (T-DM1) in HER2-Positive Locally Advanced or Metastatic Breast Cancer Patients Who Have Received Prior Anti-HER2 and Chemotherapy-Based Treatment\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT01702571\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2020, 7, 31), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT01702571\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2012, 11, 27), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027StartYear\u0027: 2012, \u0027TrialID\u0027: \u0027NCT01702571\u0027, \u0027CompletionYear\u0027: 2020, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "3073", "label": "SponsorCollaborator", "shape": "dot", "title": "ID: 3073\nLabels: SponsorCollaborator\nProperties: {\u0027name\u0027: \u0027Japanese Foundation for Cancer Research\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "3075", "label": "SponsorCollaborator", "shape": "dot", "title": "ID: 3075\nLabels: SponsorCollaborator\nProperties: {\u0027name\u0027: \u0027Seoul National University Hospital\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "17757", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 17757\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Palbociclib (Drug), Standard Adjuvant Endocrine Therapy (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 5796, \u0027BriefTitle\u0027: \u0027PALbociclib CoLlaborative Adjuvant Study\u0027, \u0027Abstract\u0027: \u0027This is a prospective, two arm, international, multicenter, randomized, open-label Phase III study evaluating the addition of 2 years of palbociclib to standard adjuvant endocrine therapy for patients with HR+ / HER2- early breast cancer (EBC).The purpose of the PALLAS study is to determine whether the addition of palbociclib to adjuvant endocrine therapy will improve outcomes over endocrine therapy alone for HR+/HER2- early breast cancer. Assessment of a variety of correlative analysis, including evaluation of the effect of palbociclib in genomically defined tumor subgroups, is planned.\u0027, \u0027Title\u0027: \u0027PALbociclib CoLlaborative Adjuvant Study: A Randomized Phase III Trial of Palbociclib With Standard Adjuvant Endocrine Therapy Versus Standard Adjuvant Endocrine Therapy Alone for Hormone Receptor Positive (HR+) / Human Epidermal Growth Factor Receptor 2 (HER2)-Negative Early Breast Cancer\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT02513394\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2025, 9, 1), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT02513394\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2015, 8, 1), \u0027RecruitmentStatus\u0027: \u0027Active, not recruiting\u0027, \u0027AltmetricAttentionScore\u0027: 106.0, \u0027StartYear\u0027: 2015, \u0027TrialID\u0027: \u0027NCT02513394\u0027, \u0027CompletionYear\u0027: 2025, \u0027Acronym\u0027: \u0027PALLAS\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "28041", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 28041\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Letrozole (Drug), Placebo (Other), Taselisib (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 2\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 334, \u0027BriefTitle\u0027: \u0027A Study of Neoadjuvant Letrozole + Taselisib Versus Letrozole + Placebo in Post-Menopausal Women With Breast Cancer (LORELEI)\u0027, \u0027Abstract\u0027: \u0027This is a two-arm, randomized, double-blind, multicenter, pre-operative study to evaluate the effect of combining letrozole and GDC-0032 (also known as taselisib) versus letrozole and placebo in postmenopausal women with estrogen receptor-positive (ER+)/human epidermal growth factor receptor 2 (HER2) untreated, Stage I-III operable breast cancer. Participants will be randomized into one of the two treatment arms with a 1:1 randomization ratio. Letrozole at 2.5 milligrams (mg) will be dosed once daily plus either Taselisib at 4 mg (two 2-mg tablets) or placebo on a 5 days-on/ 2 days-off schedule for a total of 16 weeks.\u0027, \u0027Title\u0027: \u0027A Phase II Randomized, Double-Blind Study of Neoadjuvant Letrozole Plus GDC-0032 Versus Letrozole Plus Placebo in Postmenopausal Women With ER-positive/HER2-negative, Early Stage Breast Cancer\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT02273973\u0027, \u0027Gender\u0027: \u0027Female\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2017, 3, 13), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT02273973\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2014, 11, 12), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027AltmetricAttentionScore\u0027: 27.0, \u0027StartYear\u0027: 2014, \u0027TrialID\u0027: \u0027NCT02273973\u0027, \u0027CompletionYear\u0027: 2017, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "3079", "label": "SponsorCollaborator", "shape": "dot", "title": "ID: 3079\nLabels: SponsorCollaborator\nProperties: {\u0027name\u0027: \u0027Samsung Medical Center\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "4629", "label": "SponsorCollaborator", "shape": "dot", "title": "ID: 4629\nLabels: SponsorCollaborator\nProperties: {\u0027name\u0027: \u0027A. O. Ordine Mauriziano di Torino\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "4667", "label": "SponsorCollaborator", "shape": "dot", "title": "ID: 4667\nLabels: SponsorCollaborator\nProperties: {\u0027name\u0027: \u0027Osaka International Cancer Institute\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "4801", "label": "SponsorCollaborator", "shape": "dot", "title": "ID: 4801\nLabels: SponsorCollaborator\nProperties: {\u0027name\u0027: \u0027Vilnius University\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "40008", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 40008\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Efaproxiral (Drug), Whole Brain Radiation Therapy (WBRT) (Radiation), Supplemental Oxygen (Other)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 368, \u0027BriefTitle\u0027: \u0027Whole Brain Radiation Therapy With Oxygen, With or Without RSR13, in Women With Brain Metastases From Breast Cancer\u0027, \u0027Abstract\u0027: \u0027RSR13 (efaproxiral) is a radiation sensitizer that has shown positive results in a Phase 3, randomized clinical trial of patients with brain metastases. Of 111 eligible breast cancer patients with brain metastases in that trial, 59 patients who received RSR13 prior to radiation therapy had a median survival time that was twice as long as the 52 patients who did not receive RSR13 prior to radiation therapy.RSR13 (efaproxiral) is an experimental drug that increases the amount of oxygen released from blood into the tissues. It is well known that certain types of cancer tumors, including those in brain metastases, lack oxygen. Lack of oxygen in a tumor can reduce the effect of radiation therapy (RT). RSR13 may increase the oxygen level in brain tumors so that radiation therapy works better.This study will enroll up to 360 women with brain metastases from breast cancer, and will evaluate if whole brain radiation therapy given with RSR13 will have a better treatment effect than whole brain radiation therapy alone. RSR13 will be infused intravenously (IV) through a central catheter placed in a central vein. Women randomized (assigned) to receive RSR13, therefore, will need to have a central catheter placed for treatment unless one is already in place.\\n\\nDetailed Description\\nThe screening process will include documentation of the cancer, which which will require a brain scan and may include a liver scan. Other screening measurements will include a Karnofsky Performance Status (KPS) assessment, measurement of the amount of oxygen in the blood, using a non-invasive device most often placed on the finger, lung function tests that will require blowing into a machine, and an electrocardiogram (ECG). About 2 teaspoons, or 10 mL, of blood will be taken for specific laboratory tests, and a pregnancy test will be done on the blood of women of childbearing potential.All study patients will receive supplemental oxygen and whole brain radiation therapy (WBRT) (30 Gy, 3 Gy fractions) every weekday for 2 weeks. Half of the patients will be randomized (assigned) to receive RSR13 prior to WBRT, and will need to have a central catheter placed for treatment unless one is already in place. Patients who receive RSR13 will also need to continue to receive oxygen in the clinic until the amount of oxygen in their blood is near normal. This level has returned to near normal in most patients within 1 to 2 hours.During treatment and follow-up visits, physical and neurological exam, KPS assessment, weight, height, and vital sign measurements, and about 2 teaspoons of blood may be required. Patients will need to return for follow-up visits 1 month after completion of treatment, 2 months later, and every 3 months thereafter until their doctor tells them otherwise.\u0027, \u0027Title\u0027: \u0027A Phase 3 Randomized, Open-label Comparative Study of Standard Whole Brain Radiation Therapy With Supplemental Oxygen, With or Without Concurrent RSR13 (Efaproxiral), in Women With Brain Metastases From Breast Cancer\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT00083304\u0027, \u0027Gender\u0027: \u0027Female\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2007, 6, 1), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT00083304\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2004, 2, 1), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027StartYear\u0027: 2004, \u0027TrialID\u0027: \u0027NCT00083304\u0027, \u0027CompletionYear\u0027: 2007, \u0027Acronym\u0027: \u0027ENRICH\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "9946", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 9946\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027\u0027, \u0027Phase\u0027: \u0027\u0027, \u0027StudyType\u0027: \u0027Observational\u0027, \u0027NumberOfParticipants\u0027: 830, \u0027BriefTitle\u0027: \u0027Follow-up in Early and Locally Advanced Breast Cancer Patients\u0027, \u0027Abstract\u0027: \u0027A cross-sectional follow-up study of Early and Locally Advanced Breast Cancer patients after primary treatment.\\n\\nDetailed Description\\nThe objective of this study is to assess follow-up patterns and identify patients with increased levels of physical and/or psychosocial problems after treatment in early breast cancer and locally advanced breast cancer.830 patients stratified by cancer sites and treatment - a minimum of 120 patients within each stratum - will be recruited.Institutional data on follow-up policy, demographic and clinical data (related to treatment history and tumor characteristics) will be collected. Patients will complete a set of 139 Quality of Life questions, at one single time point.Statistical analysis includes descriptive statistic for socio-demographic and clinical data, overall and per treatment, age and risk group. Patterns of follow-up will be identified and described overall, and per treatment, age, risk group and country.Where available, normative data will be used to identify those QoL domains where there is a clinically relevant difference with the general population.Multivariable model building will be used to build predictive models on the overall population to investigate determinants for the physical, sexual and emotional needs based on the identified PROM outcomes. Factor analysis will be undertaken to investigate the inter-correlations between physical, sexual and emotional needs in the overall population and in the relevant subgroups of interest.The magnitude of the observed differences will be assessed by clinical important effect size rather than by statistical significance.\u0027, \u0027Title\u0027: \u0027Follow-up in Early and Locally Advanced Breast Cancer Patients\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT03859453\u0027, \u0027Gender\u0027: \u0027Female\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2023, 12, 31), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT03859453\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2020, 10, 14), \u0027RecruitmentStatus\u0027: \u0027Active, not recruiting\u0027, \u0027StartYear\u0027: 2020, \u0027TrialID\u0027: \u0027NCT03859453\u0027, \u0027CompletionYear\u0027: 2023, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "10803", "label": "SponsorCollaborator", "shape": "dot", "title": "ID: 10803\nLabels: SponsorCollaborator\nProperties: {\u0027name\u0027: \u0027Antoni van Leeuwenhoek Hospital\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "19887", "label": "SponsorCollaborator", "shape": "dot", "title": "ID: 19887\nLabels: SponsorCollaborator\nProperties: {\u0027name\u0027: \u0027Amsterdam UMC Location VUmc\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "24171", "label": "SponsorCollaborator", "shape": "dot", "title": "ID: 24171\nLabels: SponsorCollaborator\nProperties: {\u0027name\u0027: \u0027Istituto Tumori Bari\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "35285", "label": "SponsorCollaborator", "shape": "dot", "title": "ID: 35285\nLabels: SponsorCollaborator\nProperties: {\u0027name\u0027: \u0027Onze Lieve Vrouwe Gasthuis\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "53354", "label": "SponsorCollaborator", "shape": "dot", "title": "ID: 53354\nLabels: SponsorCollaborator\nProperties: {\u0027name\u0027: \u0027Toranomon Hospital\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "55411", "label": "SponsorCollaborator", "shape": "dot", "title": "ID: 55411\nLabels: SponsorCollaborator\nProperties: {\u0027name\u0027: \u0027Fondazione Salvatore Maugeri\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "56817", "label": "SponsorCollaborator", "shape": "dot", "title": "ID: 56817\nLabels: SponsorCollaborator\nProperties: {\u0027name\u0027: \u0027Oncologia Medica\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "88451", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 88451\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u00275-Fluorouracil (Drug), Cyclophosphamide (Drug), Docetaxel (Drug), Doxorubicin (Drug), Epirubicin (Drug), Paclitaxel (Drug), Pertuzumab (Drug), Trastuzumab (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 2\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 401, \u0027BriefTitle\u0027: \u0027A Study Evaluating Pertuzumab (Perjeta) Combined With Trastuzumab (Herceptin) and Standard Anthracycline-based Chemotherapy in Participants With Human Epidermal Growth Factor Receptor 2 (HER2)-Positive Locally Advanced, Inflammatory, or Early-stage Breast Cancer\u0027, \u0027Abstract\u0027: \u0027This multicenter, non-randomized, open-label, phase 2 study is designed to evaluate the safety and efficacy of pertuzumab (Perjeta) in combination with trastuzumab (Herceptin) and anthracycline-based chemotherapy as neoadjuvant treatment in participants with HER2-positive locally advanced, inflammatory, or early-stage breast cancer. Each investigator will choose a treatment regimen (A or B) for all of their participants to follow. Treatment regimen A (for Cohort A) will include dose-dense doxorubicin and cyclophosphamide (ddAC), followed by paclitaxel, with pertuzumab and trastuzumab given from the start of paclitaxel. Treatment regimen B (for Cohort B) will include 5-fluorouracil, epirubicin, and cyclophosphamide (FEC), followed by docetaxel, with pertuzumab and trastuzumab given from the start of docetaxel. Participants in both cohorts will subsequently undergo surgical treatment and then resume pertuzumab and trastuzumab treatment.\u0027, \u0027Title\u0027: \u0027A Multicenter, Multinational, Phase II Study to Evaluate Perjeta in Combination With Herceptin and Standard Neoadjuvant Anthracycline-Based Chemotherapy in Patients With HER2-Positive, Locally Advanced, Inflammatory, or Early-Stage Breast Cancer\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT02132949\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2020, 8, 25), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT02132949\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2014, 7, 14), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027AltmetricAttentionScore\u0027: 24.0, \u0027StartYear\u0027: 2014, \u0027TrialID\u0027: \u0027NCT02132949\u0027, \u0027CompletionYear\u0027: 2020, \u0027Acronym\u0027: \u0027BERENICE\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "60428", "label": "SponsorCollaborator", "shape": "dot", "title": "ID: 60428\nLabels: SponsorCollaborator\nProperties: {\u0027name\u0027: \u0027Fondazione Piemontese per la Ricerca sul Cancro Onlus\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "61742", "label": "SponsorCollaborator", "shape": "dot", "title": "ID: 61742\nLabels: SponsorCollaborator\nProperties: {\u0027name\u0027: \u0027Dip. Medicina - S.C. Oncologia\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "61743", "label": "SponsorCollaborator", "shape": "dot", "title": "ID: 61743\nLabels: SponsorCollaborator\nProperties: {\u0027name\u0027: \u0027Irccs Istituto Nazionale Dei Tumori (Int)\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "88576", "label": "SponsorCollaborator", "shape": "dot", "title": "ID: 88576\nLabels: SponsorCollaborator\nProperties: {\u0027name\u0027: \u0027S.C. Medicina Oncologica 1\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "90337", "label": "SponsorCollaborator", "shape": "dot", "title": "ID: 90337\nLabels: SponsorCollaborator\nProperties: {\u0027name\u0027: \u0027Azienda USL di Ravenna\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "60754", "label": "Condition", "shape": "dot", "title": "ID: 60754\nLabels: Condition\nProperties: {\u0027name\u0027: \u0027multiple myeloma\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "60751", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 60751\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027\u0027, \u0027Phase\u0027: \u0027\u0027, \u0027StudyType\u0027: \u0027Observational\u0027, \u0027NumberOfParticipants\u0027: 705, \u0027BriefTitle\u0027: \u0027Real-world Use of Carfilzomib Among Multiple Myeloma Patients in Europe\u0027, \u0027Abstract\u0027: \u0027With the recent addition of carfilzomib as a treatment option for multiple myeloma, no data is available yet on how the drug is being used outside of the clinical trial setting.This study will therefore provide essential data to demonstrate the real world utilization of carfilzomib in routine clinical practice, including dosage, administration schedule, regimen, duration of treatment and reason for discontinuation in Europe.\\n\\nDetailed Description\\nWith the recent addition of carfilzomib as a treatment option for multiple myeloma, no data is available yet on how the drug is being used outside of the clinical trial setting.The Primary Objective is to describe carfilzomib utilisation in routine clinical practice, including dosage, administration schedule, regimen, duration of treatment and reason for discontinuation.Secondary Objectives:Describe the population treated with carfilzomib in terms of demographics, multiple myeloma (MM) disease characteristics, treatment history, and comorbidities.Describe the safety profile of carfilzomib in routine clinical practice.Describe response to treatment as assessed by the physician and recorded in the medical file.Describe healthcare resource utilisation of subjects treated with carfilzomib, in terms of unplanned hospitalisations.Describe the reasons for choosing carfilzomib as the MM treatment of choice.Describe specific concomitant therapy (bisphosphonates, thromboprophylaxis, antihypertensive treatment, anti-infective treatment) and whether these therapies were used as prophylaxis or as treatment.Describe a cardiovascular assessment at carfilzomib regimen initiation and at occurrence of cardiac adverse events, where available per routine care (electrocardiogram [ECG], echocardiography, left ventricular ejection fraction).\u0027, \u0027Title\u0027: \u0027Real-world Use of Carfilzomib Among Multiple Myeloma Patients in Europe Who Have Received at Least One Prior Therapy.\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT03091127\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2020, 3, 17), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT03091127\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2017, 3, 14), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027StartYear\u0027: 2017, \u0027TrialID\u0027: \u0027NCT03091127\u0027, \u0027CompletionYear\u0027: 2020, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "234", "label": "SponsorCollaborator", "shape": "dot", "title": "ID: 234\nLabels: SponsorCollaborator\nProperties: {\u0027name\u0027: \u0027Azienda Ospedaliera Universitaria Integrata Verona\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "3043", "label": "City", "shape": "dot", "title": "ID: 3043\nLabels: City\nProperties: {\u0027name\u0027: \u0027Akashi\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "71938", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 71938\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Bendamustine (Drug), Thalidomide (Drug), Dexamethasone (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 2\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 30, \u0027BriefTitle\u0027: \u0027Phase II Trial Designed to Determine Efficacy and Safety of Bendamustine+Dexamethasone+Thalidomide in R/R MM\u0027, \u0027Abstract\u0027: \u0027This is a prospective, multicenter phase II trial designed to determine efficacy and safety of a combination chemotherapy consisting of Bendamustine + Dexamethasone + Thalidomide in patients with multiple myeloma (MM) after treatment with lenalidomide and bortezomib or which are ineligible to one of these drugs.\\n\\nDetailed Description\\nEligible patients will be treated according to the following scheme until the occurrence of maximum response, dose limiting toxicity or disease progression. Repeat cycles every 28 days for a maximum of 6 cycles and a minimum of 4.Bendamustine 60 mg/m2 i.v. days 1, 8, 15Dexamethasone 20 mg p.o. days 1,8 , 15, 22Thalidomide 100 mg daily p.o. days 1-28; initial dose of 50 mg/day, with an increment to 100 mg after the first 15 days of treatment.\u0027, \u0027Title\u0027: \u0027Phase II Multicenter Clinical Trial to Investigate the Efficacy and Safety of Bendamustine, Dexamethasone and Thalidomide in R/R MM Pts After Treatment With Lenalidomide and Bortezomib or Which Are Ineligible to One of These Drugs\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT01526694\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2017, 4, 8), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT01526694\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2012, 7, 1), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027StartYear\u0027: 2012, \u0027TrialID\u0027: \u0027NCT01526694\u0027, \u0027CompletionYear\u0027: 2017, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "73982", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 73982\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Daratumumab (Drug), Pomalidomide (Drug), Dexamethasone (Drug), Bortezomib (Drug), Teclistamab (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 587, \u0027BriefTitle\u0027: \u0027A Study of Teclistamab in Combination With Daratumumab Subcutaneously (SC) (Tec-Dara) Versus Daratumumab SC, Pomalidomide, and Dexamethasone (DPd) or Daratumumab SC, Bortezomib, and Dexamethasone (DVd) in Participants With Relapsed or Refractory Multiple Myeloma\u0027, \u0027Abstract\u0027: \"The purpose of this study is to compare the efficacy of teclistamab daratumumab (Tec-Dara) with daratumumab subcutaneously (SC) in combination with pomalidomide and dexamethasone (DPd) or daratumumab SC in combination with bortezomib and dexamethasone (DVd).\\n\\nDetailed Description\\nTeclistamab is a novel B-cell maturation antigen (BCMA) bispecific antibody that is being evaluated to treat participants with multiple myeloma, an incurable malignant plasma cell disorder. The primary hypothesis of this study is that Tec-Dara will significantly improve progression free survival (PFS) compared with investigator\u0027s choice of DPd/DVd in participants with relapsed refractory multiple myeloma. Approximately 560 participants will be randomly assigned in a 1:1 ratio to receive either Tec-Dara (Arm A) or investigator\u0027s choice of DPd/DVd (Arm B). The study will be conducted in 3 phases: Screening Phase, Treatment Phase, and Follow-up Phase. Participants will be treated until disease progression, unacceptable toxicity, or other reasons to discontinue the study. Disease evaluation will occur every cycle. Safety will be assessed throughout the study. Efficacy will be assessed using International Myeloma Working Group (IMWG) criteria. The overall duration of the study will be approximately 5 years.\", \u0027Title\u0027: \u0027A Phase 3 Randomized Study Comparing Teclistamab in Combination With Daratumumab SC (Tec-Dara) Versus Daratumumab SC, Pomalidomide, and Dexamethasone (DPd) or Daratumumab SC, Bortezomib, and Dexamethasone (DVd) in Participants With Relapsed or Refractory Multiple Myeloma\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT05083169\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2026, 10, 1), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT05083169\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2021, 10, 14), \u0027RecruitmentStatus\u0027: \u0027Active, not recruiting\u0027, \u0027AltmetricAttentionScore\u0027: 467.0, \u0027StartYear\u0027: 2021, \u0027TrialID\u0027: \u0027NCT05083169\u0027, \u0027CompletionYear\u0027: 2026, \u0027Acronym\u0027: \u0027MajesTEC-3\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "3030", "label": "SponsorCollaborator", "shape": "dot", "title": "ID: 3030\nLabels: SponsorCollaborator\nProperties: {\u0027name\u0027: \u0027National Cancer Center Hospital East\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "1801", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 1801\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Modakafusp alfa (Drug), Dexamethasone (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 1/2\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 336, \u0027BriefTitle\u0027: \u0027A Study of Modakafusp Alfa on Adult Participants With Relapsed/Refractory Multiple Myeloma\u0027, \u0027Abstract\u0027: \u0027The main aims of this 3-part study are as follows:Part 1: To determine any side effects from modakafusp alfa single treatment and how often they occur. The dose of modakafusp alfa will be increased a little at a time until the highest dose that does not cause harmful side effects is found.Part 2: To assess clinical activity of one or more dosing schedules of modakafusp alfa alone in participants with relapsed/refractory multiple myeloma. Dexamethasone standard dose will be administered with one or more selected dose of modakafusp alfa in selected group of participants.Part 3: To find the optimal dose with the more favorable risk-benefit profile of modakafusp alfa.Participants will receive modakafusp alfa at one of two doses which will be given through a vein.\\n\\nDetailed Description\\nThe drug being tested in this study, and which will be given through a vein, is called modakafusp alfa (TAK-573 ) as single agent or in combination with dexamethasone. The study will determine the safety, tolerability, and efficacy of modakafusp alfa as single agent and in combination with dexamethasone in participants with relapsed/refractory multiple myeloma (RRMM). The study consists of 3 Parts:Part 1: Dose Escalation, Part 2: Dose Expansion, Part 3: Dose ExtensionThe study will enroll approximately 65 participants in Part 1, 35 in Part 2, and 236 in Part 3. Participants will be assigned to one of the following treatment groups in Parts 1 and 2 of the study. Participants will be randomly assigned in Part 3 of the study as given below:Part 1 (Dose Escalation) Schedule A: Modakafusp alfa 0.001 Up to 14 mg/kgPart 1 (Dose Escalation) Schedule B: Modakafusp alfa TBDPart 1 (Dose Escalation) Schedule C: Modakafusp alfa TBDPart 1 (Dose Escalation) Schedule D: Modakafusp alfa TBDPart 2 (Dose Expansion): Modakafusp alfa TBD + Dexamethasone 40 mgPart 3 (Dose Extension): Modakafusp alfa 120 mgPart 3 (Dose Extension): Modakafusp alfa 240 mgThe Part 1 (Dose Escalation) portion of the study will follow a 3+3 dose escalation design to evaluate once-weekly up to 4 different schedules of administration of modakafusp alfa starting at 0.001 mg/kg for dose limiting toxicity (DLT) evaluation and to determine the maximum tolerated dose (MTD) or an optimal biological dose (OBD) for assessments in Part 2.The Part 2 (Dose Expansion) will further assess the safety profile of modakafusp alfa and its efficacy at MTD or OBD.For Part 3 (Dose Extension) participants will be randomized 1:1 to receive single-agent modakafusp alfa 120 mg or 240 mg Q4W.Parts 1 and 2 will be conducted at multiple centers in the United States. Part 3 will be conducted worldwide. The maximum treatment duration in this study is up to 12 months (Parts 1 and 2) or until disease progression (Part 3) and overall time to participate in the study is approximately up to 90 months. Participants with clinical benefit may continue treatment after sponsor approval.\u0027, \u0027Title\u0027: \u0027A Phase 1/2 Open-label Study to Investigate the Safety and Tolerability, Efficacy, Pharmacokinetics, and Immunogenicity of Modakafusp Alfa (TAK-573) as a Single Agent in Patients With Relapsed Refractory Multiple Myeloma\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT03215030\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2024, 9, 3), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT03215030\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2017, 10, 4), \u0027RecruitmentStatus\u0027: \u0027Active, not recruiting\u0027, \u0027AltmetricAttentionScore\u0027: 93.0, \u0027StartYear\u0027: 2017, \u0027TrialID\u0027: \u0027NCT03215030\u0027, \u0027CompletionYear\u0027: 2024, \u0027Acronym\u0027: \u0027iinnovate-1\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "3333", "label": "SponsorCollaborator", "shape": "dot", "title": "ID: 3333\nLabels: SponsorCollaborator\nProperties: {\u0027name\u0027: \u0027Azienda Ospedaliero Universitaria Ospedali Riuniti\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "2244", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 2244\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Placebo (Drug), Ixazomib (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 706, \u0027BriefTitle\u0027: \u0027A Study of Oral Ixazomib Maintenance Therapy in Participants With Newly Diagnosed Multiple Myeloma (NDMM) Not Treated With Stem Cell Transplantation (SCT)\u0027, \u0027Abstract\u0027: \u0027The purpose of this study is to determine the effect of ixazomib maintenance therapy on progression free survival (PFS) compared with placebo, in participants with NDMM who have had a major response (complete response [CR], very good partial response [VGPR], or partial response [PR]) to initial therapy and who have not undergone SCT.\\n\\nDetailed Description\\nThe drug being tested in this study is called ixazomib citrate. Ixazomib citrate is being tested to slow progressive disease (PD) and improve overall survival in people who have NDMM who have had a major positive response to initial therapy and have not undergone SCT. This study will look at the effect of ixazomib citrate has on the length of time that participants are free of PD and their overall survival.The study will enrol approximately 700 participants. Participants will be randomly assigned (by chance, like flipping a coin) in 3:2 ratio to Ixazomib or matching placebo groups-which will remain undisclosed to the participant and study doctor during the study (unless there is an urgent medical need):Ixazomib citrate initiates at 3 mg which will be escalated to 4 mg with cycle 5 day 1Placebo (dummy inactive pill) - this is a capsule that looks like the study drug but has no active ingredientAll participants will be asked to take one capsule on Days 1, 8 and 15 of each 28-day cycle. The treatment period will be approximately 24 months (equivalent to 26 cycles) or until patients experience PD or unacceptable toxicities, whichever occurs first.This multi-center trial will be conducted worldwide. The overall time to participate in this study is approximately 78 to 106 months. Participants will make 28 visits to the clinic during the treatment period and will continue to make follow-up visits every 4 weeks until the next line of therapy begins. Participants will also be contacted by telephone every 12 weeks after last treatment visit for a follow-up assessment.\u0027, \u0027Title\u0027: \u0027A Phase 3, Randomized, Placebo-Controlled, Double-Blind Study of Oral Ixazomib Maintenance Therapy After Initial Therapy in Patients With Newly Diagnosed Multiple Myeloma Not Treated With Stem Cell Transplantation\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT02312258\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2022, 8, 26), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT02312258\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2015, 4, 9), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027AltmetricAttentionScore\u0027: 183.0, \u0027StartYear\u0027: 2015, \u0027TrialID\u0027: \u0027NCT02312258\u0027, \u0027CompletionYear\u0027: 2022, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "3996", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 3996\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Daratumumab (Drug), Bortezomib (Drug), Lenalidomide (Drug), Dexamethasone (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 2\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 200, \u0027BriefTitle\u0027: \u0027Phase 2 Study Applying MRD Techniques for Participants With Previously Untreated Multiple Myeloma Treated With D-VRd Prior To and After High-dose Therapy Followed by ASCT - TAURUS\u0027, \u0027Abstract\u0027: \u0027This is a multicenter, single arm, open-label, Phase 2 study in mutiple myeloma with newly diagnosed and treatment-na\u00efve participants for whom high-dose therapy and autologous stem cell transplantation is part of the intended treatment plan. The study is evaluating a technique called Mass Spectrometry Minimal Residual Disease (MS-MRD) using blood samples and compares it with the minimal residual disease (MRD) technique using bone marrow samples.\u0027, \u0027Title\u0027: \u0027Phase 2 Study Applying Innovative Minimal Residual Disease (MRD) Techniques for Participants With Previously Untreated Multiple Myeloma Treated With D-VRd Prior To and After High-dose Therapy Followed by Autologous Stem Cell Transplantation (ASCT) - TAURUS\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT06189833\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2025, 12, 1), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT06189833\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2023, 11, 23), \u0027RecruitmentStatus\u0027: \u0027Recruiting\u0027, \u0027StartYear\u0027: 2023, \u0027TrialID\u0027: \u0027NCT06189833\u0027, \u0027CompletionYear\u0027: 2025, \u0027Acronym\u0027: \u0027TAURUS\u0027, \u0027maxAgeYears\u0027: 70.0}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "15735", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 15735\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Selinexor (Drug), Bortezomib (Drug), Dexamethasone (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 402, \u0027BriefTitle\u0027: \u0027Bortezomib, Selinexor, and Dexamethasone in Patients With Multiple Myeloma\u0027, \u0027Abstract\u0027: \u0027This Phase 3, 2-arm, randomized, active comparator-controlled, open-label, multicenter study will compare the efficacy and health-related quality of life (HR-QoL) and assess the safety of selinexor plus bortezomib (Velcade) plus low-dose dexamethasone (SVd) versus bortezomib plus low-dose dexamethasone (Vd) in adult patients with RRMM who have received 1 to 3 prior anti-multiple myeloma (MM) regimens. Crossover from the Vd Arm to a treatment that includes selinexor (i.e., SVdX or SdX) will be allowed at the point of IRC-confirmed objective disease progression per the IMWG criteria for patients in the Vd Arm.\u0027, \u0027Title\u0027: \u0027A Phase 3 Randomized, Controlled, Open-label Study of Selinexor, Bortezomib, and Dexamethasone (SVd) Versus Bortezomib and Dexamethasone (Vd) in Patients With Relapsed or Refractory Multiple Myeloma (RRMM)\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT03110562\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2023, 9, 1), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT03110562\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2017, 5, 24), \u0027RecruitmentStatus\u0027: \u0027Active, not recruiting\u0027, \u0027AltmetricAttentionScore\u0027: 654.0, \u0027StartYear\u0027: 2017, \u0027TrialID\u0027: \u0027NCT03110562\u0027, \u0027CompletionYear\u0027: 2023, \u0027Acronym\u0027: \u0027BOSTON\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "17413", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 17413\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Elotuzumab (Drug), Pomalidomide (Drug), Dexamethasone (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 2\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 117, \u0027BriefTitle\u0027: \u0027An Investigational Immuno-therapy Trial of Pomalidomide and Low-dose Dexamethasone With or Without Elotuzumab to Treat Refractory and Relapsed and Refractory Multiple Myeloma (ELOQUENT-3)\u0027, \u0027Abstract\u0027: \u0027The purpose of this study is to determine if adding Elotuzumab to Pomalidomide and low-dose dexamethasone is a more effective treatment of relapsed and refractory multiple myeloma compared to pomalidomide and low-dose dexamethasone by itself.\u0027, \u0027Title\u0027: \u0027An Open Label, Randomized Phase 2 Trial of Pomalidomide/Dexamethasone With or Without Elotuzumab in Relapsed and Refractory Multiple Myeloma (ELOQUENT-3)\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT02654132\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2021, 10, 21), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT02654132\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2016, 3, 18), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027AltmetricAttentionScore\u0027: 70.0, \u0027StartYear\u0027: 2016, \u0027TrialID\u0027: \u0027NCT02654132\u0027, \u0027CompletionYear\u0027: 2021, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "18629", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 18629\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Ixazomib Citrate (Drug), Placebo (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 656, \u0027BriefTitle\u0027: \u0027A Study of Oral Ixazomib Citrate (MLN9708) Maintenance Therapy in Participants With Multiple Myeloma Following Autologous Stem Cell Transplant\u0027, \u0027Abstract\u0027: \u0027The purpose of this study is to determine the effect of ixazomib citrate maintenance therapy on progression-free survival (PFS), compared to placebo, in participants with newly diagnosed multiple myeloma (NDMM) who have had a response (complete response [CR], very good partial response [VGPR], or partial response [PR]) to induction therapy followed by high-dose therapy (HDT) and autologous stem cell transplant (ASCT).\\n\\nDetailed Description\\nThe investigational drug being tested in this study is called ixazomib citrate. Ixazomib citrate is being tested to slow disease progression and improve overall survival in people who have NDMM and who have had any type of positive response to induction therapy followed by HDT and ASCT. This study will look at the effect ixazomib citrate has on the length of time that participants are free of progressive disease (PD) and their overall survival (OS).The study enrolled 656 participants. Participants were randomly assigned (by chance, like flipping a coin) to one of the two treatment groups-which will remain undisclosed to the participant and study doctor during the study (unless there is an urgent medical need, or if the disease has progressed and the information is required for planning the next treatment):Ixazomib citrate 3 mg for the first 4 cycles, then 4 mg for the remaining 22 cyclesPlacebo (dummy inactive pill) - this is a capsule that looks like the study drug but has no active ingredient.All participants will be asked to take one capsule on Days 1, 8 and 15 of each 28-day cycle, for up to 26 cycles (approximately 24 months).This multi-center trial will be conducted globally. The overall time to participate in this study is up to 107 months. Participants will make 28 visits to the clinic during the treatment period and will continue to make visits after treatment has ended. During this initial follow up period, participants will be assessed for disease status with follow up every 12 weeks. After the next line of therapy begins, follow-up will occur every 12 weeks until death or termination of the study.\u0027, \u0027Title\u0027: \u0027A Phase 3, Randomized, Placebo-Controlled, Double-Blind Study of Oral Ixazomib Citrate (MLN9708) Maintenance Therapy in Patients With Multiple Myeloma Following Autologous Stem Cell Transplant\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT02181413\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2024, 7, 31), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT02181413\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2014, 7, 1), \u0027RecruitmentStatus\u0027: \u0027Active, not recruiting\u0027, \u0027AltmetricAttentionScore\u0027: 93.0, \u0027StartYear\u0027: 2014, \u0027TrialID\u0027: \u0027NCT02181413\u0027, \u0027CompletionYear\u0027: 2024, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "20014", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 20014\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Vorinostat (Drug), Lenalidomide (Drug), Dexamethasone (Drug), Lenalidomide (Drug), Dexamethasone (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 2\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027BriefTitle\u0027: \u0027Vorinostat Plus Lenalidomide and Dexamethasone or Lenalidomide Plus Dexamethasone in Multiple Myeloma Patients Who Experience Biochemical Relapse During Lenalidomide Maintenance Therapy\u0027, \u0027Abstract\u0027: \"Histone deacetylase (HDAC) inhibitors represent a potential new class of antitumor agents. Vorinostat (suberoylanilide Hydroxamic acid, SAHA) inhibits the activity of all 11 known human class I and II HDACs. HDACs have many protein targets whose structure and function are altered by acetylation, including histones and non-histones proteins component of transcription factors controlling gene expression and proteins that regulate cell proliferation, migration and death (1). Vorinostat has undergone initial evaluation in several phase I and II clinical trials in both solid and hematologic malignancies. It has shown activity in hematologic malignancies including Hodgkin\u0027s disease and non Hodgkin\u0027s lymphomas (2-5); it has been approved for treatment of cutaneous manifestation in patients with primary cutaneous T-cell lymphoma who have progressive, persistent or recurrent disease on or following two systemic therapies (6). HDAC function is critical for Multiple Myeloma (MM) cells by actively maintaining a transcriptional program indispensable for their uncontrolled proliferation and/or inappropriate resistance to pro-apoptotic stimuli. The pleiotropic anti-MM effects of Vorinostat and its ability to sensitize MM cellsto multiple conventional or novel agents (7) provide the framework for clinical trials of Vorinostat in MM. A phase I trial of oral Vorinostat alone in advanced MM shows modest activity, but treatment was generally well tolerated (common drug related adverse events (AEs) included fatigue, anorexia, dehydration, diarrhea and nausea and were mostly grade \u003c 2) (8). A phase I clinical trial of Vorinostat in association with Bortezomib in relapsed MM patients report a partial response (PR) rate of 42%, with responses occurring also in patients refractory to a previous Bortezomib based regimen. Treatment was generally well tolerated (main adverse events were myelosuppression, fatigue and diarrhea) (9). Lenalidomide is an active agent against MM, that as shown activity in both the relapse and newly diagnosed settings, in combination with chemotherapy or steroids only. The dose of Lenalidomide commonly used in the relapse setting, in association with steroids, is 25 mg/day on days 1-21 every 28 days (10, 11). A recent phase I study evaluated the safety and tolerability of Vorinostat in combination with Lenalidomide and Dexamethasone in relapsed patients:no dose limiting toxicities prohibited dose escalation, the maximum tolerated dose has not been reached and the maximum administered dose was Lenalidomide 25 mg/day on days 1-21, Dexamethasone 40 mg/day on days 1,8,15,22, Vorinostat 400 mg/day on days 1-7 and 15-21; each cycle was repeated every 28 days. Rate of at least PR was 51%, and activity was seen also in patients who received prior Lenalidomide therapy (clinical benefit reported in 69% of patients, including minimal response or better in 33% of Lenalidomide refractory patients). The most common drug related grade \u003e 3 AEs were neutropenia, thrombocytopenia, diarrhea, anemia and fatigue (12). Since Vorinostat has shown efficacy also in patients previously treated with Lenalidomide, and in patients refractory to Lenalidomide, the investigators hypothesis is that the addition of Vorinostat and low-dose dexamethasone to Lenalidomide (ZLd), in patients experiencing a biochemical relapse during a Lenalidomide maintenance ongoing therapy, can overcome Lenalidomide-drug resistance and result in a significant response rate, that can translate into a significant improvement in survival of MM patients. The second hypothesis is that, since the dose of Lenalidomide commonly administered in maintenance therapy, is 10 mg days 1-21 every 28 days, the increase in Lenalidomide dose to the standard dose used for relapsing patients, plus low-dose Dexamethasone (Ld), in patients experiencing a biochemical relapse during a Lenalidomide ongoing maintenance, can as well overcome Lenalidomide-drug resistance and determine a significant response rate, that can translate into a significant improvement in survival of MM patients.This is a multicenter non comparative, randomized, open label, phase II study. Patients, who are receiving Lenalidomide maintenance treatment with or without prednisone, will be randomized to receive:Cohort 1: ZLd association:Lenalidomide orally at the dose of 25 mg/day for 21 days every 28 days Vorinostat orally at the dose of 400 mg/day on days 1-7 and 15- 21 on a 28-day cycle.Dexamethasone orally at the dose of 40 mg day 1,8, 15, 22 every 28 days.Cohort 2: Ld association:Lenalidomide orally at the dose of 25 mg/day for 21 days every 28 days Dexamethasone orally at the dose of 40 mg day 1,8, 15, 22 every 28 days.Patients must have a -confirmed diagnosis of relapsed multiple myeloma. In this Phase II study, a total of up to 35 patients in the ZLd cohort and 48 in the Ld cohort will be enrolled. It is anticipated that full accrual to this study will take approximately 36 months.\", \u0027Title\u0027: \u0027A Phase II, Multi-center, Open-label, Randomized Study of Vorinostat Plus Lenalidomide and Dexamethasone or Lenalidomide Plus Dexamethasone in Multiple Myeloma Patients Who Experience Biochemical Relapse During Lenalidomide Maintenance Therapy\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT01501370\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2012, 1, 1), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT01501370\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2012, 1, 1), \u0027RecruitmentStatus\u0027: \u0027Withdrawn\u0027, \u0027StartYear\u0027: 2012, \u0027TrialID\u0027: \u0027NCT01501370\u0027, \u0027CompletionYear\u0027: 2012, \u0027Acronym\u0027: \u0027ZLd_Ld\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "26634", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 26634\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Carfilzomib (Drug), Bortezomib (Drug), Dexamethasone (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 929, \u0027BriefTitle\u0027: \u0027Phase 3 Study With Carfilzomib and Dexamethasone Versus Bortezomib and Dexamethasone for Relapsed Multiple Myeloma Patients\u0027, \u0027Abstract\u0027: \u0027The primary objective of this study was to compare progression-free survival in patients with multiple myeloma who relapsed after 1 to 3 prior therapies treated with carfilzomib plus dexamethasone or bortezomib plus dexamethasone.\u0027, \u0027Title\u0027: \u0027A Randomized, Open-label, Phase 3 Study of Carfilzomib Plus Dexamethasone vs. Bortezomib Plus Dexamethasone in Patients With Relapsed Multiple Myeloma\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT01568866\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2018, 2, 5), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT01568866\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2012, 6, 20), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027AltmetricAttentionScore\u0027: 99.0, \u0027StartYear\u0027: 2012, \u0027TrialID\u0027: \u0027NCT01568866\u0027, \u0027CompletionYear\u0027: 2018, \u0027Acronym\u0027: \u0027ENDEAVOR\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "30751", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 30751\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Carfilzomib (Drug), Bortezomib (Drug), Melphalan (Drug), Prednisone (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 955, \u0027BriefTitle\u0027: \u0027Phase 3 Study of Carfilzomib, Melphalan, Prednisone vs Bortezomib, Melphalan, Prednisone in Newly Diagnosed Multiple Myeloma\u0027, \u0027Abstract\u0027: \u0027The primary objective was to compare the progression-free survival of transplant ineligible patients newly diagnosed with multiple myeloma who were treated with carfilzomib, melphalan and prednisone (CMP) or with Velcade\u00ae (bortezomib), melphalan and prednisone (VMP).\u0027, \u0027Title\u0027: \u0027A Randomized, Open-label Phase 3 Study of Carfilzomib, Melphalan, and Prednisone Versus Bortezomib, Melphalan, and Prednisone in Transplant-ineligible Patients With Newly Diagnosed Multiple Myeloma\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT01818752\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2016, 11, 4), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT01818752\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2013, 7, 8), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027AltmetricAttentionScore\u0027: 7.0, \u0027StartYear\u0027: 2013, \u0027TrialID\u0027: \u0027NCT01818752\u0027, \u0027CompletionYear\u0027: 2016, \u0027Acronym\u0027: \u0027CLARION\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "38275", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 38275\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Daratumumab (Drug), Pomalidomide (Drug), Dexamethasone (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 2\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 45, \u0027BriefTitle\u0027: \u0027A Trial for Relapsed and Relapsed/Refractory Multiple Myeloma Patients\u0027, \u0027Abstract\u0027: \u0027Multiple myeloma (MM) with chromosome 17 deletion (del(17p) represents one of the most dangerous genetic variant of this disease, since it is associated with a high level of genomic instability. Del(17p) is present in approximately 10% of patients at diagnosis, and its frequency increases with disease evolution. The adverse prognosis of del(17p) has been observed in patients treated with conventional chemotherapy and new drugs. Only very few studies have suggested an advantage in treating del(17p) MM patients with specific therapies. In particular, several recent trials combining lenalidomide plus dexamethasone with a new agent, suggested that high risk cytogenetics patients may benefit from newest generation drugs. Yet, in all studies, outcome of patients with high risk genetic features have been derived from subgroup analyses, with all the limitations of this approach. To date no trial has been designed with the specific aim to test genotype-adapted therapies.The objective of the present study is to evaluate the combination of daratumumab-pomalidomide-dexamethasone (DPd) in relapsed or relapsed/refractory MM patients harboring del(17p).Treatment of relapsed or relapsed/refractory MM patients harbouring del(17p) is a relevant unmet medical need. A clinical trial designed to test a tailored treatment for this patient population would be a major improvement. In this perspective the combination DPd seems attractive since:both daratumumab and pomalidomide are therapies not interfering with DNA replication, thus not increasing the intrinsic genomic instability of del(17p) plasma cells.the POLLUX study has shown that daratumumab in combination with lenalidomide is highly effective in relapsed and relapsed/refractory MM patients.10the IFM 2010-02 trial has suggested that pomalidomide may be effective in del(17p) patients.the DPd combination has been successfully tested in MM patients with advanced disease.\\n\\nDetailed Description\\nPatients will undergo screening for protocol eligibility within 28 days (4 weeks) of enrolment.After providing written informed consent to participate in the study, patients will be evaluated for study eligibility. It is to note that patients can be enrolled based on the presence of del(17p), as per center evaluation. However, the presence of del(17p) should be confirmed by the central laboratory (University of Torino laboratory), which will perform the test in 5 working days.After registration, subjects who meet all the inclusion criteria will be treated according to the protocol, only after the presence of del(17p) has been confirmed by the central laboratory.Treatment period includes administration of 28-day cycles of treatment with DPd until any sign of progression or intolerance.The response will be assessed after each cycle. The LTFU period will start after development of confirmed progressive disease (PD) or treatment interruption due to toxicity. All patients are to be followed for survival during the LTFU period every 3 months via telephone or office visit.\u0027, \u0027Title\u0027: \u0027Daratumumab, Pomalidomide and Dexamethasone for Del(17p) Positive Relapsed and Relapsed/Refractory Multiple Myeloma Patients [DEDALO]\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT04124497\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2024, 7, 1), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT04124497\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2019, 7, 1), \u0027RecruitmentStatus\u0027: \u0027Active, not recruiting\u0027, \u0027StartYear\u0027: 2019, \u0027TrialID\u0027: \u0027NCT04124497\u0027, \u0027CompletionYear\u0027: 2024, \u0027Acronym\u0027: \u0027DPd\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "61172", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 61172\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027No Intervention (Other)\u0027, \u0027Phase\u0027: \u0027\u0027, \u0027StudyType\u0027: \u0027Observational\u0027, \u0027NumberOfParticipants\u0027: 4310, \u0027BriefTitle\u0027: \u0027An Observational Study of Presentation, Treatment Patterns, and Outcomes in Multiple Myeloma Participants\u0027, \u0027Abstract\u0027: \u0027The purpose of this study is to describe contemporary, real-world patterns of patient characteristics, clinical disease presentation, therapeutic regimen chosen, and clinical outcomes in participants with newly diagnosed [ND] multiple myeloma (MM) and participants with relapsed/refractory [R/R] MM.\\n\\nDetailed Description\\nThis is a prospective, non-interventional, observational study. This study will look at contemporary, real-world patterns of patient characteristics, clinical disease presentation, therapeutic regimen chosen, and clinical outcomes in participants with MM. Participants will not be asked to change their routine clinical treatment. Participants will have to complete patient reported outcomes (PROs) surveys during on-site routine office visits.The study will enroll approximately 4200 participants. Participants will be assigned to one of the following cohorts based upon the diagnosis of MM:ND MM within 3 months from initiation of treatmentR/R MM who have received 1 to 3 prior lines of therapyThis multi-center trial will be conducted worldwide. The overall time to participate in this study is up to 8 years. Participants will be evaluated and followed-up for a period of at least 5 years, until death, are lost to follow-up, or the end of the study, whichever comes first.\u0027, \u0027Title\u0027: \u0027A Global, Prospective, Non-interventional, Observational Study of Presentation, Treatment Patterns, and Outcomes in Multiple Myeloma Patients - the INSIGHT - MM Study\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT02761187\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2021, 9, 30), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT02761187\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2016, 7, 1), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027AltmetricAttentionScore\u0027: 119.0, \u0027StartYear\u0027: 2016, \u0027TrialID\u0027: \u0027NCT02761187\u0027, \u0027CompletionYear\u0027: 2021, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "68981", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 68981\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Quality of life questionnaires (Other)\u0027, \u0027Phase\u0027: \u0027\u0027, \u0027StudyType\u0027: \u0027Observational\u0027, \u0027NumberOfParticipants\u0027: 520, \u0027BriefTitle\u0027: \u0027Clinical Decision-making, Prognosis, Quality of Life and Satisfaction in Relapsed/Refractory Multiple Myeloma\u0027, \u0027Abstract\u0027: \u0027The primary objective is overall survival (OS) as predicted by baseline self-reported EORTC QLQ-C30 (European Organisation for Research and Treatment of Cancer Quality of Life Questionnaire-Core 30) fatigue scale ratings, independently from other prognostic factors for OS in multiple myeloma (MM), including the clinically-based prognostic frailty score.\\n\\nDetailed Description\\nWhile quality of life (QoL) and other types of patient-reported Outcomes (PROs) can be crucial in the management of RRMM patients, a perusal of the literature indicates a dearth of information in this area. PRO is defined by the US Food and Drug Administration (FDA) as \"a measurement based on a report that comes directly from the patient (i.e., study subject) about the status of a patient\\\u0027s health condition without amendment or interpretation of the patient\\\u0027s response by a clinician or anyone else. A PRO can be measured by self-report or by interview provided that the interviewer records only the patient\\\u0027s response. Until now the few studies that have included PRO data have been conducted in newly diagnosed MM patients enrolled in randomized controlled trials (RCTs).For the purpose of this protocol, we have conducted a systematic review of PRO studies conducted in RRMM patients receiving treatments with either Imunomodulatory agents (IMiDs) or Proteasome inhibitors (PIs). The search was conducted for studies published from January, 1990 to July, 2015 and yielded only eight studies published within this timeframe. Three studies dealt with bortezomib based regimens, two with thalidomide, and the remaining studies with carfilzomib, pomalidomide, and lenalidomide. In all these studies PROs were considered as secondary outcomes and in four this was analyzed in the context of RCTs.Despite enhanced disease control, none of the current novel agents, either IMiDs or PIs are free of significant toxicities, which frequently persist after completing treatment and continue to impair patient\\\u0027s daily functioning over the long-term period. Also, it is important to consider the poor prognosis for many of these patients. For example, patients who fail first-line PIs or IMiDs have been shown to report an average life expectancy of 9 months from the time of becoming refractory to PIs and IMiDs. Maintaining a \"good\" or \"acceptable\" level of QoL and lowering symptom burden over the longest possible period of time is a main goal of treatment for RRMM patients. Therefore, considering the paucity of QoL evidence-base data, CLARITY is designed to expand on some key understudied areas in this population that are broadly summarized in the next two paragraphs.\u0027, \u0027Title\u0027: \u0027CLinical Decision-making, Prognosis, quAlity of Life and Satisfaction With caRe in patIents With Relapsed/refracTory Multiple mYeloma (CLARITY)\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT03190525\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2024, 12, 1), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT03190525\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2017, 11, 13), \u0027RecruitmentStatus\u0027: \u0027Recruiting\u0027, \u0027StartYear\u0027: 2017, \u0027TrialID\u0027: \u0027NCT03190525\u0027, \u0027CompletionYear\u0027: 2024, \u0027Acronym\u0027: \u0027CLARITY\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "69912", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 69912\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Observation (Other)\u0027, \u0027Phase\u0027: \u0027\u0027, \u0027StudyType\u0027: \u0027Observational\u0027, \u0027NumberOfParticipants\u0027: 99, \u0027BriefTitle\u0027: \u0027PENELOPE Observational Study: Prophylaxis and Treatment of Arterial and Venous Thromboembolism\u0027, \u0027Abstract\u0027: \"The primary objective of the study is to assess efficacy and safety of different prophylactic or therapeutic antithrombotic approaches in patients with hematologic neoplasms and platelet count \u003c50 x109/L, including unfractionated or low molecular weight heparin, fondaparinux, anti-vitamin K agents, antiplatelet agents, novel oral anticoagulants, fibrinolytic agents, with or without a policy of platelet transfusion. Cases with arterial or venous thromboembolism managed with observation or use of vena cava filters in patients with venous thromboembolism will be included too.\\n\\nDetailed Description\\nIllness treatment overview The incidence of venous thromboembolism (VTE) among patients with haematological malignancies has been recently reviewed (1). For patients with lymphoma, the incidence of VTE ranged from 1.5 to 14.6% and is 59% in patients with central nervous system lymphoma. The incidence of VTE in patients with acute leukaemia varies with time, being between 1.4 and 9.6% at diagnosis and between 1.7 and 12% during induction therapy. Notably, the highest rates of VTE were reported in patients with acute promyelocytic leukaemia, with values between 6 and 16% in the largest series. In patients with multiple myeloma who did not receive antithrombotic prophylaxis, the rate of VTE increased to 26% in those undergoing treatment regimens including immumodulatory drugs (thalidomide and lenalidomide) (1). Moreover, in patients who have undergone autologous or allogeneic haematopoietic stem cell transplantation (HSCT), the rate of VTE is between 2.9 to 9.9%, and was central venous catheter (CVC)-associated in the majority of cases (2-4). VTE has been shown to occur even during periods of severe thrombocytopenia; one-third of the events from a patient series occurred when the platelet count was \u003c50 x109/L (3). Patients with acute leukaemia have a high risk of haemorrhage, mostly related to thrombocytopenia as a result of haematological disease and/or chemotherapy, such that the administration of anticoagulant drugs in this setting is problematic. No randomised controlled trials have addressed the issue of VTE treatment in patients with acute leukaemia, and the management of these cases is based only on small groups of patient series or experts\u0027 opinion. Five reports have described in detail cases of paediatric or adult patients with malignancies and thrombocytopenia who have been treated with heparin as a result of a VTE (5-9). Out of a total of 54 cases, 32 had haematological malignancies and a platelet nadir \u003c50 x109/L (reviewed in ref. 10). The majority of patients (22 of 32) had CVC-related thrombosis. A full dose of low molecular weight heparin (LMWH) bid was administered to the majority of the patients with CVC-related thrombosis and to the totality of patients for whom the thrombosis was not CVC-related. All patients received platelet transfusions if the platelet count fell below \u003c20-40 x109/L, and the dose of LMWH was halved when the platelet count was \u003c20 x109/L in one report. None of the patients had major bleeding. Rethrombosis occurred in three of 32 (9.3%) patients (6,7). In a large series of 379 patients with acute leukaemia, treatment for 20 patients who had one (n=16) or two (n= 4) VTE events was essentially based on the administration of enoxaparin 100 U/kg bid; in the case of a platelet count \u003c50 x109/L or in the clinical suspicion of bleeding risk the dose was reduced to 100 U/kg qd or 50 U/kg bid. Alternatively, the patients received a continuous i.v. infusion of unfractionated heparin (UFH) to obtain aPTTs in the lower therapeutic range (1.5 times greater than the basal value). Secondary prophylaxis after acute VTE was based on the administration of enoxaparin 100 U/kg qd in the case of ongoing chemotherapy or vitamin K-antagonists (VKA) (INR between 2 and 3) otherwise. In general, the length of secondary prophylaxis was reported to be not longer than six months (11). The safety of therapeutic anticoagulation treatment for the management of thrombocytopenic patients was also evaluated in two series of patients receiving HSCT (12,13). In 10 patients with multiple myeloma who had received autologous HSCT, anticoagulation was required following pre-transplant CVC-related subclavian vein thrombosis (n= 8), pulmonary embolism two months prior to transplant (n= 1), or a history of acute intermittent atrial fibrillation that was complicated by an arterial embolus to the leg (n= 1). Beginning on the first day of high-dose chemotherapy, the 10 patients received therapeutic UFH (a 5,000 U i.v. bolus followed by 1,000 U per h) to maintain aPTTs between 50 and 70 seconds and were switched to VKA treatment when their conditions stabilised. UFH treatment was interrupted once the VKA administration produced a therapeutic INR \u003e2 for two consecutive days. Heparinised patients received platelet transfusions to maintain counts \u003e30 x109/L. Three patients developed bleeding (haematuria, haematemesis, mucosal bleeding) that did not not require transfusion, and no thrombotic events occurred (12). In another series of 26 patients with HSCT who were given enoxaparin for the treatment of VTE, 21 patients had haematological malignancies. There were 25 VTE events recorded (four patients had two events at different sites) and 11 cases had upper extremity CVC-related deep venous thrombosis. During periods of thrombocytopenia (\u003c55 x109/L), enoxaparin administration was reduced to a median value of 49 U/kg/day (range 34-75) and was withdrawn in some instances when the platelet count fell below 20 x109/L. Two major bleeding events (8%) occurred, in one case fatal (13). The aforementioned data are insufficient for the production of evidence-based guidelines. Experts and the AIEOP (Associazione Italiana di Ematologia e Oncologia Pediatrica) have suggested that the first two weeks of treatment should consist of the administration of full-dose LMWH (anti-factor Xa level 0.5-1 U/ml), maintaining the platelet count above 50 x109/L. After the first two weeks, halving the dose is recommended if the platelet count is between 20 and 50 x109/L. If the platelet count is below 20 x109/L, it is advised that the LMWH therapy be discontinued until the platelet count recovers to greater than 20 x109/L (14-16). Recent guidelines of the SISET (Societ\u00e0 Italiana per lo Studio dell\u0027Emostasi e della Trombosi) also suggested that in patients with haematological malignancies and VTE LMWH should be preferred over VKA either for the first six months or a longer time (17). Arterial thrombosis has been rarely reported in patients with acute leukemia as heralding manifestation or complicating the course of disease (18-21). However, details concerning antithrombotic treatment and the platelet count at the time of the event are lacking in the majority of the reported cases. There have been no published studies concerning the use of novel antithrombotic agents such fondaparinux, direct thrombin or factor Xa inhibitors, in patients with haematological malignancies or thrombocytopaenia. However, in vitro experiments that have been performed on plasma from children with ALL and antithrombin deficiency as a result of the administration of asparaginase have demonstrated that the direct thrombin inhibitor melagatran generates a consistent anticoagulant response that is independent of the antithrombin level. Therefore, this drug class may have important potential for use in this field (22).Rationale Data about treatment of arterial or venous thromboembolism in patients with haematological malignancies and thrombocytopenia are mainly anecdotal. The very limited knowledge in this setting does not allow to plan a randomized controlled trial, lacking a standard of care an
