d being quite uncertain the benefits and risks of different strategies. Therefore we planned an observational study either retrospective and prospective to gain information about efficacy and safety of different therapeutic strategies in patients with hematologic neoplasms and platelet count \u003c50 x109/L having had diagnosis of arterial or venous thromboembolism.\", \u0027Title\u0027: \u0027Clinical Practice in the Prophylaxis and Treatment of Arterial and Venous Thromboembolism in Patients With hEmatological NEoplasms and LOw PlatElets (PENELOPE Observational Study)\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT01855698\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2018, 3, 15), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT01855698\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2013, 6, 1), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027StartYear\u0027: 2013, \u0027TrialID\u0027: \u0027NCT01855698\u0027, \u0027CompletionYear\u0027: 2018, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "71262", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 71262\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Carfilzomib (Drug), Lenalidomide (Drug), Dexamethasone (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 84, \u0027BriefTitle\u0027: \u0027A Trial That Compare Two Treatments in Newly Diagnosed Myeloma Patients Not Eligible for Transplant\u0027, \u0027Abstract\u0027: \u0027The combination of lenalidomide plus low-dose dexamethasone (Rd) is considered the new standard for elderly newly diagnosed multiple myeloma (NDMM) patients. The combination carfilzomib plus lenalidomide-dexamethasone (KRd) in relapsed-refractory MM patients improved the progression-free survival (PFS) of approximately 1 year compared to standard Rd treatment. In a small phase 2 trial (23 pts) the KRd combination in elderly NDMM pts showed a complete response (CR) rate of 79% and a PFS at 3 years of 80%. Cardiovascular adverse events are the most limiting toxicities, especially in elderly patients.\\n\\nDetailed Description\\nThis protocol is a randomized, multicenter study designed to determine the MRD negativity and the PFS of KRd treatment regimen.Patients will be randomized in a 1:1 ratio to receive carfilzomib-lenalidomide-dexamethasone (KRd - Arm A) or lenalidomide-dexamethasone (Rd - Arm B).Patients will be stratified basing on international staging system (ISS) and fitness status using a web-based procedure completely concealed to study participants.All consecutive patients \u2265 65 years with newly diagnosed MM will be enrolled in a large randomized study during a period of 24 months.Patients will be treated until disease progression or intolerance to the therapy. The only exception is for patients enrolled in KRd arm who achieve at least a VGPR during the first year of treatment and in sustained MRD negativity (MRD negative at least at 10-5 after one and two years of therapy): these patients will stop carfilzomib administration after 2 years, whereas treatment with lenalidomide and dexamethasone will be continued.\u0027, \u0027Title\u0027: \u0027Carfilzomib - Lenalidmide - Dexamethasone (KRd) Versus Lenalidomi - Dexamethasone (Rd) in Newly Diagnosed Myeloma Patients Not Eligible for Autologous Stem Cell Transplantation: a Randomized Phas III Trial\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT04096066\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2024, 7, 1), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT04096066\u0027, \u0027minAgeYears\u0027: 65.0, \u0027StartDate\u0027: neo4j.time.Date(2019, 7, 1), \u0027RecruitmentStatus\u0027: \u0027Active, not recruiting\u0027, \u0027StartYear\u0027: 2019, \u0027TrialID\u0027: \u0027NCT04096066\u0027, \u0027CompletionYear\u0027: 2024, \u0027Acronym\u0027: \u0027KRdvsRd\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "74595", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 74595\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Observation (Other)\u0027, \u0027Phase\u0027: \u0027\u0027, \u0027StudyType\u0027: \u0027Observational\u0027, \u0027NumberOfParticipants\u0027: 1900, \u0027BriefTitle\u0027: \u0027A \"Physician \u0026 Patient-powered\" Cohort Registry (MY MYELOMA)\u0027, \u0027Abstract\u0027: \u0027The aim of this observational study is the creation of a national multiple myeloma registry to monitor the current routine clinical practice in Italy and describe the standard of care adopted for the diagnosis and treatment of patients with multiple myeloma in the different Italian hematology centers.\\n\\nDetailed Description\\nIn Italy, myeloma accounts for 1.3% of all tumour diagnoses in males and for 1.2% of all tumour diagnoses in women. The incidence is 9.5 new cases per 100,000 males and 8.1 cases per 100,000 females. Median age at diagnosis is 68 years and approximately 2% of patients experience onset before the age of 4011. Therefore is to establish a national disease registry to monitor current routine clinical practice in Italy and to describe the standard of care adopted for the diagnosis and treatment of patients with myeloma. National registries have already been established in some countries and a recently-published meta-analysis highlighted certain differences in treatment, survival and the demographic characteristics of patients. An Italian national registry is important for analysing the current situation, in order to deal with the changes that lie ahead. In addition to the standard epidemiological registry - as described in the statistical methods section - a patientpowered registry (PPR) will also be established to encourage patient participation.\u0027, \u0027Title\u0027: \u0027A \"Physician \u0026 Patient-powered\" Cohort Registry\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT05001087\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2024, 3, 1), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT05001087\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2021, 3, 16), \u0027RecruitmentStatus\u0027: \u0027Recruiting\u0027, \u0027AltmetricAttentionScore\u0027: 2.0, \u0027StartYear\u0027: 2021, \u0027TrialID\u0027: \u0027NCT05001087\u0027, \u0027CompletionYear\u0027: 2024, \u0027Acronym\u0027: \u0027MY MYELOMA\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "79611", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 79611\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Bortezomib, Melphalan, Prednisone (VMP) (Drug), 1 or 2 cycle(s) HDM (High Dose Melphalan) (Drug), 2 cycles of Bortezomib, Lenalidomide, Dexamethasone (VRD) (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 1503, \u0027BriefTitle\u0027: \u0027Study to Compare VMP With HDM Followed by VRD Consolidation and Lenalidomide Maintenance in Patients With Newly Diagnosed Multiple Myeloma\u0027, \u0027Abstract\u0027: \u0027Study phase: phase IIIStudy objective:Comparison of Bortezomib, Melphalan, Prednisone (VMP) with High Dose Melphalan followed autologous stem cell transplantation (ASCT)Comparison of Bortezomib, Lenalidomide, Dexamethasone(VRD) as consolidation versus no consolidationComparison of single versus tandem high dose Melphalan with ASCTPatient population: Patients with symptomatic multiple myeloma,previously untreated, ISS stages 1-3, age 18-65 years inclusiveStudy design: Prospective, multicenter, intergroup, randomizedDuration of treatment: Expected duration of induction, stem cell collection and intensification is 6 - 9 months. Consolidation with VRD will last 2 months Maintenance therapy with Lenalidomide will be given until relapse. All patients will be followed until 10 years after registration.\u0027, \u0027Title\u0027: \u0027A Randomized Phase III Study to Compare Bortezomib, Melphalan, Prednisone (VMP) With High Dose Melphalan Followed by Bortezomib, Lenalidomide, Dexamethasone (VRD) Consolidation and Lenalidomide Maintenance in Patients With Newly Diagnosed Multiple Myeloma\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT01208766\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2024, 4, 1), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT01208766\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2011, 1, 1), \u0027RecruitmentStatus\u0027: \u0027Active, not recruiting\u0027, \u0027AltmetricAttentionScore\u0027: 13.0, \u0027StartYear\u0027: 2011, \u0027TrialID\u0027: \u0027NCT01208766\u0027, \u0027CompletionYear\u0027: 2024, \u0027Acronym\u0027: \u0027HO95\u0027, \u0027maxAgeYears\u0027: 65.0}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "83038", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 83038\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Belantamab mafodotin (Drug)\u0027, \u0027Phase\u0027: \u0027\u0027, \u0027StudyType\u0027: \u0027Observational\u0027, \u0027NumberOfParticipants\u0027: 100, \u0027BriefTitle\u0027: \u0027Patient With MMRR Treated With Belantamab Mafotidine on Monotherapy\u0027, \u0027Abstract\u0027: \u0027This is a retrospective/prospective observational study evaluating the efficacy and safety of Belantamab Mafotidin as a single agent in patients with Multiple Myeloma Relapse/Refractory (MMRR) treated in clinical pratice under compassionate use\\n\\nDetailed Description\\nMultiple myeloma (MM) is an incurable disease that accounts for 1% of all cancers and 10% of all haematological malignancies, most patients with MM develop resistance to existing therapies at the time of disease recurrence.Belantamab mafodotin is a new humanized antibody-drug conjugate (IgG1) that is under development for the treatment of MM and has demonstrated a manageable safety profile and positive clinical activity in patients with relapsed or refractory multiple myeloma (MMRR) heavily pretreated.The objective of this retro-prospective observational study is: to evaluate clinical efficacy as the percentage of patients who have achieved a clinical benefit (minimum or best response), ORR, DoR, PFS, OS; evaluate the safety profile of patients treated with Belantamab Mafodotin as monotherapy in clinical practice.All patients included in this analysis were treated or are still receiving Belantamab Mafodotin monotherapy under the compassionate use programs (nominal program-NPP and the extended access program-EAP).\u0027, \u0027Title\u0027: \u0027Observational Study in Patient With Multiple Myeloma Relapse/Refractory Treated With Belantamab Mafotidine on Monotherapy Previously Exposed to at Least One Proteasome Inhibitor, Immunomodulatory Agent, and Anti-CD38 Antibody.\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT05393024\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2024, 12, 1), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT05393024\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2022, 7, 22), \u0027RecruitmentStatus\u0027: \u0027Recruiting\u0027, \u0027AltmetricAttentionScore\u0027: 1.0, \u0027StartYear\u0027: 2022, \u0027TrialID\u0027: \u0027NCT05393024\u0027, \u0027CompletionYear\u0027: 2024, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "83333", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 83333\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Elranatamab (Drug), Lenalidomide (Drug), Lenalidomide (Drug), Elranatamab (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 760, \u0027BriefTitle\u0027: \u0027Study With Elranatamab Versus Lenalidomide in Patients With Newly Diagnosed Multiple Myeloma After Transplant\u0027, \u0027Abstract\u0027: \u0027The purpose of this study is to evaluate whether elranatamab monotherapy can provide clinical benefit compared to lenalidomide monotherapy (control) in participants with newly diagnosed multiple myeloma after undergoing autologous stem cell transplant. In Part 1 and Part 2 of the study, participants in the study will either receive elranatamab (arm A and C) as an injection under the skin at the study clinic or lenalidomide orally once daily at home (arm B). Participation in the study will be approximately five years\\n\\nDetailed Description\\nElranatamab is a bispecific antibody: binding of elranatamab to CD3-expressing T-cells and BCMA-expressing multiple myeloma cells causes targeted T-cell-mediated cytotoxicity.\u0027, \u0027Title\u0027: \u0027A RANDOMIZED, 2-ARM, PHASE 3 STUDY OF ELRANATAMAB (PF-06863135) VERSUS LENALIDOMIDE IN PATIENTS WITH NEWLY DIAGNOSED MULTIPLE MYELOMA AFTER UNDERGOING AUTOLOGOUS STEM-CELL TRANSPLANTATION\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT05317416\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2029, 10, 31), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT05317416\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2022, 3, 25), \u0027RecruitmentStatus\u0027: \u0027Recruiting\u0027, \u0027AltmetricAttentionScore\u0027: 1.0, \u0027StartYear\u0027: 2022, \u0027TrialID\u0027: \u0027NCT05317416\u0027, \u0027CompletionYear\u0027: 2029, \u0027Acronym\u0027: \u0027MagnetisMM-7\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "88642", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 88642\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Lenalidomide (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 46, \u0027BriefTitle\u0027: \u0027Lenalidomide vs Placebo Maintenance Therapy Following Melphalan Prednisone Velcade\u00ae Induction Therapy in NDMM\u0027, \u0027Abstract\u0027: \"The purpose of this study is to compare the safety and efficacy of Lenalidomide versus Placebo maintenance following melphalan, prednisone and velcade induction therapy in newly diagnosed multiple myeloma.After the study is unblinded, subjects in treatment Arm A (Len 10 mg) will remain on study therapy at the Investigator\u0027s discretion and subjects in treatment Arm B (placebo), will be discontinued from study treatment. Subjects who discontinued from study treatment for any reason will enter the LTFU Phase.\\n\\nDetailed Description\\nThe planned total number of evaluable subjects for PFS was approximately 351 (234 in the lenalidomide treatment arm; 117 in the placebo treatment arm) and the study will be conducted in European countries. However, due to the significant enrollment challenges and the changes in the NDMM treatment practices in subjects who are not eligible for transplant, such as the recent approval of Revlimid in NDMM setting, the DMC recommended to close study enrollment. Study enrollment was closed on 12 October 2015.\", \u0027Title\u0027: \u0027Phase 3B, Randomized Trail of Revlimid\u00ae (Lenalidomide) Versus Placebo Maintenance Therapy Following Melphalan Prednisone Velcade (Bortezomib) Induction Therapy In Newly Diagnosed Multiple Myeloma\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT02112175\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2020, 10, 12), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT02112175\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2014, 4, 30), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027StartYear\u0027: 2014, \u0027TrialID\u0027: \u0027NCT02112175\u0027, \u0027CompletionYear\u0027: 2020, \u0027Acronym\u0027: \u0027ARUMM\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "10663", "label": "SponsorCollaborator", "shape": "dot", "title": "ID: 10663\nLabels: SponsorCollaborator\nProperties: {\u0027name\u0027: \u0027Policlinico Umberto I\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "83995", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 83995\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Elranatamab (Drug), Daratumumab (Drug), Pomalidomide (Drug), Dexamethasone (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 764, \u0027BriefTitle\u0027: \u0027MagnetisMM-5: Study of Elranatamab (PF-06863135) Monotherapy and Elranatamab + Daratumumab Versus Daratumumab + Pomalidomide + Dexamethasone in Participants With Relapsed/Refractory Multiple Myeloma\u0027, \u0027Abstract\u0027: \u0027The purpose of this study is to evaluate whether the BCMA-CD3 bispecific antibody elranatamab, alone and/or in combination with the anti-CD38 monoclonal antibody, daratumumab, can provide more benefit to people with multiple myeloma compared to a combination therapy including daratumumab, pomalidomide, and dexamethasone. People with multiple myeloma who have received previous treatment including lenalidomide and a proteasome inhibitor will be enrolled in the study. Part 1 of the study will assess the safety and activity of different doses of elranatamab in combination with daratumumab. People participating in Part 2 of the study will be randomly assigned to receive either elranatamab alone, elranatamab plus daratumumab, or daratumumab, pomalidomide, and dexamethasone. Part 2 will compare the safety and activity of (1) elranatamab alone compared to daratumumab, pomalidomide, and dexamethasone, and (2) elranatamab plus daratumumab compared to daratumumab, pomalidomide, and dexamethasone. Participants in all parts of the study will receive study treatment until their disease progresses, they experience unacceptable side effects, or they choose to no longer participate in the study.\u0027, \u0027Title\u0027: \u0027AN OPEN-LABEL, 3-ARM, MULTICENTER, RANDOMIZED PHASE 3 STUDY TO EVALUATE THE EFFICACY AND SAFETY OF ELRANATAMAB (PF-06863135) MONOTHERAPY AND ELRANATAMAB + DARATUMUMAB VERSUS DARATUMUMAB + POMALIDOMIDE + DEXAMETHASONE IN PARTICIPANTS WITH RELAPSED/REFRACTORY MULTIPLE MYELOMA WHO HAVE RECEIVED AT LEAST 1 PRIOR LINE OF THERAPY INCLUDING LENALIDOMIDE AND A PROTEASOME INHIBITOR\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT05020236\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2026, 9, 28), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT05020236\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2021, 10, 4), \u0027RecruitmentStatus\u0027: \u0027Recruiting\u0027, \u0027AltmetricAttentionScore\u0027: 2.0, \u0027StartYear\u0027: 2021, \u0027TrialID\u0027: \u0027NCT05020236\u0027, \u0027CompletionYear\u0027: 2026, \u0027Acronym\u0027: \u0027MAGNETISMM-5\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "89734", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 89734\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Cyclophosphamide (Drug), Lenalidomide (Drug), Dexamethasone (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 2\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 13, \u0027BriefTitle\u0027: \u0027Cyclophosphamide With Biochemical Progression During Lenalidomide-Dexamethasone Treatment for Relapsed/Refractory Multiple Myeloma (MM)\u0027, \u0027Abstract\u0027: \u0027This study evaluates the efficacy of the addiction of Cyclophosphamide to Revlimid-low dose dexamethasone (Rd) in relapsed/refractory Multiple Myeloma patients, who experienced a biochemical progression, without CRAB, during Rd treatment.\\n\\nDetailed Description\\nThis protocol is a phase II multicenter, open label study designed to determine whether the addiction of Cyclophosphamide to Rd (CRd) treatment significantly increases response rates and prolonged the outcome (PFS, OS) in patients who experienced a biochemical relapse, without CRAB under Rd treatment. Patients will be evaluated at scheduled visits in up to 3 study periods: pre-treatment, treatment and long-term follow-up (LTFU).The pre-treatment period includes: screening visits, performed at study entry. After providing written informed consent to participate in the study, patients will be evaluated for study eligibility. The screening period includes the availability of inclusion criteria described above. Subjects who meet all the inclusion criteria will be enrolled.The treatment period includes: administration of the combination CRd for 9 cycles. In order to assess the efficacy and safety of treatment, patients will attend the study center visits at least every 2 weeks. The response will be assessed after each cycle.During the LTFU period, after development of confirmed progression disease (PD), all patients are to be followed for survival every 1-3 months via telephone or office visit.\u0027, \u0027Title\u0027: \u0027A PHASE II, MULTI-CENTER, OPEN LABEL STUDY OF CYCLOPHOSPHAMIDE IN MULTIPLE MYELOMA PATIENTS WITH BIOCHEMICAL PROGRESSION DURING LENALIDOMIDE-DEXAMETHASONE TREATMENT FOR RELAPSED/REFRACTORY MULTIPLE MYELOMA\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT02206503\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2018, 7, 1), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT02206503\u0027, \u0027StartDate\u0027: neo4j.time.Date(2013, 3, 1), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027StartYear\u0027: 2013, \u0027TrialID\u0027: \u0027NCT02206503\u0027, \u0027CompletionYear\u0027: 2018, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "90538", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 90538\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027pomalidomide (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 74, \u0027BriefTitle\u0027: \u0027Study to Evaluate the Safety and Efficacy of Pomalidomide Monotherapy in Subjects With Refractory or Relapsed Refractory Multiple Myeloma\u0027, \u0027Abstract\u0027: \u0027The purpose of this study is to evaluate the efficacy and safety of pomalidomide monotherapy in subjects with refractory or relapsed and refractory multiple myeloma who were enrolled in study CC-4047-MM-003 (NCT01311687) and discontinued treatment with high-dose dexamethasone due to disease progression.\u0027, \u0027Title\u0027: \u0027Open-label, Multi-center, Single Arm Study For The Safety And Efficacy Of Pomalidomide Monotherapy For Subjects With Refractory Or Relapsed And Refractory Multiple Myeloma. A Companion Study For Clinical Trial CC-4047-MM003\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT01324947\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2014, 7, 31), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT01324947\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2011, 3, 1), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027StartYear\u0027: 2011, \u0027TrialID\u0027: \u0027NCT01324947\u0027, \u0027CompletionYear\u0027: 2014, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "91028", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 91028\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Lenalidomide and low-dose dexamethasone (Drug), Lenalidomide plus low-dose dexamethasone given for 18 four-week cycles (Drug), Melphalan, Prednisone and Thalidomide (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 1623, \u0027BriefTitle\u0027: \u0027Study to Determine Efficacy and Safety of Lenalidomide Plus Low-dose Dexamethasone Versus Melphalan, Prednisone, Thalidomide in Patients With Previously Untreated Multiple Myeloma\u0027, \u0027Abstract\u0027: \u0027The purpose of this study is to compare the safety and efficacy of Lenalidomide plus low dose dexamethasone to that of the combination of melphalan, prednisone and thalidomide.\\n\\nDetailed Description\\nCC-5013-MM020/IFM 07-01 is a Phase III, multicenter, randomized, open-label, 3-arm study that will compare the efficacy and safety of two Lenalidomide plus low-dose dexamethasone regimens given for two different durations of time (i.e., until progressive disease [PD] or for up to a maximum of 18 four-week cycles) to that of MPT given for a maximum of 12 six-week cycles.\u0027, \u0027Title\u0027: \u0027A Phase III, Randomized, Open-label, 3-arm Study to Determine the Efficacy and Safety of Lenalidomide(REVLIMID) Plus Low-dose Dexamethasone When Given Until Progressive Disease or for 18 Four-week Cycles Versus the Combination of Melphalan, Prednisone, and Thalidomide Given for 12 Six-week Cycles in Patients With Previously Untreated Multiple Myeloma Who Are Either 65 Years of Age or Older or Not Candidates for Stem Cell Transplantation.\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT00689936\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2016, 7, 14), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT00689936\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2008, 8, 21), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027AltmetricAttentionScore\u0027: 11.0, \u0027StartYear\u0027: 2008, \u0027TrialID\u0027: \u0027NCT00689936\u0027, \u0027CompletionYear\u0027: 2016, \u0027Acronym\u0027: \u0027FIRST\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "91411", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 91411\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Treosulfan IV (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 2\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 175, \u0027BriefTitle\u0027: \u0027Clinical Trial to Evaluate the Safety and Efficacy of Treosulfan Based Conditioning Prior to Allogeneic Haematopoietic Stem Cell Transplantation (HSCT)\u0027, \u0027Abstract\u0027: \u0027This is a multicentric, non-randomized, non-controlled open-label phase II trial to evaluate the safety and efficacy of treosulfan in a combination regimen with fludarabine as conditioning therapy prior to allogeneic stem cell transplantation (SCT) in patients with haematological malignancies.The aim is to demonstrate a clinical benefit compared with historical data on intravenous busulfan (BusulfexTM, BusilvexTM), the only drug so far registered in the indication conditioning before allogeneic stem cell transplantation.\u0027, \u0027Title\u0027: \u0027Clinical Phase II Trial to Evaluate the Safety and Efficacy of Treosulfan Based Conditioning Prior to Allogeneic Haematopoietic Stem Cell Transplantation in Patients With Haematological Malignancies\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT00598624\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2010, 12, 1), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT00598624\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2005, 9, 1), \u0027RecruitmentStatus\u0027: \u0027Unknown status\u0027, \u0027StartYear\u0027: 2005, \u0027TrialID\u0027: \u0027NCT00598624\u0027, \u0027CompletionYear\u0027: 2010, \u0027Acronym\u0027: \u0027AlloTreo\u0027, \u0027maxAgeYears\u0027: 69.0}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "91619", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 91619\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027bortezomib (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 600, \u0027BriefTitle\u0027: \u0027A Study of PS-341 Given to Patients With Multiple Myeloma Who Experienced Progressive Disease After Receiving Dexamethasone in M34101-039\u0027, \u0027Abstract\u0027: \u0027The purpose of this study is to allow patients to receive VELCADE\u2122 (bortezomib) for Injection who experienced progressive disease(PD) while receiving high-dose dexamethasone from the M34101-039 study.\\n\\nDetailed Description\\nThe rationale for Amendment 2 is 2-fold. First, it is intended that this study serve as a rollover protocol for patients who experience progressive disease (PD) after receiving the comparator treatment, high-dose dexamethasone, in MPI Study M34101-039, thereby ultimately providing all patients who participate in Study M34101-039 and require treatment for their disease access to VELCADE\u2122 (bortezomib) for Injection, formerly known as MLN341, LDP-341 and PS-341.\u0027, \u0027Title\u0027: \u0027An International, Non-Comparative, Open-Label Study of PS-341 Administered to Patients With Multiple Myeloma Who Experienced Relapsed or Progressive Disease After Receiving at Least Four Previous Treatment Regimens or Experienced Progressive Disease After Receiving Dexamethasone in Millennium Protocol M34101-039\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT00063726\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2005, 7, 1), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT00063726\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2002, 4, 1), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027StartYear\u0027: 2002, \u0027TrialID\u0027: \u0027NCT00063726\u0027, \u0027CompletionYear\u0027: 2005, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "36672", "label": "SponsorCollaborator", "shape": "dot", "title": "ID: 36672\nLabels: SponsorCollaborator\nProperties: {\u0027name\u0027: \u0027Azienda Ospedaliera di Perugia\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "58937", "label": "Condition", "shape": "dot", "title": "ID: 58937\nLabels: Condition\nProperties: {\u0027name\u0027: \u0027ulcerative colitis\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "10203", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 10203\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Etrasimod (Drug), Placebo (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\ grams/kilogram (mg/kg) IV at Weeks 0, 2, and 6, then Q8W) + placebo (SC Q4W). Time on treatment is 54 weeks.\u0027, \u0027Title\u0027: \u0027Phase III, Randomized, Multicenter Double-Blind, Double Dummy Study to Evaluate the Efficacy and Safety of Etrolizumab Compared With Infliximab in Patients With Moderate to Severe Active Ulcerative Colitis Who Are Naive to TNF Inhibitors\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT02136069\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2020, 6, 23), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT02136069\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2014, 12, 24), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027AltmetricAttentionScore\u0027: 87.0, \u0027StartYear\u0027: 2014, \u0027TrialID\u0027: \u0027NCT02136069\u0027, \u0027CompletionYear\u0027: 2020, \u0027Acronym\u0027: \u0027GARDENIA\u0027, \u0027maxAgeYears\u0027: 80.0}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "18637", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 18637\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Etrozulimab (Drug), Placebo (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 609, \u0027BriefTitle\u0027: \u0027A Study of the Efficacy and Safety of Etrolizumab in Participants With Ulcerative Colitis Who Have Been Previously Exposed to Tumor Necrosis Factor (TNF) Inhibitors\u0027, \u0027Abstract\u0027: \u0027This Phase III, double-blind, placebo-controlled, multicenter study will investigate the efficacy and safety of etrolizumab during induction and maintenance of remission compared with placebo in the treatment of participants with moderately to severely active ulcerative colitis (UC) who have been previously exposed to TN Vedolizumab (Drug), Vedolizumab Placebo (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 2\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 195, \u0027BriefTitle\u0027: \u0027A Study to Evaluate the Efficacy, Safety, and Pharmacokinetics of UTTR1147A Compared With Placebo and With Vedolizumab in Participants With Moderate to Severe Ulcerative Colitis (UC)\u0027, \u0027Abstract\u0027: \u0027This study is designed to evaluate the efficacy, safety, and pharmacokinetics of UTTR1147A compared with vedolizumab and with placebo in the treatment of participants with moderate to severe UC. This study will consist of two parts, Part A and Part B. Part A will test the induction of clinical remission and Part B will test the durability of clinical remission.\u0027, \u0027Title\u0027: \u0027A Phase II, Randomized, Parallel-Group, Double-Blind, Double-Dummy, Placebo-Controlled, Multicenter Study To Evaluate the Efficacy, Safety, and Pharmacokinetics of UTTR1147A Compared With Placebo and Compared With Vedolizumab in Patients With Moderate to Severe Ulcerative Colitis\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT03558152\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2021, 12, 15), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT03558152\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2018, 10, 26), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027AltmetricAttentionScore\u0027: 7.0, \u0027StartYear\u0027: 2018, \u0027TrialID\u0027: \u0027NCT03558152\u0027, \u0027CompletionYear\u0027: 2021, \u0027Acronym\u0027: \u0027\u0027, \u0027maxAgeYears\u0027: 80.0}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "43390", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 43390\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Pl Active Ulcerative Colitis (LUCENT 1)\u0027, \u0027Abstract\u0027: \u0027The purpose of this study is to evaluate the safety and efficacy of Mirikizumab in participants with moderately to severely active ulcerative colitis (UC) who have had an inadequate response to, loss of response, or intolerant to conventional or biologic therapy for UC.\u0027, \u0027Title\u0027: \u0027A Phase 3, Multicenter, Randomized, Double-Blind, Parallel, Placebo-Controlled Induction Study of Mirikizumab in Conventional-Failed and Biologic-Failed Patients With Moderately to Severely Active Ulcerative Colitis (LUCENT 1)\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT03518086\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2024, 9, 22), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT03518086\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2018, 6, 18), \u0027RecruitmentStatus\u0027: \u0027Active, not recruiting\u0027, \u0027AltmetricAttentionScore\u0027: 24.0, \u0027StartYear\u0027: 2018, \u0027TrialID\u0027: \u0027NCT03518086\u0027, \u0027CompletionYear\u0027: 2024, \u0027Acronym\u0027: \u0027\u0027, \u0027maxAgeYears\u0027: 80.0}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "62607", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 62607\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027RPC1063 (Drug), Placebo (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 1012, \u0027BriefTitle\u0027: \u0027Safety and Efficacy Trial of RPC1063 for Moderate to Severe Ulcerative Colitis\u0027, \u0027Abstract\u0027: \u0027The purpose of this study is to determine whether RPC1063 is effective in the treatment of Ulcerative Colitis (UC).\\n\\nDetailed Description\\nThe trial is composed of 2 periods: Induction and Maintenance. In the Induction Period (IP), patients will be entered into the trial in 2 separate cohorts (Cohort 1 and Cohort 2).Patients from Cohort 1 and 2 in clinical response at the end of the IP will proceed through to the Maintenance Period (MP). Patients from Cohort 1 and 2 who participate in this trial may also qualify to participate in an optional Open-Label Extension (OLE) trial.\u0027, \u0027Title\u0027: \u0027A Phase 3, Multicenter, Randomized, Double-blind, Placebo-controlled Trial of Oral RPC1063 as Induction and Maintenance Therapy for Moderate to Severe Ulcerative Colitis\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT02435992\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2020, 6, 17), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT02435992\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2015, 6, 17), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027AltmetricAttentionScore\u0027: 57.0, \u0027StartYear\u0027: 2015, \u0027TrialID\u0027: \u0027NCT02435992\u0027, \u0027CompletionYear\u0027: 2020, \u0027Acronym\u0027: \u0027\u0027, \u0027maxAgeYears\u0027: 75.0}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "68517", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 68517\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027ABX464 (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 2\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 217, \u0027BriefTitle\u0027: \u0027Efficacy and Safety Study of ABX464 as Maintenance Therapy in Patients With Moderate to Severe Ulcerative Colitis\u0027, \u0027Abstract\u0027: \u0027A phase 2b study to evaluate the long-term efficacy and safety study of ABX464 50mg as maintenance therapy in patients with moderate to severe Ulcerative Colitis.\\n\\nDetailed Description\\nThis study is an open-label study aiming at evaluating the long-term safety and the efficacy profile of ABX464 given once a day (o.d) at 50 mg in subjects who have been previously enrolled in the ABX464-103 clinical study (induction study) and who are willing to continue their treatment. All subjects will receive ABX464 given at 50mg o.d regardless of their previous treatment and dose received in the ABX464-103 study (i.e. ABX464 100mg, ABX464 50mg, ABX464 25mg or Placebo). The enrolment in this follow-up study will be based on the willingness of the subject to carry on his/her participation. Subjects will be treated with ABX464 for an overall period of 48 weeks. Subjects will be followed up on a monthly basis.\u0027, \u0027Title\u0027: \u0027A Phase 2b, Open-label, Efficacy and Safety Study of ABX464 as Maintenance Therapy in Patients With Moderate to Severe Ulcerative Colitis\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT04023396\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2023, 3, 1), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT04023396\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2020, 1, 13), \u0027RecruitmentStatus\u0027: \u0027Unknown status\u0027, \u0027AltmetricAttentionScore\u0027: 25.0, \u0027StartYear\u0027: 2020, \u0027TrialID\u0027: \u0027NCT04023396\u0027, \u0027CompletionYear\u0027: 2023, \u0027Acronym\u0027: \u0027\u0027, \u0027maxAgeYears\u0027: 75.0}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "68693", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 68693\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027ABX464 25mg (Drug), ABX464 50mg (Drug), ABX464 100mg (Drug), Placebo (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 2\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 254, \u0027BriefTitle\u0027: \u0027Dose-Ranging Phase 2b Study of ABX464 in Moderate to Severe Ulcerative Colitis\u0027, \u0027Abstract\u0027: \u0027Phase IIb study to evaluate the efficacy and the safety of 3 dose-levels of ABX464, administered daily in patients with moderate to severe Ulcerative Colitis.\\n\\nDetailed Description\\nThis phase IIb study will evaluate the efficacy and the safety of 3 dose-levels of ABX464, administered daily in improving Modified Mayo Score (MMS) in patients with moderate to severe Ulcerative Colitis who have inadequate response, loss of response, or intolerance with at least one of the following agents: immunosuppressant treatment (i.e. azathioprine, 6-mercaptopurine, methotrexate), tumor necrosis factor alpha [TNF-\u03b1] inhibitors, vedolizumab, JAK inhibitors and/or corticosteroid treatment .Eligible patients will be randomized into 4 parallel intervention/treatment groups: 25mg q.d of ABX464, 50mg q.d of ABX464, 100mg q.d of ABX464, or matching placebo and will be treated for 16 weeks.\u0027, \u0027Title\u0027: \u0027A Randomized, Double Blind, Placebo Controlled, Parallel Group, Multiple Dose, Induction Study to Evaluate the Safety, Tolerability and Optimal Dose of ABX464 Compared With Placebo in Patients With Moderate to Severe Ulcerative Colitis Who Have Inadequate Response, Loss of Response, or Intolerance With at Least One of the Following Agents: Immunosuppressant Treatment (i.e. Azathioprine, 6-mercaptopurine, Methotrexate), Tumor Necrosis Factor Alpha [TNF-\u03b1] Inhibitors, Vedolizumab, JAK Inhibitors and/or Corticosteroid Treatment\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT03760003\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2021, 4, 16), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT03760003\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2019, 9, 23), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027AltmetricAttentionScore\u0027: 11.0, \u0027StartYear\u0027: 2019, \u0027TrialID\u0027: \u0027NCT03760003\u0027, \u0027CompletionYear\u0027: 2021, \u0027Acronym\u0027: \u0027\u0027, \u0027maxAgeYears\u0027: 75.0}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "69577", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 69577\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Etrolizumab (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 1822, \u0027BriefTitle\u0027: \u0027Study for Participants With Ulcerative Colitis Previously Enrolled in Etrolizumab Phase II/III Studies\u0027, \u0027Abstract\u0027: \u0027This two-part, part 1: open-label extension (OLE) and part 2: safety monitoring (SM) study will examine the efficacy and safety of continued etrolizumab treatment in moderate to severe ulcerative colitis (UC) participants previously enrolled in etrolizumab Phase II/III studies. Participants with moderate to severe UC who were enrolled in the Phase II OLE study (GA27927 [NCT01461317]) or the Phase III studies (GA28948 [NCT02163759], GA28949 [NCT02171429], GA28950 [NCT02100696], GA29102 [NCT02165215], and GA29103 [NCT02136069]) were included. Participants from the Phase II OLE study or the Phase III studies who are not eligible or willing to receive etrolizumab in the OLE-SM study, and who have completed the 12-week safety follow-up period will be enrolled in Part 2. Part 1 of OLE-SM will continue for up to 9 years after the first participant is enrolled into the study. Following Part 1, participants will enter Part 2 for a period of 92 weeks.\u0027, \u0027Title\u0027: \u0027An Open-Label Extension and Safety Monitoring Study of Moderate to Severe Ulcerative Colitis Patients Previously Enrolled in Etrolizumab Phase II/III Studies\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT02118584\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2023, 10, 5), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT02118584\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2014, 9, 15), \u0027RecruitmentStatus\u0027: \u0027Terminated\u0027, \u0027AltmetricAttentionScore\u0027: 83.0, \u0027StartYear\u0027: 2014, \u0027TrialID\u0027: \u0027NCT02118584\u0027, \u0027CompletionYear\u0027: 2023, \u0027Acronym\u0027: \u0027COTTONWOOD\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "80210", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 80210\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Granulocyte Monocyte Apheresis (GMA-Apheresis) (Device)\u0027, \u0027Phase\u0027: \u0027Phase 4\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 133, \u0027BriefTitle\u0027: \u0027Efficacy Study of Granulocytapheresis Plus Steroids vs Steroids Alone in Active Steroid Dependant Ulcerative Colitis\u0027, \u0027Abstract\u0027: \u0027The purpose of this study is to evaluate the efficacy of the addition of GMA apheresis to steroid conventional treatment for achieving and maintaining remission in Active steroid dependant Ulcerative Colitis patients\\n\\nDetailed Description\\nThis is a multicenter randomized controlled trial which will compare the efficacy and safety of Adacolumn GMA apheresis plus oral steroids vs steroids alone in a strictly selected population of moderate to severe active steroid dependant Ulcerative Colitis patients.\u0027, \u0027Title\u0027: \u0027An Open Randomized Multicenter Clinical Investigation to Compare the Efficacy and Safety of Prednisone Plus Adacolumn\u00ae GMA Apheresis vs Prednisone Alone in the Treatment of Patients With Mild or Moderately Active Steroid Dependent Ulcerative Colitis\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT00702611\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2013, 7, 1), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT00702611\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2008, 6, 1), \u0027RecruitmentStatus\u0027: \u0027Terminated\u0027, \u0027StartYear\u0027: 2008, \u0027TrialID\u0027: \u0027NCT00702611\u0027, \u0027CompletionYear\u0027: 2013, \u0027Acronym\u0027: \u0027ATICCA\u0027, \u0027maxAgeYears\u0027: 75.0}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "80218", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 80218\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027VSL#3 (Dietary Supplement), Placebo (Dietary Supplement)\u0027, \u0027Phase\u0027: \u0027\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 144, \u0027BriefTitle\u0027: \u0027Food Supplementation With VSL#3 as a Support to Standard Pharmaceutical Therapy in Ulcerative Colitis\u0027, \u0027Abstract\u0027: \u0027This is a double-blind, randomized, placebo controlled study to assess the beneficial effects of food supplementation with VSL#3 as a support to standard pharmaceutical therapy in patients affected by mild to moderate active ulcerative colitis.\\n\\nDetailed Description\\nTitle:Food supplementation with the probiotic preparation VSL#3 as a support to standard pharmaceutical therapy in patient with mild to moderate active Ulcerative Colitis. A double-blind, randomized, placebo controlled study.Study Design:Double blind, randomised, parallel groups, placebo controlled, multicentre, national study.Study Period:February 2006 - October 2007 (recruitment: 12 months; food supplementation with VSL#3: 8 weeks).Study Population:The study population will comprise 144 patients with mild to moderate active ulcerative colitis on top of standard pharmaceutical therapy. 72 patients will be randomised to receive food supplementation VSL#3 and 72 to receive placebo.Total Number of centers:Approximately 16Study Objectives:To assess the beneficial effects of food supplementation with VSL#3 in patients affected by mild to moderate active ulcerative colitis in a double-blind, placebo-controlled study.Study product:VSL#3 consists of sachets each containing 900 billion viable lyophilised bacteria, comprising 4 strains of Lactobacillus (L. paracasei, L. plantarum, L. acidophilus and L. delbrueckii subsp. bulgaricus), 3 strains of Bifidobacterium (B. longum, B. breve and B. infantis) and 1 strain of Streptococcus thermophilus, in maltose and silicon dioxide as excipients.The placebo is in the form of identical sachets containing only maltose and silicon dioxide.The dose which will receive each patients is two sachets of VSL#3 or placebo to take twice a day orally (total amount of bacteria: 3.600 billion organisms per day).Assessments:Primary Outcome The primary outcome is the evaluation of the beneficial effects of food supplementation with VSL#3 in patients affected by UC, assessed by a decrease in the UCDAI of 50% or more, from baseline to week 8.Secondary Outcomes:Assessment of the beneficial effects of the food supplementation with the probiotic preparation VSL#3 on:activity of ulcerative colitis.change in subjective symptoms (rectal bleeding and stool frequency) from baseline to weeks 2, 4 and 8 of food supplementation with VSL#3.lack of beneficial effects, defined by need for further food supplementation or inability to stay on study till week 8.quality of life questionnaire (IBDQ)concordance between the Physician and Patient Global Assessment Scale at each time point.Physical Status Evaluations:Assessment of haematological laboratory tests, vital signs (blood pressure, pulse rate and respiratory rate), medical history and physical examination.\u0027, \u0027Title\u0027: \u0027Food Supplementation With the Probiotic Preparation VSL#3 as a Support to Standard Pharmaceutical Therapy in Patients With Mild to Moderate Active Ulcerative Colitis. A Double-blind, Randomized, Placebo Controlled Study\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT00951548\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2008, 10, 1), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT00951548\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2006, 10, 1), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027StartYear\u0027: 2006, \u0027TrialID\u0027: \u0027NCT00951548\u0027, \u0027CompletionYear\u0027: 2008, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "93387", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 93387\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027ABX464 (Drug), Placebo (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 1050, \u0027BriefTitle\u0027: \u0027ABTECT - Maintenance\u0027, \u0027Abstract\u0027: \u0027This is a multicenter, randomized study to evaluate the long-term efficacy and safety of ABX464 50mg and 25mg administered once daily (QD) as maintenance therapy in subjects with moderately to severely active ulcerative colitis who have inadequate response, no response, a loss of response, or an intolerance to either conventional therapies [corticosteroids, immunosuppressant (i.e. azathioprine, 6-mercaptopurine, methotrexate)] and/or advanced therapies [biologics (TNF inhibitors, anti-integrins, anti-IL-23), and/or S1P receptor modulators, and/or JAK inhibitors].This study is the maintenance phase of both previous induction studies ABX464-105 and ABX464-106.All eligible subjects who have completed either one of the induction studies above mentioned, will be given the opportunity to take part in the present ABX464-107 maintenance study and will be randomized to either a double blind, placebo-controlled part (Part #1) or allocated to ABX464 50mg or 25mg open label treatment arms (Part #2) depending on their clinical response at the end of induction.This study consists of a 44-week treatment phase and a 28-days follow-up period consisting in the End of Study (EOS) visit.\u0027, \u0027Title\u0027: \u0027A Randomized, Double-blind, Multicenter Phase III Study to Evaluate the Long-term Efficacy and Safety of ABX464 25 mg or 50 mg Once Daily as a Maintenance Therapy in Subjects With Moderately to Severely Active Ulcerative Colitis\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT05535946\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2025, 6, 1), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT05535946\u0027, \u0027minAgeYears\u0027: 16.0, \u0027StartDate\u0027: neo4j.time.Date(2023, 1, 16), \u0027RecruitmentStatus\u0027: \u0027Recruiting\u0027, \u0027AltmetricAttentionScore\u0027: 7.0, \u0027StartYear\u0027: 2023, \u0027TrialID\u0027: \u0027NCT05535946\u0027, \u0027CompletionYear\u0027: 2025, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "93389", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 93389\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027ABX464 (Drug), Placebo (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 612, \u0027BriefTitle\u0027: \u0027ABTECT-2 - ABX464 Treatment Evaluation for Ulcerative Colitis Therapy -2\u0027, \u0027Abstract\u0027: \u0027This is a multicenter, randomized, placebo controlled study to evaluate the efficacy and safety of ABX464 given at 25 or 50 mg QD in inducing clinical remission in subjects with moderately to severely active ulcerative colitis who have inadequate response, no response, a loss of response, or an intolerance to either conventional therapies [corticosteroids, immunosuppressant (i.e. azathioprine, 6-mercaptopurine, methotrexate)] and/or advanced therapies [biologics (TNF inhibitors, anti-integrins, anti-IL-23), and/or S1P receptor modulators, and/or JAK inhibitors].\u0027, \u0027Title\u0027: \u0027A Randomized, Double-blind, Placebo-controlled, Multicenter Phase III Study to Evaluate the Efficacy and Safety of ABX464 Once Daily for Induction Treatment in Subjects With Moderately to Severely Active Ulcerative Colitis\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT05507216\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2024, 6, 1), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT05507216\u0027, \u0027minAgeYears\u0027: 16.0, \u0027StartDate\u0027: neo4j.time.Date(2022, 12, 21), \u0027RecruitmentStatus\u0027: \u0027Recruiting\u0027, \u0027AltmetricAttentionScore\u0027: 7.0, \u0027StartYear\u0027: 2022, \u0027TrialID\u0027: \u0027NCT05507216\u0027, \u0027CompletionYear\u0027: 2024, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "1542", "label": "SponsorCollaborator", "shape": "dot", "title": "ID: 1542\nLabels: SponsorCollaborator\nProperties: {\u0027name\u0027: \u0027Dunedin Public Hospital\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "41835", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 41835\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Placebo (Drug), Guselkumab (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 2/3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 1064, \u0027BriefTitle\u0027: \u0027A Study of Guselkumab in Participants With Moderately to Severely Active Ulcerative Colitis\u0027, \u0027Abstract\u0027: \u0027The purpose of this study is to evaluate the efficacy and safety of guselkumab in participants with moderately to severely active ulcerative colitis (UC).\\n\\nDetailed Description\\nUC is a chronic disease of the large intestine, in which the lining of the colon becomes inflamed and develops ulcers. Guselkumab is a fully human immunoglobulin G1 lambda monoclonal antibody (mAb) that binds to human interleukin (IL)-23 with high affinity. The study is designed to answer scientific questions pertaining to the efficacy and safety of guselkumab in the treatment of moderately to severely active UC. Overall, the study will evaluate long-term guselkumab treatment. Efficacy, safety, pharmacokinetics (PK), immunogenicity, and biomarkers will be assessed at specified time points.\u0027, \u0027Title\u0027: \u0027A Phase 2b/3, Randomized, Double-blind, Placebo-controlled, Parallel-group, Multicenter Protocol to Evaluate the Efficacy and Safety of Guselkumab in Participants With Moderately to Severely Active Ulcerative Colitis\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT04033445\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2027, 10, 31), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT04033445\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2019, 9, 26), \u0027RecruitmentStatus\u0027: \u0027Active, not recruiting\u0027, \u0027AltmetricAttentionScore\u0027: 659.0, \u0027StartYear\u0027: 2019, \u0027TrialID\u0027: \u0027NCT04033445\u0027, \u0027CompletionYear\u0027: 2027, \u0027Acronym\u0027: \u0027QUASAR\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "6796", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 6796\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Efavaleukin alfa (Drug), Placebo (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 2\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 320, \u0027BriefTitle\u0027: \u0027Safety and Efficacy of Efavaleukin Alfa in Participants With Moderately to Severely Active Ulcerative Colitis\u0027, \u0027Abstract\u0027: \u0027The main purpose of this study is to evaluate the effect of efavaleukin alfa on induction of clinical remission in participants with moderately to severely active ulcerative colitis (UC).Participants will be randomized to receive 1 of 3 efavaleukin alfa doses or placebo during a 12-week induction period. Participants who complete the 12-week induction period will have the option to enter an exploratory long-term treatment period for up to 40 weeks (total of up to 52 weeks of treatment) if, in the opinion of the investigator, they may benefit from continued treatment. During the long-term period, participants randomized to efavaleukin alfa will remain on the same efavaleukin alfa blinded dose; participants randomized to placebo who achieved clinical response at week 12 will remain on placebo; and placebo non-responders (ie, participants randomized to placebo who did not achieve clinical response at week 12) will receive efavaleukin alfa in a blinded manner during continued treatment. All participants will complete a safety follow-up visit 6 weeks after their last dose of investigational product.\u0027, \u0027Title\u0027: \u0027A Phase 2, Dose-finding, Randomized, Double-blind, Placebo-controlled, Multicenter Study to Evaluate the Safety and Efficacy of Efavaleukin Alfa Induction Therapy in Subjects With Moderately to Severely Active Ulcerative Colitis\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT04987307\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2026, 5, 27), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT04987307\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2022, 1, 31), \u0027RecruitmentStatus\u0027: \u0027Recruiting\u0027, \u0027StartYear\u0027: 2022, \u0027TrialID\u0027: \u0027NCT04987307\u0027, \u0027CompletionYear\u0027: 2026, \u0027Acronym\u0027: \u0027\u0027, \u0027maxAgeYears\u0027: 80.0}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "82115", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 82115\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Upadacitinib (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 110, \u0027BriefTitle\u0027: \u0027Study to Assess Adverse Events, Change in Disease Activity, and How Oral Upadacitinib Moves Through the Body of Pediatric Participants With Moderately to Severely Active Ulcerative Colitis.\u0027, \u0027Abstract\u0027: \"Ulcerative colitis (UC) is a type of inflammatory bowel disease that causes inflammation and bleeding from the lining of the rectum and colon (large intestine). This study will assess how safe and effective Upadacitinib is in treating pediatric participants with UC. Adverse events and change in disease activity will be assessed.Upadacitinib (RINVOQ) is a drug approved in adults for moderate- to severely active UC and is being developed for moderate- to severely active UC in pediatric participants. This study is conducted in 2 periods: Period 1 is comprised of two phases: an 8-week open-label induction phase which means that the study doctor and patients know that participants will receive UPA Dose-A (or the adult equivalent based on body weight) followed by a 44-week double-blind maintenance phase meaning that neither the participants nor the study doctors will know which dose of upadacitinib will be given(UPA Dose B or Dose C). Period 2 is a 260 week open-label extension (OLE) of Period 1. Approximately 110 pediatric participants with moderate to severely active UC will be enrolled at up to 85 sites worldwide.Participants will receive upadacitinib oral tablets once daily or oral solution twice daily at approximately the same time each day, with or without food. Participants will be followed up for 30 days after each phase (i.e. after induction, maintenance, OLE) and only if a participant doesn\u0027t continue into the next phase.There may be higher treatment burden for participants in this trial compared to their standard of care. Participants will attend regular visits during the study at a hospital or clinic. The effect of the treatment will be checked by medical assessments, blood tests, checking for side effects and completing questionnaires.\", \u0027Title\u0027: \u0027A Phase 3 Multicenter Study to Evaluate Efficacy, Safety, and Pharmacokinetics of Upadacitinib With Open-Label Induction, Randomized, Double-Blind Maintenance and Open-Label Long-Term Extension in Pediatric Subjects With Moderately to Severely Active Ulcerative Colitis and Inadequate Response, Intolerance, or Medical Contraindications to Corticosteroids, Immunosuppressants, and/or Biologic Therapy\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT05782907\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2033, 10, 31), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT05782907\u0027, \u0027minAgeYears\u0027: 2.0, \u0027StartDate\u0027: neo4j.time.Date(2023, 11, 6), \u0027RecruitmentStatus\u0027: \u0027Recruiting\u0027, \u0027StartYear\u0027: 2023, \u0027TrialID\u0027: \u0027NCT05782907\u0027, \u0027CompletionYear\u0027: 2033, \u0027Acronym\u0027: \u0027\u0027, \u0027maxAgeYears\u0027: 17.0}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "7332", "label": "SponsorCollaborator"
