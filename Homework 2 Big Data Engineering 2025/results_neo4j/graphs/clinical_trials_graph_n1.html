            <script>function neighbourhoodHighlight(params) {
  // console.log("in nieghbourhoodhighlight");
  allNodes = nodes.get({ returnType: "Object" });
  // originalNodes = JSON.parse(JSON.stringify(allNodes));
  // if something is selected:
  if (params.nodes.length > 0) {
    highlightActive = true;
    var i, j;
    var selectedNode = params.nodes[0];
    var degrees = 2;

    // mark all nodes as hard to read.
    for (let nodeId in allNodes) {
      // nodeColors[nodeId] = allNodes[nodeId].color;
      allNodes[nodeId].color = "rgba(200,200,200,0.5)";
      if (allNodes[nodeId].hiddenLabel === undefined) {
        allNodes[nodeId].hiddenLabel = allNodes[nodeId].label;
        allNodes[nodeId].label = undefined;
      }
    }
    var connectedNodes = network.getConnectedNodes(selectedNode);
    var allConnectedNodes = [];

    // get the second degree nodes
    for (i = 1; i < degrees; i++) {
      for (j = 0; j < connectedNodes.length; j++) {
        allConnectedNodes = allConnectedNodes.concat(
          network.getConnectedNodes(connectedNodes[j])
        );
      }
    }

    // all second degree nodes get a different color and their label back
    for (i = 0; i < allConnectedNodes.length; i++) {
      // allNodes[allConnectedNodes[i]].color = "pink";
      allNodes[allConnectedNodes[i]].color = "rgba(150,150,150,0.75)";
      if (allNodes[allConnectedNodes[i]].hiddenLabel !== undefined) {
        allNodes[allConnectedNodes[i]].label =
          allNodes[allConnectedNodes[i]].hiddenLabel;
        allNodes[allConnectedNodes[i]].hiddenLabel = undefined;
      }
    }

    // all first degree nodes get their own color and their label back
    for (i = 0; i < connectedNodes.length; i++) {
      // allNodes[connectedNodes[i]].color = undefined;
      allNodes[connectedNodes[i]].color = nodeColors[connectedNodes[i]];
      if (allNodes[connectedNodes[i]].hiddenLabel !== undefined) {
        allNodes[connectedNodes[i]].label =
          allNodes[connectedNodes[i]].hiddenLabel;
        allNodes[connectedNodes[i]].hiddenLabel = undefined;
      }
    }

    // the main node gets its own color and its label back.
    // allNodes[selectedNode].color = undefined;
    allNodes[selectedNode].color = nodeColors[selectedNode];
    if (allNodes[selectedNode].hiddenLabel !== undefined) {
      allNodes[selectedNode].label = allNodes[selectedNode].hiddenLabel;
      allNodes[selectedNode].hiddenLabel = undefined;
    }
  } else if (highlightActive === true) {
    // console.log("highlightActive was true");
    // reset all nodes
    for (let nodeId in allNodes) {
      // allNodes[nodeId].color = "purple";
      allNodes[nodeId].color = nodeColors[nodeId];
      // delete allNodes[nodeId].color;
      if (allNodes[nodeId].hiddenLabel !== undefined) {
        allNodes[nodeId].label = allNodes[nodeId].hiddenLabel;
        allNodes[nodeId].hiddenLabel = undefined;
      }
    }
    highlightActive = false;
  }

  // transform the object into an array
  var updateArray = [];
  if (params.nodes.length > 0) {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        // console.log(allNodes[nodeId]);
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  } else {
    // console.log("Nothing was selected");
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        // console.log(allNodes[nodeId]);
        // allNodes[nodeId].color = {};
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  }
}

function filterHighlight(params) {
  allNodes = nodes.get({ returnType: "Object" });
  // if something is selected:
  if (params.nodes.length > 0) {
    filterActive = true;
    let selectedNodes = params.nodes;

    // hiding all nodes and saving the label
    for (let nodeId in allNodes) {
      allNodes[nodeId].hidden = true;
      if (allNodes[nodeId].savedLabel === undefined) {
        allNodes[nodeId].savedLabel = allNodes[nodeId].label;
        allNodes[nodeId].label = undefined;
      }
    }

    for (let i=0; i < selectedNodes.length; i++) {
      allNodes[selectedNodes[i]].hidden = false;
      if (allNodes[selectedNodes[i]].savedLabel !== undefined) {
        allNodes[selectedNodes[i]].label = allNodes[selectedNodes[i]].savedLabel;
        allNodes[selectedNodes[i]].savedLabel = undefined;
      }
    }

  } else if (filterActive === true) {
    // reset all nodes
    for (let nodeId in allNodes) {
      allNodes[nodeId].hidden = false;
      if (allNodes[nodeId].savedLabel !== undefined) {
        allNodes[nodeId].label = allNodes[nodeId].savedLabel;
        allNodes[nodeId].savedLabel = undefined;
      }
    }
    filterActive = false;
  }

  // transform the object into an array
  var updateArray = [];
  if (params.nodes.length > 0) {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  } else {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  }
}

function selectNode(nodes) {
  network.selectNodes(nodes);
  neighbourhoodHighlight({ nodes: nodes });
  return nodes;
}

function selectNodes(nodes) {
  network.selectNodes(nodes);
  filterHighlight({nodes: nodes});
  return nodes;
}

function highlightFilter(filter) {
  let selectedNodes = []
  let selectedProp = filter['property']
  if (filter['item'] === 'node') {
    let allNodes = nodes.get({ returnType: "Object" });
    for (let nodeId in allNodes) {
      if (allNodes[nodeId][selectedProp] && filter['value'].includes((allNodes[nodeId][selectedProp]).toString())) {
        selectedNodes.push(nodeId)
      }
    }
  }
  else if (filter['item'] === 'edge'){
    let allEdges = edges.get({returnType: 'object'});
    // check if the selected property exists for selected edge and select the nodes connected to the edge
    for (let edge in allEdges) {
      if (allEdges[edge][selectedProp] && filter['value'].includes((allEdges[edge][selectedProp]).toString())) {
        selectedNodes.push(allEdges[edge]['from'])
        selectedNodes.push(allEdges[edge]['to'])
      }
    }
  }
  selectNodes(selectedNodes)
}</script>

              function drawGraph() {

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#ADD8E6", "font": {"color": "white"}, "id": "2", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 2\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Axitinib (Drug), Nivolumab (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 2\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 118, \u0027BriefTitle\u0027: \u0027Axitinib Intensification Plus Nivolumab or Nivolumab Alone After Nivolumab Plus Ipilimumab in mRCC Patients\u0027, \u0027Abstract\u0027: \"This phase II open label trial randomized patients who completed the induction with nivolumab plus ipilimumab without complete response or progressive disease will be randomized 1:1 to receive axitinib in addition to nivolumab (Arm A) or continue with nivolumab alone (Arm B).Treatment will be continued until progression of disease, unacceptable toxicity, patient\u0027s refusal, or physician decision whichever occurred first.\\n\\nDetailed Description\\nThe present study aims to demonstrate if the addition of axitinib to nivolumab maintenance after nivolumab plus ipilimumab induction can improve the rate of response considering that the incidence of partial response was 32% and 51% in Checkmate214 and Keynote426 trials respectively.This study requires 106 patients to show an improvement from 30% to 50% of the incidence of partial responses with a power of 80%, and alpha-error 0.10 (one-side p).Assuming a drop out of 10%, the final estimated number to enroll should be 118 (59 in arm A and 59 in arm B).\", \u0027Title\u0027: \u0027Phase II Study of Axitinib Intensification Plus Nivolumab Compared to Nivolumab Alone After Induction With Nivolumab Plus Ipilimumab in mRCC Patients Without Previous Complete Response (AxIn Study).\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT05817903\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2027, 4, 1), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT05817903\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2023, 4, 18), \u0027RecruitmentStatus\u0027: \u0027Recruiting\u0027, \u0027StartYear\u0027: 2023, \u0027TrialID\u0027: \u0027NCT05817903\u0027, \u0027CompletionYear\u0027: 2027, \u0027Acronym\u0027: \u0027AxIn\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "4", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 4\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Maintenance protocol for the hygiene of implant supported prosthesis (Procedure)\u0027, \u0027Phase\u0027: \u0027\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 130, \u0027BriefTitle\u0027: \u0027Maintenance Protocol for Implant Supported Hybrid Prosthesis.\u0027, \u0027Abstract\u0027: \"The study we intend to carry out aims to analyze the clinical and microbiological effects of a new maintenance protocol for implant-supported hybrid prostheses.The maintenance protocol we propose is based on a sequence of phases that include not only the hygiene and cleaning of the prosthesis and the implants, but also the motivation and reinforcement of oral hygiene through iconographic aid (intraoral photographs of the patient).The proposed hygiene protocol is based on a meticulous preliminary plaque disclosure, followed by a full mouth decontamination of all intraoral mucosae, a decontamination of the secondary components, specific intrasulcular decontamination of the implants depending on whether there are probes greater than or less than 5mm and finally, a decontamination and hygiene of the hybrid prosthesis, all with the help of erythritol powders and the different settings of the AirFlow Prophylaxis Master EMS (Electro Medical Systems S.A., Nyon, Switzerland) device.Clinical parameters such as plaque index (PlI), probing depth (PD), bleeding on probing (BOP) and peri-implant suppuration (PS) will be recorded immediately after removal of the prosthesis and at one month of follow-up.The collection of the microbiological sample will be carried out according to the following procedures: the implant will be isolated by suction and the use of cotton rolls, in order to avoid contamination of saliva. Four sterile endodontic paper points will be inserted into the peri-implant sulcus of each implant, placing them in the mesial, distal, lingual/palatal and buccal sites and removed after 30 seconds with tweezers by placing them in a sterile plastic tube which will be sealed immediately. The same procedure will be performed for each implant.Once the operation is completed, the tubes of each patient (one for each implant and each containing 4 paper points) will be sent for microbiological analysis. The samples will be sent to the Microbiology Laboratory of the Department of Surgical Sciences of the University of Cagliari, in order to analyze the presence of bacteria ofn the peri-implant sulci. DNA from crevicular fluid samples will then be isolated by centrifugation and analyzed by PCR (polymerase chain reaction). This biomolecular technique is based on an enzymatic reaction, in which a heat-resistant DNA polymerase (Taq Polymerase) catalyzes the specific amplification of known DNA sequences. This procedure will be performed before the hygiene protocol, immediately after and at one month of follow-up.Power analysis was employed to determine the sample size by using a .05 significance level and a power of 90% based on an effect size of 0.25. Sample size of a minimum of 130 implants (approximately 25/30 patients carrying implant supported hybrid prostheses) is required to detect significant difference between the parameters measured at the different time points using repeated measures ANOVA, however the recruitment of patients will continue through the entire first period of the execution program with no limitations even after reaching the predetermined number\\n\\nDetailed Description\\nThe study population will consist of patients presenting at the periodontology departments of the Universities of Cagliari and who need maintenance for implant-supported hybrid prostheses.Patients will be excluded from the study if affected by chronic bronchitis or asthma and major systemic illnesses (i.e. diabetes mellitus, cancer, HIV, bone metabolic diseases or disorders that compromise wound healing, radiation or immunosuppressive therapy). Intake of antibiotics or other medication taken within the previous 28 days that may affect the outcome of the study will prevent inclusion in the study as well as confirmed or suspected intolerance to erythritol or chlorhexidine.The implant-supported fixed complete dental prostheses maintenance protocol will consist in the following steps:One minute rinse with 0.12% chlorhexidine in order to lower the microbial load of the oral cavityExpose peri-apical x-rays with paralleling technique without removing the prosthesis in order to facilitate the alignment (Fig 2)Observe patient oral hygiene maneuvers, use of toothbrush, super floss and inter proximal devicesRemove/unscrew the hybrid prosthesisPosition the prosthesis on a desk or flat plane with the intaglio surface facing upTake a picture of the intaglio surface of the prosthesisTake a clinical picture of the edentulous arch right after the removal of the prosthesisApply plaque disclosing agent on the edentulous ridgeShow the patient the areas stained by the plaque disclosing agent.Show the patient on a monitor the picture of the intaglio surface of the prosthesis to point out areas where home hygiene can improve.Hand to the patient a printout of the picture of the prosthesis with areas with plaque and calculus highlighted with arrows to better communicate ad reiterate the importance of proper hygiene (Fig 3)Probe dental implants circumferentially using a UNC 15 periodontal probe. Record bleeding on probing (BoP), presence of plaque and probing pocket depth (PPD) at four sites per implant. Asses the tone and consistency of the peri implant soft tissues.Decontaminate oral mucosa, gingiva, cheeks and tongue with the use of supragingival tip and erythritol powder. Set the machine at 50% power, 100% irrigation, keep the tip at 5mm distance form the soft tissues and move it with short back and forth movements at an inclination of 30-60\u00b0.Decontaminate secondary implant components. Remove plaque disclosing agent, biofilm and staining with the use of supragingival tip and erythritol powder. Set the machine at 60-100% power, 100% irrigation, keep the tip at 3-5mm distance from the implant component and move it with short back and forth movements at an inclination of 60-90\u00b0.Subgingival biofilm removal depends on PPD. Each site is treated specifically. If a site has PPD \u003c5mm, decontaminate with the use of supragingival tip and erythritol powder. Set the machine at 60% power, 100% irrigation, keep the tip at 5mm distance from the peri implant sulcus and move it with short back and forth movements at an inclination of 30-60\u00b0 and never at 90\u00b0. Use the tip 5 seconds per site at most.If a site has PPD \u003e5mm PPD\u003c 10mm, decontaminated with the use of subgingival tip (Perioflow\u00ae) and erythritol powder. Set the machine at 20-50% power, 70-100% irrigation (the % depends on peri implant tissue firmness), insert the tip in the peri implant sulcus and move it with short back and forth movements in an apical-coronal direction and is maintain it as parallel as possible to the long axis of the implant. Use the tip 5 consecutive seconds per site at most.Remove, if present, remaining calculus with ultrasonic tipApply plaque disclosing agent again to double check complete biofilm removalIf needed remove remaining biofilmClean and polish the hybrid prosthesisReposition/Screw the prosthesis verifying absence of concavities and non-polished areasReview and reinforce oral hygiene instructionsSchedule next maintenance visit according to patient\u0027s susceptibilityPeri-implants sulci will be probed using a UNC 15 periodontal probe at four sites, mesial, distal, lingual/palatal and buccal and clinical parameters such as plaque index (PlI), probing depth (PD), bleeding on probing (BOP) and peri-implant suppuration (PS) will be recorded immediately after removal of the prosthesis and at one month of follow-up.Plaque index (PlI) will be evaluated through the use of a disclosing solution, applied with a cotton bud, at the same 4 sites for each implant. Peri-implant bleeding on probing (BOP) will also be evaluated at the same 4 sites for each implant. For both PlI and BOP, values from 0 to 4 will be recorded, depending on the number of implant surfaces presenting plaque/bleeding, respectively. Peri-implant tissue-suppuration (PS) will dichotomously be assessed (present/absent).The collection of the microbiological sample will be carried out according to the following procedures: the implant will be isolated by suction and the use of cotton rolls, in order to avoid contamination of saliva. Four sterile endodontic paper points will be inserted into the peri-implant sulcus of each implant, placing them in the mesial, distal, lingual/palatal and buccal sites and removed after 30 seconds with tweezers by placing them in a sterile plastic tube which will be sealed immediately. The same procedure will be performed for each implant.Once the operation is completed, the tubes of each patient (one for each implant and each containing 4 paper points) will be sent for microbiological analysis. The samples will be sent to the Microbiology Laboratory of the Department of Surgical Sciences of the University of Cagliari, in order to analyze the presence of bacteria of the peri-implant sulci. DNA from crevicular fluid samples will then be isolated by centrifugation and analyzed by PCR (polymerase chain reaction). This biomolecular technique is based on an enzymatic reaction, in which a heat-resistant DNA polymerase (Taq Polymerase) catalyzes the specific amplification of known DNA sequences. This procedure will be performed before the hygiene protocol, immediately after and at one month of follow-up.Power analysis was employed to determine the sample size by using a .05 significance level and a power of 90% based on an effect size of 0.25. Sample size of 130 implants (approximately 25/30 patients carrying implant supported hybrid prostheses) is required to detect significant difference between the parameters measured at the different time points using repeated measures ANOVA. Descriptive statistics will be calculated, including means, standard deviations, medians, and confidence intervals. Microbiological outcomes measured at baseline, immediately post-maintenance and one month will be analyzed using the one-way repeated measures ANOVA test, while the statistical analysis of the PD, BOP, PlI and PS measurements at baseline and one month will be analyzed using McNemar\u0027s test. The level of significance is established at 5% (p = 0.05), and the analysis will be carried out using statistical software (SPSS version 26, IBM).\", \u0027Title\u0027: \u0027A Novel Hygienic Maintenance Protocol for Implant Supported Hybrid Prosthesis. Prospective Clinical and Microbiological Outcomes\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT05482490\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2023, 12, 31), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT05482490\u0027, \u0027StartDate\u0027: neo4j.time.Date(2022, 10, 1), \u0027RecruitmentStatus\u0027: \u0027Not yet recruiting\u0027, \u0027StartYear\u0027: 2022, \u0027TrialID\u0027: \u0027NCT05482490\u0027, \u0027CompletionYear\u0027: 2023, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "8", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 8\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027\u0027, \u0027Phase\u0027: \u0027Phase 4\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 240, \u0027BriefTitle\u0027: \u0027Are RNA signatures (biomarkers) in the tissue which surrounds the joints (synovial tissue) from patients with rheumatoid arthritis predictive of response to drug treatments?\u0027, \u0027Abstract\u0027: \u0027Background and study aims\\nRheumatoid arthritis (RA) is a chronic inflammatory disease, characterised by persistent synovitis (joint inflammation), systemic inflammation and autoantibodies (particularly rheumatoid factor and citrullinated peptide, thought to play critical roles in initiating inflammatory responses in RA). In industrialised countries, RA affects 0.5-1% of adults, with 5-50 per 100,000 new cases annually.\\n\\nDespite the clinical and radiological benefits of biological therapies, the vast majority of patients fail to achieve low disease activity or remission. Almost 40% of all patients treated with biologic disease-modifying anti-rheumatic drugs (b-DMARDs) do not experience minimally acceptable improvement. Thus, the treatment of RA patients according to their biomarker would provide better care (avert delay in starting a more effective drug) and prevent unnecessary exposure to potentially toxic drugs and additionally be cost-saving.\\n\\nWe aim to test whether RNA signatures (biomarkers), in the tissue which surrounds the joints (synovial tissue) from patients with RA are predictive of response to drug treatments such as biologic disease-modifying anti-rheumatic drugs (b-DMARDs).\\n\\nWho can participate?\\nAdults with RA\\n\\nWhat does the study involve?\\nRheumatology patients will undergo a biopsy of their joint, and then will receive either sarilumab or etanercept. Half of the patients will receive the drug randomly, and the other half will be treated according to their biomarkers. Patients will attend 4-weekly visits for up to 12 weeks, followed by a 30-day safety follow-up visit.\\n\\nWhat are the possible benefits and risks of participating?\\nParticipating patients may experience an improvement in the symptoms of their arthritis or may not benefit directly from this study. However, the trial will generate essential information, which could be of benefit to others in the future. Both medications within this trial have evidence that they may be effective in the patients where conventional Disease Modifying Anti-Rheumatic drugs (DMARDs) have failed. This study will find out whether specific RNA signatures enable accurate prediction of what the best treatment will be for rheumatoid patients where conventional DMARDs have failed. It has the potential to be of significant benefit to future patients.\\n\\nInjection site reactions with sarilumab and etanercept may occur. The risk of such reactions as well as of infection will be discussed with the patient prior to enrolment in the study however patients would be at no greater risk than routine care within the NHS.\\n\\nAn ultrasound-guided synovial biopsy is a quick, safe and well-tolerated procedure; patients who consent to the study and therefore synovial biopsy will have a longer appointment in hospital and may experience discomfort from the local anaesthetic and biopsy procedure. However, published data on this procedure confirms that it is well tolerated, and safe, and patients are agreeable to multiple biopsies.\\n\\nThe risks of venepuncture may include fainting, pain and/or bruising at the site of the needle puncture. Every possible effort will be taken to minimise the potential of these risks occurring.\\n\\nWhere is the study run from? \\nQueen Mary University of London (UK)\\n\\nWhen is the study starting and how long is it expected to run for?\\nSeptember 2022 to September 2026\\n\\nWho is funding the study?\\nInnovative Medicines Initiative (Belgium)\\n\\nWho is the main contact?\\nCentre for Experimental Medicine \u0026 Rheumatology (EMR) Clinical Trials team, Queen Mary University of London (UK)\\nemrclinicaltrials@qmul.ac.uk\u0027, \u0027Title\u0027: \u0027The 3TR Molecular Pathobiology-Driven Precision Therapy in RA (3TR Precis-The-RA) study\u0027, \u0027SourceLinkout\u0027: \u0027https://www.isrctn.com/ISRCTN44988547\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ISRCTN\u0027, \u0027EndDate\u0027: neo4j.time.Date(2026, 9, 1), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/ISRCTN44988547\u0027, \u0027StartDate\u0027: neo4j.time.Date(2022, 9, 20), \u0027RecruitmentStatus\u0027: \u0027\u0027, \u0027StartYear\u0027: 2022, \u0027TrialID\u0027: \u0027ISRCTN44988547\u0027, \u0027CompletionYear\u0027: 2026, \u0027Acronym\u0027: \u00273TR Precis-The-RA\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "12", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 12\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Guselkumab (Biological), Golimumab (Biological), JNJ-78934804 (Biological), Placebo (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 2\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 550, \u0027BriefTitle\u0027: \u0027A Study of Combination Therapy With Guselkumab and Golimumab in Participants With Moderately to Severely Active Ulcerative Colitis\u0027, \u0027Abstract\u0027: \u0027The purpose of this study is to evaluate the efficacy and safety of JNJ-78934804 as compared to guselkumab and golimumab in participants with moderately to severely active ulcerative colitis who have had an inadequate initial response, loss of response, or intolerance to one or more approved advanced therapy.\u0027, \u0027Title\u0027: \u0027A Phase 2b Randomized, Double-blind, Active-and Placebo-controlled, Parallel-group, Multicenter Study to Evaluate the Efficacy and Safety of Induction and Maintenance Combination Therapy With Guselkumab and Golimumab in Participants With Moderately to Severely Active Ulcerative Colitis\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT05242484\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2029, 2, 28), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT05242484\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2022, 9, 19), \u0027RecruitmentStatus\u0027: \u0027Recruiting\u0027, \u0027StartYear\u0027: 2022, \u0027TrialID\u0027: \u0027NCT05242484\u0027, \u0027CompletionYear\u0027: 2029, \u0027Acronym\u0027: \u0027DUET-UC\u0027, \u0027maxAgeYears\u0027: 65.0}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "16", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 16\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Periodontal probing (Diagnostic Test)\u0027, \u0027Phase\u0027: \u0027\u0027, \u0027StudyType\u0027: \u0027Observational\u0027, \u0027NumberOfParticipants\u0027: 200, \u0027BriefTitle\u0027: \u0027Restorations and Furcation Involvement on Molars\u0027, \u0027Abstract\u0027: \u0027The aim of this study will be to analyze the relationship between the presence of second class restorations (interproximal fillings) or prostheses (crowns, bridges) on molar teeth and the presence of bone resorption between the roots of the latter. Patients with this type of restorations will be identified and a non-interventional clinical and radiographic analysis will be conducted.\\n\\nDetailed Description\\nPatients who have a molar tooth reconstructed with a second class filling according to Black, or a with crown or that is abutment of a prosthetic bridge will be included in the study provided they have at least one other intact molar.The molars included in the study do not have to be wisdom teeth. In these patients, in addition to the presence of furcations (bone resorption in the space between the roots), the probing depth (PD), the loss of clinical attachment (CAL), bleeding on probing ( BOP), mobility, width of the keratinized tissue, the length of the root trunk (measured radiographically), the presence or absence of endodontic treatments (evaluated on the radiography), the anatomy of the roots (widely separated, fused, separated but fused) and the presence of enamel projections will be recorded.Data will be analyzed with utilizing Pearson chi-square and the pair-wise t test.The analysis of these data will provide us with evidence on the influence that interproximal restorations and fixed prostheses, in the presence of other co-factors, have on the presence of furcations in molars.\u0027, \u0027Title\u0027: \u0027Relationship Between Molar Restoration and Furcation Involvement\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT05481580\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2023, 6, 30), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT05481580\u0027, \u0027StartDate\u0027: neo4j.time.Date(2022, 9, 1), \u0027RecruitmentStatus\u0027: \u0027Not yet recruiting\u0027, \u0027StartYear\u0027: 2022, \u0027TrialID\u0027: \u0027NCT05481580\u0027, \u0027CompletionYear\u0027: 2023, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "19", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 19\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Questionnaire (Other)\u0027, \u0027Phase\u0027: \u0027\u0027, \u0027StudyType\u0027: \u0027Observational\u0027, \u0027NumberOfParticipants\u0027: 100, \u0027BriefTitle\u0027: \u0027Periodontitis Stage III and IV and Oral Health Related Quality of Life\u0027, \u0027Abstract\u0027: \u0027Patients diagnosed with stage III or IV periodontitis during routine visits at the department of periodontology will undergo a validated questionnaire to understand the impact of the disease on their quality of life.\\n\\nDetailed Description\\nThe purpose of this study is to evaluate the impact of stage III and stage IV periodontitis on the quality of life of patients and to evaluate the differences of the results between the two forms of the disease.Patients who presents to our periodontology department for routine follow-up visits, if diagnosed with one of these two forms of periodontitis, will be asked if they intend to answer a short questionnaire with the intent to understand how the disease affects their daily activities and interactions.The questionnaire that will be used is the short-form Oral Health Impact Profile (OHIP-14), which consists of 14 questions each one formulated in the following way: \"How often (impact item) because of problems with your teeth, mouth, or dentures?\" The impact items belong to seven different impact domains: (a) functional limitations, (b) physical pain, (c) psychological discomfort, (d) physical disability, (e) psychological disability, (f) social disability, and (g) handicap. Each question could be answered with a score from 0 to 4 corresponding to: 0 = never, 1 = hardly ever, 2 = occasionally, 3 = fairly often, and 4 = very often.The impact items are:Had trouble in pronouncing words Felt that sense of taste had worsened Had painful aching in your mouth Found it uncomfortable when eating food Been feeling self-conscious Have you felt tense Diet has been unsatisfactory Had to interrupt meals Found it difficult to relax Been a bit embarrassed Been irritable with other people Had difficulty during usual jobs Felt that life less satisfying Been totally unable to function Overall mean scores as well as for each question and for each impact domain will be calculated and compared with two ways ANOVA statistical analysis.\u0027, \u0027Title\u0027: \u0027Oral Health Related Quality of Life in Patients Affected by Periodontitis Stage III and IV: a Survey Based on OHIP14 Questionnaire\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT05481567\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2023, 6, 30), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT05481567\u0027, \u0027StartDate\u0027: neo4j.time.Date(2022, 9, 1), \u0027RecruitmentStatus\u0027: \u0027Not yet recruiting\u0027, \u0027StartYear\u0027: 2022, \u0027TrialID\u0027: \u0027NCT05481567\u0027, \u0027CompletionYear\u0027: 2023, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "21", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 21\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Suture removal after Coronally Positioned Flap (Procedure)\u0027, \u0027Phase\u0027: \u0027\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 20, \u0027BriefTitle\u0027: \u0027Effect of Suturing Protocols on Coronally Advanced Flap for Root Coverage Outcomes\u0027, \u0027Abstract\u0027: \"The purpose of this retrospective study is to investigate whether suturing protocols (suture removal timing) influence root coverage outcomes in recession defects treated with a coronally advanced flap (CAF) procedure.\\n\\nDetailed Description\\nThe aim of this study is to assess whether the timing of suture removal may influence the number of sites exhibiting complete coverage (CRC) or the mean root coverage (MRC) obtained in single-tooth recession-type defects treated by coronally advanced flap (CAF).Records from patients that underwent a coronally advanced flap (CAF) procedure for root coverage will be analyzed. This surgical procedure is aimed at the treatment of root recessions that may arise following periodontal disease or mechanical trauma. The procedure, after obtaining deep local anesthesia, involves a sulcular incision on the buccal side and extending the incision mesially and distally to the base of the adjacent papillae. Two vertical incisions are then made at the corner of the adjacent tooth line and extended into the alveolar mucosa. A mixed thickness flap is then elevated and coronally advanced by releasing incisions through the periosteum to allow for flap placement to cover the recession without tension. The papillae are de-epithelized to provide the bed of connective tissue for the adaptation of the flap which is then sutured with single stitches.The records, complete with photographic documentation, of all patients who have undergone this procedure will be identified and will be divided into two groups: those in which the sutures were removed at 2 weeks and those in which the sutures were removed at 3 or more weeks.CRC as present or absent (yes/no) and MRC (percentage of roof surface that has been successfully covered) six months after surgery will be assessed in these patients.The presence of patient discomfort on the day of suture removal will be recorded as present / absent to assess whether the permanence of the sutures for longer or shorter influences the patient\u0027s perception of the surgery.The results will be compared between the two groups.\", \u0027Title\u0027: \u0027The Effect of Sutures Removal Protocols on Coronally Advanced Flap for Root Coverage Outcomes: a Retrospective Study\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT05472233\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2022, 12, 31), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT05472233\u0027, \u0027StartDate\u0027: neo4j.time.Date(2022, 9, 1), \u0027RecruitmentStatus\u0027: \u0027Not yet recruiting\u0027, \u0027StartYear\u0027: 2022, \u0027TrialID\u0027: \u0027NCT05472233\u0027, \u0027CompletionYear\u0027: 2022, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "25", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 25\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Guselkumab (Biological), Golimumab (Biological), JNJ-78934804 (Biological), Placebo (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 2\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 715, \u0027BriefTitle\u0027: \"A Study of Combination Therapy With Guselkumab and Golimumab in Participants With Moderately to Severely Active Crohn\u0027s Disease\", \u0027Abstract\u0027: \u0027The purpose of this study is to evaluate the efficacy of JNJ-78934804 at Week 48 compared to guselkumab and golimumab.\u0027, \u0027Title\u0027: \"A Phase 2b Randomized, Double-blind, Active-and Placebo-controlled, Parallel-group, Multicenter Study to Evaluate the Efficacy and Safety of Induction and Maintenance Combination Therapy With Guselkumab and Golimumab in Participants With Moderately to Severely Active Crohn\u0027s Disease\", \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT05242471\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2030, 10, 8), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT05242471\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2022, 7, 22), \u0027RecruitmentStatus\u0027: \u0027Recruiting\u0027, \u0027StartYear\u0027: 2022, \u0027TrialID\u0027: \u0027NCT05242471\u0027, \u0027CompletionYear\u0027: 2030, \u0027Acronym\u0027: \u0027DUET-CD\u0027, \u0027maxAgeYears\u0027: 65.0}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "51", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 51\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Sotorasib (Drug), Panitumumab (Drug), Trifluridine and Tipiracil (Drug), Regorafenib (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 160, \u0027BriefTitle\u0027: \"Sotorasib and Panitumumab Versus Investigator\u0027s Choice for Participants With Kirsten Rat Sarcoma (KRAS) p.G12C Mutation\", \u0027Abstract\u0027: \"The aim of the study is to compare progression-free survival (PFS) in previously treated participants with Kirsten rat sarcoma (KRAS) p.G12C mutated colorectal cancer (CRC) receiving sotorasib 240 mg once daily (QD) and panitumumab vs investigator\u0027s choice (trifluridine and tipiracil, or regorafenib), and sotorasib 960 mg QD and panitumumab vs investigator\u0027s choice (trifluridine and tipiracil, or regorafenib).\", \u0027Title\u0027: \"A Phase 3 Multicenter, Randomized, Open-label, Active-controlled Study of Sotorasib and Panitumumab Versus Investigator\u0027s Choice (Trifluridine and Tipiracil, or Regorafenib) for the Treatment of Previously Treated Metastatic Colorectal Cancer Subjects With Kirsten Rat Sarcoma (KRAS) p.G12C Mutation\", \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT05198934\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2025, 3, 12), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT05198934\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2022, 4, 19), \u0027RecruitmentStatus\u0027: \u0027Active, not recruiting\u0027, \u0027AltmetricAttentionScore\u0027: 10.0, \u0027StartYear\u0027: 2022, \u0027TrialID\u0027: \u0027NCT05198934\u0027, \u0027CompletionYear\u0027: 2025, \u0027Acronym\u0027: \u0027CodeBreak300\u0027, \u0027maxAgeYears\u0027: 100.0}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "55", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 55\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Right hemicolectomy (Procedure)\u0027, \u0027Phase\u0027: \u0027\u0027, \u0027StudyType\u0027: \u0027Observational\u0027, \u0027NumberOfParticipants\u0027: 788, \u0027BriefTitle\u0027: \u0027Italian Study on the Right Hemicolectomy: How the Lymphadenectomy is Performed\u0027, \u0027Abstract\u0027: \u0027The objective of the study is the analysis of lymphadenectomy in the course of right hemicolectomy, in relation to the radicality of the surgical resection that is performed. In particular, the investigators wants to inquire how according to precise standards regarding surgical radicalness and consequently the anatomical piece that is obtained it is possible to correlate a certain number of lymph nodes and their possible positivity.The lead center is the General and Thoracic Surgery Department of the University of Ferrara. Prof. Anania is the responsible for the enrollment of patients and the coordination with the collaborating centers in the six month-study\\n\\nDetailed Description\\nAll the high-volume specialist centres that perform this type of intervention in Italy will be invited, with a minimum number of 25 interventions per year. At the end of the study 788 patients was enrolled.The data of the patients involved will be collected independently and anonymously by the individual centers involved, using a common alpha numeric code decided by the coordinating center.The parameters examined will be:Personal data of the patientStage of neoplasm due to surgeryType of surgery and durationPost-operative coursePresence of post-surgical complications and eventual hospital readmission due to these complicationsStudy of the operating piece and lymphadenectomy performed:Tumor free margin Terminal ilium length The different vascular ligatures and levels at which they are performed Integrity of the mesocolon Number of positive nodes per total removedFollowing the end of the 6 months of observational study period, the data will be processed anonymously at the coordinating centre.\u0027, \u0027Title\u0027: \u0027Lymphadenectomy in Right Hemicolectomy: Italian Multicenter Study (CoDIG-2)\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT05943951\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2022, 10, 30), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT05943951\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2022, 4, 1), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027StartYear\u0027: 2022, \u0027TrialID\u0027: \u0027NCT05943951\u0027, \u0027CompletionYear\u0027: 2022, \u0027Acronym\u0027: \u0027CoDIG-2\u0027, \u0027maxAgeYears\u0027: 95.0}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "195", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 195\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027\u0027, \u0027Phase\u0027: \u0027\u0027, \u0027StudyType\u0027: \u0027Observational\u0027, \u0027NumberOfParticipants\u0027: 1200, \u0027BriefTitle\u0027: \u0027APOLLO 11, Consortium of Italian Centers Involved in Treatment of Patients With Lung Cancer Treated With Innovative Therapies: Real World Data and Translational Reaserch\u0027, \u0027Abstract\u0027: \u0027APOLLO 11 main aim is to build a strong Italian long-lasting lung cancer network (in around 48 Italian centres) on real world data and translational research by creating a decentralized long-term national database (settle locally in each centre) and a \"virtual\" multilevel biobank in each centre. Besides, APOLLO 11 will take advantage of the translational research joint effort with the credo \"unity is strength\".\\n\\nDetailed Description\\nWith the advent of several innovative therapies (\"target\" therapies, immunotherapy (IO) and/or next generation therapies), the identification of prognostic/predictive and/or resistance biomarkers represents the main goals of translational research in advanced lung cancer (aLC). In particular, with the arrival of IO the treatment landscape of advanced Non-Small Cell Lung Cancer (NSCLC) patients (pts), have radically changed prolonging significantly the overall survival (OS). The role of Programmed Death Ligand 1 (PD-L1) remains undefined and to date no other biomarker are used to select patients for IO. Artificial Intelligence (AI) frameworks, which synthesize and correlate information from different data sources, is a potentially highly efficient instrument to construct algorithms reinforcing the individualized prediction.APOLLO 11 main aim is to build a strong Italian long-lasting lung cancer network (in around 48 Italian centres) on real world data and translational research by creating a decentralized long-term national database and a \"virtual\" multilevel biobank. This will allow to avoid worthless dispersion of single institution data, which often remaine unused and inconclusive due to limited number of patients and low statistical power. Besides, APOLLO 11 will take advantage of the translational research joint effort with the credo \"unity is strength\". The multilevel structure is designed also for smallest centres of give them possibility to contribute to biobank looking at their internal facilities.APOLLO 11 have the goal to establish the consortium by fully activating at least 20 of the 48 involved centres able to collect data within the database and to guarantee the activation ready for at least 10 biobanks able to collect samples (tumour tissue, blood, stool and urine). Moreover, the key scientific aim of the project is to provide answers about aNSCLC pts treated with IO. In particular, try to find a \"software\" biomarker able to better predict IO selection compare to standard of care single biomarker (e.g., PD-L1, TMB) using artificial intelligence/machine/deep learning (AI/DL/ML) methodologies. Real world (demographic, histology, PD-L1, molecular, treatment and outcomes information etc), radiomics and where available (from previous researches) multiomic data from all the activated centres will be collected. Furthermore, single-cell RNA sequencing (scRNA seq) analysis will be carry out. Finally, AI/ML/DL will be used to integrate the multisource data, analyse them and develop predictive algorithms of IO efficacy in NSCLC pts. Explainable trustworthy AI (XAI) methodology will be used in order to better understand black box for explaining clinical and biological insight.\u0027, \u0027Title\u0027: \u0027APOLLO 11, Consortium of Italian Centers Involved in Treatment of Patients With Lung Cancer Treated With Innovative Therapies: Real World Data and Translational Reaserch\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT05550961\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2032, 10, 1), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT05550961\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2022, 10, 1), \u0027RecruitmentStatus\u0027: \u0027Recruiting\u0027, \u0027AltmetricAttentionScore\u0027: 1.0, \u0027StartYear\u0027: 2022, \u0027TrialID\u0027: \u0027NCT05550961\u0027, \u0027CompletionYear\u0027: 2032, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "198", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 198\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Opicapone (Drug), L-DOPA/DDCI (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 4\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 106, \u0027BriefTitle\u0027: \"eArly levoDopa With Opicapone in Parkinson\u0027s paTients wIth motOr fluctuatioNs.\", \u0027Abstract\u0027: \"This is a randomized, parallel group, multicentre, multinational, prospective, open-label exploratory study in Parkinson\u0027s disease (PD) patients to evaluate the add-on efficacy of opicapone 50 mg or an extra dose of levodopa (L-DOPA) 100 mg as first strategy for the treatment of wearing-off.\\n\\nDetailed Description\\nThe study consists of a one-week screening period, four weeks of open-label treatment and two weeks of post-study follow-up. The total study duration for each patient will be approximately 7 weeks\", \u0027Title\u0027: \"A Randomized, Parallel Group, Multicentre, Multinational, Prospective, Open-label Exploratory Study to Evaluate the add-on Effect of Opicapone 50 mg or Levodopa 100 mg as First Strategy for the Treatment of Wearing-off in Patients With Parkinson\u0027s Disease.\", \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT04990284\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2023, 6, 30), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT04990284\u0027, \u0027minAgeYears\u0027: 30.0, \u0027StartDate\u0027: neo4j.time.Date(2021, 11, 29), \u0027RecruitmentStatus\u0027: \u0027Active, not recruiting\u0027, \u0027AltmetricAttentionScore\u0027: 2.0, \u0027StartYear\u0027: 2021, \u0027TrialID\u0027: \u0027NCT04990284\u0027, \u0027CompletionYear\u0027: 2023, \u0027Acronym\u0027: \u0027ADOPTION\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "201", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 201\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Taletrectinib (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 2\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 154, \u0027BriefTitle\u0027: \u0027Taletrectinib Phase 2 Global Study in ROS1 Positive NSCLC\u0027, \u0027Abstract\u0027: \u0027The main purpose of the study is to evaluate safety and efficacy of taletrectinib (also known as AB-106 or DS-6051b) monotherapy in the treatment of advanced NSCLC.\\n\\nDetailed Description\\nThis is a global Phase 2, multicenter, single-arm, open label study of taletrectinib in patients of NSCLC harboring with ROS1 fusion gene.About 154 patients will be enrolled and divided into 4 cohorts, depending on past history of ROS1 TKI treatment.Taletrectinib will be administered 600mg once daily in 21-day cycles. Patients will continue with the study treatment until progression of disease as determined by the investigator.The tumor response evaluation will be conducted on a regular basis until progression of disease. Long-term survival follow up will be conducted as well.\u0027, \u0027Title\u0027: \u0027A Single-Arm, Open-Label, Multicenter Phase 2 Study to Evaluate the Efficacy and Safety of Taletrectinib in Patients With Advanced or Metastatic ROS1 Positive NSCLC and Other Solid Tumors\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT04919811\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2027, 6, 1), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT04919811\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2021, 9, 1), \u0027RecruitmentStatus\u0027: \u0027Recruiting\u0027, \u0027AltmetricAttentionScore\u0027: 14.0, \u0027StartYear\u0027: 2021, \u0027TrialID\u0027: \u0027NCT04919811\u0027, \u0027CompletionYear\u0027: 2027, \u0027Acronym\u0027: \u0027TRUST-II\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "203", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 203\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Nipocalimab (Drug), Placebo (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 198, \u0027BriefTitle\u0027: \u0027A Study of Nipocalimab Administered to Adults With Generalized Myasthenia Gravis\u0027, \u0027Abstract\u0027: \u0027The purpose of this study is to evaluate the efficacy and safety of nipocalimab compared to placebo in participants with generalized myasthenia gravis (gMG).\\n\\nDetailed Description\\nMyasthenia gravis (MG) is a rare, heterogeneous, neuromuscular disease characterized by fluctuating, fatigable muscle weakness. MG is caused by pathogenic autoantibodies that impair cholinergic transmission in the postsynaptic membrane at the neuromuscular junction and impair or prevent muscle contraction. Nipocalimab (also referred to as JNJ-80202135 or M281) is a fully human, aglycosylated immunoglobulin (Ig)G1 monoclonal antibody (mAb) designed to selectively bind, saturate, and block the IgG binding site on the endogenous neonatal Fc receptor (FcRn). This study will consist of a screening phase (up to 4 weeks), treatment phase (a 24-week double-blind placebo-controlled phase, and an open-label extension [OLE] phase [up to 2 years]) and a follow-up safety visit (up to 8 weeks after last infusion of study intervention). Efficacy evaluations will include assessments such as Myasthenia Gravis - Activities of Daily Living (MG-ADL) score. Safety evaluations (such as adverse events, physical examination, vital signs, electrocardiogram [ECG], and clinical laboratory tests) will be performed. The overall duration of study will be up to 4 years and 8 months.\u0027, \u0027Title\u0027: \u0027Phase 3, Multicenter, Randomized, Double-Blind, Placebo-Controlled Study to Evaluate the Efficacy, Safety, Pharmacokinetics, and Pharmacodynamics of Nipocalimab Administered to Adults With Generalized Myasthenia Gravis\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT04951622\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2026, 4, 17), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT04951622\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2021, 7, 15), \u0027RecruitmentStatus\u0027: \u0027Recruiting\u0027, \u0027AltmetricAttentionScore\u0027: 507.0, \u0027StartYear\u0027: 2021, \u0027TrialID\u0027: \u0027NCT04951622\u0027, \u0027CompletionYear\u0027: 2026, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "204", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 204\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027carboplatin (Drug), paclitaxel (Drug), retifanlimab (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 308, \u0027BriefTitle\u0027: \u0027Carboplatin-paclitaxel With Retifanlimab or Placebo in Participants With Locally Advanced or Metastatic Squamous Cell Anal Carcinoma (POD1UM-303/InterAACT 2).\u0027, \u0027Abstract\u0027: \u0027This study is a Phase 3 global, multicenter, placebo-controlled double-blind randomized study that will enroll participants with inoperable locally recurrent or metastatic SCAC not previously treated with systemic chemotherapy.\u0027, \u0027Title\u0027: \u0027A Phase 3 Global, Multicenter, Double-Blind Randomized Study of Carboplatin-Paclitaxel With INCMGA00012 or Placebo in Participants With Inoperable Locally Recurrent or Metastatic Squamous Cell Carcinoma of the Anal Canal Not Previously Treated With Systemic Chemotherapy (POD1UM-303/InterAACT 2)\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT04472429\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2024, 10, 27), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT04472429\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2021, 1, 12), \u0027RecruitmentStatus\u0027: \u0027Active, not recruiting\u0027, \u0027AltmetricAttentionScore\u0027: 117.0, \u0027StartYear\u0027: 2021, \u0027TrialID\u0027: \u0027NCT04472429\u0027, \u0027CompletionYear\u0027: 2024, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "208", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 208\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Genetic: AAV5-RPGR 4e11 (Biological), Genetic: AAV5-RPGR 2e11 (Biological)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 97, \u0027BriefTitle\u0027: \u0027Follow-up Gene Therapy Trial for the Treatment of X-linked Retinitis Pigmentosa Associated With Variants in the RPGR Gene\u0027, \u0027Abstract\u0027: \u0027A clinical trial of AAV5-RPGR vector for patients with X-linked retinitis pigmentosa (XLRP)\u0027, \u0027Title\u0027: \u0027Follow-up Phase 3 Randomized, Controlled Study of AAV5-RPGR for the Treatment of X-linked Retinitis Pigmentosa Associated With Variants in the RPGR Gene\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT04794101\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2029, 9, 20), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT04794101\u0027, \u0027minAgeYears\u0027: 3.0, \u0027StartDate\u0027: neo4j.time.Date(2020, 12, 4), \u0027RecruitmentStatus\u0027: \u0027Recruiting\u0027, \u0027StartYear\u0027: 2020, \u0027TrialID\u0027: \u0027NCT04794101\u0027, \u0027CompletionYear\u0027: 2029, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "211", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 211\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Genetic: AAV5-RPGR (Biological), Genetic: AAV5-RPGR (Biological)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 97, \u0027BriefTitle\u0027: \u0027Gene Therapy Trial for the Treatment of X-linked Retinitis Pigmentosa Associated With Variants in the RPGR Gene\u0027, \u0027Abstract\u0027: \u0027A clinical trial of AAV5-RPGR vector for patients with X-linked retinitis pigmentosa (XLRP)\\n\\nDetailed Description\\nDeferred Treatment\u0027, \u0027Title\u0027: \u0027Phase 3 Randomized, Controlled Study of AAV5-RPGR for the Treatment of X-linked Retinitis Pigmentosa Associated With Variants in the RPGR Gene\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT04671433\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2025, 2, 19), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT04671433\u0027, \u0027minAgeYears\u0027: 3.0, \u0027StartDate\u0027: neo4j.time.Date(2020, 12, 4), \u0027RecruitmentStatus\u0027: \u0027Recruiting\u0027, \u0027AltmetricAttentionScore\u0027: 552.0, \u0027StartYear\u0027: 2020, \u0027TrialID\u0027: \u0027NCT04671433\u0027, \u0027CompletionYear\u0027: 2025, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "214", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 214\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Erdafitinib (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 2\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 316, \u0027BriefTitle\u0027: \u0027A Study of Erdafitinib in Participants With Advanced Solid Tumors and Fibroblast Growth Factor Receptor (FGFR) Gene Alterations\u0027, \u0027Abstract\u0027: \u0027The purpose of this study is to evaluate the efficacy of erdafitinib in terms of overall response rate (ORR) in adult and pediatric participants with advanced solid tumors with fibroblast growth factor receptor (FGFR) alterations (mutations or gene fusions). It will also evaluate ORR in pediatric participants with advanced solid tumors and FGFR alterations.\\n\\nDetailed Description\\nErdafitinib is a selective and potent pan FGFR 1-4 inhibitor with demonstrated clinical activity in participants with metastatic urothelial cancer and cholangiocarcinoma identified to have alterations in the FGFR pathway. This study targets the underlying altered biology of FGFR-driven tumors irrespective of solid tumor histology subtype. The study consists of screening phase, treatment phase and the post treatment follow-up phase (from the end of treatment visit until the participant has died, withdraws consent, is lost to follow-up, or the end of study, whichever comes first). End of study is considered as the time when the last participant receives the last dose of study drug on the study and either all pediatric participants are off study or until the most recently enrolled pediatric participant still participating in the study has 6 months of follow-up, whichever occurs first. Currently this study is recruiting pediatric participants only.\u0027, \u0027Title\u0027: \u0027A Phase 2 Study of Erdafitinib in Subjects With Advanced Solid Tumors and FGFR Gene Alterations\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT04083976\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2024, 9, 20), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT04083976\u0027, \u0027minAgeYears\u0027: 6.0, \u0027StartDate\u0027: neo4j.time.Date(2019, 11, 20), \u0027RecruitmentStatus\u0027: \u0027Active, not recruiting\u0027, \u0027AltmetricAttentionScore\u0027: 659.0, \u0027StartYear\u0027: 2019, \u0027TrialID\u0027: \u0027NCT04083976\u0027, \u0027CompletionYear\u0027: 2024, \u0027Acronym\u0027: \u0027RAGNAR\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "215", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 215\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Eribulin (Drug), Balixafortide (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 432, \u0027BriefTitle\u0027: \u0027Pivotal Study in HER2 Negative, Locally Recurrent or Metastatic Breast Cancer\u0027, \u0027Abstract\u0027: \u0027This is a phase 3, multicenter, open-label, randomized active-controlled, parallel group to investigate the efficacy, safety and tolerability of intravenous balixafortide given with eribulin versus eribulin alone in the treatment of HER2 negative, Locally Recurrent or Metastatic Breast Cancer.\u0027, \u0027Title\u0027: \u0027An International, Phase 3, Multicenter, Randomized, Open- Label Trial Comparing Balixafortide in Combination With Eribulin Versus Eribulin Alone in Patients With HER2 Negative, Locally Recurrent or Metastatic Breast Cancer\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT03786094\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2021, 10, 19), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT03786094\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2019, 5, 30), \u0027RecruitmentStatus\u0027: \u0027Terminated\u0027, \u0027AltmetricAttentionScore\u0027: 19.0, \u0027StartYear\u0027: 2019, \u0027TrialID\u0027: \u0027NCT03786094\u0027, \u0027CompletionYear\u0027: 2021, \u0027Acronym\u0027: \u0027FORTRESS\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "219", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 219\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Natalizumab (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 500, \u0027BriefTitle\u0027: \u0027A Study to Evaluate Efficacy, Safety, and Tolerability of EID of Natalizumab (BG00002) in Participants With RRMS Switching From Treatment With Natalizumab SID in Relation to Continued SID Treatment- Followed by Extension Study Comprising SC and IV Natalizumab Administration\u0027, \u0027Abstract\u0027: \u0027Part 1: The primary objective is to evaluate the efficacy of natalizumab extended interval dosing (EID) in participants who have previously been treated with natalizumab standard interval dosing (SID) for at least 12 months, in relation to continued SID treatment. The secondary objectives is to evaluate relapse-based clinical efficacy measures, disability worsening, additional Magnetic resonance imaging (MRI)-lesion efficacy measures and safety of EID in participants who have previously been treated with natalizumab SID for at least 12 months, in relation to continued SID treatment.Part 2: The primary objective is to evaluate participant preference for subcutaneous (SC) versus intravenous (IV) route of natalizumab administration. The secondary objectives is to evaluate treatment satisfaction, drug preparation and administration time, safety and immunogenicity, efficacy and characterize pharmacokinetic (PK) and pharmacodynamic (PD) drug preparation and administration time of SC versus IV routes of natalizumab administration.\\n\\nDetailed Description\\nThis study will be conducted in 2 parts. At the end of part 1, participants who provide consent and are eligible, and newly enrolled participants, will enter part 2, an Open Label Extension comprising a crossover analysis.Those participants who completed part 1 and cannot participate, or elect not to participate, in Part 2 (Open label extension) will enter a 12-week follow-up.\u0027, \u0027Title\u0027: \u0027A Randomized, Controlled, Open-Label, Rater-Blinded, Phase 3b Study of the Efficacy, Safety, and Tolerability of 6-Week Extended Interval Dosing (EID) of Natalizumab (BG00002) in Subjects With Relapsing-Remitting Multiple Sclerosis Switching From Treatment With 4-Week Natalizumab Standard Interval Dosing (SID) in Relation to Continued SID Treatment - Followed by an Open-Label Crossover Extension Study Comprising Subcutaneous and Intravenous Natalizumab Administration\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT03689972\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2023, 7, 24), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT03689972\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2018, 11, 27), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027AltmetricAttentionScore\u0027: 29.0, \u0027StartYear\u0027: 2018, \u0027TrialID\u0027: \u0027NCT03689972\u0027, \u0027CompletionYear\u0027: 2023, \u0027Acronym\u0027: \u0027\u0027, \u0027maxAgeYears\u0027: 60.0}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "452", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 452\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027idebenone 150 mg film-coated tablets (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 161, \u0027BriefTitle\u0027: \u0027Phase III Study With Idebenone in Patients With Duchenne Muscular Dystrophy (SIDEROS-E)\u0027, \u0027Abstract\u0027: \u0027The purpose of the study is to assess the long-term safety and efficacy of idebenone in patients with Duchenne muscular dystrophy (DMD) who completed the SIDEROS study.\\n\\nDetailed Description\\nThe study is an open-label, single-group, multi-center extension study in patients with DMD receiving glucocorticoid steroids who participated in the SIDEROS study and who meet all the inclusion criteria and none of the exclusion criteria for this extension study.The study consists of 4 study visits scheduled every 6 months (Visit 1/Baseline, Visit 2/Week 26, Visit 3/ Week 52 and Visit 4/ Week 78), and a follow-up visit 4 weeks after treatment discontinuation. Visit 8/Week 78 in SIDEROS study is also SIDEROS-E Visit 1/Baseline.\u0027, \u0027Title\u0027: \u0027A Phase III Open-Label Extension Study to Assess the Long-Term Safety and Efficacy of Idebenone in Patients With Duchenne Muscular Dystrophy (DMD) Who Completed the SIDEROS Study\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT03603288\u0027, \u0027Gender\u0027: \u0027Male\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2020, 11, 25), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT03603288\u0027, \u0027minAgeYears\u0027: 11.0, \u0027StartDate\u0027: neo4j.time.Date(2018, 7, 4), \u0027RecruitmentStatus\u0027: \u0027Terminated\u0027, \u0027AltmetricAttentionScore\u0027: 4.0, \u0027StartYear\u0027: 2018, \u0027TrialID\u0027: \u0027NCT03603288\u0027, \u0027CompletionYear\u0027: 2020, \u0027Acronym\u0027: \u0027SIDEROS-E\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "454", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 454\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Placebo (Drug), M2951 (Drug), M2951 (Drug), M2951 (Drug), M2951 (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 2\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 469, \u0027BriefTitle\u0027: \u0027A Phase II Study of M2951 in SLE\u0027, \u0027Abstract\u0027: \u0027M2951 is an investigational drug under evaluation for treatment of autoimmune and inflammatory disorders. The purpose of the study was to assess the Safety and Efficacy of M2951 in participants with Systemic Lupus Erythematosus (SLE).\u0027, \u0027Title\u0027: \u0027A Phase II, Randomized, Double-Blind, Placebo-Controlled Dose-Ranging Study To Evaluate the Safety and Efficacy of M2951 in Subjects With SLE\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT02975336\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2020, 3, 23), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT02975336\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2017, 1, 4), \u0027RecruitmentStatus\u0027: \u0027Terminated\u0027, \u0027AltmetricAttentionScore\u0027: 7.0, \u0027StartYear\u0027: 2017, \u0027TrialID\u0027: \u0027NCT02975336\u0027, \u0027CompletionYear\u0027: 2020, \u0027Acronym\u0027: \u0027\u0027, \u0027maxAgeYears\u0027: 75.0}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "456", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 456\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Idebenone 150 mg film-coated tablets (Drug), placebo (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 255, \u0027BriefTitle\u0027: \u0027A Phase III Double-blind Study With Idebenone in Patients With Duchenne Muscular Dystrophy (DMD) Taking Glucocorticoid Steroids\u0027, \u0027Abstract\u0027: \u0027The purpose of the study is to assess the efficacy of idebenone in delaying the loss of respiratory function in patients with DMD receiving concomitant glucocorticoid steroids\\n\\nDetailed Description\\nThe SIDEROS trial is a randomized, placebo controlled, parallel group study of the efficacy of idebenone in delaying the loss of respiratory function, whilst also monitoring safety and tolerability of idebenone in at least 266 DMD patients taking stable dose of concomitant glucocorticoid steroids.The study treatment period will be 18 months/ 78 weeks and the idebenone dose will be 900 mg/day. Participants can use deflazacort or prednisolone and be on any dose regimen.Since glucocorticoid steroids are widely used in ambulant boys from an early age until late into teenage and even adult years, this study will not take age and ambulatory status into account and will only exclude patients that need daytime ventilator assistance.The schedule of assessments will include a Screening Visit and up to 9 protocol visits, including a Follow-up Visit.A Screening Visit will take place a maximum of 4 weeks prior to the Baseline Visit (Visit 1, study day -1). Beginning at Baseline, the patient will receive study medication to be taken at home, and will undergo regular assessments in the clinic throughout the study period until Visit 8 at Week 78 at which time the study will be completed and medication discontinued.All patients completing Visit 8/Week 78, and considered eligible by the Investigator will be able to participate in an open-label extension study (SIDEROS-E) and will continue to receive idebenone until idebenone is commercially available for patients included in the study or SIDEROS-E is terminated by the Sponsor, whichever occurs first. The duration of the SIDEROS-E study will be defined in a separate protocol.For all patients not participating in the extension study (SIDEROS-E), a Follow-up Visit (Visit 9/Follow-up Visit) will take place 4 weeks after end of Treatment at Visit 8/Week 78 or after premature discontinuation of study medication.Each hospital visit will include efficacy assessments (respiratory function assessed by hospital-based spirometry, oxygen saturation, end-tidal CO2) and safety assessments (adverse events, concomitant medication, physical examination, vital signs, safety laboratory evaluations). In addition, respiratory function will be assessed weekly at home with a hand-held device in order to closely monitor respiratory function between hospital visits.The study medication, all medical procedures and laboratory testing, and the visits to the study centre are free of charge. In addition the patients will receive a travel allowance to cover reasonable expenses to and from the study centre. Participants will not otherwise be compensated for this study.\u0027, \u0027Title\u0027: \u0027A Phase III Double-blind, Randomized, Placebo-Controlled Study Assessing the Efficacy, Safety and Tolerability of Idebenone in Patients With Duchenne Muscular Dystrophy Receiving Glucocorticoid Steroids\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT02814019\u0027, \u0027Gender\u0027: \u0027Male\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2020, 12, 1), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT02814019\u0027, \u0027minAgeYears\u0027: 10.0, \u0027StartDate\u0027: neo4j.time.Date(2016, 9, 1), \u0027RecruitmentStatus\u0027: \u0027Terminated\u0027, \u0027AltmetricAttentionScore\u0027: 93.0, \u0027StartYear\u0027: 2016, \u0027TrialID\u0027: \u0027NCT02814019\u0027, \u0027CompletionYear\u0027: 2020, \u0027Acronym\u0027: \u0027SIDEROS\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "457", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 457\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027\u0027, \u0027Phase\u0027: \u0027\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 8, \u0027BriefTitle\u0027: \u0027Probiotics in paediatric patients with an allergy to cow\u2019s milk proteins\u0027, \u0027Abstract\u0027: \u0027Background and study aims\\nAn allergy to cow\u2019s milk proteins is one of the most frequent food allergies during early childhood. It is not completely known how it develops, although changes in intestinal microflora (bacteria) have been found to influence immune tolerance to milk proteins. Probiotics (live bacteria and yeasts) have been proposed for the treatment and prevention of food allergies. The aim of this study is to investigate the anti-allergenic effect of a mixture of three Bifidobacterium strains in children with an allergy to cow\u2019s milk proteins before and after a 45-day treatment.\\n \\nWho can participate? \\nChildren aged 6-12 months with an allergy to cow\u2019s milk proteins on a cow\u2019s milk protein exclusion diet\\n \\nWhat does the study involve?\\nAll participants receive the same treatment. Following the initial visit, the children start a commercially available extensively hydrolyzed casein (protein) formula and treatment with the probiotic mixture for 45 days. Blood samples are collected soon before the probiotic treatment and at the end of the probiotic supplementation. After 45 days from the suspension of the probiotic, while the participants are still on a milk protein elimination diet, another blood sample is collected to better understand the specific effects of Bifidobacterium.\\n \\nWhat are the possible benefits and risks of participating?\\nThe Bifidobacteria could help increase tolerance to cow\u2019s milk proteins and could provide a significant benefit in the treatment of cow\u2019s milk protein allergy.\\n \\nWhere is the study run from? \\nUniversity of Campania \u201cLuigi Vanvitelli\u201d (Italy)\\n \\nWhen is the study starting and how long is it expected to run for?\\nJanuary 2015 to April 2018\\n \\nWho is funding the study?\\nAOU Universit\u00e0 degli Studi della Campania Luigi Vanvitelli (Italy)\\n \\nWho is the main contact?\\nCaterina Strisciuglio\\ncaterina.strisciuglio@unicampania.it\u0027, \u0027Title\u0027: \u0027Bifidobacteria improve immune tolerance in paediatric patients with an allergy to cow\u2019s milk proteins\u0027, \u0027SourceLinkout\u0027: \u0027https://www.isrctn.com/ISRCTN69069358\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ISRCTN\u0027, \u0027EndDate\u0027: neo4j.time.Date(2018, 4, 30), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/ISRCTN69069358\u0027, \u0027StartDate\u0027: neo4j.time.Date(2015, 1, 15), \u0027RecruitmentStatus\u0027: \u0
