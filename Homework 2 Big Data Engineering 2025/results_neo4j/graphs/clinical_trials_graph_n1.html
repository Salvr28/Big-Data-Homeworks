027Completed\u0027, \u0027StartYear\u0027: 2015, \u0027TrialID\u0027: \u0027ISRCTN69069358\u0027, \u0027CompletionYear\u0027: 2018, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "459", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 459\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027\u0027, \u0027BriefTitle\u0027: \u0027\u0027, \u0027Abstract\u0027: \u0027Helicobacter pylori infection\u0027, \u0027Title\u0027: \u0027Concomitant therapy with  levofloxacyn versus sequential therapy with levofloxacin  for eradication of H. pylori infection\u0027, \u0027SourceLinkout\u0027: \u0027https://www.clinicaltrialsregister.eu/ctr-search/search?query=2010-024644-15\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027EU-CTR\u0027, \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/2010-024644-15\u0027, \u0027StartDate\u0027: neo4j.time.Date(2011, 10, 27), \u0027RecruitmentStatus\u0027: \u0027Ongoing\u0027, \u0027StartYear\u0027: 2011, \u0027TrialID\u0027: \u00272010-024644-15\u0027, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "460", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 460\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027\u0027, \u0027Phase\u0027: \u0027\u0027, \u0027StudyType\u0027: \u0027Observational\u0027, \u0027NumberOfParticipants\u0027: 4501, \u0027BriefTitle\u0027: \u0027Post-Authorisation Safety Cohort Observation of RetacritTM (Epoetin Zeta) Administered Subcutaneously for the Treatment of Renal Anaemia\u0027, \u0027Abstract\u0027: \u0027The purpose of this study is to estimate the incidence of Pure Red Cell Aplasia (PRCA), neutralising antibodies, lack of efficacy, and thromboembolic events under treatment with Retacrit\u2122 (epoetin zeta) administered subcutaneously in patients with renal anaemia. The other key objective of this study is to obtain information on adverse drug reactions (ADR) associated with Retacrit\u2122 (epoetin zeta), use of epoetin zeta during pregnancy and lactation and data on long term use.\\n\\nDetailed Description\\nThis is a non-interventional, multi-centre, longitudinal observation with a defined population using a prospective cohort design to estimate the incidence of Pure Red Cell Aplasia (PRCA), neutralising antibodies, lack of efficacy, and thromboembolic events under treatment with Retacrit\u2122 (epoetin zeta) administered subcutaneously in patients with renal anaemia.\u0027, \u0027Title\u0027: \u0027POST-AUTHORISATION SAFETY COHORT OBSERVATION OF RETACRIT (EPOETIN ZETA) ADMINISTERED SUBCUTANEOUSLY FOR THE TREATMENT OF RENAL ANAEMIA (PASCO II)\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT01543477\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2020, 4, 29), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT01543477\u0027, \u0027minAgeYears\u0027: 0.0, \u0027StartDate\u0027: neo4j.time.Date(2010, 7, 7), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027StartYear\u0027: 2010, \u0027TrialID\u0027: \u0027NCT01543477\u0027, \u0027CompletionYear\u0027: 2020, \u0027Acronym\u0027: \u0027PASCO II\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "464", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 464\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027\u0027, \u0027Phase\u0027: \u0027Phase 4\u0027, \u0027StudyType\u0027: \u0027\u0027, \u0027BriefTitle\u0027: \u0027\u0027, \u0027Abstract\u0027: \u0027patients with type 2 diabetes poorly controlled\u0027, \u0027Title\u0027: \u0027Effects of vildagliptin twice daily vs. sitagliptin once daily on reduction of oxidative stress and inflammation by blunting interprandial acute glucose fluctuations in patients with type 2 diabetes - PROBE Design Multicenter Prospective, Randomized, Open-label parallel group with a blinded-endpoint\u0027, \u0027SourceLinkout\u0027: \u0027https://www.clinicaltrialsregister.eu/ctr-search/search?query=2010-019346-11\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027EU-CTR\u0027, \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/2010-019346-11\u0027, \u0027StartDate\u0027: neo4j.time.Date(2010, 3, 3), \u0027RecruitmentStatus\u0027: \u0027Ongoing\u0027, \u0027StartYear\u0027: 2010, \u0027TrialID\u0027: \u00272010-019346-11\u0027, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "466", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 466\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Placebo (Drug), Idebenone (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 65, \u0027BriefTitle\u0027: \u0027Phase III Study of Idebenone in Duchenne Muscular Dystrophy (DMD)\u0027, \u0027Abstract\u0027: \u0027The aim of this Phase III study was to assess the efficacy of idebenone on pulmonary function, motor function, muscle strength and quality of life in patients with DMD. Furthermore, the safety and tolerability of idebenone was assessed.\\n\\nDetailed Description\\nThis study was a Phase III, multicenter, randomized, double-blind, placebo-controlled efficacy and safety study. DMD patients (ambulatory and non-ambulatory) at age 10-18 years were enrolled at sites in Europe and North America. Study subjects were randomized in a 1:1 ratio to receive either idebenone (900 mg/day) or placebo 3 times a day with meals for 52 weeks. The primary endpoint was the difference between Catena\u00ae/Raxone\u00ae and placebo in the change from Baseline to week 52 in Peak Expiratory Flow (PEF as percent predicted, PEF%p, a measure of respiratory muscle strength) as measured by hospital-based spirometry. PEF was also measured by the patient at home using the hand-held ASMA-1 device (secondary endpoint). Other respiratory endpoints included Forced Expiratory Volume in 1 second (as percent predicted, FEV1%p, an additional measure of respiratory muscle strength) and Forced Vital Capacity (as percent predicted, FVC%p, a measure of restrictive lung disease predictive of morbidity and mortality in DMD).\u0027, \u0027Title\u0027: \u0027A Phase III Double-Blind, Randomised, Placebo-Controlled Study of the Efficacy, Safety and Tolerability of Idebenone in 10-18 Year Old Patients With Duchenne Muscular Dystrophy\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT01027884\u0027, \u0027Gender\u0027: \u0027Male\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2014, 4, 1), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT01027884\u0027, \u0027minAgeYears\u0027: 10.0, \u0027StartDate\u0027: neo4j.time.Date(2009, 7, 1), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027AltmetricAttentionScore\u0027: 9.0, \u0027StartYear\u0027: 2009, \u0027TrialID\u0027: \u0027NCT01027884\u0027, \u0027CompletionYear\u0027: 2014, \u0027Acronym\u0027: \u0027DELOS\u0027, \u0027maxAgeYears\u0027: 18.0}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "470", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 470\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027\u0027, \u0027BriefTitle\u0027: \u0027\u0027, \u0027Abstract\u0027: \u0027subjects affected by secondary-progressive Multiple Sclerosis MedDRA Classification\u0027, \u0027Title\u0027: \u0027MITOXANTRONE/GLATIRAMER ACETATE COMBINED  TREATMENT IN THE THERAPY OF  SECONDARY-PROGRESSIVE MULTIPLE SCLEROSIS\u0027, \u0027SourceLinkout\u0027: \u0027https:// ucleostide analogues. MedDRA Classification\u0027, \u0027Title\u0027: \u0027PILOT MULTICENTER OPEN STUDY TO EVALUATE EFFICACY AND TOLERABILITY OF PEG-INTERFERON ALFA-2A IN PATIENTS WITH ANTI-HBE POSITIVE CHRONIC HEPATITIS B WHO PRESENT RESIDUAL VIREMIA OR VIROLOGICAL REBOUND DURING NUCLEOSTIDE ANALOGUE TREATMENT\u0027, \u0027SourceLinkout\u0027: \u0027https://www.clinicaltrialsregister.eu/ctr-search/search?query=2008-004761-26\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027EU-CTR\u0027, \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/2008-004761-26\u0027, \u0027StartDate\u0027: neo4j.time.Date(2008, 12, 16), \u0027RecruitmentStatus\u0027: \u0027Prematurely Ended\u0027, \u0027StartYear\u0027: 2008, \u0027TrialID\u0027: \u00272008-004761-26\u0027, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "915", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 915\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027\u0027, \u0027BriefTitle\u0027: \u0027\u0027, \u0027Abstract\u0027: \u0027Hyperhomocysteinemia in hemodialysis. MedDRA Classification\u0027, \u0027Title\u0027: \u0027Therapy of hyperhomocysteinemia in hemodialysis patients:effects of acetylcysteine and folates.\u0027, \u0027SourceLinkout\u0027: \u0027https://www.clinicaltrialsregister.eu/ctr-search/search?query=2007-000451-34\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027EU-CTR\u0027, \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/2007-000451-34\u0027, \u0027StartDate\u0027: neo4j.time.Date(2007, 1, 16), \u0027RecruitmentStatus\u0027: \u0027Ongoing\u0027, \u0027StartYear\u0027: 2007, \u0027TrialID\u0027: \u00272007-000451-34\u0027, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "917", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 917\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Povorcitinib (Drug), Placebo (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 444, \u0027BriefTitle\u0027: \u0027A Study to Evaluate Efficacy and Safety of Povorcitinib in Participants With Nonsegmental Vitiligo (STOP-V2)\u0027, \u0027Abstract\u0027: \u0027This study is being conducted to determine the efficacy and safety of povorcitinib in participants with nonsegmental vitiligo.\u0027, \u0027Title\u0027: \u0027A Phase 3, Randomized, Double-Blind, 52-Week, Placebo-Controlled, Efficacy and Safety Study of Povorcitinib in Participants With Nonsegmental Vitiligo\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT06113471\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2027, 5, 17), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT06113471\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2023, 11, 27), \u0027RecruitmentStatus\u0027: \u0027Recruiting\u0027, \u0027StartYear\u0027: 2023, \u0027TrialID\u0027: \u0027NCT06113471\u0027, \u0027CompletionYear\u0027: 2027, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "921", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 921\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027root resection (Procedure)\u0027, \u0027Phase\u0027: \u0027\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 10, \u0027BriefTitle\u0027: \u0027Vital Root Amputation in Molars With Advanced Periodontal Furcation Involvement: a Preliminary Study\u0027, \u0027Abstract\u0027: \u0027The goal of this clinical trial is to test in 10 patients with advanced furcation involvement on molars. The main question[s] it aims to answer are:\u2022 Is it possible to carry out root resection without endodontic treatment on molars? Tooth vitality will be checked (positive response to cold test). Root resection will be carried out under local anestesia.Following visits will be carried out for re-evaluation/maintenance according to clinical care every 3 mounths until 3 years follow-up.\u0027, \u0027Title\u0027: \u0027Vital Root Amputation in Molars With Advanced Periodontal Furcation Involvement: a Preliminary Study\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT05721313\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2025, 1, 15), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT05721313\u0027, \u0027StartDate\u0027: neo4j.time.Date(2023, 9, 1), \u0027RecruitmentStatus\u0027: \u0027Not yet recruiting\u0027, \u0027StartYear\u0027: 2023, \u0027TrialID\u0027: \u0027NCT05721313\u0027, \u0027CompletionYear\u0027: 2025, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "926", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 926\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Leramistat (Drug), Placebo (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 2\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 150, \u0027BriefTitle\u0027: \u0027A Study to Investigate Leramistat in Patients With IPF\u0027, \u0027Abstract\u0027: \u0027To compare the effect of daily oral dosing of leramistat over 12 weeks with placebo in participants aged 40 years or older with idiopathic pulmonary fibrosis (IPF).\\n\\nDetailed Description\\nThis will be a Phase 2, double-blind, placebo-controlled, 2-arm, parallel-group, multi-centre study to investigate leramistat treatment of patients aged 40 years or older with IPF. The study is planned to consist of the following parts:Screening period: 1 to 28 days (Weeks -4 to -1). Treatment period: a 12-week blinded, placebo-controlled treatment period (Weeks 1 to 12).Follow up period: 56 days (Weeks 13 to 20). All participants will return for a follow-up visit 56 days after their final dose.Randomization will be stratified by concomitant use of an approved anti-fibrotic drug (nintedanib or pirfenidone) at randomization versus no concomitant use of an approved anti-fibrotic drug at randomization.Number of Participants: Approximately 150 participants will be enrolled and randomly assigned in a 2:1 ratio to receive either leramistat or matched placebo.If the participant is receiving nintedanib or pirfenidone treatment, it should be stable for at least 8 weeks prior to study entry and be predicted to remain stable during the course of the study. The maximum duration of participation (including screening period and follow-up) is 24 weeks.Data Monitoring/Other Committee: A DSMB has been appointed for this study.\u0027, \u0027Title\u0027: \u0027A Randomized, Double-Blind, Placebo-Controlled, Phase 2 Study to Investigate the Efficacy and Safety of Leramistat in Patients With Idiopathic Pulmonary Fibrosis (IPF)\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT05951296\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2024, 9, 1), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT05951296\u0027, \u0027minAgeYears\u0027: 40.0, \u0027StartDate\u0027: neo4j.time.Date(2023, 8, 30), \u0027RecruitmentStatus\u0027: \u0027Recruiting\u0027, \u0027StartYear\u0027: 2023, \u0027TrialID\u0027: \u0027NCT05951296\u0027, \u0027CompletionYear\u0027: 2024, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "927", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 927\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Vixarelimab (Drug), Placebo (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 2\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 290, \u0027BriefTitle\u0027: \u0027A Study Evaluating the Efficacy and Safety of Vixarelimab in Participants With Idiopathic Pulmonary Fibrosis and in Participants With Systemic Sclerosis-Associated Interstitial Lung Disease\u0027, \u0027Abstract\u0027: \u0027The main purpose of the study is to evaluate the efficacy of vixarelimab compared with placebo on lung function in participants with idiopathic pulmonary fibrosis (IPF) and in participants with systemic sclerosis-associated interstitial lung disease (SSc-ILD). Participants who complete 52-weeks of treatment in the Double-blind Treatment (DBT) period can choose to enroll in the optional Open-label Extension (OLE) period to receive treatment with vixarelimab for another 52 weeks.\u0027, \u0027Title\u0027: \u0027A Two-Cohort, Phase II, Multicenter, Randomized, Double-Blind, Parallel-Group, Placebo-Controlled Study Evaluating the Efficacy and Safety of Vixarelimab Compared With Placebo in Patients With Idiopathic Pulmonary Fibrosis and in Patients With Systemic Sclerosis-Associated Interstitial Lung Disease\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT05785624\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2027, 8, 10), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT05785624\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2023, 5, 26), \u0027RecruitmentStatus\u0027: \u0027Recruiting\u0027, \u0027AltmetricAttentionScore\u0027: 1.0, \u0027StartYear\u0027: 2023, \u0027TrialID\u0027: \u0027NCT05785624\u0027, \u0027CompletionYear\u0027: 2027, \u0027Acronym\u0027: \u0027\u0027, \u0027maxAgeYears\u0027: 85.0}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "928", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 928\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Sotrovimab (Drug), Tixagevimab Cilgavimab (Drug), Nirmatrelvir Ritonavir (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 536, \u0027BriefTitle\u0027: \u0027Non-inferiority Trial on Treatments in Early COVID-19\u0027, \u0027Abstract\u0027: \u0027The study aims at assessing the non-inferiority of tixagevimab plus cilgavimab and nirmatrelvir plus ritornavir vs. sotrovimab (reference standard due to the wider evidence gathered on its efficacy) on COVID-19 progression in a real-life setting of outpatients aged at least 50 years at an early stage of the disease. The progression of COVID-19 disease (hospitalization, need for supplementary oxygen therapy at home, death) within 14 days of randomisation is the composite outcome variable on which the calculation of the sample size is based. Based on available data regarding the reduction in the number of hospitalisations and medical visits with the use of sotrovimab at an early-stage of COVID-19, a disease progression of 1% has been estimated in the reference arm. 3% delta margin was considered clinically relevant, taking into account both the estimates of disease progression in the study population in absence of early treatment (7%, based on national data) and the efficacy of the reference standard. Therefore, 1095 participants will be randomly assigned in an equal ratio between the reference standard and each of the other two experimental arms (1:1:1). Randomization will be computer-generated in permuted blocks with a stratification based on site.\u0027, \u0027Title\u0027: \u0027Adaptive, Randomized, Non-inferiority Trial on the Use of Monoclonal Antibodies or Antivirals in Outpatients With Mild or Moderate COVID-19\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT05321394\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2023, 10, 29), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT05321394\u0027, \u0027minAgeYears\u0027: 50.0, \u0027StartDate\u0027: neo4j.time.Date(2022, 3, 7), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027StartYear\u0027: 2022, \u0027TrialID\u0027: \u0027NCT05321394\u0027, \u0027CompletionYear\u0027: 2023, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "932", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 932\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Ocrelizumab (Drug), Ocrelizumab Placebo (Other), Fingolimod (Drug), Fingolimod Placebo (Other)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 233, \u0027BriefTitle\u0027: \u0027A Study To Evaluate Safety And Efficacy Of Ocrelizumab In Comparison With Fingolimod In Children And Adolescents With Relapsing-Remitting Multiple Sclerosis\u0027, \u0027Abstract\u0027: \u0027This double-blind, double-dummy study will evaluate the safety and efficacy of ocrelizumab compared with fingolimod in children and adolescents with relapsing-remitting multiple sclerosis aged between 10 and \u003c 18 years over a duration of at least 96 weeks.\\n\\nDetailed Description\\nThis Phase III randomized, double-blind, double-dummy, multicenter study will evaluate the safety and efficacy of ocrelizumab administered by IV infusion every 24 weeks compared with fingolimod taken orally daily, in children and adolescents with Multiple Sclerosis aged between 10 and \u003c 18 years. The study plans to enroll 233 patients in a 1:1 randomization (ocrelizumab:fingolimod), globally. This study consists of a double-blind, double dummy period in which patients will be treated with either active ocrelizumab or active fingolimod for at least 96 weeks. Patients who complete the double-blind period will be offered the possibility to enter an optional open-label extension treatment period of at least 144 weeks with ocrelizumab.\u0027, \u0027Title\u0027: \u0027A Phase III Multicenter, Randomized, Double-Blind, Double-Dummy Study To Evaluate Safety And Efficacy Of Ocrelizumab In Comparison With Fingolimod In Children And Adolescents With Relapsing-Remitting Multiple Sclerosis\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT05123703\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2029, 9, 17), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT05123703\u0027, \u0027minAgeYears\u0027: 10.0, \u0027StartDate\u0027: neo4j.time.Date(2022, 2, 4), \u0027RecruitmentStatus\u0027: \u0027Recruiting\u0027, \u0027AltmetricAttentionScore\u0027: 1.0, \u0027StartYear\u0027: 2022, \u0027TrialID\u0027: \u0027NCT05123703\u0027, \u0027CompletionYear\u0027: 2029, \u0027Acronym\u0027: \u0027Operetta 2\u0027, \u0027maxAgeYears\u0027: 17.0}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "934", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 934\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Atezolizumab 1200 mg in 20 ML Injection (Drug), Placebo (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 162, \u0027BriefTitle\u0027: \u0027Atezolizumab Versus Placebo for the Adjuvant Treatment of Malignant Pleural Mesothelioma (Atezomeso)\u0027, \u0027Abstract\u0027: \u0027This is a multicentric double-blind, placebo controlled, phase III trial. In this study, patients who underwent to a surgical resection of pleural mesothelioma and are without signs of macroscopic residual disease will be randomized 2:1 to receive atezolizumab or placebo. Patients will be treated for 12 months or until recurrence, unacceptable toxicity or patient/physician decision, whichever occurs first.Randomization will be done via a centralized system and patients will be stratified histology (epithelioid vs non epithelioid) and stage (I vs\u003eI). Patients will be radiologically evaluated after surgical procedure before starting therapy and then every 12 weeks for 24 months or until disease progression. At screening patients should be without macroscopic residual disease. Quality of life questionnaire will be administered to patient at baseline and every 12 weeks. During the study baseline tumor blocks will be centrally analyzed to determinate biological characteristics and gene expression.\u0027, \u0027Title\u0027: \u0027PHASE III STUDY WITH ATEZOLIZUMAB VERSUS PLACEBO IN MALIGNANT PLEURAL MESOTHELIOMA PATIENTS AFTER PLEURECTOMY/DECORTICATION\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT04996017\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2023, 12, 31), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT04996017\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2021, 12, 14), \u0027RecruitmentStatus\u0027: \u0027Unknown status\u0027, \u0027AltmetricAttentionScore\u0027: 1.0, \u0027StartYear\u0027: 2021, \u0027TrialID\u0027: \u0027NCT04996017\u0027, \u0027CompletionYear\u0027: 2023, \u0027Acronym\u0027: \u0027AtezoMeso\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "938", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 938\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Bamlanivimab Etesevimab (Drug), Sotrovimab (Drug), Casirivimab-Imdevimab (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 319, \u0027BriefTitle\u0027: \u0027Non-inferiority Trial on Monoclonal Antibodies in COVID-19\u0027, \u0027Abstract\u0027: \u0027Currently, 3 anti-SARS-CoV-2 monoclonal antibody products have received Emergency Use Authorizations from the Italian Medicines Agency (AIFA) for the treatment of mild to moderate COVID-19 in non hospitalized patients with laboratory-confirmed SARS-CoV-2 infection who are at high risk for progressing to severe disease and/or hospitalization (bamlanivimab plus etesevimab, sotrovimab, and casirivimab plus imdevimab). Differently from casirivimab/imdevimab and sotrovimab, the European Medicines Agency (EMA) has never recommended authorising the combination bamlanivimab/etesevimab for treating COVID-19. Moreover, the evidence on sotrovimab relies on the interim analysis results of an ongoing randomised placebo-controlled clinical trial [1], unlike the combinations bamlanivimab/etesevimab and casirivimab/imdevimab, whose results of the randomised placebo-controlled trials were published after having completed the enrolment [2,3]. The study aims at assessing the non-inferiority of bamlanivimab plus etesevimab and sotrovimab vs. casirivimab plus imdevimab on COVID-19 progression in patients aged at least 50 years at an early stage of the disease. The progression of COVID-19 disease (hospitalization, need for supplementary oxygen therapy at home, death) within 14 days of randomisation is the composite outcome variable on which the calculation of the sample size is based. Based on available data regarding the reduction in the number of hospitalisations and medical visits with the use of casirivimab plus imdevimab at an early-stage of COVID-19, a disease progression of 5% has been estimated in the reference arm. 5% delta margin was considered clinically relevant, taking into account both the estimates of disease progression in the study population in absence of early treatment with monoclonal antibodies (20%, based on national data) and the efficacy of the reference standard. Therefore, 1260 participants will be randomly assigned in an equal ratio between the reference standard and each of the other two experimental arms (1:1:1). Randomization will be computer-generated in permuted blocks with a stratification based on site.\\n\\nDetailed Description\\nSample size. The parameters for the sample size estimation were derived from the only double-blind, randomised, placebo-controlled trial assessing the clinical efficacy of casirivimab/imdevimab (reference standard) [3]. Hospitalisation related to COVID-19 or all-cause mortality in this study occurred in 7 of 736 patients in the casirivimab/imdevimab 1200-mg group (1.0%) and in 24 of 748 patients in the placebo group who underwent randomisation concurrently (3.2%) (relative risk reduction, 70.4%; P=0.002). Assuming a non-inferiority margin of 5%, 420 patients per group were needed to achieve 90% power with a 1-sided \u03b1 level of .025, allowing for 5% dropout. A 5% non-inferiority margin was chosen as the maximal difference between treatments in COVID-19 progression that would be clinically acceptable by consultation with Infectious Diseases and clinical trial specialists involved in the protocol development.\u0027, \u0027Title\u0027: \u0027Adaptive, Randomized, Non-inferiority Trial to Evaluate the Efficacy of Monoclonal Antibodies in Outpatients With Mild or Moderate COVID-19\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT05205759\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2022, 4, 5), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT05205759\u0027, \u0027minAgeYears\u0027: 50.0, \u0027StartDate\u0027: neo4j.time.Date(2021, 12, 9), \u0027RecruitmentStatus\u0027: \u0027Terminated\u0027, \u0027AltmetricAttentionScore\u0027: 1.0, \u0027StartYear\u0027: 2021, \u0027TrialID\u0027: \u0027NCT05205759\u0027, \u0027CompletionYear\u0027: 2022, \u0027Acronym\u0027: \u0027MANTICO\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "1132", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 1132\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027TAK-755 (Biological)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 77, \u0027BriefTitle\u0027: \u0027A Study of TAK-755 in Participants With Congenital Thrombotic Thrombocytopenic Purpura\u0027, \u0027Abstract\u0027: \u0027Thrombotic thrombocytopenic purpura (or TTP for short) is a condition where blood clots form in small blood vessels throughout the body. The clots can limit or block the flow of oxygen-rich blood to the body\\\u0027s organs, such as the brain, kidneys, and heart. As a result, serious health problems can develop. The increased clotting that occurs in TTP uses up the cells that help the blood to clot, called platelets. With fewer platelets available in the blood, bleeding problems can also occur. People who have TTP may bleed underneath the skin forming purple bruises, or purpura. TTP also can cause anemia, a condition in which red blood cells break apart faster than the body can replace them, leading to fewer red blood cells than in normal.TTP is caused by a lack of activity in the ADAMTS13 enzyme, a protein in the blood involved in controlling clotting of the blood. The ADAMTS13 enzyme breaks up another blood protein called von Willebrand factor that forms blood clots by clumping together with platelets. Some people are born with this condition, while others develop the condition during their life. Many people who are born with TTP experience frequent flare-ups that need to be treated right away. TAK-755 is a medicine that replaces ADAMTS13 and may prevent or control TTP flare-ups, called acute TTP events.The main aim of the study is to check for side effects of long-term treatment with TAK-755. Treatment will be given in 2 ways:TAK-755 treatment given either every week or every other week to prevent acute TTP events from happening (the \"prophylactic\" cohort).TAK-755 treatment given to control an acute TTP event when it happens (the \"on-demand\" cohort).Participants in the prophylactic cohort will receive treatment in the clinic or at home for up to approximately 3 years. They will visit the clinic at least every 12 weeks. Participants in the on-demand cohort will receive daily treatment for the acute TTP event until the flare-up has gotten better. They will have a follow-up visit at the clinic 4 weeks later.\\n\\nDetailed Description\\nThis is a follow-up study to the Phase 3 pivotal study (281102 [NCT03393975]) and will be comprised of two treatment cohorts (Prophylactic and On-demand) consisting of na\u00efve and non-na\u00efve participants who were born with TTP, with a total duration of approximately 6 years. A maximum of approximately 77 participants will be enrolled in this study (approximately 57 participants who have completed study 281102 [NCT03393975] [non-na\u00efve participants] and at least 20 na\u00efve participants (participants who are na\u00efve to TAK-755). Participants from Expanded Access Programs, participants from study 281102 (NCT03393975) who had an allergic reaction to standard of care treatment, and participants who completed the Phase 1 study (281101 [NCT02216084]) but did not participate in Study 281102, will also be eligible for enrollment in this continuation study as na\u00efve participants.TAK-755 is given slowly through a vein (intravenous infusion). Participants in the prophylactic cohort will be able to opt for treatment in a home setting by caregiver or self-infusion subject to conditions and to local regulatory approval.\u0027, \u0027Title\u0027: \u0027A Phase 3b, Prospective, Open-label, Multicenter, Single Treatment Arm, Continuation Study of the Safety and Efficacy of TAK-755 (rADAMTS13, Also Known as BAX 930/SHP655) in the Prophylactic and On-demand Treatment of Subjects With Severe Congenital Thrombotic Thrombocytopenic Purpura (cTTP; Upshaw-Schulman Syndrome, or Hereditary Thrombotic Thrombocytopenic Purpura)\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT04683003\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2026, 8, 27), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT04683003\u0027, \u0027StartDate\u0027: neo4j.time.Date(2021, 4, 14), \u0027RecruitmentStatus\u0027: \u0027Recruiting\u0027, \u0027AltmetricAttentionScore\u0027: 132.0, \u0027StartYear\u0027: 2021, \u0027TrialID\u0027: \u0027NCT04683003\u0027, \u0027CompletionYear\u0027: 2026, \u0027Acronym\u0027: \u0027\u0027, \u0027maxAgeYears\u0027: 70.0}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "1133", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 1133\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Basimglurant with crossover to Placebo (Drug), Placebo with crossover to Basimglurant (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 2\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 54, \u0027BriefTitle\u0027: \u0027Basimglurant in Children, Adolescents, and Young Adults With TSC\u0027, \u0027Abstract\u0027: \"The study intends to show that basimglurant provides effective seizure control in children, adolescents and young adults with Tuberous Sclerosis Complex (TSC).\\n\\nDetailed Description\\nThe study drug (basimglurant) is a potent inhibitor of metabotropic glutamate receptor 5 (mGluR5) which controls a wide range of processes in the brain, spinal cord, retina, and peripheral nervous system. In animal studies, the inhibition of this receptor has shown therapeutic potential for the treatment of Tuberous Sclerosis Complex (TSC). This receptor\u0027s inhibition decreases the frequency of seizures. In previous clinical trials, the study drug has shown an advantageous safety profile in children and adolescents.The objective of this study is to find an optimal dose at which the study drug will lead to a decrease in the duration, frequency and intensity of seizures in children, adolescents and young adults with TSC, while being well tolerated. All patients who positively respond and tolerate the medicine will be offered the possibility to continue in an open label extension.\", \u0027Title\u0027: \u0027A Phase 2B, Multicenter, 30-week, Prospective, Cross-over, Double-blind, Randomized, Placebo-controlled Study Followed by a 52-Week Open-label Extension Study to Evaluate the Efficacy and Safety of Basimglurant Adjunctive to Ongoing Anticonvulsive Therapy in Children, Adolescents, and Young Adults With Uncontrolled Seizures Associated With Tuberous Sclerosis Complex\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT05059327\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2025, 8, 31), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT05059327\u0027, \u0027minAgeYears\u0027: 5.0, \u0027StartDate\u0027: neo4j.time.Date(2021, 3, 3), \u0027RecruitmentStatus\u0027: \u0027Recruiting\u0027, \u0027AltmetricAttentionScore\u0027: 11.0, \u0027StartYear\u0027: 2021, \u0027TrialID\u0027: \u0027NCT05059327\u0027, \u0027CompletionYear\u0027: 2025, \u0027Acronym\u0027: \u0027\u0027, \u0027maxAgeYears\u0027: 30.0}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "1136", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 1136\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027satralizumab (Drug), azathioprine (AZA) (Drug), mycophenolate mofetil (MMF) (Drug), oral corticosteroids (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 119, \u0027BriefTitle\u0027: \u0027A Study to Evaluate the Safety and Efficacy of Satralizumab in Participants With Neuromyelitis Optica Spectrum Disorder (NMOSD)\u0027, \u0027Abstract\u0027: \u0027This multicenter, single-arm, open-label study will evaluate the long-term safety and efficacy of satralizumab in participants with neuromyelitis optica spectrum disorder (NMOSD) who completed open-label extension (OLE) period of studies BN40898 and BN40900. Participants will receive satralizumab as monotherapy or in combination with one of the following background immunosuppressive treatments: azathioprine (AZA), mycophenolate mofetil (MMF), or oral corticosteroids.\u0027, \u0027Title\u0027: \u0027A Multicenter, Single Arm, Open-Label Study to Evaluate the Long-Term Safety and Efficacy of Satralizumab in Patients With Neuromyelitis Optica Spectrum Disorder (NMOSD)\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT04660539\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2024, 5, 25), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT04660539\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2021, 3, 2), \u0027RecruitmentStatus\u0027: \u0027Active, not recruiting\u0027, \u0027StartYear\u0027: 2021, \u0027TrialID\u0027: \u0027NCT04660539\u0027, \u0027CompletionYear\u0027: 2024, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "1137", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 1137\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Ibrutinib (Biological), Venetoclax (Biological), Obinutuzumab (Biological)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 897, \u0027BriefTitle\u0027: \u0027Ibrutinib Monotherapy Versus Fixed-duration Venetoclax Plus Obinutuzumab Versus Fixed-duration Ibrutinib Plus Venetoclax in Patients With Previously Untreated Chronic Lymphocytic Leukaemia (CLL)\u0027, \u0027Abstract\u0027: \u0027The aim of this study is to compare the efficacy of continuous ibrutinib monotherapy with fixed-duration venetoclax plus obinutuzumab and fixed-duration ibrutinib plus venetoclax by measuring progression-free survival (PFS) in patients with previously untreated CLL.\u0027, \u0027Title\u0027: \u0027A Phase 3 Multicentre, Randomized, Prospective, Open-label Trial of Ibrutinib Monotherapy Versus Fixed-duration Venetoclax Plus Obinutuzumab Versus Fixed-duration Ibrutinib Plus Venetoclax in Patients With Previously Untreated Chronic Lymphocytic Leukaemia (CLL)\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT04608318\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2027, 3, 1), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT04608318\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2021, 3, 1), \u0027RecruitmentStatus\u0027: \u0027Active, not recruiting\u0027, \u0027StartYear\u0027: 2021, \u0027TrialID\u0027: \u0027NCT04608318\u0027, \u0027CompletionYear\u0027: 2027, \u0027Acronym\u0027: \u0027CLL17\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "1139", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 1139\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Crovalimab (Drug), Eculizumab (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 190, \u0027BriefTitle\u0027: \u0027A Study Evaluating The Safety, Pharmacokinetics, and Efficacy Of Crovalimab Versus Eculizumab In Participants With Paroxysmal Nocturnal Hemoglobinuria (PNH) Currently Treated With Complement Inhibitors\u0027, \u0027Abstract\u0027: \u0027A study designed to evaluate the safety of crovalimab with eculizumab in participants with PNH currently treated with complement inhibitors. This study will enroll approximately 190 participants.\u0027, \u0027Title\u0027: \u0027A Phase III, Randomized, Open-Label, Active-Controlled, Multicenter Study Evaluating The Safety, Pharmacokinetics, Pharmacodynamic And Efficacy of Crovalimab Versus Eculizumab In Patients With Paroxysmal Nocturnal Hemoglobinuria (PNH) Currently Treated With Complement Inhibitors\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT04432584\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2029, 9, 1), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT04432584\u0027, \u0027StartDate\u0027: neo4j.time.Date(2020, 9, 30), \u0027RecruitmentStatus\u0027: \u0027Recruiting\u0027, \u0027AltmetricAttentionScore\u0027: 105.0, \u0027StartYear\u0027: 2020, \u0027TrialID\u0027: \u0027NCT04432584\u0027, \u0027CompletionYear\u0027: 2029, \u0027Acronym\u0027: \u0027COMMODORE 1\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "1140", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 1140\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027TAK-788 (Drug), Pemetrexed (Drug), Cisplatin (Drug), Carboplatin (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 354, \u0027BriefTitle\u0027: \u0027TAK-788 as First-Line Treatment Versus Platinum-Based Chemotherapy for Non-Small Cell Lung Cancer (NSCLC) With EGFR Exon 20 Insertion Mutations\u0027, \u0027Abstract\u0027: \"The purpose of this study is to compare the effectiveness of TAK-788 as first-line treatment with that of platinum-based chemotherapy in participants with locally advanced or metastatic non-small cell lung cancer (NSCLC) whose tumors has epidermal growth factor receptor (EGFR) exon 20 insertion mutations.Participants will be randomly assigned to one of the two treatment groups- TAK-788 group or Platinum-based chemotherapy group.Participants will receive TAK-788 orally and pemetrexed/cisplatin or pemetrexed/carboplatin via vein until the participants experience worsening disease (PD) as assessed by blinded independent review committee (IRC), intolerable harmful effects or another discontinuation criteria.\\n\\nDetailed Description\\nThe drug being tested in this study is called TAK-788. TAK-788 is being tested to evaluate the efficacy as a first line treatment compare with platinum-based chemotherapy in the participants with locally advanced or NSCLC whose tumors harbor EGFR exon 20 insertion mutations.The study will enroll approximately 318 patients. Participants will be randomly assigned to one of the two treatment groups-TAK-788 Group (Arm A)Platinum-based Chemotherapy Group (Arm B)The participants will be administered with TAK-788 orally in arm A and pemetrexed/cisplatin or pemetrexed/carboplatin intravenously (IV) in arm B until the participants experience progressive disease (PD) as assessed by blinded independent review committee (IRC), intolerable toxicity or another discontinuation criteria. Participants in the chemotherapy group may cross over to treatment with TAK-788 after IRC-assessed PD is documented. Randomized treatment with TAK-788 or platinum-based chemotherapy may be continued after PD, at the discretion of the investigator and with the sponsor\u0027s approval, if there is still evidence of clinical benefit.This multi-center trial will be conducted in United States (US), Europe, and Asia. The overall time to participate in this study is until 3 years after the last participant is randomized. Participants will make multiple visits to the clinic and will be followed for survival, subsequent anticancer therapy, subsequent disease assessment outcome until disease progression on a subsequent anticancer therapy, and participant-reported health status (EuroQoL-5 Dimensions-5 Levels [EQ-5D-5L]) for 3 years after the last participant is randomized in the study and 30 days after the last dose of study drug for safety follow-up.\", \u0027Title\u0027: \u0027A Randomized Phase 3 Multicenter Open-Label Study to Compare the Efficacy of TAK-788 as First-Line Treatment Versus Platinum-Based Chemotherapy in Patients With Non-Small Cell Lung Cancer With EGFR Exon 20 Insertion Mutations\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT04129502\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2026, 6, 12), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT04129502\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2020, 1, 10), \u0027RecruitmentStatus\u0027: \u0027Active, not recruiting\u0027, \u0027AltmetricAttentionScore\u0027: 14.0, \u0027StartYear\u0027: 2020, \u0027TrialID\u0027: \u0027NCT04129502\u0027, \u0027CompletionYear\u0027: 2026, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "1143", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 1143\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027\u0027, \u0027Phase\u0027: \u0027\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 240, \u0027BriefTitle\u0027: \u0027A resilience group training program for people with multiple sclerosis: multi-centre trial (Multi_READY for MS)\u0027, \u0027Abstract\u0027: \"Background and study aims\\nMultiple sclerosis (MS) is a condition that can affect the brain and spinal cord, causing a wide range of potential symptoms, including problems with vision, arm or leg movement, sensation or balance.\\nIt\u0027s a lifelong condition that can sometimes cause serious disability, although it can occasionally be mild. In many cases, it\u0027s possible to treat symptoms. Average life expectancy is slightly reduced for people with MS. It\u0027s most commonly diagnosed in people in their 20s and 30s, although it can develop at any age. It\u0027s about 2 to 3 times more common in women than men. MS is one of the most common causes of disability in younger adults.\\nAdjusting to MS can be highly demanding, and the disease can be a consistent source of stress. Resilience is an internal resource for alleviating the adverse effects of stress and sustaining good mental health through adversity.\\nIn recent years, an Australian team developed and tested an Acceptance and Commitment Therapy (ACT)-based group resilience-training program: the REsilience and Activities for every DaY (READY). In view of the promising preliminary data on the READY for MS resilience training intervention, we decided to apply the READY for MS in Italy and to evaluate the efficacy of the program by following the Medical Research Council (MRC) framework for developing and evaluating complex interventions. \\nAim: This study aims to evaluate the efficacy of the Italian READY for MS program in a multi-center cluster randomized trial.\\n\\nWho can participate?\\nAdults over 18 years, diagnosed with MS.\\n\\nWhat does the study involve?\\nParticipants will be randomly allocated to receive the READY intervention consisting of seven weekly 2.5 hour sessions plus a 2.5 hour \u2018booster\u2019 session approximately five weeks after the seventh session, or a control program with the same number of sessions and schedules (but with different content). \\n\\nWhat are the possible benefits and risks of participating?\\nThis study will produce evidence on the efficacy of a brief, structured group intervention to promote resilience in people with MS by comparing it with an active group intervention. It is expected that, by empowering participant inner resources, Italian READY for MS can promote a personal growth that may help participants to prevent or overcome difficulties in adjustment to MS, and to live a full and rich life. The Italian READY for MS program is brief and highly structured, which ease its affordability.\\nWe do not expect any negative effects due to the participation in this study. \\n\\nWhere is the study run from?\\nFondazione IRCCS Istituto Neurologico Carlo Besta (Italy)\\n\\nWhen is the study starting and how long is it expected to run for?\\nJanuary 2020 to December 2022 (updated 09/04/2021, previously: December 2021; updated 20/10/2020, previously: September 2021)\\n\\nWho is funding the study?\\nFondazione Italiana Sclerosi Multipla \u2013 FISM (Italy)\\n\\nWho is the main contact?\\nAmbra Mara Giovannetti, ambra.giovannetti@istituto-besta.it\", \u0027Title\u0027: \u0027A resilience group training program for people with multiple sclerosis: multi-centre randomized controlled trial\u0027, \u0027SourceLinkout\u0027: \u0027https://www.isrctn.com/ISRCTN67194859\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ISRCTN\u0027, \u0027EndDate\u0027: neo4j.time.Date(2022, 12, 31), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/ISRCTN67194859\u0027, \u0027StartDate\u0027: neo4j.time.Date(2020, 1, 1), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027StartYear\u0027: 2020, \u0027TrialID\u0027: \u0027ISRCTN67194859\u0027, \u0027CompletionYear\u0027: 2022, \u0027Acronym\u0027: \u0027Multi_READY for MS\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "1146", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 1146\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Guselkumab 100 mg (Drug), Placebo (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 117, \u0027BriefTitle\u0027: \u0027A Study of Guselkumab for the Treatment of Palmoplantar-non-Pustular Psoriasis\u0027, \u0027Abstract\u0027: \u0027The purpose of this study is to evaluate the efficacy of guselkumab for the treatment of palmoplantar psoriasis.\\n\\nDetailed Description\\nChronic plaque psoriasis is the most common form of psoriatic skin disease; however, there is growing evidence that other variants including scalp, nail, inverse, and palmoplantar psoriasis are prevalent, undertreated, and are correlated with an increased risk of psoriatic arthritis that may result in significant morbidity with functional impairment and greater impairment in quality of life. Therefore, the main aim of the study is to provide robust efficacy and safety data on guselkumab treatment for palmoplantar non-pustular psoriasis. The study comprises of a Screening Phase (4 Weeks [Week -4 to 0]), a Treatment Phase (up to Week 48) and a post-treatment follow-up phase (up to Week 56). Key efficacy assessments include physician assessments and patient-reported outcomes questionnaires. Safety evaluations will include 12-lead electrocardiogram at baseline, pregnancy testing and monitoring of vital signs at all visits and recording of adverse events throughout the study. Also, participants will be evaluated for signs and symptoms of active tuberculosis at all visits including follow-up visit. Biomarker assessments will include the evaluation of relevant markers in serum for all participants. The study will have an overall duration of 56 weeks.\u0027, \u0027Title\u0027: \u0027A Phase 3b, Multicenter, Interventional, Randomized, Placebo-controlled Study Investigating the Efficacy and Safety of Guselkumab for the Treatment of Palmoplantar-non-Pustular Psoriasis\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT03998683\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2021, 11, 30), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT03998683\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2019, 9, 3), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027StartYear\u0027: 2019, \u0027TrialID\u0027: \u0027NCT03998683\u0027, \u0027CompletionYear\u0027: 2021, \u0027Acronym\u0027: \u0027G-PLUS\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "1148", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 1148\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Obinutuzumab (Drug)\u0027, \u0027Phase\u0027: \u0027\u0027, \u0027StudyType\u0027: \u0027Observational\u0027, \u0027NumberOfParticipants\u0027: 299, \u0027BriefTitle\u0027: \u0027Untreated FolliculaR Lymphoma Treated With OBinituzumAb in a Non-interventional Study (URBAN)\u0027, \u0027Abstract\u0027: \u0027To evaluate the effectiveness and safety of obinutuzumab in clinical routine in 1L FL measured by the % of relapse within 24 months from start of therapy.\\n\\nDetailed Description\\nThis observational study has been planned to evaluate the effectiveness of obinutuzumab in combination with chemotherapy in previously untreated advanced FL patients, in the real world setting in Italy. The study will allow to collect real-life data in a significant number of Italian patients when compared to participants in pivotal studies of obinutuzumab and thus will allow to verify in routine practice (after physician hands-on) the effectiveness and safety management in 50 reference sites all over the country.\u0027, \u0027Title\u0027: \u0027A Non-Interventional, Retrospective And Prospective, Multicenter, Single Arm Study Evaluating The Effectiveness And Safety Of Obinutuzumab In Patients With Previously Untreated Advanced Follicular Lymphoma\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT04034056\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2024, 4, 22), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT04034056\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2019, 9, 2), \u0027RecruitmentStatus\u0027: \u0027Active, not recruiting\u0027, \u0027StartYear\u0027: 2019, \u0027TrialID\u0027: \u0027NCT04034056\u0027, \u0027CompletionYear\u0027: 2024, \u0027Acronym\u0027: \u0027URBAN\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "1149", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 1149\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027DZD9008 (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 1/2\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 336, \u0027BriefTitle\u0027: \u0027Assessing an Oral EGFR Inhibitor, DZD9008 in Patients Who Have Advanced Non-small Cell Lung Cancer With EGFR or HER2 Mutation (WU-KONG1)\u0027, \u0027Abstract\u0027: \u0027This study will treat patients with advanced NSCLC with EGFR or HER2 mutation who have progressed following prior therapy. This is the first time this drug is tested in patients, and so it will help to understand what type of side effects may occur with the drug treatment. It will also measure the levels of drug in the body and preliminarily assess its anti-cancer activity as monotherapy.\\n\\nDetailed Description\\nA Phase I/II, Open-Label, Multicenter Study to Assess the Safety, Tolerability, Pharmacokinetics and Anti-tumor Efficacy of DZD9008 in Patients with Advanced Non-Small Cell Lung Cancer (NSCLC) with EGFR or HER2 mutation. This study includes dose escalation, dose expansion, food effect (Part A) and dose extension (Part B).\u0027, \u0027Title\u0027: \u0027A Phase I/II, Open-Label, Multicenter Study to Assess the Safety, Tolerability, Pharmacokinetics and Anti-tumor Efficacy of DZD9008 in Patients With Advanced Non-Small Cell Lung Cancer (NSCLC) With EGFR or HER2 Mutation\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT03974022\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2024, 7, 1), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT03974022\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2019, 7, 9), \u0027RecruitmentStatus\u0027: \u0027Recruiting\u0027, \u0027AltmetricAttentionScore\u0027: 4.0, \u0027StartYear\u0027: 2019, \u0027TrialID\u0027: \u0027NCT03974022\u0027, \u0027CompletionYear\u0027: 2024, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "1510", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 1510\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Tislelizumab (Drug), Concurrent chemoradiotherapy (cCRT) (Drug), Placebo (Other)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 1, \u0027BriefTitle\u0027: \u0027A Study of Tislelizumab (BGB-A317) Plus Chemoradiotherapy Followed by Tislelizumab Monotherapy in Newly Diagnosed, Stage III Subjects With Locally Advanced, Unresectable Non-small Cell Lung Cancer\u0027, \u0027Abstract\u0027: \u0027This is a Phase 3, randomized, double-blind, placebo-controlled multicenter global study designed to compare the efficacy and safety of tislelizumab in combination with concurrent chemoradiotherapy (cCRT) followed by tislelizumab monotherapy versus cCRT alone, and tislelizumab given sequentially after cCRT versus cCRT alone, in newly diagnosed stage III subjects with locally advanced, unresectable non-small cell lung cancer (NSCLC). The primary endpoint is centrally-assessed progression free survival (PFS) in the intent-to-treat (ITT) population. .\u0027, \u0027Title\u0027: \u0027A PHASE 3, RANDOMIZED, BLINDED, PLACEBO-CONTROLLED STUDY OF TISLELIZUMAB (BGB-A317) PLUS CHEMORADIOTHERAPY FOLLOWED BY TISLELIZUMAB MONOTHERAPY IN NEWLY DIAGNOSED, STAGE III SUBJECTS WITH LOCALLY ADVANCED, UNRESECTABLE NON-SMALL CELL LUNG CANCER\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT03745222\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2019, 6, 26), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT03745222\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2019, 5, 22), \u0027RecruitmentStatus\u0027: \u0027Terminated\u0027, \u0027AltmetricAttentionScore\u0027: 1.0, \u0027StartYear\u0027: 2019, \u0027TrialID\u0027: \u0027NCT03745222\u0027, \u0027CompletionYear\u0027: 2019, \u0027Acronym\u0027: \u0027RATIONALE001\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "1512", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 1512\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027ampreloxetine (Drug), Placebo (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 203, \u0027BriefTitle\u0027: \u0027Phase 3 Clinical Effect Durability of TD-9855 for Treating Symptomatic nOH in Subjects With Primary Autonomic Failure\u0027, \u0027Abstract\u0027: \u0027A Phase 3, 22-week, Multi-center, Randomized Withdrawal Study of ampreloxetine in Treating Symptomatic Neurogenic Orthostatic Hypotension in Subjects with Primary Autonomic Failure\\n\\nDetailed Description\\nPhase 3, multi-center, randomized withdrawal study to evaluate the sustained benefit in efficacy and safety of ampreloxetine in subjects with primary autonomic failures (MSA, PD, or PAF) and symptomatic nOH. The study consists of 3 periods: (i) 16-week open-label (OL) treatment with ampreloxetine, (ii) 6-week randomized placebo-controlled treatment, and (iii) 2-week follow-up (only for patients who do not enroll in Study 0171 (long-term extension safety study)).\u0027, \u0027Title\u0027: \u0027A Phase 3, 22-week, Multi-center, Randomized Withdrawal Study of TD-9855 in Treating Symptomatic Neurogenic Orthostatic Hypotension in Subjects With Primary Autonomic Failure\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT03829657\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2021, 11, 10), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT03829657\u0027, \u0027minAgeYears\u0027: 30.0, \u0027StartDate\u0027: neo4j.time.Date(2019, 2, 22), \u0027RecruitmentStatus\u0027: \u0027Terminated\u0027, \u0027AltmetricAttentionScore\u0027: 685.0, \u0027StartYear\u0027: 2019, \u0027TrialID\u0027: \u0027NCT03829657\u0027, \u0027CompletionYear\u0027: 2021, \u0027Acronym\u0027: \u0027REDWOOD\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "1517", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 1517\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Apremilast (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 4\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 123, \u0027BriefTitle\u0027: \u0027A Study to Evaluate the Impact of Apremilast on Magnetic Resonance Imaging (MRI) Outcomes in Adults With Psoriatic Arthritis\u0027, \u0027Abstract\u0027: \u0027This study is designed to assess the efficacy of apremilast, either in monotherapy or with stable methotrexate, on imaging outcomes in adults with active psoriatic arthritis with less than 5 years of disease duration (since diagnosis), and who are na\u00efve to biologic therapies.\\n\\nDetailed Description\\nThis study consists of 3 phases:Screening Phase - up to 4 weeksSingle-arm, Open-label Treatment Phase - Weeks 0 to 48Participants will receive apremilast 30 mg BID (after a 5-day titration period) for the entire duration of this phase.MRI of the most affected hand and whole body MRI (WB-MRI) will be performed at weeks 0, 24, and 48.The hand with the greater inflammatory burden of swollen joints and/or dactylitis will be considered as the most affected hand. If both hands are equally affected, the dominant hand will be designated as the index hand.Observational Follow-up Phase - 4 WeeksAll participants who complete the study or discontinue early will participate in the 4-week Post-Treatment Observational Follow-up Phase.\u0027, \u0027Title\u0027: \u0027A Phase 4, Multicenter, Single-Arm, Open-Label Study to Evaluate the Impact of Apremilast (CC-10004) on MRI Outcomes in Subjects With Active Psoriatic Arthritis\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT03783026\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2022, 5, 11), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT03783026\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2019, 2, 6), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027StartYear\u0027: 2019, \u0027TrialID\u0027: \u0027NCT03783026\u0027, \u0027CompletionYear\u0027: 2022, \u0027Acronym\u0027: \u0027MOSAIC\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "1520", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 1520\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027KRT-232 (Drug), Best Available Therapy (BAT) (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 2/3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 385, \u0027BriefTitle\u0027: \u0027KRT-232 Versus Best Available Therapy for the Treatment of Subjects With Myelofibrosis Who Are Relapsed or Refractory to JAK Inhibitor Treatment\u0027, \u0027Abstract\u0027: \u0027This study evaluates KRT-232, a novel oral small molecule inhibitor of MDM2, for the treatment of patients with myelofibrosis (MF) who no longer benefit from treatment with a JAK inhibitor. Inhibition of MDM2 is a novel mechanism of action in MF.This study will be conducted in 2 phases. Phase 2 will determine the KRT-232 recommended dose and dosing schedule; Phase 3 will test KRT-232 vs Best Available Therapy (BAT). Patients in the Phase 3 part of the study will be randomized 2:1 to receive either KRT-232 (Arm 1) or BAT (Arm 2). The BAT administered will be determined by the treating physician, with the option to \"cross-over\" to KRT-232 treatment after 6 months of BAT or if the disease worsens at any time.\u0027, \u0027Title\u0027: \u0027A Phase 2/3 Randomized, Controlled, Open-Label Study of KRT 232 in Subjects With Primary Myelofibrosis (PMF), Post Polycythemia Vera MF (Post-PV-MF), Or Post Essential Thrombocythemia MF (Post-ET-MF) Who Are Relapsed or Refractory to Janus Kinase (JAK) Inhibitor Treatment\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT03662126\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2025, 12, 31), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT03662126\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2019, 1, 15), \u0027RecruitmentStatus\u0027: \u0027Recruiting\u0027, \u0027AltmetricAttentionScore\u0027: 1.0, \u0027StartYear\u0027: 2019, \u0027TrialID\u0027: \u0027NCT03662126\u0027, \u0027CompletionYear\u0027: 2025, \u0027Acronym\u0027: \u0027BOREAS\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "1524", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 1524\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027GLPG1690 (Drug), Placebo (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 781, \u0027BriefTitle\u0027: \u0027A Clinical Study to Test How Effective and Safe GLPG1690 is for Participants With Idiopathic Pulmonary Fibrosis (IPF) When Used Together With Standard of Care\u0027, \u0027Abstract\u0027: \u0027The main purpose of this study was to see how GLPG1690 works together with the current standard treatment on your lung function and IPF disease in general. The study also investigated how well GLPG1690 is tolerated (for example if you get any side effects while on study drug).\u0027, \u0027Title\u0027: \u0027A Phase 3, Randomized, Double-blind, Parallel-group, Placebo-controlled, Multi-center Study to Evaluate the Efficacy and Safety of Two Doses of GLPG1690 in Addition to Local Standard of Care for Minimum 52 Weeks in Subjects With Idiopathic Pulmonary Fibrosis\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT03733444\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2021, 3, 30), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT03733444\u0027, \u0027minAgeYears\u0027: 40.0, \u0027StartDate\u0027: neo4j.time.Date(2018, 11, 5), \u0027RecruitmentStatus\u0027: \u0027Terminated\u0027, \u0027AltmetricAttentionScore\u0027: 50.0, \u0027StartYear\u0027: 2018, \u0027TrialID\u0027: \u0027NCT03733444\u0027, \u0027CompletionYear\u0027: 2021, \u0027Acronym\u0027: \u0027ISABELA2\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "1527", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 1527\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Flo TracIQ with HPI software (Device)\u0027, \u0027Phase\u0027: \u0027\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 40, \u0027BriefTitle\u0027: \u0027Correlation Between Circulating Biomarkers of Organs Damage and Intraoperative Hypotension Management\u0027, \u0027Abstract\u0027: \u0027Intraoperative hypotension (defined as mean arterial pressure below 65 mmHg) is associated with increased organs dysfunction and mortality. Even short durations of reduced arterial blood pressure episodes significantly increased the risk of myocardial injury, neurological deficits, renal failure, and mortality. Hypotension rate during surgery is quite common and recent studies showed an incidence up to 60% of patients endured hypotension during anesthesia for an average of 10% of surgical time.Nowadays hypotension seems to be preventable even if current management of the hypotensive episodes is predominantly reactive and rather occurs with some delay.The investigators hypothesize that the prevention of hypotension by means Edwards Lifesciences new technology (HPI software) can improve patients outcome after surgery.The present pilot randomized clinical trial is aimed at investigating various biomarkers involved in organ dysfunction and how they correlate with different intraoperative hypotension management strategies (Invasive blood pressure monitored by a normal arterial line vs Invasive blood pressure monitored by Edwards FloTracIQ system with HPI software).\\n\\nDetailed Description\\nThe primary objective of this pilot study is to investigate if an early treatment of intraoperative hypotension driven by an Edwards Lifesciences new technology (Hypotension Probability Index - HPI software) and integrated hemodynamic variables is able to determine a modification of the blood levels of several specific biomarkers of tissue and organ damage compared to a traditional management of hypotension. It will also be evaluated if the management strategy of patient hemodynamics based on the Hypotension Probability Index (HPI) is associated with a lower incidence of hypotensive events and / or a shorter overall duration of intraoperative hypotension.In the study will be enrolled forty adult patients requiring an arterial line (at discretion of treating physician) undergoing non-cardiac non-day surgery (with an expected duration of more than 2 hours and an aimed medium arterial pressure - MAP of 65 mmHg) at the Universitary Hospital of Catania.The patients will be randomly (1:1) assigned to one of the subsequent two groups: a group monitored with FloTracIQ with HPI software (Treatment Group) and a group with standard invasive blood pressure monitoring (Control Group).In the Control Group, all hypotensive episodes during surgery will be treated according to standard of care.Patients randomized to the Treatment Group will receive monitoring with integration of HPI index and hemodynamic parameters visible on the EV1000 platform; these informations will be used to guide the investigator in the choice of the more appropriate treatment to be carried out. The value of HPI is updated every 20 seconds and expresses in percentage the probability of occurrence of a hypotensive event. The cut-off value of HPI is equal to 85%. Values above the cut-off are related to a higher probability of hypotension. A specific visual and sound \"ALERT\" will indicate to the investigator if the threshold value is reached / exceeded. Any treatment strategy will be based on integrated analysis of clinical and instrumental data showed on the screen of the EV1000 platform [MAP, cardiac output (CO), systemic vascular resistance (SVR), stroke volume (SV), stroke volume variation (SVV), intra-ventricular pressure rate of rise (dP/dt), dynamic arterial elastance (Eadyn)].In both groups different blood samplings will be performed in order to assess biomarkers of specific organ dysfunction: T0 (baseline, before starting operating procedures); T1 (2 hours after starting anesthesia); T2 (at the end of surgical procedures). The following biomarkers will be assessed: neuron specific enolase and S100B (for brain monitoring); high sensitive cardiac troponin T (for heart monitoring); Neutrophil Gelatinase-Associated Lipocalin (NGAL, for kidney monitoring); circulating endothelial cells counting and cytofluorimetric analysis (for endothelial monitoring). There will also be determined the systemic effect of intraoperative hypotension as measured by inflammatory cytokines [Interleukin (IL)-6, IL-1 beta and Tumor necrosis factor (TNF)-alfa], oxidative stress (reduced glutathione, lipid hydroperoxides) and markers of hypoxia (HIF1alpha, lactate, acetylCoA, CoA).Various clinical informations will be collected at the same time: glomerular filtration rate, plasma electrolytes, creatinine, aspartate aminotransferase (AST), alanine aminotransferase (ALT), blood gasses analysis, anion gap.A telephone interview will be performed one month after surgery, in order to investigate general health condition and any re-admission to hospital.Sample size calculation:Given the pilot nature of the study, no formal justification of sample size has been made.Statistical analysis:For a test of normal distribution, the Kolmogorov-Smirnov test will be used. Continuous data with normal distribution will be tested with paired or unpaired t tests, non-normally distributed data using Mann-Whitney U test and Wilcoxon rank-sum test for unpaired and paired results, respectively.Changes in biomarkers over time will be tested using analysis of variance (ANOVA) on repeated measurements. Categorical data will be tested using Chi-square test and Chi-square test for trend. Data will be presented as mean \u00b1 standard deviation when normally distributed and as median [interquartile ranges] in case of abnormal distribution. A p \u003c 0.05 will be considered statistically significant for all tests.\u0027, \u0027Title\u0027: \u0027Correlation Between Circulating Biomarkers of Organs Damage and Intraoperative Hypotension Management\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT03527758\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2020, 1, 15), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT03527758\u0027, \u0027minAgeYears\u0027: 21.0, \u0027StartDate\u0027: neo4j.time.Date(2018, 11, 1), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027StartYear\u0027: 2018, \u0027TrialID\u0027: \u0027NCT03527758\u0027, \u0027CompletionYear\u0027: 2020, \u0027Acronym\u0027: \u0027\u0027, \u0027maxAgeYears\u0027: 80.0}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "1534", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 1534\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027ultrasound (Diagnostic Test)\u0027, \u0027Phase\u0027: \u0027\u0027, \u0027StudyType\u0027: \u0027Observational\u0027, \u0027NumberOfParticipants\u0027: 50, \u0027BriefTitle\u0027: \u0027Ultrasound Emergency Diagnosis of Small Bowel Obstruction\u0027, \u0027Abstract\u0027: \u0027Small bowel obstruction (SBO) is a common presentation to the emergency department (ED) and represents 15% of hospital admissions for acute abdominal complaints.Plain radiography, although traditionally recommended as the initial diagnostic imaging modality of choice, has a sensitivity of only 59% to 77%. When clinical and radiographic assessment is indeterminate, computed tomography (CT) becomes the test of choice due to its superior resolution and increased ability to identify both obstruction and its aetiology Aim: this is a prospective study in a sample of patients presenting to the emergency department (ED) with abdominal pain, vomiting, or other symptoms suggestive of a SBO (history of previous surgeries, constipation, abnormal bowel sounds, and abdominal distention). Patients will be evaluated with US prior to x-ray and CT, with possible diagnostic confirms by endoscopy or surgery.\\n\\nDetailed Description\\nPrimary outcome:Our objective was to study the accuracy of emergency medicine bedside ultrasonography and in patients with suspected small bowel obstruction (SBO).Secondary outcome:assess the usefulness of the history and physical examination in the prediction of diagnosisUS Diagnostic criteria:Bowel lumen diameter \u003e2.5cmWall thickness \u003e 4 mmDecreased/absent peristalsisBack/forth stool movementsFree fluidMethods The study is based on the assessment of all consecutive patients (19-75 years) presenting in the emergency department of Policlinico VE of the University of Catania (or to other affiliated Hospitals, such as Cannizzaro and/or Ragusa hospitals), which show clinical clues of small bowel obstruction (SBO). The criterion of enrolment is the casual referral to few previously identified physicians, skilled in TUS procedures and which accepted to take part to this study.The most similar study on this topic demonstrates an extremely high accuracy of US in the diagnosis of intestinal obstruction, so that no actual power analysis can be done. The rationale of the present prospective study is the definition of prevalence of US detected obstruction in patients referred to an emergency facilities with symptoms potentially suggestive for such diagnosis.Moreover, which clue, if any, such as anaemia, CRP, NLR, hypotension, could reinforce the need of US intestinal study.This information is not yet available elsewhere. Moreover, in this context, sensitivity and specificity of ultrasound vs. confirm by CT and other procedures will make more sense and will be consequently assessed.The secondary reason of this investigation is the attempt to detect which are the prevalence and the feature of under-diagnosis or over-diagnosis by US vs. the actual condition.IMPLEMENTATION. This is a medium-term pilot study, non-interventional, which can be performed better as a single centre investigation, with few skilled and committed emergency physicians, than as a multicentre study, which would have the possible bias of relying on a mosaic or on scarcely skilled or motivated MDs.\u0027, \u0027Title\u0027: \u0027Ultrasound Emergency Diagnosis of Small Bowel Obstruction. An Observational Study\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT03226665\u0027, \u0027Gender\u0027: \u0027A
