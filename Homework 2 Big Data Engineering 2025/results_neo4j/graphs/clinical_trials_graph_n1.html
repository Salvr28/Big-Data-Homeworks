ll\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2019, 6, 30), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT03226665\u0027, \u0027minAgeYears\u0027: 19.0, \u0027StartDate\u0027: neo4j.time.Date(2018, 11, 1), \u0027RecruitmentStatus\u0027: \u0027Unknown status\u0027, \u0027StartYear\u0027: 2018, \u0027TrialID\u0027: \u0027NCT03226665\u0027, \u0027CompletionYear\u0027: 2019, \u0027Acronym\u0027: \u0027USBOW\u0027, \u0027maxAgeYears\u0027: 75.0}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "1536", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 1536\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Conventional 3-lead CRT defibrillator system implantation (Device), 2-lead CRT defibrillator system implantation (Device)\u0027, \u0027Phase\u0027: \u0027\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 640, \u0027BriefTitle\u0027: \u0027Comparison of CRT-D and CRT-DX Systems (CRT-NEXT)\u0027, \u0027Abstract\u0027: \u0027The principal objective is to test non-inferiority of the CRT-DX system as compared to a conventional CRT-D system, in terms of the combined endpoint of mortality, hospitalizations due cardiovascular causes, any complication leading to loss of lead functionality, in the subset of patients without evidence of sinus dysfunction on optimal therapy.\\n\\nDetailed Description\\nResting heart rate is strongly associated with incident worsening Heart Failure (HF) and mortality. Current devices for cardiac resynchronization (CRT-D) normally provide atrio-ventricular (AV) sequential pacing modes during resynchronization, but the best pacing programming strategy is not clear.On the one hand a basic rate of 50 to 70 bpm (optionally with some rate-responsive function) could be considered for therapy up-titration, specifically betablockers; on the other hand, increasing pacing rates may partially reduce benefits from resynchronization, reducing filling time and contractility reservoir.The Pegasus investigation is the only large randomized investigation comparing DDD with 70 bpm basic rate to DDD(R) @40 bpm. Results showed no difference in investigation endpoints, including mortality and HF-hospitalization.These results may support the use of a device implementing both a CRT function and a right ventricular single-lead with and an atrial sensing dipole (CRT-DX system). This system can track ventricular pacing and resynchronization following atrial sensing, even if it cannot provide atrial pacing support. It should be assessed whether such limitation is counterbalanced by the advantages related to the reduced number of necessary leads, with simplified implantation and less complications.The objective of the investigation is to assess whether atrial pacing support is really necessary in the subset of patients with indication to CRT-D and no evidence of sinus dysfunction on optimal therapy. The investigation will test the hypothesis that a CRT-DX system is not inferior to a conventional CRT-D system in this class of subjects.\u0027, \u0027Title\u0027: \u0027Non-inferiority Randomized Clinical Investigation of CRT-DX Versus CRT-D Systems\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT03587064\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2025, 4, 1), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT03587064\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2018, 10, 22), \u0027RecruitmentStatus\u0027: \u0027Recruiting\u0027, \u0027StartYear\u0027: 2018, \u0027TrialID\u0027: \u0027NCT03587064\u0027, \u0027CompletionYear\u0027: 2025, \u0027Acronym\u0027: \u0027CRT-NEXT\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "1539", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 1539\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Levobupivacaine (Drug), Bupivacaine (Drug)\u0027, \u0027Phase\u0027: \u0027\u0027, \u0027StudyType\u0027: \u0027Observational\u0027, \u0027NumberOfParticipants\u0027: 250, \u0027BriefTitle\u0027: \u0027Spinal Anesthesia in Caesarean Section\u0027, \u0027Abstract\u0027: \u0027Spinal anesthesia is a safe technique, widely used and tested in the gynecological field, so as to be considered the first choice technique in cesarean section, which allows to quickly obtain a valid sensor and motor block. Bupivacaine is one of the most widely used drug for obtaining spinal anesthesia in pregnant women undergoing caesarean section. Bupivacaine is a local anesthetic available as a racemic mixture of its two enantiomers, the R (+)- dextrobupivacaine and the S (-) - levobupivacaine, whose clinical use is widely validated. Racemic bupivacaine is available as a simple or hyperbaric solution, the latter being the most commonly used for spinal anesthesia. Levobupivacaine, which is the pure levorotatory enantiomer of racemic bupivacaine, is a slightly hypobaric solution compared to liquor and has shown less heart and nerve toxicity, probably due to its ability to bind proteins more rapidly, and a greater selectivity towards the sensory component compared to Bupivacaine, presents action and effects better predictable. Its baricity would also offer the advantage of providing a less sensitive block to the position.Hypotension is one of the most common complications of spinal anesthesia and is particularly relevant in caesarean section because, in addition to the adverse effects on the parturient, it can have repercussions on the fetus through a reduction of placental perfusion.Some studies have showed a similar incidence of hypotension in patients treated with bupivacaine compared to those treated with levobupivacaine, while others assert an equivalence between the two drugs. In most studies, however, a significantly lower incidence of hypotension and a greater hemodynamic stability were reported in pregnant patients undergoing spinal anesthesia by caesarean section with levobupivacaine.Being both hyperbaric bupivacaine and levobupivacaine routinely used at the \"G. Rodolico\" Universitary Hospital of Catania for the spinal anesthesia of pregnant women undergoing caesarean section and being their use decided exclusively at discretion of the treating anesthesiologist, in the light of the discrepant data in the literature about the incidence of hypotension with the two drugs, the main objective of this observational study is to evaluate the hemodynamic effects mediated by levobupivacaine on pregnant women subjected to elective cesarean section and to compare them with those mediated by hyperbaric bupivacaine in an historical court of pregnant women subjected to caesarean section in the period between April 2017 and April 2018. The hemodynamic parameters will be monitored in real time with a non-invasive hemodynamic monitoring system (EV1000\u00ae platform + Clearsight\u00ae system - Edwards LifeSciences), routinely used in the \"G. Rodolico\" Universitary Hospital of Catania, allowing to obtain greater accuracy and veracity of the results compared to previous studies conducted on such anesthetics.\\n\\nDetailed Description\\nThis is a prospective, monocentric, not for-profit, observational study, with historical control group, whose primary objective is the monitoring of changes in the hemodynamic condition, intended as continuous pressure measurements by means of a non-invasive system (EV1000\u00ae platform + Clearsight\u00ae system - Edwards Lifesciences), of a group of 125 pregnant women who have to undergo spinal anesthesia with Levobupivacaine for elective cesarean section at the \"G. Rodolico\" Presidium of Azienda Ospedaliero Universitaria \"Policlinco-Vittorio Emanuele\" of Catania, and to compare them with those detected, with the same non-invasive system, in an historical cohort of 125 patients who underwent spinal anesthesia with Bupivacaine for an elective caesarean section in the period between April 2017 and April 2018.The study will have an expected duration of one year from the time of its approval.In the levobupivacaine group, during the preoperative anesthesiological examination, carried out approximately two weeks before the scheduled date of the surgical intervention, informed consent will be acquired and the eligible patients will be enrolled. On this occasion, an ASA class will be assigned and the following data will be collected:personal and general data:date of birth and agecurrent weightweight before pregnancyheightinformation concerning:any previous or concomitant diseases affecting the nervous, respiratory, cardiovascular systemany previous or concomitant disease interesting: gastrointestinal system, hemolymphatic system, thyroid, pancreas, kidneys, liver, adrenal glandsany immunodeficienciesany coagulopathiesspinal deformitiesprevious surgeriesprevious allergic events following the administration of drugsseasonal allergiesprevious pregnancies and their characteristicspossible hypertension during the last quarterconditions that represent contraindications for spinal anesthesia. Upon arrival in the operating room, the Clearsight\u00ae non-invasive hemodynamic monitoring system will be placed at the fingers of the parturient and the usual intraoperative monitoring (ECG, non-invasive blood pressure, oxygen saturation) will be applied. The continuous recording of the following hemodynamic parameters, which will last for the whole duration of the intervention, will then begin through the EV1000\u00ae platform (Edwards Lifesciences): Cardiac Output (CO); Cardiac Index (CI); Stroke Volume (SV); Stroke Volume Index (SVI); Stroke Volume Variation (SVV); Pulse Rate Variation (PRV); Systemic Vascular Resistance (SVR); Systemic Vascular Resistance Index (SVRI); Central Venous Oxygen Saturation (ScvO2); Pulse rate (PR); Systolic Pressure (SYS); Diastolic Pressure (DIA); Mean Arterial Pressure (MAP); Central Venous Pressure (CVP).These measurements will be made every twenty seconds.Once the monitoring system has been applied, the patients will be placed in position and spinal anesthesia will be performed with Levobupivacaine 12 mg 0.5% and Fentanyl 25\u03b3. Once the anesthetic is injected, patients will be subjected to dislocation of the uterus and placed in left lateral tilt. Once the sensory and motor block has been obtained, the surgery will begin. In the event of adverse reactions to the drug, therapeutic measures that are part of the usual clinical practice will be used.Any episodes of hypotension during the operation will be treated by administration of 5 mg etilefrine in bolus and/or IV fluids; any episodes of bradycardia will be treated by administration of IV atropine 0.01 mg/kg.Sensory block will be evaluated by objective examination: the investigators will evaluate the tactile discrimination ability of a blunt tip in contact with the patient\\\u0027s back, thus determining the level of anesthesia reached and the time in which it occurs. The measurements of this parameter will be carried out every fifteen minutes, during the first half hour, and then at thirty and sixty minutes until the restitutio of the physiological condition of the patient.The motor block will be evaluated by Bromage score, ie by observing the residual motor capacity of the patient\\\u0027s lower limbs. The measurements of this parameter will be carried out every fifteen minutes, during the first half hour, and then at thirty and sixty minutes until the restitutio of the physiological condition of the patient.For calculating the Aldrete\\\u0027s score, the following parameters will be assessed: respiration and consciousness through objective examination, systolic blood pressure using the classic intraoperative monitoring system and pulse oximetry oxygenation. The measurements of this score will be carried out every fifteen minutes during the first half hour, and then at thirty and sixty minutes until the restitutio of the physiological condition of the patient.Patient data from the historical cohort will be collected by reviewing the clinical documentation related to the individual case.Once collected, the data will be subjected to statistical and comparative processing in order to highlight statistically relevant differences concerning the effects mediated by the two anesthetics on the pregnant patient who undergoes elective cesarean section.The data obtained will be analyzed using the SPSS software (Statistical Package for Social Sciences), version 21.0 for Windows (SPSS Inc., Chicago, Illinois, USA). Differences with p\u2264 0.05 will be considered significant.The descriptive analysis will be performed using frequencies, percentages and frequency tables for qualitative variables. For the normally distributed quantitative variables the mean and standard deviation will be used, while for those not normally distributed the median and the interquartile range (IQR) will be used. For the comparison between the two groups will be used the Chi-square test with Yates correction or Fisher exact test for qualitative variables and the Mann-Whitney U test for quantitative variables.Multivariate analysis will be performed using logistic regression models and the ORs (odds ratios) will be reported together with the corresponding 95% confidence intervals.\u0027, \u0027Title\u0027: \u0027Spinal Anesthesia in Caesarean Section: Comparison Between Levobupivacaine and Hyperbaric Bupivacaine\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT03743870\u0027, \u0027Gender\u0027: \u0027Female\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2021, 9, 30), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT03743870\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2018, 6, 1), \u0027RecruitmentStatus\u0027: \u0027Unknown status\u0027, \u0027StartYear\u0027: 2018, \u0027TrialID\u0027: \u0027NCT03743870\u0027, \u0027CompletionYear\u0027: 2021, \u0027Acronym\u0027: \u0027\u0027, \u0027maxAgeYears\u0027: 40.0}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "1549", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 1549\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027\u0027, \u0027Phase\u0027: \u0027\u0027, \u0027StudyType\u0027: \u0027Observational\u0027, \u0027NumberOfParticipants\u0027: 148, \u0027BriefTitle\u0027: \u0027Hemodynamic Monitoring in Obstetrics\u0027, \u0027Abstract\u0027: \u0027Spinal anesthesia has long been considered the first choice technique in caesarean section, but although it is a reliable and safe procedure, it is in some cases associated with undesirable effects. Maternal hypotension after sub-arachnoid anesthesia is a reduction in systolic blood pressure below 100 mmHg or a decrease of 20% compared to baseline values. According to some authors, maternal hypotension occurs up to 80% in women undergoing caesarean section after spinal anesthesia. In order to reduce the incidence of maternal hypotension, some measures can be taken:a reduction of aorto-caval compression by manual displacement of the uterus on the left;hemodynamic monitoring;administration of fluids;optimization of the dosage of the local anesthetic;use of vasopressors.The main objective of the study is to investigate, through the use of a continuous non-invasive hemodynamic monitoring system (Clearsight\u00ae - Edwards Lifesciences), the incidence of hypotension in pregnant women at risk undergoing spinal anesthesia due to elective cesarean section.\\n\\nDetailed Description\\nIn this prospective observational not-for profit study, 128 patients will be enrolled to measure the incidence of hypotension during spinal anesthesia for elective cesarean section. On the occasion of the preoperative visit, all patients to be subjected to elective cesarean section will be subjected to the Postural Change Test (PCT), a predictive test for maternal hypotension during spinal anesthesia that evaluate changes in heart rate of pregnant women following postural changes. Specifically, after monitoring the heart rate in the supine position, the patient is asked to change decubitus (from supine to left lateral and then back to supine). The test is positive if the patient\\\u0027s heart rate changes more than 10% from baseline.Once arrived in the obstetric emergency department, parturients with positive Postural Change Test will be subjected to cannulation of a peripheral vein through a 18-20 Gauge needle cannula and the Clearsight hemodynamic monitoring system will be placed on a finger. The investigators will then proceed to the detection of the following parameters:Mean Blood Pressure (MAP);Heart Rate (HR);Stroke volume (SV);Stroke volume Index (SVI);Cardiac Index (CI). These data will be collected and reported in the data sheet of the study, at different time points (T0 - T9). Basal values will be collected at T0 and T1: at T0 when the patient is in the supine position and at T1 when the patient is in a lateral position. The investigators will then proceed to the administration of a crystalloid bolus (10 ml/kg) and to the execution of spinal anesthesia (T2). The spinal block needle will be inserted, compatibly to the patient\\\u0027s anatomical conditions, at the L3-L4 / L4-L5 spaces. 0.5% hyperbaric Bupivacaine (5 mg/ml) will be administered at a dose depending on the patient\\\u0027s weight and height.Once the spinal block has been performed, the patient will be immediately placed in a supine position. The investigators will then continue monitoring the parameters listed above using Clearsight\u00ae (SV, SVI, MAP, CI) at 2-minute intervals in the phases following spinal anesthesia:T3: 2 minutes after spinal anesthesia,T4: 4 minutes after spinal anesthesia,T5: 6 minutes after spinal anesthesia,T6: 8 minutes after spinal anesthesia. The other measurements will be made at skin incision (T7), uterine incision (T8) and extraction (T9).Any hemodynamic changes (MAP \u003c60 mmHg or CI \u003c2.5), under volemic optimization conditions, will be treated by administration of vasoconstrictors (Etilefrine, intravenous bolus of 1-3 mg).At the afterbirth, the investigators will proceed to the infusion of liquids and uterotonic according regimens in use at the unit of Anesthesia and Intensive Care of the Universitary Hospital \"G. Rodolico\" of Catania.Given the descriptive nature of the study, a formal calculation of the sample size was not made. As secondary end-points, the Stroke Volume variation following spinal anesthesia, the amount of fluids administered, the vasoconstrictor doses used, diuresis, the Apgar index and the fetal pH will be measured. The number of hypotension episodes not detected by the traditional blood pressure monitoring system but detected by the Clearsight system will also be recorded. For the qualitative variables, the absolute frequencies and the percentage frequencies will be calculated. For the quantitative variables, if with normal distribution, mean and standard deviation will be calculated; if with not normal distribution, median and interquartile range will be calculated.The normality of the distribution will be evaluated through the Kolmogorov-Smirnoff test.\u0027, \u0027Title\u0027: \u0027Hemodynamic Monitoring in Obstetrics\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT03755271\u0027, \u0027Gender\u0027: \u0027Female\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2018, 7, 20), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT03755271\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2018, 3, 2), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027StartYear\u0027: 2018, \u0027TrialID\u0027: \u0027NCT03755271\u0027, \u0027CompletionYear\u0027: 2018, \u0027Acronym\u0027: \u0027\u0027, \u0027maxAgeYears\u0027: 40.0}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "1797", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 1797\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Tocilizumab (Drug), Etanercept (Drug), Infliximab (Drug), Adalimumab (Drug), Golimumab (Drug), Certolizumab Pegol (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 4\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 208, \u0027BriefTitle\u0027: \u0027Rheumatoid Arthritis Treatment After First Anti-TNF INvestiGation\u0027, \u0027Abstract\u0027: \u0027To compare the efficacy of switching to a different molecular target (from TNF to IL6) versus cycling to a second TNF inhibitor in patients with active RA, who have not adequately responded to a previous treatment with a first anti-TNF.\\n\\nDetailed Description\\nNew drugs for the treatment of rheumatoid arthritis (RA) with action on specific molecular target (e.g. anti-TNF) have improved the prognosis of patients with an inadequate response to conventional therapy such as methotrexate (MTX).However, approximately 50% of patients treated with first-line anti-TNF discontinue treatment after two years due to ineffectiveness or adverse events. The second line treatment involves the use of another anti-TNF drug or switching to a different molecular target (anti-IL6, -CD20 or CTLA-4-Ig) in combination with MTX.\u0027, \u0027Title\u0027: \u0027Open-label, Randomized Controlled Trial Comparing Tocilizumab to Anti-TNF Treatment and Discovery of Biomarkers for Treatment Selection in Rheumatoid Arthritis Patients With Inadequate Response to a First Anti-TNF\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT03100253\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2021, 12, 31), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT03100253\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2018, 3, 1), \u0027RecruitmentStatus\u0027: \u0027Terminated\u0027, \u0027AltmetricAttentionScore\u0027: 3.0, \u0027StartYear\u0027: 2018, \u0027TrialID\u0027: \u0027NCT03100253\u0027, \u0027CompletionYear\u0027: 2021, \u0027Acronym\u0027: \u0027RAFTING\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "1798", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 1798\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Harvested (Other)\u0027, \u0027Phase\u0027: \u0027\u0027, \u0027StudyType\u0027: \u0027Observational\u0027, \u0027NumberOfParticipants\u0027: 50, \u0027BriefTitle\u0027: \u0027Microbiota Around Periodontal Teeth and Implants Affected by Peri-implant Disease.\u0027, \u0027Abstract\u0027: \u0027The purpose of the study was to evaluate, from a microbiological point of view, microbiota around teeth and implants in the same patient affected by periodontal disease and peri-implant disease, all compared with a healthy tooth. From the identification of particular bacterial species in the examined sites, it is intended to be traced back to the identification of a clear etiopathogenic process, which may shed light on the similarities and differences between the two diseases. In recognition of these mechanisms, the investigators think to develop new therapeutic strategies for the future.\\n\\nDetailed Description\\nHarvested via sterile paper points, for endodontic use, the sulcular fluid present around a dental element affected by periodontitis, and, in the same patient, the fluid present inside a peri-implant sulcus of a implant affected periimplantitis. If more implants are considered affected by perimplantitis, partecipant will choose the worst as sample site. The same principle will be followed in the case of the tooth affected by periodontal disease. The samples must be underwent to bacterial genomic meta-analysis for the precise identification of bacterial. For a better comparation of the flora, even a healthy tooth from the same patient will be choose like test site and a gingival crevicular fluide will be harvested on it.The investigators think that the perfect knowledge of the pathogen species is the starter point from a correct therapeutic strategy. But is really important take in mind the individual characteristcs of oral microflora.The data to be noted at the outset are:Signs and symptoms of periodontal disease, with precise framing within the Armitage 1999 Classification, and peri-implant disease. For the aim of the study definition of perimplantitis concern an implant with a 4 mm minimal probing depth with bleeding on probing and or suppuration (BOP and Supp) and radiographic bone loss (BL).Evidence of BL recorded in order of definition of 8th European Consensus Conference of Periodontology Working group 4: BL \u003e 2 mm from the expected bone level if a preliminary rx was absent; Rx 2-3 times the SD of the measurement record (1-1,5 mm) in case a preliminary rx was present.Detections diagnostic radiographic and pre-intervention performed with parallel technique (CBCT optional).Photographs pre, intra and post op (if present)Follow up to 6 months / 1 year (optional) The study provides a GCF harvested around periodontal and peri-implant sulcus in patients recruited for microbiological investigation. The analyzes of the samples are performed \"blind\". The Probe used is a UNC15 and only one calibrated clinician perform the probing. The pathogen microflora will be compaired with a healthy tooth microflora harvested around a healthy tooth in the same patient.Pretreatment of the sample sites in order to avoid contamination of the samples by the supragingival bacterial plaque will proceed as follows:- 2 days prior to sampling, the patient undergoes professional cleaning cups and brushes with the sole purpose of eliminating subgingival plaque. also we will be provided appropriate oral hygiene instruction with brushing twice / day and use of the other instruments where required.Sampling procedure: The harvested will be carried out through sterile paper point the extent to tip 30 and ISO taper 4%. The sampling technique will be that shown in the figure and marked with the letter c (intracrevicular deep method) until minimum resistance is felt. Each paper point will remain in place for 5 sec, then it will be readily stored in a special sterile container, stored in a refrigerated and delivered within 60 minutes Institute environment that will carry out the examination. Any harvested that show blood contamination will be excluded from the exam.Microbiological ProtocolSample collection and DNA isolation For the metagenomic analysis, samples of paper strip / paper point by patients included in the study, they will be eluted overnight in PBS (phosphate buffered saline) at 4 \u00b0 C. Subsequently, the samples will be centrifuged at 10,000 rpm for 15 min at 4 \u00b0 C. After removal of the paper point, the supernatant will be used for the extraction of DNA using the QIAamp DNA Mini kit . The DNA will be quantified with Qubit\u00ae 2.0 Fluorometer (Thermo Fisher) using QUBIT Kit dsDNA HS ASSAY KIT (Life Technologies).Analysis of 16S rRNA - Metagenomics The metagenomic analyzes will be conducted on MiSeq platform Illumina. The gene libraries will be sequenced through the MiSeq v3 reagent kits. The 16S rRNA hypervariable regions will be amplified using a DNA concentration of 5 ng / l with the primers V5-V7.The libraries will be purified by magnetic beads (AgencourtAmpure XP, Beckman), and the concentration and distribution of the fragments of the libraries will be evaluated on DNA Chip 1000 in the microanalyzer 2100 (Agilent Technologies). The analysis of the sequences (amplicon data sets) and the determination of OTU (OperationalTaxonomicUnits) will be performed by QIIME pipeline using as 16S rRNA gene database Green genes .Inclusion criteria:Assets in service for at least one year without any technical GBR (therefore excluded from the study also post-extraction)entered Works on native boneFill out a medical history form and a periodontal board dedicated to the event, as well as a card for the clinician which builds on the work published in J ClinPeriodontol 2012; 39 (Suppl 12): 224-244Reporting in the type of system board (optional surgical technique)Exclusion criteria:Patients in subintrant systemic conditions that contraindicate the insertion of implantsPatients in the last three months, after surgery have taken antibiotics or follow any therapy for the resolution of acute events. The same may qualify for the study later.Women who are pregnant or nursing or undergoing hormone therapies\u0027, \u0027Title\u0027: \u0027Rating Comparative Microbiology of Cell Populations Present Around Teeth Affected by Periodontal Disease and Implants Affected by Peri-implant Disease.\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT03407911\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2018, 6, 1), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT03407911\u0027, \u0027minAgeYears\u0027: 45.0, \u0027StartDate\u0027: neo4j.time.Date(2018, 2, 1), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027StartYear\u0027: 2018, \u0027TrialID\u0027: \u0027NCT03407911\u0027, \u0027CompletionYear\u0027: 2018, \u0027Acronym\u0027: \u0027\u0027, \u0027maxAgeYears\u0027: 75.0}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "1800", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 1800\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027BAX930 (Biological), Standard of care (Biological)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 57, \u0027BriefTitle\u0027: \u0027A Study of BAX 930 in Children, Teenagers, and Adults Born With Thrombotic Thrombocytopenic Purpura (TTP)\u0027, \u0027Abstract\u0027: \"Thrombotic thrombocytopenic purpura (or TTP for short) is a condition where blood clots form in small blood vessels throughout the body. The clots can limit or block the flow of oxygen-rich blood to the body\u0027s organs, such as the brain, kidneys, and heart. As a result, serious health problems can develop. The increased clotting that occurs in TTP uses up the cells that help the blood to clot, called platelets. With fewer platelets available in the blood, bleeding problems can occur. People who have TTP may bleed underneath the skin forming purple bruises or purpura, or from the surface of the skin. TTP also can cause anemia, a condition in which red blood cells break apart faster than the body can replace them leading to lower than normal number of red blood cells.A lack of activity in the ADAMTS13 enzyme, a protein in the blood involved in blood clotting, causes TTP. The enzyme breaks up another blood protein called von Willebrand factor that clumps together with platelets to form blood clots. Some people are born with this condition, others get the condition during their life. Many people who born with TTP experience frequent flareups that need to be treated right away. If not treated It can be fatal or cause lasting damage, such as brain damage or a stroke. BAX 930 is a medicine that replaces ADAMTS13 and can prevent or control TTP flareups, called TTP events.The main aim of this study is to compare the number of TTP events in people born with severe TTP when they treated with BAX 930 versus when they are treated with the standard treatment. Treatment will be given in 2 ways:BAX 930 or standard treatment given to prevent TTP events from happening.BAX 930 or standard treatment given to control an acute TTP event when it happens, according to the clinic\u0027s standard practice.Both BAX 930 and standard treatment are given slowly through a vein (infusion).At the first visit, the study doctor will check if you can participate in the study. If you are eligible and enter the study, you will follow an assigned schedule and either start with BAX 930 (Period 1) and then switch to standard treatment (Period 2) or start with standard treatment (Period 1) and then switch to BAX 930 (Period 2). Everyone will be treated with BAX 930 again for Period 3. Each Period will last approximately 6 months.If you enter the study to control an acute TTP event, you will follow a schedule receiving either BAX 930 or standard care to treat your acute TTP event. Once the acute TTP event has gotten better, you can decide to continue in the study and be given treatment to prevent TTP events from happening, following the schedule above.Another study\u0027s aim is to assess side effects from treatment with BAX 930 and standard treatment. To do that, the study doctor will ask you questions about your health at each study visit.The study doctors will also check how long BAX 930 stays in the blood of the participants, over time. They will do this from blood samples taken after participants receive their specific infusions of BAX 930. This will happen at different times during the study.1 month after all treatment has been completed, participants will visit the clinic for a final check-up.\", \u0027Title\u0027: \u0027A Phase 3, Prospective, Randomized, Controlled, Open-label, Multicenter, 2 Period Crossover Study With a Single Arm Continuation Evaluating the Safety And Efficacy of BAX 930 (rADAMTS13) in the Prophylactic And On-demand Treatment of Subjects With Severe Congenital Thrombotic Thrombocytopenic Purpura (cTTP, Upshaw-Schulman Syndrome [USS], Hereditary Thrombotic Thrombocytopenic Purpura [hTTP])\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT03393975\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2024, 1, 19), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT03393975\u0027, \u0027minAgeYears\u0027: 0.0, \u0027StartDate\u0027: neo4j.time.Date(2017, 10, 13), \u0027RecruitmentStatus\u0027: \u0027Recruiting\u0027, \u0027AltmetricAttentionScore\u0027: 139.0, \u0027StartYear\u0027: 2017, \u0027TrialID\u0027: \u0027NCT03393975\u0027, \u0027CompletionYear\u0027: 2024, \u0027Acronym\u0027: \u0027\u0027, \u0027maxAgeYears\u0027: 70.0}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "1801", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 1801\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Modakafusp alfa (Drug), Dexamethasone (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 1/2\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 336, \u0027BriefTitle\u0027: \u0027A Study of Modakafusp Alfa on Adult Participants With Relapsed/Refractory Multiple Myeloma\u0027, \u0027Abstract\u0027: \u0027The main aims of this 3-part study are as follows:Part 1: To determine any side effects from modakafusp alfa single treatment and how often they occur. The dose of modakafusp alfa will be increased a little at a time until the highest dose that does not cause harmful side effects is found.Part 2: To assess clinical activity of one or more dosing schedules of modakafusp alfa alone in participants with relapsed/refractory multiple myeloma. Dexamethasone standard dose will be administered with one or more selected dose of modakafusp alfa in selected group of participants.Part 3: To find the optimal dose with the more favorable risk-benefit profile of modakafusp alfa.Participants will receive modakafusp alfa at one of two doses which will be given through a vein.\\n\\nDetailed Description\\nThe drug being tested in this study, and which will be given through a vein, is called modakafusp alfa (TAK-573 ) as single agent or in combination with dexamethasone. The study will determine the safety, tolerability, and efficacy of modakafusp alfa as single agent and in combination with dexamethasone in participants with relapsed/refractory multiple myeloma (RRMM). The study consists of 3 Parts:Part 1: Dose Escalation, Part 2: Dose Expansion, Part 3: Dose ExtensionThe study will enroll approximately 65 participants in Part 1, 35 in Part 2, and 236 in Part 3. Participants will be assigned to one of the following treatment groups in Parts 1 and 2 of the study. Participants will be randomly assigned in Part 3 of the study as given below:Part 1 (Dose Escalation) Schedule A: Modakafusp alfa 0.001 Up to 14 mg/kgPart 1 (Dose Escalation) Schedule B: Modakafusp alfa TBDPart 1 (Dose Escalation) Schedule C: Modakafusp alfa TBDPart 1 (Dose Escalation) Schedule D: Modakafusp alfa TBDPart 2 (Dose Expansion): Modakafusp alfa TBD + Dexamethasone 40 mgPart 3 (Dose Extension): Modakafusp alfa 120 mgPart 3 (Dose Extension): Modakafusp alfa 240 mgThe Part 1 (Dose Escalation) portion of the study will follow a 3+3 dose escalation design to evaluate once-weekly up to 4 different schedules of administration of modakafusp alfa starting at 0.001 mg/kg for dose limiting toxicity (DLT) evaluation and to determine the maximum tolerated dose (MTD) or an optimal biological dose (OBD) for assessments in Part 2.The Part 2 (Dose Expansion) will further assess the safety profile of modakafusp alfa and its efficacy at MTD or OBD.For Part 3 (Dose Extension) participants will be randomized 1:1 to receive single-agent modakafusp alfa 120 mg or 240 mg Q4W.Parts 1 and 2 will be conducted at multiple centers in the United States. Part 3 will be conducted worldwide. The maximum treatment duration in this study is up to 12 months (Parts 1 and 2) or until disease progression (Part 3) and overall time to participate in the study is approximately up to 90 months. Participants with clinical benefit may continue treatment after sponsor approval.\u0027, \u0027Title\u0027: \u0027A Phase 1/2 Open-label Study to Investigate the Safety and Tolerability, Efficacy, Pharmacokinetics, and Immunogenicity of Modakafusp Alfa (TAK-573) as a Single Agent in Patients With Relapsed Refractory Multiple Myeloma\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT03215030\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2024, 9, 3), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT03215030\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2017, 10, 4), \u0027RecruitmentStatus\u0027: \u0027Active, not recruiting\u0027, \u0027AltmetricAttentionScore\u0027: 93.0, \u0027StartYear\u0027: 2017, \u0027TrialID\u0027: \u0027NCT03215030\u0027, \u0027CompletionYear\u0027: 2024, \u0027Acronym\u0027: \u0027iinnovate-1\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "1802", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 1802\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027E-learning educational program (Other), Control (Other)\u0027, \u0027Phase\u0027: \u0027\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 247, \u0027BriefTitle\u0027: \u0027E-learning to Improve Oral Anticoagulant Use in Hospitalized Older People With AF\u0027, \u0027Abstract\u0027: \u0027Atrial Fibrillation (AF) is the most common cardiac arrhythmia and the main cause of cardioembolic stroke. Oral Anticoagulation (OAC) has been shown to significantly prevent AF-related thromboembolism, however, despite convincing evidences and current guidelines recommendations, OAC tends to be underused in clinical practice especially in the oldest. Education and training to appropriately select people suitable for OAC for stroke prevention could be pivotal in the decision making process. According to the study project, physicians working in Internal Medicine and Geriatric wards, where are mainly admitted elderly people with AF, will undergo to a program of e-learning through computer-based simulation method reproducing clinical scenarios of patients aged 65 years or older, with known or newly diagnosed AF, admitted to hospital for any medical reason and requesting that a decision about long-term antithrombotic therapy is taken.Primary objective of the study is to investigate whether such educational intervention will improve the appropriate use and prescription rate of OAC in hospitalised elderly patients with AF, multimorbidity and polypharmacy, in comparison to the usual practice.The study will be a cluster randomised controlled trial involving a network of Internal Medicine and Geriatrics wards. Thirty-two wards will be recruited based on voluntary participation and randomised to receive an educational intervention through computer-based simulation, (N=16) or to continue with the usual practice (N=16). Subjects receiving the intervention will be all the staff physicians of the wards randomised in the intervention arm.The impact of the intervention compared with the usual practice will be evaluated in patients aged 65 years or older admitted to the participating centres with a known diagnosis of AF or newly diagnosed with AF during the hospitalisation.\u0027, \u0027Title\u0027: \u0027Simulation-based Technologies to Improve the Appropriate Use of Oral Anticoagulants in Hospitalized Elderly Patients With Atrial Fibrillation\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT03188211\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2018, 9, 30), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT03188211\u0027, \u0027minAgeYears\u0027: 65.0, \u0027StartDate\u0027: neo4j.time.Date(2017, 9, 1), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027StartYear\u0027: 2017, \u0027TrialID\u0027: \u0027NCT03188211\u0027, \u0027CompletionYear\u0027: 2018, \u0027Acronym\u0027: \u0027SIM-AF\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "1809", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 1809\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Tricuspid Valve Repair System (Device)\u0027, \u0027Phase\u0027: \u0027\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 85, \u0027BriefTitle\u0027: \u0027TRILUMINATE Study With Abbott Transcatheter Clip Repair System in Patients With Moderate or Greater TR\u0027, \u0027Abstract\u0027: \u0027The primary purpose of this study is to evaluate safety and effectiveness of the Tricuspid Valve Repair System (TVRS) for treating symptomatic moderate or greater tricuspid regurgitation (TR) in patients currently on medical management and who are deemed appropriate for percutaneous transcatheter intervention.\\n\\nDetailed Description\\nThis is a prospective, single arm, multi-center study.A minimum of 85 subjects will be prospectively enrolled into this single arm study in approximately 25 sites, in Europe, Canada and the United States. Patients will be seen for follow-up visits at discharge (\u2264 7 days post index procedure), 30 days, 6 months, 1,2,3 years.\u0027, \u0027Title\u0027: \u0027Trial to Evaluate Treatment With Abbott Transcatheter Clip Repair System in Patients With Moderate or Greater Tricuspid Regurgitation (TRILUMINATE)\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT03227757\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2024, 6, 9), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT03227757\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2017, 8, 1), \u0027RecruitmentStatus\u0027: \u0027Active, not recruiting\u0027, \u0027AltmetricAttentionScore\u0027: 99.0, \u0027StartYear\u0027: 2017, \u0027TrialID\u0027: \u0027NCT03227757\u0027, \u0027CompletionYear\u0027: 2024, \u0027Acronym\u0027: \u0027TRILUMINATE\u0027, \u0027maxAgeYears\u0027: 90.0}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "1812", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 1812\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027TAS-116 (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 1\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 31, \u0027BriefTitle\u0027: \u0027A Study of TAS-116 in Patients With Solid Tumors\u0027, \u0027Abstract\u0027: \u0027A First-in-Human (FIH) study of TAS-116 in patients with advanced solid tumors was first initiated in Japan in April 2014 and has been ongoing since then. The study consists of a dose escalation phase and a dose expansion phase. Three dosing regimens of TAS-116, once daily (QD), every other day (QOD) and 5 days on/2 days off regimens in 21-day cycles, are being evaluated. This phase I study is also planned to enroll patients with advanced solid tumors in UK to confirm the MTD, safety, tolerability, and pharmacokinetics of TAS-116 in a Western patient population in the dose expansion phase. In addition, patients with HER2+ MBC, NSCLC harboring EGFR mutations or NSCLC harbouring ALK translocations will be further evaluated for safety, tolerability, and efficacy in 3 separate cohorts at recommended dose of TAS-116 on the 5 days on/2 days off regimen.\u0027, \u0027Title\u0027: \u0027A Phase IA/IB Study Evaluating TAS-116 in Patients With Advanced Solid Tumors\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT02965885\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2019, 5, 3), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT02965885\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2017, 7, 10), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027StartYear\u0027: 2017, \u0027TrialID\u0027: \u0027NCT02965885\u0027, \u0027CompletionYear\u0027: 2019, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "1815", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 1815\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Abatacept (Drug), Placebo for abatacept (Drug), Upadacitinib (Drug), Placebo for upadacitinib (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 613, \u0027BriefTitle\u0027: \u0027A Phase 3 Study to Compare Upadacitinib to Abatacept in Subjects With Rheumatoid Arthritis on Stable Dose of Conventional Synthetic Disease- Modifying Antirheumatic Drugs (csDMARDs) Who Have an Inadequate Response or Intolerance to Biologic DMARDs\u0027, \u0027Abstract\u0027: \u0027The study objective of Period 1 was to compare the safety and efficacy of upadacitinib 15 mg once daily (QD) to abatacept on a background of conventional synthetic disease-modifying antirheumatic drugs (csDMARDs) for the treatment of signs and symptoms of rheumatoid arthritis (RA) in biologic disease-modifying antirheumatic drug (bDMARD)-inadequate response or bDMARD-intolerant participants with moderately to severely active RA. The study objective of Period 2 is to evaluate the long-term safety, tolerability, and efficacy of upadacitinib 15 mg QD in participants with RA who had completed Period 1.\\n\\nDetailed Description\\nThis is a Phase 3 multicenter study with 2 periods. Period 1 was a 24-week, randomized, double-blind, parallel-group, active-controlled period designed to compare the safety and efficacy of upadacitinib 15 mg and abatacept for the treatment of signs and symptoms of participants with moderately to severely active rheumatoid RA who had an inadequate response to or intolerance to bDMARD therapy and were currently on a stable dose of csDMARD(s) and had never received abatacept. Period 2 is an open-label, long-term extension study to evaluate the long-term safety, tolerability, and efficacy of upadacitinib 15 mg once a day (QD) in participants with RA who had completed Period 1.\u0027, \u0027Title\u0027: \u0027A Phase 3, Randomized, Active-Controlled, Double-Blind Study Comparing Upadacitinib (ABT-494) to Abatacept in Subjects With Moderately to Severely Active Rheumatoid Arthritis With Inadequate Response or Intolerance to Biologic DMARDs (bDMARDs) on Stable Conventional Synthetic Disease Modifying Anti-Rheumatic Drugs (csDMARDs)\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT03086343\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2023, 6, 6), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT03086343\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2017, 5, 9), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027AltmetricAttentionScore\u0027: 239.0, \u0027StartYear\u0027: 2017, \u0027TrialID\u0027: \u0027NCT03086343\u0027, \u0027CompletionYear\u0027: 2023, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "1818", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 1818\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Vodobatinib (K0706) capsules (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 1/2\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 122, \u0027BriefTitle\u0027: \u0027Safety and Anti-leukemic Activity of Vodobatinib (K0706) for Treatment of Ph+ CML Resistant/Intolerant to \u22653 Prior CML Therapies\u0027, \u0027Abstract\u0027: \u0027Phase 1/2 study to determine safety, tolerability, pharmacokinetics, and anti-leukemic activity of Vodobatinib (K0706) in treatment-refractory/intolerant CML\\n\\nDetailed Description\\nPart A ( for Healthy volunteers) of the study is completed.Part B dose-escalation study is completed. Recruitment in dose expansion is completed.Part C study in subjects with treatment-resistant/intolerant is ongoing for the enrolled subjects.\u0027, \u0027Title\u0027: \u0027A Two-Part Phase 1/2 Study to Determine Safety, Tolerability, Pharmacokinetics, and Activity of K0706, a Novel Tyrosine Kinase Inhibitor (TKI), in Healthy Subjects and in Subjects With Chronic Myeloid Leukemia (CML) or Philadelphia Chromosome Positive Acute Lymphoblastic Leukemia (Ph+ ALL)\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT02629692\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2026, 8, 1), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT02629692\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2017, 4, 25), \u0027RecruitmentStatus\u0027: \u0027Active, not recruiting\u0027, \u0027AltmetricAttentionScore\u0027: 1.0, \u0027StartYear\u0027: 2017, \u0027TrialID\u0027: \u0027NCT02629692\u0027, \u0027CompletionYear\u0027: 2026, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "1821", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 1821\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Ipilimumab (Drug), Nivolumab (Drug), Rovalpituzumab tesirine (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 1/2\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 42, \u0027BriefTitle\u0027: \u0027A Study of Rovalpituzumab Tesirine Administered in Combination With Nivolumab and With or Without Ipilimumab for Adults With Extensive-Stage Small Cell Lung Cancer\u0027, \u0027Abstract\u0027: \u0027The purpose of this study is to assess the safety and efficacy of rovalpituzumab tesirine administered in combination with nivolumab or nivolumab and ipilimumab in participants with extensive-stage small cell lung cancer (SCLC).\\n\\nDetailed Description\\nThe study planned to enroll three cohorts with approximately 30 participants in each, including a dose-limiting toxicity (DLT) evaluation phase (the first 12 weeks of any treatment) and an expansion phase. Initially, up to 12 participants were to be enrolled into Cohort 1 in order to obtain 6 evaluable participants through the DLT evaluation period of 12 weeks. Safety data were reviewed by a Safety Monitoring Committee (SMC) for each cohort during the DLT evaluation phase before the next cohort opened. Once a new cohort was opened, the previously opened cohort was permitted to continue enrolling participants for the expansion phase for a total of 30 participants per cohort.Only two of the planned three cohorts enrolled participants in the study based on the SMC recommendation after DLTs were identified in Cohort 2.\u0027, \u0027Title\u0027: \u0027A Phase 1/2 Study on the Safety of Rovalpituzumab Tesirine Administered in Combination With Nivolumab or Nivolumab and Ipilimumab for Adults With Extensive-Stage Small Cell Lung Cancer\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT03026166\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2019, 7, 3), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT03026166\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2017, 3, 30), \u0027RecruitmentStatus\u0027: \u0027Terminated\u0027, \u0027AltmetricAttentionScore\u0027: 10.0, \u0027StartYear\u0027: 2017, \u0027TrialID\u0027: \u0027NCT03026166\u0027, \u0027CompletionYear\u0027: 2019, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "2052", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 2052\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Anti-TNF-alpha (Drug), Methotrexate (Drug), Placebo (Drug), RO7123520 (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 2\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 109, \u0027BriefTitle\u0027: \u0027A Study of RO7123520 to Evaluate the Safety and Efficacy in Participants With Moderately To Severely Active Rheumatoid Arthritis (RA) Who Are Inadequately Responding to Anti-Tumor Necrosis Factor (TNF)-Alpha Therapy\u0027, \u0027Abstract\u0027: \u0027This is a Phase IIa/b double-blind, placebo-controlled, randomized, parallel group, multicenter study to evaluate the safety and efficacy of RO7123520 as adjunctive therapy in participants with RA who are inadequately responding to standard-of-care (methotrexate and anti-TNF-alpha therapy). Part 1 of the study will evaluate safety. Part 2 will evaluate efficacy and safety. Part 3 will evaluate dose-ranging efficacy. Participants will have the option of continuing to the extension period of the study.\u0027, \u0027Title\u0027: \u0027A Randomized, Double-Blind, Placebo-Controlled, Multi-Center Phase II Study to Evaluate The Safety and Efficacy of RO7123520 as Adjunct Treatment in Patients With Moderately to Severely Active Rheumatoid Arthritis and an Inadequate Response to TNF-alpha Inhibitors\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT03001219\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2018, 11, 6), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT03001219\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2016, 12, 22), \u0027RecruitmentStatus\u0027: \u0027Terminated\u0027, \u0027StartYear\u0027: 2016, \u0027TrialID\u0027: \u0027NCT03001219\u0027, \u0027CompletionYear\u0027: 2018, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "2053", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 2053\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027\u0027, \u0027Phase\u0027: \u0027Phase 2\u0027, \u0027StudyType\u0027: \u0027\u0027, \u0027BriefTitle\u0027: \u0027Phase II Study evaluating the effect of osimertinib in patients with non-small cell lung cancer locally advanced or metastatic with T790M resistance mutation not evaluable or unknown, undergoing chemotherapy after failure of treatment with tyrosine kinase inhibitors.\u0027, \u0027Abstract\u0027: \u0027Locally Advanced or Metastatic EGFR mutated, T790M undetectable or unknown Non Small Cell Lung Cancer Stage IIIB-IV\u0027, \u0027Title\u0027: \u0027OSIRIS OSImertinib Rechallenge TKI In Subsequent line of therapy A Phase II, Noncomparative, Open label, Multicentre, Study of AZD9291, in Patients with Locally Advanced or Metastatic EGFR mutated, T790M undetectable or unknown Non Small Cell Lung Cancer Stage IIIB-IV after No Immediate Prior EGFR TKI\u0027, \u0027SourceLinkout\u0027: \u0027https://www.clinicaltrialsregister.eu/ctr-search/search?query=2016-002555-17\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027EU-CTR\u0027, \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/2016-002555-17\u0027, \u0027StartDate\u0027: neo4j.time.Date(2016, 11, 21), \u0027RecruitmentStatus\u0027: \u0027Prematurely Ended\u0027, \u0027StartYear\u0027: 2016, \u0027TrialID\u0027: \u00272016-002555-17\u0027, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "2054", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 2054\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Defibrotide (Drug), Best Supportive Care (Other)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 372, \u0027BriefTitle\u0027: \u0027Study Comparing Efficacy and Safety of Defibrotide vs Best Supportive Care in the Prevention of Hepatic Veno-Occlusive Disease in Adult and Pediatric Patients\u0027, \u0027Abstract\u0027: \u0027This study is to compare the efficacy and safety of defibrotide prophylaxis in addition to best supportive care versus best supportive care alone in the prevention of hepatic veno- occlusive disease (VOD) in adult and pediatric patients undergoing hematopoietic stem cell transplant who are at high risk or very high risk of developing VOD.\u0027, \u0027Title\u0027: \u0027A Phase 3, Randomized, Adaptive Study Comparing the Efficacy and Safety of Defibrotide vs Best Supportive Care in the Prevention of Hepatic Veno-Occlusive Disease in Adult and Pediatric Patients Undergoing Hematopoietic Stem Cell Transplant\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT02851407\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2020, 10, 20), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT02851407\u0027, \u0027minAgeYears\u0027: 0.08333333333333333, \u0027StartDate\u0027: neo4j.time.Date(2016, 9, 1), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027AltmetricAttentionScore\u0027: 14.0, \u0027StartYear\u0027: 2016, \u0027TrialID\u0027: \u0027NCT02851407\u0027, \u0027CompletionYear\u0027: 2020, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "2055", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 2055\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Lurbinectedin (PM01183) (Drug), Doxorubicin (DOX) (Drug), Cyclophosphamide (CTX) (Drug), Vincristine (VCR) (Drug), Topotecan (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 613, \u0027BriefTitle\u0027: \u0027Clinical Trial of Lurbinectedin (PM01183)/Doxorubicin Versus CAV or Topotecan as Treatment in Patients With Small-Cell Lung Cancer\u0027, \u0027Abstract\u0027: \"Phase III randomized clinical trial of lurbinectedin (PM01183)/doxorubicin (DOX) versus cyclophosphamide (CTX), doxorubicin (DOX) and vincristine (VCR) (CAV) or topotecan as treatment in patients with small-cell lung cancer (SCLC) who failed one prior platinum-containing line.\\n\\nDetailed Description\\nMulticenter, open-label, randomized, controlled phase III clinical trial to evaluate and compare the activity and safety of an experimental arm consisting of PM01183/DOX combination followed by PM01183 alone, if applicable vs. best Investigator\u0027s choice between CAV or topotecan as a control arm, in SCLC patients who failed one prior platinum-containing line but no more than one prior chemotherapy-containing line.\", \u0027Title\u0027: \u0027Phase III Randomized Clinical Trial of Lurbinectedin (PM01183)/Doxorubicin Versus Cyclophosphamide, Doxorubicin and Vincristine (CAV) or Topotecan as Treatment in Patients With Small-Cell Lung Cancer (SCLC) Who Failed One Prior Platinum-containing Line (ATLANTIS)\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT02566993\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2020, 2, 24), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT02566993\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2016, 8, 30), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027AltmetricAttentionScore\u0027: 478.0, \u0027StartYear\u0027: 2016, \u0027TrialID\u0027: \u0027NCT02566993\u0027, \u0027CompletionYear\u0027: 2020, \u0027Acronym\u0027: \u0027ATLANTIS\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "2057", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 2057\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027\u0027, \u0027Phase\u0027: \u0027\u0027, \u0027StudyType\u0027: \u0027Observational\u0027, \u0027NumberOfParticipants\u0027: 66, \u0027BriefTitle\u0027: \u0027Perioperative Goal Directed Therapy in Kidney Transplantation\u0027, \u0027Abstract\u0027: \u0027In literature there is a huge amount of works demonstrating the direct correlation between volemic overload or fluid deficit and hypoperfusion and the increase in the rate of major postoperative complications in patients with high cardiovascular risk and chronic renal failure candidate to kidney transplantation from cadaver. It is also widely demonstrated that in certain populations with high surgical and post-operative complications risk, the adoption of targeted haemodynamic and clinical-therapeutic management protocols is indicated. The current trend is therefore to guarantee greater precision in the intraoperative management of patients undergoing kidney transplantation from cadaver by using a specific protocol that can be framed in the recent and innovative concept of Perioperative Gold Directed Therapy (PGDT), resulting from the adoption of an advanced minimally invasive hemodynamic monitoring technology with a special sensor called FloTrac (Edwards Lifesciences), already extensively tested in an extensive case series of high perioperative risk patients underwent to major abdominal surgery, major vascular surgery, major orthopedic surgery and cardio-thoracic surgery. In the present study there will be enrolled all patients who are candidates for kidney transplant from cadaver at the University Hospital \"G. Rodolico\" of Catania that meet the inclusion criteria of the study and will give their informed consent to participation. The enrolled patients will be monitored for a maximum period of 7 days from transplantation. As control group there will be considered an historical cohort of patients who underwent kidney transplantation from cadaver in 2015, in which a PGDT protocol was not used, but a common hemodynamic monitoring, based on parameters such as central venous pressure and / or invasive arterial pressure, was performed according to the international guidelines.\u0027, \u0027Title\u0027: \u0027Perioperative Protocol Goal Directed Therapy in Kidney Transplantation: Fluid Therapy Optimization and Impact on Postoperative Complications.\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT03776396\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2018, 1, 30), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT03776396\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2016, 5, 5), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027StartYear\u0027: 2016, \u0027TrialID\u0027: \u0027NCT03776396\u0027, \u0027CompletionYear\u0027: 2018, \u0027Acronym\u0027: \u0027\u0027, \u0027maxAgeYears\u0027: 65.0}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "2060", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 2060\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027further diagnostic (Other)\u0027, \u0027Phase\u0027: \u0027\u0027, \u0027StudyType\u0027: \u0027Observational\u0027, \u0027NumberOfParticipants\u0027: 400, \u0027BriefTitle\u0027: \u0027Emergency Thoracic Ultrasound and Clinical Risk Management\u0027, \u0027Abstract\u0027: \u0027Clinical risk assessment and management is mostly relevant in emergency. Thoracic ultrasound (TUS) has been proposed as an easy-option replacement for chest X-ray (CXR) in Emergency diagnosis of pneumonia, pleural effusion and pneumothorax. Investigators investigated CXR \"unforeseen diagnosis\", provided by TUS, exploring usefulness and sustainability of telementoring aimed at the management of clinical risk. This observational report includes a period of six months with a proactive concurrent adjunctive telementoring in TUS diagnosis using freely available smartphone applications for the transfer of images and movies.\\n\\nDetailed Description\\nThe present study describes a six months period of specialist activity of an Emergency Department physician. The aim is to display the performance in the subsets of difficult or unexpected thoracic ultrasound imaging performed by TUS, in a context with the prompt availability of all radiological facilities. The interaction of TUS telementoring, using WhatsApp\u00ae or Skype\u00ae, provided by another colleague, in another city and hospital, with a greater specific expertise in TUS, was devised to assure a concurrent mentorship by the School. This training has included a subsequent revaluation of clinical cases by the Ultrasound Course Lecturer in TUS and by the Director of the School of Clinical Ultrasound, with a reappraisal overview of all the available information. The approach was clinical and instrumental, and included:A. clinical history; B. clinical examination of chest, neck, joints and abdomen; C. sequential ultrasound examination of the abdomen, thorax, pericardium; D. focus on pain symptoms: of chest, abdomen (with or without distention), lumbar region, neck; E. focus on dyspnea and/or cough and/or fever with detection of humid or dry lung sounds, chest dullness, of heart and/or pleura-pericardial sounds, and/or jugular congestion, checking also the mobility of the diaphragm and evaluating the collapsibility of the cava vein.TUS was generally conducted with the patient in a sitting position, although the few patients (predominantly children), likely to experience severe discomfort during the procedure, were scanned in a semi-supine position. A systematic examination of all intercostal spaces was performed and TUS images, if present, were assessed for the number, location, shape, size, and breath-dependent changes in consolidation areas. Two main types of pattern of lung consolidation attributable to pneumonia were defined: hypoechoic consolidation and mixed consolidation. The presence of air bronchogram, fluid bronchogram, and basal pleural effusion was also reported. The size of the consolidation area was measured longitudinally and transversally, using the longest measurement, i.e., the maximal length of the consolidation area visible by TUS, for data analysis. For the purpose of this report, details on the measurements are not detailed.The second opinion was provided outside the Hospital facility by a mentor (FMT), expert in Clinical Ultrasound, answering to the questions related to the images of videoclips of the actual patient in emergency. Images and movies were sent by WhatsApp. Reappraisal was performed subsequently, using all the available imaging - photos and videoclips, the clinical records and the outcome information, as obtainable by a short-term follow-up.\u0027, \u0027Title\u0027: \u0027Emergency Thoracic Ultrasound and Clinical Risk Management\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT02985528\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2016, 7, 1), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT02985528\u0027, \u0027minAgeYears\u0027: 16.0, \u0027StartDate\u0027: neo4j.time.Date(2016, 2, 1), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027StartYear\u0027: 2016, \u0027TrialID\u0027: \u0027NCT02985528\u0027, \u0027CompletionYear\u0027: 2016, \u0027Acronym\u0027: \u0027CLINRISKETUS\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "2062", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 2062\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Thoracic Ultrasound (TUS) (Diagnostic Test)\u0027, \u0027Phase\u0027: \u0027\u0027, \u0027StudyType\u0027: \u0027Observational\u0027, \u0027NumberOfParticipants\u0027: 70, \u0027BriefTitle\u0027: \u0027CRP and Thoracic Emergency Ultrasound in Pneumonia\u0027, \u0027Abstract\u0027: \u0027This preliminary study investigates in patients with possible clinical diagnosis of pneumonia, clues and biomarker assessed at Emergency Department (ED) triage, potentially predicting detection of lung consolidation by Thoracic-ultrasound (TUS) and/or by Chest-X-Rays. Cough and high admission CRP levels will be defined according to the cutoff defined by ROC analysis, will be challenged if independently associated with TUS lung consolidation detection High level of the chosen biomarker, and any of the considered symptoms, in otherwise not extremely critical patients (CURB65\u22643), should prompt to immediate confirm by TUS, during the physical examination. This may limit the need of further radiological investigations allowing targeted workup.\\n\\nDetailed Description\\nChest-X-Rays (CXR), Computerized Tomography (CT) or Thoracic Ultrasound (TUS) provide images deemed consistent with acute lung consolidation and suitable to confirm the diagnosis of community acquired pneumonia (CAP). Patients which may be affected by CAP are many , but diagnosis is not straightforward because we are managing \"a disease characterized by educated guesswork\" . Comprehensive imaging workup may be not regularly affordable in busy emergency rooms. Point-of-care TUS allows reliable diagnosis of lung consolidation and of pleural effusion. Regretfully, adequate TUS expertise is more warranted than actually available in most medical departments. Even not specifically investigated, a delay or even an impairment of appropriate TUS or CXR evaluation for several patients may occur due to time- or resource-limiting factors.Clinical clues of lung consolidation are many. Key symptoms are cough, fever, chest pain and dyspnea with tachypnea, while the major physical signs are chest crackles and dullness. Surrogate biomarkers more easily obtainable in emergency facilities are C-reactive-protein (CRP), peripheral non-invasive pulse-oxymetry and neutrophil-to-lymphocyte ratio (NLR) which is an index of systemic inflammation associated also with pneumonia and subsequent outcome.The aim of this preliminary study is to evaluate if any clue and which biomarker, including NLR, assessed at Emergency Department (ED) triage, is predictive of the subsequent detection of lung consolidation by TUS and/or by CXR.The minimal groups\\\u0027 size, with and without TUS or CXR lung consolidation, was calculated according to the difference of the averages of neutrophil-to-lymphocyte ratio (NLR) in the reference the study of Yoon et al. Accepting alpha 0.01, for the probability of type 1 error, and power 80% for probability of type 2 error, a minimum sample size of 19 participants in each group (total 38) was required. Student\\\u0027s t-tests assessed the differences of CRP, WBC - white blood cells count - (TLC), neutrophil count (TNC) and NLR, between the groups with TUS and, separately, with CXR lung consolidation.Thereafter, by ROC (receiver operating curve) analysis, a cutoff of NLR, total leucocytes count (TLC), total Neutrophil count (TNC) and of CRP was calculated vs. the optimal reliability for the detection of TUS consolidation; sensitivity, specificity and accuracy (The proportion of all tests that are correct), and relative Odds Ratio (OR) and confidence intervals (CI) of the individual symptoms, and ORs of so defined laboratory assay cut-offs were calculated separately vs. TUS and CXR consolidation.\u0027, \u0027Title\u0027: \u0027CRP (C-Reactive-Protein) and Pneumonia Biomarkers Stratification for Selectively Addressing Priorities in Thoracic Emergency Ultrasound in Pneumonia\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT03212248\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2017, 6, 30), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT03212248\u0027, \u0027minAgeYears\u0027: 19.0, \u0027StartDate\u0027: neo4j.time.Date(2016, 1, 2), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027StartYear\u0027: 2016, \u0027TrialID\u0027: \u0027NCT03212248\u0027, \u0027CompletionYear\u0027: 2017, \u0027Acronym\u0027: \u0027TUS-STRAT\u0027, \u0027maxAgeYears\u0027: 75.0}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "2065", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 2065\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027\u0027, \u0027Phase\u0027: \u0027\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 102, \u0027BriefTitle\u0027: \u0027Clinical study to assess the tolerance and efficacy of a nasal spray: St\u00e9rimar Stop \u0026 Protect Rhume/Cold for  relief of symptoms in patients with an upper respiratory tract infection (common cold)\u0027, \u0027Abstract\u0027: \u0027Background and study aims\\nThe objective of this clinical study is to assess the effects of St\u00e9rimar Stop \u0026 Protect Rhume/Cold for relief of symptoms in patients with an upper respiratory tract infection (common cold).\\n\\nWho can participate?\\nPeople aged 18 - 60 years old, with symptoms of the common cold.\\n\\nWhat does the study involve?\\nParticipants will be randomly allocated to receive either Sterimar S\u0026P Cold or Blocked Nose\\nThey could be used up to 6 times a day, 2 pulverisations into each nostril for 14 days at the maximum.\\n\\nWhat are the possible benefits and risks of participating?\\nNone\\n\\nWhere is the study run from?\\n1. Centro di Farmacologia Clinica per la Sperimentazione dei Farmaci (Italy)\\n2. Azienda Ospedaliero - Universitaria \"Policlinico - Vittorio Emanuele\" (Italy)\\n\\nWhen is the study starting and how long is it expected to run for?\\nDecember 2015 to July 2018\\n\\nWho is funding the study?\\nChurch and Dwight (France)\\n\\nWho is the main contact?\\nMs Constance Prime, constance.prime@churchdwight.com\u0027, \u0027Title\u0027: \u0027Assessment of the tolerance and efficacy of St\u00e9rimar Stop \u0026 Protect Rhume/Cold  -  randomized,  double-blind, controlled versus St\u00e9rimar Hypertonic parallel-group,  non-inferiority clinical study\u0027, \u0027SourceLinkout\u0027: \u0027https://www.isrctn.com/ISRCTN14067635\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ISRCTN\u0027, \u0027EndDate\u0027: neo4j.time.Date(2018, 7, 11), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/ISRCTN14067635\u0027, \u0027StartDate\u0027: neo4j.time.Date(2015, 12, 1), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027StartYear\u0027: 2015, \u0027TrialID\u0027: \u0027ISRCTN14067635\u0027, \u0027CompletionYear\u0027: 2018, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "2066", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 2066\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027CTX-4430 (Drug), Placebo (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 2\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 200, \u0027BriefTitle\u0027: \u0027EMPIRE CF: A Phase 2 Study to Evaluate the Efficacy, Safety, and Tolerability of CTX-4430 in Adult Cystic Fibrosis (CF) Patients\u0027, \u0027Abstract\u0027: \u0027This study is a Phase 2, double-blind, randomized, placebo-controlled study to evaluate the safety and efficacy of CTX-4430 administered once-daily for 48 weeks for treatment of CF.\\n\\nDetailed Description\\nThis study is a Phase 2, double-blind, randomized, placebo-controlled study to evaluate the safety and efficacy of CTX-4430 administered once-daily for 48 weeks for treatment of CF. A total of 195 pulmonary CF patients that meet all the inclusion and no exclusion criteria and provide written informed consent will be randomized to receive 50 mg CTX-4430, 100 mg CTX-4430, or placebo in a 1:1:1 ratio. Follow-up visits will be conducted approximately every 4 weeks from Week 4 to Week 52 (4 weeks after completion of treatment).\u0027, \u0027Title\u0027: \u0027A Phase 2, Multicenter, Randomized, Double-blind, Placebo-controlled, Parallel-group Study to Evaluate the Efficacy, Safety, and Tolerability of CTX-4430 Administered Orally Once-Daily for 48 Weeks in Adult Patients With Cystic Fibrosis\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT02443688\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2018, 5, 16), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT02443688\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2015, 10, 30), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027AltmetricAttentionScore\u0027: 129.0, \u0027StartYear\u0027: 2015, \u0027TrialID\u0027: \u0027NCT02443688\u0027, \u0027CompletionYear\u0027: 2018, \u0027Acronym\u0027: \u0027\u0027, \u0027maxAgeYears\u0027: 30.0}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "2068", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 2068\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Ponatinib (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 2\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 283, \u0027BriefTitle\u0027: \u0027Ponatinib in Participants With Resistant Chronic Phase Chronic Myeloid Leukemia (CP-CML) to Characterize the Efficacy and Safety of a Range of Doses\u0027, \u0027Abstract\u0027: \u0027The purpose of this study is to characterize the efficacy of ponatinib administered in 3 starting doses (45 mg, 30 mg, and 15 mg daily) in participants with CP-CML who are resistant to prior tyrosine-kinase inhibitor (TKI) therapy o
