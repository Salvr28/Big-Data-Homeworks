r have T315I mutation, as measured by \u003c=1 % Breakpoint Cluster Region-Abelson Transcript Level using International Scale (BCR-ABL1IS) at 12 months.\\n\\nDetailed Description\\nThe drug being tested in this study is ponatinib. This study will characterize the safety and efficacy of ponatinib over a range of 3 starting doses.The study will enroll 276 participants in 3 cohorts and each cohort will have 92 participants. All the participants will be randomized to receive once-daily oral administration of 1 of 3 starting doses of ponatinib:Cohort A: 45 mg ponatinib tabletCohort B: 30 mg ponatinib tabletCohort C: 15 mg ponatinib tabletThe study is designed to consist of 2 periods: 24-cycle Main treatment period and optional treatment continuation period. Participants will be treated with their randomized dose of study drug in the Main Treatment Period until the occurrence of at least one of the following: absence of CHR by 3 months, absence of MCyR at 12 months, absence of \u003c=1% BCR-ABL1IS at 12 months, loss of \u003c=1% BCR-ABL1IS development of intolerance, or completion of all 24 cycles of treatment (whichever occurs first). Following completion of approximately 5 years or following early withdrawal, participants may enter into an optional treatment continuation period.This multi-center trial will be conducted in the United States, United Kingdom, Republic of Korea, Spain, France, Taiwan, Australia, Canada, Italy, Chile, Japan, Germany, Argentina, Poland, Czech Republic, Denmark, Hong Kong, Portugal, Russia, Singapore, Switzerland, and Sweden. The overall time to participate in this study is approximately 96 months. Participants will make a final visit to the clinic approximately 30 days after the last dose of study treatment.\u0027, \u0027Title\u0027: \u0027A Randomized, Open-label, Phase 2 Trial of Ponatinib in Patients With Resistant Chronic Phase Chronic Myeloid Leukemia to Characterize the Efficacy and Safety of a Range of Doses\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT02467270\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2024, 6, 1), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT02467270\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2015, 6, 30), \u0027RecruitmentStatus\u0027: \u0027Active, not recruiting\u0027, \u0027AltmetricAttentionScore\u0027: 118.0, \u0027StartYear\u0027: 2015, \u0027TrialID\u0027: \u0027NCT02467270\u0027, \u0027CompletionYear\u0027: 2024, \u0027Acronym\u0027: \u0027OPTIC\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "2242", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 2242\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Docetaxel (Drug), pertuzumab [Perjeta] (Drug), trastuzumab [Herceptin] (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 418, \u0027BriefTitle\u0027: \u0027Phase IIIb Study to Evaluate the Safety and Tolerability of Herceptin SC With Perjeta and Docetaxel in Patients With HER2-positive Advanced Breast Cancer\u0027, \u0027Abstract\u0027: \u0027This is an open-label, single-arm, multicenter, Phase IIIb study to evaluate the safety and tolerability of Herceptin SC in combination with Perjeta IV plus docetaxel in female patients with HER2-positive metastatic or locally recurrent breast cancer. Enrolled patients are to receive study medication until disease progression, unacceptable toxicity, withdrawal of consent, death, or predefined study end, whichever occurs first. The anticipated time on study treatment is approximately 24 months. The target sample size is 400.\u0027, \u0027Title\u0027: \u0027Phase IIIb Study to Evaluate the Safety and Tolerability of Herceptin SC With Perjeta and Docetaxel in Patients With HER2-positive Advanced Breast Cancer\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT02402712\u0027, \u0027Gender\u0027: \u0027Female\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2019, 2, 22), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT02402712\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2015, 5, 6), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027AltmetricAttentionScore\u0027: 1.0, \u0027StartYear\u0027: 2015, \u0027TrialID\u0027: \u0027NCT02402712\u0027, \u0027CompletionYear\u0027: 2019, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "2244", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 2244\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Placebo (Drug), Ixazomib (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 706, \u0027BriefTitle\u0027: \u0027A Study of Oral Ixazomib Maintenance Therapy in Participants With Newly Diagnosed Multiple Myeloma (NDMM) Not Treated With Stem Cell Transplantation (SCT)\u0027, \u0027Abstract\u0027: \u0027The purpose of this study is to determine the effect of ixazomib maintenance therapy on progression free survival (PFS) compared with placebo, in participants with NDMM who have had a major response (complete response [CR], very good partial response [VGPR], or partial response [PR]) to initial therapy and who have not undergone SCT.\\n\\nDetailed Description\\nThe drug being tested in this study is called ixazomib citrate. Ixazomib citrate is being tested to slow progressive disease (PD) and improve overall survival in people who have NDMM who have had a major positive response to initial therapy and have not undergone SCT. This study will look at the effect of ixazomib citrate has on the length of time that participants are free of PD and their overall survival.The study will enrol approximately 700 participants. Participants will be randomly assigned (by chance, like flipping a coin) in 3:2 ratio to Ixazomib or matching placebo groups-which will remain undisclosed to the participant and study doctor during the study (unless there is an urgent medical need):Ixazomib citrate initiates at 3 mg which will be escalated to 4 mg with cycle 5 day 1Placebo (dummy inactive pill) - this is a capsule that looks like the study drug but has no active ingredientAll participants will be asked to take one capsule on Days 1, 8 and 15 of each 28-day cycle. The treatment period will be approximately 24 months (equivalent to 26 cycles) or until patients experience PD or unacceptable toxicities, whichever occurs first.This multi-center trial will be conducted worldwide. The overall time to participate in this study is approximately 78 to 106 months. Participants will make 28 visits to the clinic during the treatment period and will continue to make follow-up visits every 4 weeks until the next line of therapy begins. Participants will also be contacted by telephone every 12 weeks after last treatment visit for a follow-up assessment.\u0027, \u0027Title\u0027: \u0027A Phase 3, Randomized, Placebo-Controlled, Double-Blind Study of Oral Ixazomib Maintenance Therapy After Initial Therapy in Patients With Newly Diagnosed Multiple Myeloma Not Treated With Stem Cell Transplantation\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT02312258\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2022, 8, 26), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT02312258\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2015, 4, 9), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027AltmetricAttentionScore\u0027: 183.0, \u0027StartYear\u0027: 2015, \u0027TrialID\u0027: \u0027NCT02312258\u0027, \u0027CompletionYear\u0027: 2022, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "2246", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 2246\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Lubricin (Device), Sodium Hyaluronate (Device)\u0027, \u0027Phase\u0027: \u0027\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 56, \u0027BriefTitle\u0027: \u0027Tolerability, Safety and Efficacy of Lubricin Eye Drops vs Sodium Hyaluronate Eye Drops in Subjects With Mod. Dry Eye\u0027, \u0027Abstract\u0027: \u0027Dry eye is a multifactorial disease of the tears and ocular surface that results in symptoms of discomfort, visual disturbance, and tear film instability with potential damage to the ocular surface. It is accompanied by increased osmolarity of the tear film and inflammation of the ocular surface.Lubricin is a mucin-like glycoprotein originally discovered in synovial fluid, as a secreted product of cells that line the joint tissues, which is present at the surface of articular cartilage and it has been investigated on its roles at the ocular surface, in normal and pathologic conditions such as dry eye.The objective of the study is to assess the tolerability, safety and efficacy of Lubricin eye drops solution administered over 4 weeks versus sodium hyaluronate (Na-HY) eye drops solution in subjects with moderate dry eye.\\n\\nDetailed Description\\nDry eye, or keratoconjunctivitis sicca, is a chronic inflammatory condition of the ocular surface that may cause severe symptoms and visual impairment. The 2007 international dry eye workshop (DEWS) defined the disease as follows: \"Dry eye is a multifactorial disease of the tears and ocular surface that results in symptoms of discomfort, visual disturbance, and tear film instability with potential damage to the ocular surface. It is accompanied by increased osmolarity of the tear film and inflammation of the ocular surface\".Lubricin is a mucin-like glycoprotein originally discovered in synovial fluid, as a secreted product of cells that line the joint tissues, which is present at the surface of articular cartilage.In vitro studies have shown that lubricin in saline buffer acts as a lubricant between various surfaces, as well as in synovial fluid, providing evidence that lubricin is a principal lubricating protein in joints. Besides the lubricating property, lubricin has been shown to exert anti-adhesive action, strain energy dissipation, and a protective effect on underlying cells.Lubricin has been investigated on its roles at the ocular surface, in normal and pathologic conditions such as dry eye. In fact, Lubricin is a natural human protein with most potent lubricant and anti-adhesive properties present on the ocular surface and on meibonian gland. The presence of this protein at the ocular surface was first described by the team of Sullivan D.Based on the available preclinical lubricin studies may be an important barrier to the development of corneal and conjunctival epitheliopathies in dry eyes and its use as a novel lubricating and anti-adhesive eye drop is under investigation in this clinical investigation. This clinical investigation has been designed to demonstrate that a Lubricin 150 \u00b5g/ml eye drop formulation is non-inferior to the currently most-widely used ocular surface lubricant sodium hyaluronate 0.13% in improving signs and symptoms in patients with moderate dry eye.Up to now, there are no known anticipated adverse events associated with the use of lubricin, anyway the occurrence of side effects cannot be excluded.It must be considered that topical treatment with lubricin or hyaluronic acid could cause local irritation or allergic reactions. There are no known contraindications to the use of lubricin or hyaluronic acid eye drops. All examinations and assessments that will be carried out during this study are non-invasive, are commonly used in the management of subjects with dry eye and pose no risk to the subjects. There are no known contraindications to the use of lubricin or hyaluronic acid eye drops. No data are available about the embryo and fetal toxicity, therefore the experimental treatment will not be allowed to pregnant women or nursing mothers and women of childbearing potential not using appropriate birth control methods.\u0027, \u0027Title\u0027: \u0027A Randomized, Double-masked, Controlled, Non-inferiority Study to Evaluate Tolerability, Safety and Efficacy of Lubricin Eye Drops vs Sodium Hyaluronate Eye Drops Given 4 Times a Day for 4 Weeks \u0026 1 Week Follow-up in Subjects With Dry Eye\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT02510235\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2015, 6, 1), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT02510235\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2015, 3, 1), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027StartYear\u0027: 2015, \u0027TrialID\u0027: \u0027NCT02510235\u0027, \u0027CompletionYear\u0027: 2015, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "2247", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 2247\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027BMS-936564 (Drug), Cytarabine (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 1/2\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 70, \u0027BriefTitle\u0027: \u0027An Investigational Immuno-therapy Study of Ulocuplumab in Combination With Low Dose Cytarabine in Patients With Newly Diagnosed Acute Myeloid Leukemia\u0027, \u0027Abstract\u0027: \u0027The purpose of this study is to determine the safety and effectiveness of ulocuplumab in combination with low dose cytarabine in the treatment of Newly Diagnosed Acute Myeloid Leukemia (AML).\u0027, \u0027Title\u0027: \u0027A Phase 1/2, Open-label Randomized Study of Ulocuplumab (BMS-936564) in Combination With Low Dose Cytarabine in Subjects With Newly Diagnosed Acute Myeloid Leukemia\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT02305563\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2019, 6, 4), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT02305563\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2015, 1, 27), \u0027RecruitmentStatus\u0027: \u0027Terminated\u0027, \u0027StartYear\u0027: 2015, \u0027TrialID\u0027: \u0027NCT02305563\u0027, \u0027CompletionYear\u0027: 2019, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "2249", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 2249\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Bimatoprost SR (Drug), Sham: Applicator Without Needle (Other), Active Comparator: Timolol 0.5% (Drug), Timolol Vehicle (placebo) (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 528, \u0027BriefTitle\u0027: \u0027Efficacy and Safety of Bimatoprost Sustained-Release (SR) in Patients With Open-Angle Glaucoma or Ocular Hypertension\u0027, \u0027Abstract\u0027: \u0027This study will evaluate the efficacy and safety of bimatoprost sustained-release (SR) in patients with open-angle glaucoma or ocular hypertension. The study includes a 12-month treatment period with an 8-month extended follow-up.\u0027, \u0027Title\u0027: \u0027The Efficacy and Safety of Bimatoprost SR in Patients With Open-angle Glaucoma or Ocular Hypertension\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT02250651\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2020, 7, 22), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT02250651\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2014, 12, 15), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027AltmetricAttentionScore\u0027: 7.0, \u0027StartYear\u0027: 2014, \u0027TrialID\u0027: \u0027NCT02250651\u0027, \u0027CompletionYear\u0027: 2020, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "2252", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 2252\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Clinical and psychopathological assessment of HAE patients (Other)\u0027, \u0027Phase\u0027: \u0027\u0027, \u0027StudyType\u0027: \u0027Observational\u0027, \u0027NumberOfParticipants\u0027: 35, \u0027BriefTitle\u0027: \u0027Hereditary AngioEdema, Neurobiology and Psychopathology\u0027, \u0027Abstract\u0027: \u0027Since 1963 Hereditary AngioEdema (HAE) is considered an autosomal dominant disorder (Donaldson and Evans), characterized by a quantitative and/or qualitative deficit of C1 esterase inhibitor (C1-INH), which affects approximately 1:50.000 individuals in the general population. From this period the link between HAE and psychiatry was interrupted, however genetic issues could not comprehensively explain the clinical evolution of the disease. Clinical studies show an evident gap between genotype and phenotype of HAE. For this still controversial question, we have designed this cross-sectional study in order to establish the relationship between HAE clinical manifestations and neurobiological/psychopatological parameters.\u0027, \u0027Title\u0027: \u0027Hereditary AngioEdema, Neurobiology and Psychopathology\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT02159430\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2015, 5, 1), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT02159430\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2014, 11, 1), \u0027RecruitmentStatus\u0027: \u0027Unknown status\u0027, \u0027StartYear\u0027: 2014, \u0027TrialID\u0027: \u0027NCT02159430\u0027, \u0027CompletionYear\u0027: 2015, \u0027Acronym\u0027: \u0027HAENP\u0027, \u0027maxAgeYears\u0027: 65.0}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "2258", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 2258\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Aerobic Exercise (Other)\u0027, \u0027Phase\u0027: \u0027\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 154, \u0027BriefTitle\u0027: \u0027Evaluation of Depression In Chronic Obstructive Pulmonary Disease\u0027, \u0027Abstract\u0027: \"Background:Several clinical studies show high rates of anxiety and depressive disorders in Chronic Obstructive Pulmonary Disease (COPD), that suggest common underlying pathogenetic mechanisms of COPD and depressive disorders. The aim of this study is to evaluate the effects of aerobic exercise, proposed in the context of pulmonary rehabilitation, in a sample of COPD depressed patients without psychopharmacological treatment, through the correlation of some psychopathological variables and physical/pneumological parameters.Methods:The investigators have designed an observational longitudinal trial. The trial will be prospective 6-weeks randomized clinical study to evaluate the impact of aerobic exercise on depressive symptoms in 154 patient affected by COPD and depression, assessed by Hamilton Depression Rating Scale (HDRS). The investigators will also monitor anxiety, quality of life and neurocognitive function.Outcome measures:The investigators compare the variation of HDRS total score, as primary outcome measure, in two groups (A, B) of COPD depressed patients matched for: COPD status; depressive status; age; gender. Only the participants randomized in study group A will receive a 6-weeks aerobic exercise intervention.Statistical analysis:All tests are two-tailed and a p value 0.05 was considered significant. The difference between the two groups will be evaluated with Student\u0027s T test for normally distributed data, and with Mann-Whitney\u0027s U test, for those with not normal distribution. The normality of distribution will be evaluated with the Kolmogorov-Smirnov test. Any correlations among the variables under evaluation will be assessed by Spearman r correlation. Variables will be compared using the Chi-squared test or Fisher exact test for categorical variables.Discussion:There is a strong correlation between physical activity and mental health. Several data have suggested that aerobic exercise shows significant effects, comparable to pharmacotherapy and to psychotherapy, on reducing depressive symptomatology. The goal of our study is to propose an effective intervention to reduce the risk of severe depression in this special population, evaluating the variation of HDRS total score after the aerobic exercise intervention.\", \u0027Title\u0027: \u0027Evaluation of Depression In Chronic Obstructive Pulmonary Disease: a Longitudinal Randomized Controlled Trial.\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT02147912\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2015, 11, 1), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT02147912\u0027, \u0027minAgeYears\u0027: 40.0, \u0027StartDate\u0027: neo4j.time.Date(2014, 11, 1), \u0027RecruitmentStatus\u0027: \u0027Unknown status\u0027, \u0027AltmetricAttentionScore\u0027: 1.0, \u0027StartYear\u0027: 2014, \u0027TrialID\u0027: \u0027NCT02147912\u0027, \u0027CompletionYear\u0027: 2015, \u0027Acronym\u0027: \u0027EDIC\u0027, \u0027maxAgeYears\u0027: 80.0}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "2260", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 2260\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Everolimus (Drug), Aromatase Inhibitors (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 110, \u0027BriefTitle\u0027: \u0027Maintenance Aromatase Inhibitors (AIs)+ Everolimus vs AIs in Hormone Receptor Positive Metastatic Breast Cancer Patients\u0027, \u0027Abstract\u0027: \u0027The purpose of this study is to compare maintenance Aromatase Inhibitors (AIs) + everolimus with Aromatase Inhibitors alone after 1st line chemotherapy in patients with HR+ metastatic breast cancer.\\n\\nDetailed Description\\nThe purpose of this study is:to compare the progression free survival (PFS) of AIs/everolimus to AIs administered as maintenance therapy in HR+ advanced breast cancer patients with disease control (Complete Response (CR), Partial Response (PR) or Stable Disease (SD))after 1st line chemotherapy.To evaluate the overall survivalTo assess the safety profileTo evaluate the response rate\u0027, \u0027Title\u0027: \u0027MAINtenance Afinitor: A Randomized Trial Comparing Maintenance Aromatase Inhibitors (AIs) + Everolimus (Afinitor) vs AIs in Hormone Receptor Positive (HR+) Metastatic Breast Cancer Patients With Disease Control After First Line Chemotherapy\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT02511639\u0027, \u0027Gender\u0027: \u0027Female\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2020, 7, 31), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT02511639\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2014, 7, 30), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027StartYear\u0027: 2014, \u0027TrialID\u0027: \u0027NCT02511639\u0027, \u0027CompletionYear\u0027: 2020, \u0027Acronym\u0027: \u0027MAIN-A\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "2264", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 2264\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Bosutinib (Drug), Imatinib (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 536, \u0027BriefTitle\u0027: \u0027A Multicenter Phase 3, Open-Label Study of Bosutinib Versus Imatinib in Adult Patients With Newly Diagnosed Chronic Phase Chronic Myelogenous Leukemia\u0027, \u0027Abstract\u0027: \u0027Phase 3, 2-arm, randomized, open label trial. Patients will be randomized to receive bosutinib or imatinib for the duration of the study.\\n\\nDetailed Description\\nThe study will be open for enrollment until the planned number of approximately 500 Philadelphia Chromosome Positive (Ph+) patients have been randomized (approximately 250 Ph+ patients in each treatment arm; a total of approximately 530 Ph+ and Ph- patients). All patients will be treated and/or followed for approximately 5 years (240 weeks) after randomization until the study has closed. Patients who discontinue study therapy early due to disease progression or intolerance to study medication will continue to be followed yearly for survival for up to approximately 5 years (240 weeks) after randomization.\u0027, \u0027Title\u0027: \u0027A MULTICENTER PHASE 3 RANDOMIZED, OPEN-LABEL STUDY OF BOSUTINIB VERSUS IMATINIB IN ADULT PATIENTS WITH NEWLY DIAGNOSED CHRONIC PHASE CHRONIC MYELOGENOUS LEUKEMIA\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT02130557\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2020, 4, 17), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT02130557\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2014, 7, 15), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027AltmetricAttentionScore\u0027: 25.0, \u0027StartYear\u0027: 2014, \u0027TrialID\u0027: \u0027NCT02130557\u0027, \u0027CompletionYear\u0027: 2020, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "2267", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 2267\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027R2-MANT (Drug), R-MANT (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 128, \u0027BriefTitle\u0027: \u0027Rituximab and Lenalidomide vs Rituximab Alone as Maintenance After R-chemoterapy for Relapsed/Refractory FL Patients\u0027, \u0027Abstract\u0027: \u0027A randomized phase III multicenter trial assessing efficacy and toxicity of a combination of Rituximab and Lenalidomide (R2) vs Rituximab alone as maintenance after chemoimmunotherapy with Rituximab-chemotherapy (R-CHT) for relapsed/refractory FL patients not eligible for autologous transplantation (ASCT)\\n\\nDetailed Description\\nAmong Non-Hodgkin lymphomas (NHL), Follicular Lymphoma (FL) is the second one in terms of frequency, accounting for about 25% of all NHL cases in the western hemisphere. A predominance in females is reported, and the median age at the diagnosis is 60 years.FL cells originates from normal counterparts germinal B cells. At a molecular level, the pathology is thought to be dependent on multiple DNA alterations. However, a large amount of patients (approximately 85%) have t(14;18), with a consequent overexpression of anti-apoptotic protein BCL-2.An additional hallmark of pathology is bone marrow involvement (70% of patients), while this is seldom noticed in other organs. Finally, 20% of patients show high levels of serum lactate dehydrogenase (LDH) and/or B symptoms.FL is actually considered an incurable disease. Although FL responds well to initial chemotherapy, most patients will eventually relapse, requiring multiple subsequent therapeutic regimens during the course of disease to achieve new period of remission, that are nevertheless shorter. Relapsed/refractory FL in advanced stage, especially in older patients, has a relatively poor prognosis, and several patients die for infectious complications and/or progressive disease. This subset of patients usually do not survive more than 5 years.Thus there is a need for new, less toxic and more active treatment in particular for patients with recurrent disease. The addition of Rituximab to chemotherapy showed a clear benefit in terms of overall response rate, quality of response, event-free survival and, in most studies, overall survival; nevertheless, relapses still occur. Moreover Rituximab also proved highly effective when employed as maintenance treatment either following chemotherapy or Rituximab-supplemented chemotherapy. The success of Rituximab maintenance led to the widespread opinion that in the context of indolent lymphomas novel \"smart\" drugs characterized by a good safety profile need to be carefully evaluated not only in the induction but also in the maintenance setting.Autologous stem cell transplantation and radioimmunotherapy are therapeutic option for relapsed/refractory FL patients, but can be considered only for younger or fit patients and can be delivered only in large institutions.Therefore the search of new, more manageable, therapeutic agents with different mechanisms of action, especially for elderly or frail patients, is ongoing.Bendamustine is highly effective in relapsed/refractory indolent non-Hodgkin lymphoma (NHL) and Mantle Cell Lymphoma (MCL), including patients who are refractory to rituximab and those previously treated with other alkylating agents. Therefore, bendamustine is now widely used in this setting and provides another effective treatment option for patients who progress after CHOP-R. Two phase II studies have combined bendamustine (90 mg/m2 days 2-3 every 28 days) with rituximab (375 mg/m2 day 1) and both reported similar results. The overall response rate was 90% (60% CR) for the entire patient population, and median Progression-free survival (PFS) for all patients was 24 months. Based on these encouraging results in the relapsed/refractory setting, the Study group indolent Lymphomas (StiL) initiated a large, randomized, phase III trials of bendamustine (90 mg/m2 days 1-2 every 28 days) plus rituximab (375 mg/m2 day 1). This trial compared B-R with standard CHOP-R (21-day cycles) in previously untreated patients with indolent NHL and MCL. 549 patients with predominantly stage IV disease were enrolled, and the treatment groups were well balanced for all baseline characteristics. Approximately 55% of patients had FL, approximately 20% had MCL, and the remaining 25% had other indolent lymphomas. Although the overall response rate was similar in the B-R and CHOP-R arms (93.8% and 93.5%, respectively), the CR rate was significantly higher in the B-R arm (40.1% compared with 30.8% for CHOP-R; P .03), and the median PFS was significantly longer in the B-R arm (54.8 months v 34.8 months for CHOP-R; P .0002). No difference in survival has been observed thus far, further follow-up of this ongoing study will be required to address whether B-R improves survival compared with CHOP-R. Nevertheless, bendamustine plus rituximab yielded more durable responses and improved PFS compared with CHOP-R in previously untreated patients with indolent lymphomas. Moreover, bendamustine plus rituximab was better tolerated.Lenalidomide is an immunomodulatory agent with multiple mechanisms of action wich include antiproliferative activity as well as microenvironmental effects such as inhibition angiogenesis and stimulation of T-cell mediated response. Lenalidomide given as monotherapy proved to be active, with an acceptable toxicity profile, in B-cell malignancies such as multiple myeloma, chronic lymphocytic leukemia, mantle cell lymphoma and diffuse large B-cell lymphoma.Recent reports on Lenalidomide in FL, both for untreated and relapsed patients, are promising.Forty-three patients with relapsed or refractory indolent non Hodgkin\\\u0027s lymphoma (NHL) were treated with oral Lenalidomide 25 mg once daily on days 1 to 21 of every 28-day cycle for 52 weeks or until progression. Twenty-two of the 43 patients enrolled had FL In this subgroup overall response rate was 27%, with a 9% complete remission rate. Most common adverse events were myelosuppression, fatigue, gastrointestinal events and cutaneous rash, while predominant grade 3/4 serious adverse events were neutropenia and thrombocytopenia. Despite a median duration of response longer than 16.5 months, there was a disappointing median progression-free survival of 4.4 months.Witzig et al. focused on Lenalidomide 25 mg in monotherapy in relapsed/refractory B-cell lymphomas. The cohort of patients was 217, 19 of them had a stage III FL. Regarding this patients subset, ORR was 42%, CR/Cru was 11%, median PFS was 8.9 months, median duration of response was not reached.The cytotoxic effect of Rituximab appears to involve CDC, ADCC and induction of apoptosis. Early studies of Lenalidomide show the potential for high CR rates and long duration of response in FL and Chronic lymphocytic leukemia (CLL). Recent data suggest that the modulation of effector cells by Lenalidomide can enhance the antitumor activity of Rituximab and partially overcome its resistance in cell lines of relapsed/refractory NHL. Lenalidomide appears in fact to greatly enhance the monocyte and NK-mediated ADCC exerted by Rituximab, resulting in an increase of cancer cell killing compared to the single drugs. A synergistic activity between Rituximab and Lenalidomide has been reported in vitro in lymphoma cells and in animal models. Rituximab-lenalidomide (R2) combination has been consequently tested in clinical trials, including untreated or relapsed/refractory indolent NHL, with encouraging results.The first report about the R2 combination in FL was presented at the 51th ASH meeting by Dutia M et al. Sixteen patients with relapsed/refractory indolent NHL have been treated with R2 combination, obtaining a 75% overall response (ORR) rate with an acceptable toxicity; interestingly, efficacy data seem better in FL patients with a 88% ORR. Moreover, in the unfavourable subgroups of rituximab refractory and heavily pre-treated patients, ORR rates were 57% and 70%, respectively. Estimated progression-free survival for all patients is 12 months. The major limitation of the study was the small number of patients, with only 9 FL patient included in the study.Twenty-four patients with indolent B-cell lymphoma, previously resistant to Rituximab, received a Rituximab-Lenalidomide +/- Dexamethasone combination until progression of disease or unacceptable toxicity; Lenalidomide was administered at the dosage of 10 mg, 28 days per course. 28 over 45 patients had FL. No further FL group analysis were reported, but the study allowed to assess that also patients resistant to Rituximab in mono-therapy can benefit from R2, with or without Dexamethasone, achieving higher ORR (~61%) with relatively durable responses.One hundred patients with stage III-IV untreated indolent NHL received the R2 combination in cycles of 28 days (Lenalidomide 20 mg orally once a day from day 1 to day 21 and Rituximab 375 mg/m2 intravenously on day 1). 49 patients (49%) composed the FL subset.The outcome of FL patients was extremely positive, considering the ORR (98%) and the CR/CRu (85%). Moreover, when the R2 treatment was prolonged after 6 courses, a significant improvement was seen for CR/CRu. Finally, the PFS was 83% for FL patients after 24 months, and the toxicity profile was acceptable.In CALGB 50401 randomized study 89 recurrent FL patients were treated with Lenalidomide alone versus R2 combination. ORR were 49% vs 75% and EFS was 1.2 vs 2.0 with a median follow up of 1.5 years.Basing on these promising data, other trials proposed the combination of Lenalidomide and R-CHOP (R2-CHOP), as R-CHOP is the standard treatment for most patients with B-cell lymphomas. Briefly, both Phase I and Phase I/II trials confirmed the potential of the novel combination, although a large multi-centre trial is required to confirm the results.\u0027, \u0027Title\u0027: \u0027A Randomized Phase III Multicenter Trial Assessing Efficacy and Toxicity of a Combination of Rituximab and Lenalidomide (R2) vs Rituximab Alone as Maintenance After Chemoimmunotherapy With Rituximab-chemotherapy (R-CHT) for Relapsed/Refractory FL Patients Not Eligible for Autologous Transplantation (ASCT).\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT02390869\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2027, 12, 1), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT02390869\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2014, 5, 1), \u0027RecruitmentStatus\u0027: \u0027Active, not recruiting\u0027, \u0027AltmetricAttentionScore\u0027: 3.0, \u0027StartYear\u0027: 2014, \u0027TrialID\u0027: \u0027NCT02390869\u0027, \u0027CompletionYear\u0027: 2027, \u0027Acronym\u0027: \u0027FIL_RENOIR12\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "2590", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 2590\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Ozanimod (Drug), Ozanimod placebo (Drug), Interferon beta-1a (Drug), Interferon beta-1a placebo (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 1320, \u0027BriefTitle\u0027: \u0027Efficacy and Safety Study of Ozanimod in Relapsing Multiple Sclerosis\u0027, \u0027Abstract\u0027: \u0027This study is a two-part trial consisting of Part A (see NCT01628393) and Part B, presented within this record.The primary objective of Part B is to assess whether the clinical efficacy of ozanimod (RPC1063) is superior to interferon beta-1a (IFN \u03b2-1a; Avonex\u00ae) in reducing the rate of clinical relapses at the end of Month 24 in patients with relapsing multiple sclerosis (RMS).\\n\\nDetailed Description\\nThis clinical trial (RPC01-201; RADIANCE) consisted of 2 parts, each reported separately on ClinicalTrials.gov: Part A (NCT01628393) and Part B (this record).Part A was a phase 2 study in which two doses of ozanimod were administered daily for 24 weeks with an efficacy and safety comparison to a placebo control and is reported separately as ClinicalTrials.gov record NCT01628393.Part B, reported herein, was a phase 3 study in which two doses of ozanimod were administered daily for a 24 month period compared to an active control, interferon \u03b2-1a. Participants were allowed to enroll in the open-label extension study RPC01-3001 (NCT02576717) or complete the study with a safety follow-up visit 28 days after their last dose of study treatment.\u0027, \u0027Title\u0027: \u0027A Phase 2/3, Multi-center, Randomized, Double-blind, Placebo-controlled (Part A) and Double-blind, Double-dummy, Active-controlled (Part B), Parallel Group Study to Evaluate the Efficacy and Safety of RPC1063 Administered Orally to Relapsing Multiple Sclerosis Patients\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT02047734\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2017, 4, 13), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT02047734\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2013, 12, 3), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027AltmetricAttentionScore\u0027: 50.0, \u0027StartYear\u0027: 2013, \u0027TrialID\u0027: \u0027NCT02047734\u0027, \u0027CompletionYear\u0027: 2017, \u0027Acronym\u0027: \u0027RADIANCE\u0027, \u0027maxAgeYears\u0027: 55.0}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "2592", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 2592\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Lebrikizumab (Drug), Placebo (Drug), Standard of Care (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 348, \u0027BriefTitle\u0027: \u0027A Study of Lebrikizumab in Adolescent Participants With Uncontrolled Asthma Who Are on Inhaled Corticosteroids and a Second Controller Medication\u0027, \u0027Abstract\u0027: \"This randomized, multicenter, double-blind, placebo-controlled, parallel-group study will evaluate the efficacy, safety, and tolerability of lebrikizumab in adolescent participants with asthma whose disease remains uncontrolled despite daily treatment with inhaled corticosteroids (ICS) therapy and at least one second controller medication. Participants will be randomized in a 1:1:1 ratio to receive double-blind treatment with either lebrikizumab (\u0027High\u0027 or \u0027Low\u0027) or placebo, administered as subcutaneous (SC) every 4 weeks (Q4W) for 52 weeks, in addition to their standard-of-care therapy. This will be followed by an optional 52-week double-blind active-treatment extension. The anticipated time on study treatment is up to 104 weeks. Participants who complete the study to Week 104, discontinue prematurely or decide not to take part in the optional active-treatment extension will transition to the 20-week safety follow-up period.\", \u0027Title\u0027: \u0027A Study of Lebrikizumab in Adolescent Participants With Uncontrolled Asthma Who Are on Inhaled Corticosteroids and a Second Controller Medication\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT01875003\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2016, 12, 28), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT01875003\u0027, \u0027minAgeYears\u0027: 12.0, \u0027StartDate\u0027: neo4j.time.Date(2013, 8, 31), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027AltmetricAttentionScore\u0027: 7.0, \u0027StartYear\u0027: 2013, \u0027TrialID\u0027: \u0027NCT01875003\u0027, \u0027CompletionYear\u0027: 2016, \u0027Acronym\u0027: \u0027\u0027, \u0027maxAgeYears\u0027: 17.0}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "2594", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 2594\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027BIIB033 (Drug), Placebo (Other), Avonex (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 2\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 419, \u0027BriefTitle\u0027: \u0027Study to Assess the Efficacy, Safety, Tolerability, and Pharmacokinetics of BIIB033 in Participants With Relapsing Forms of Multiple Sclerosis When Used Concurrently With Avonex\u0027, \u0027Abstract\u0027: \u0027The primary objective of the study is to evaluate the efficacy of BIIB033 in participants with active relapsing multiple sclerosis (MS) when used concurrently with Avonex.Secondary objectives of this study in this study population are to assess the safety, tolerability, and population pharmacokinetics of BIIB033 when used concurrently with Avonex.\u0027, \u0027Title\u0027: \u0027A Randomized, Double-Blind, Placebo-Controlled, Parallel-Group, Dose-Ranging Study to Assess the Efficacy, Safety, Tolerability, and Pharmacokinetics of BIIB033 in Subjects With Relapsing Forms of Multiple Sclerosis When Used Concurrently With Avonex\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT01864148\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2016, 3, 1), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT01864148\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2013, 8, 1), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027AltmetricAttentionScore\u0027: 30.0, \u0027StartYear\u0027: 2013, \u0027TrialID\u0027: \u0027NCT01864148\u0027, \u0027CompletionYear\u0027: 2016, \u0027Acronym\u0027: \u0027SYNERGY\u0027, \u0027maxAgeYears\u0027: 58.0}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "2598", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 2598\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Vinorelbine (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 2\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 120, \u0027BriefTitle\u0027: \u0027Maintenance Low Dose Oral Navelbine In Patients With Non Small Cell Lung Cancer - MA.NI.LA Trial\u0027, \u0027Abstract\u0027: \u0027Non Small Cell Lung Cancer (NSCLC) represents the first cancer related cause of death worldwide with 1.4 millions of deaths every years. Current standard therapies include platinum-containing drugs but at one year from diagnosis the survival rate is still low (30-40%) .The purpose of this study is to evaluate the role of a platinum-free drug, named Vinorelbine, administered by the so called \"metronomic schedule\" in order to prolong the progression free survival of patients.\\n\\nDetailed Description\\nSystemic therapy remains the mainstay of treatment of advanced stage NSCLC. Combination chemotherapy with a platinum-based regimen has emerged as standard therapy for patients with advanced stage disease. Observations supported by the findings of several clinical trial, established the notion that an efficacy plateau had been reached in advanced stage NSCLC patients treated with platinum-containing drugs.Recent phase III trials suggest the benefit of \"switch\" and \"continuing\" maintenance treatment with different drugs. As \"switched therapy\", Vinorelbine has been selected on the base of its anti-mitotic role. In fact, the use of anti-mitotic drugs at lower dose but with higher frequency (metronomic schedule) seems to augment the anti-angiogenetic effect of this kind of drugs, thus augmenting the efficacy of the therapy.Therefore, the purpose of the current study is to evaluate the role of a \"switched maintenance\" with oral vinorelbine administered as a metronomic schedule in terms of Progression Free Survival (PFS) in advanced NSCLC patients with stable disease after first line platinum based chemotherapy.\u0027, \u0027Title\u0027: \u0027Maintenance Metronomic Per OS Navelbine In Advanced NSCLC Patients After Previous Platinum Based Chemotherapy: A Multicenter Randomized Best Supportive Care Controlled Phase II Study - MA.NI.LA. Trial\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT02176369\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2018, 10, 27), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT02176369\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2013, 2, 1), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027StartYear\u0027: 2013, \u0027TrialID\u0027: \u0027NCT02176369\u0027, \u0027CompletionYear\u0027: 2018, \u0027Acronym\u0027: \u0027ONC-MANILA12\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "2600", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 2600\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Surgical (Procedure), Conservative treatment (Procedure)\u0027, \u0027Phase\u0027: \u0027\u0027, \u0027StudyType\u0027: \u0027Observational\u0027, \u0027NumberOfParticipants\u0027: 38, \u0027BriefTitle\u0027: \u0027Spine FA3 - a Prospective, International, Multicenter Cohort Study on Treatment of of AO A3 Thoracolumbar Fractures\u0027, \u0027Abstract\u0027: \u0027Thoracolumbar fractures are the most common spinal fractures with an average annual incidence between 18 and 30 per 100\\\u0027000 inhabitants. The majority of these fractures are AO type A3 (\"burst fractures\"). Although patients with burst fractures report a reduced quality of life and chronic pain, there is no clear evidence whether surgical or conservative treatment offer better functional and back-pain related outcomes. The indications for the selection of an ideal treatment for these fractures without neurological deficits remain controversial. The purpose of this study is to evaluate whether patients with thoracolumbar fractures without neurological deficit being surgically treated show faster recovery and better improvement of function than patients being conservatively treated.\u0027, \u0027Title\u0027: \u0027Comparison of Surgical Versus Conservative Treatment of AO Type A3 Thoracolumbar Fractures Without Neurological Deficits Prospective, International, Multicenter Cohort Study\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT01751633\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2015, 12, 1), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT01751633\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2013, 1, 1), \u0027RecruitmentStatus\u0027: \u0027Terminated\u0027, \u0027StartYear\u0027: 2013, \u0027TrialID\u0027: \u0027NCT01751633\u0027, \u0027CompletionYear\u0027: 2015, \u0027Acronym\u0027: \u0027FA3\u0027, \u0027maxAgeYears\u0027: 65.0}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "2604", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 2604\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Trazodone (Drug), Venlafaxine (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 364, \u0027BriefTitle\u0027: \u0027Trazodone Once a Day in Major Depression Disorder\u0027, \u0027Abstract\u0027: \u0027The study objective is to evaluate the efficacy and safety of trazodone OAD vs venlafaxine extended release (venlafaxine XR) after an 8-week treatment period in patients with major depressive disorder.\\n\\nDetailed Description\\nThis randomized, venlafaxine-controlled, double-blind, parallel design study consists of a Pre-Treatment Phase (screening, wash-out) and a double-blind Treatment Phase (randomization to trazodone OAD or to venlafaxine XR, treatment for 8 weeks and tapering for 1 to 3 weeks). During the Pre-Treatment Phase, patients who sign an informed consent form will undergo initial screening. Potential candidates will be instructed to discontinue antidepressants or prohibited medications (wash-out) for a period specific to taper schedule (based on 5 elimination half-lives of the used medication). On the last day of the Pre-Treatment Phase, patients will be evaluated for the final eligibility, and those qualified will be randomly allocated in a 1:1 proportion to trazodone OAD 300 mg/day (1 week of tapering with trazodone OAD 150 mg/day) or to venlafaxine XR 75 mg/day once daily. After 3 and 5 weeks of treatment, subjects will be evaluated for the response. For non responding patients dose increases (in increments of 75 mg/day) will be done till to reach the maximum of 225 mg/day for venlafaxine XR and 450 mg/day for trazodone OAD. Patients non responding to treatment at the final visit will have their study medication tapered from 1 to 3 weeks, according to the maximum dose reached during the study. In order to prevent relapse of depression symptoms, responders at the final visit may continue the treatment. In this case, an unblinded third party Dispenser will open the treatment code and will prescribe the same medication taken by the patients during the trial, according to the formulation available on the market.\u0027, \u0027Title\u0027: \u0027A Randomized, Double-blind Study Comparing the Efficacy and Safety of Trazodone OAD and Venlafaxine XR in the Treatment of Patients With Major Depressive Disorder.\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT02086929\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2014, 4, 1), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT02086929\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2012, 12, 1), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027StartYear\u0027: 2012, \u0027TrialID\u0027: \u0027NCT02086929\u0027, \u0027CompletionYear\u0027: 2014, \u0027Acronym\u0027: \u0027\u0027, \u0027maxAgeYears\u0027: 75.0}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "2606", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 2606\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Ozanimod (Drug), Placebo (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 2/3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 258, \u0027BriefTitle\u0027: \u0027Efficacy and Safety Study of Ozanimod (RPC1063) in Relapsing Multiple Sclerosis Patients\u0027, \u0027Abstract\u0027: \u0027This study is a two-part trial consisting of Part A (presented in this record) and Part B (see NCT02047734).The primary objective in Part A of this study was to demonstrate the superior efficacy of ozanimod compared to placebo by showing a reduction in the cumulative number of total gadolinium-enhancing (GdE) lesions from Week 12 to Week 24 in patients with relapsing multiple sclerosis (RMS).\u0027, \u0027Title\u0027: \u0027A Phase 2/3, Multi-center, Randomized, Double-blind, Placebo-controlled (Part A) and Double-blind, Double-dummy, Active-controlled (Part B), Parallel Group Study to Evaluate the Efficacy and Safety of RPC1063 Administered Orally to Relapsing Multiple Sclerosis Patients\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT01628393\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2016, 5, 11), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT01628393\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2012, 9, 18), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027AltmetricAttentionScore\u0027: 7.0, \u0027StartYear\u0027: 2012, \u0027TrialID\u0027: \u0027NCT01628393\u0027, \u0027CompletionYear\u0027: 2016, \u0027Acronym\u0027: \u0027RADIANCE\u0027, \u0027maxAgeYears\u0027: 55.0}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "2607", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 2607\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Permanent Cardiac Pacemaker Implantation (Procedure)\u0027, \u0027Phase\u0027: \u0027\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 408, \u0027BriefTitle\u0027: \u0027Right Ventricular Lead Placement in a Pacemaker Population: Evaluation of Apical and Alternative Position\u0027, \u0027Abstract\u0027: \u0027This study is a long-term, prospective, and controlled evaluation of the mechanical dyssynchrony induced by right ventricular apical pacing, both in acute (spontaneous and stimulated) and chronic (12 and 24 months); the study also evaluates the benefit of an alternative pacing site through measures of dyssynchrony in acute and chronic.\\n\\nDetailed Description\\nPermanent cardiac pacing plays an important role in cardiac disease management. Since early studies on right ventricular pacing, apex has been the preferred implant site for transvenous endocardial ventricular leads for several reasons: ease of placement, lead stability as well as the design characteristics of the electrode and the fixation system.It is now also accepted, however, that right ventricle pacing causes a long term deterioration of left ventricular function through complex effects, both at the structural level of the heart wall and at the hemodynamic level in left ventricular load conditions. It is possible that this deterioration is due to a dyssynchrony of contraction induced by pacing at the right ventricular apex. Some authors suggest to pace the right ventricle at alternative sites, i.e. the medium septum (RVS) region, to guarantee a more physiological activation pattern, especially in patients expected to receive high pacing percentages.However, unequivocal evidences that stimulation of the right ventricular septum is more physiological than the apical pacing are still missing.Nonetheless, it should be noted that, although a number of studies refer to RV septum as the alternative site for pacing , poor attention has been paid to the unambiguous definition of RV septum region itself. A clear definition and a proper evaluation of the alternative site is therefore important.Furthermore, from a procedural point of view, it has been demonstrated that acute and chronic electrical performances of the leads positioned at alternative sites, in particular in the region of mid septum, are equivalent to those of the leads positioned at the apical site.The purpose of this study is to perform a comprehensive assessment of the electrical and mechanical measures obtained by pacing standard RV site (Right ventricular apex, RVA) and alternative RV site (right ventricular septum, RVS). Specifically, the two pacing sites will be compared in terms of electrical dyssynchrony, as assessed by ECG criteria, and in terms of mechanical dyssynchrony, as assessed by echocardiographic criteria.The primary end point of the study is defined through the evaluation of dyssynchrony measured both in spontaneous rhythm (Vs) and paced rhythm (Vp). The delay between the time to peak systolic velocity of the septum and the LV free wall will be used to define the degree of dyssynchrony; this measurement will be obtained by TDI echocardiographic technique.Patients will receive any commercially available dual-chamber implantable pacemakers, according to current standard indications. At the end of the implantation and at follow-up visits (12 and 24 months) device programming will follow the clinical practice of the center.\u0027, \u0027Title\u0027: \u0027Right Ventricular Lead Placement in a Pacemaker Population: Evaluation of Apical and Alternative Position - Right Pace Study\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT01647490\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2015, 7, 1), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT01647490\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2012, 4, 1), \u0027RecruitmentStatus\u0027: \u0027Unknown status\u0027, \u0027StartYear\u0027: 2012, \u0027TrialID\u0027: \u0027NCT01647490\u0027, \u0027CompletionYear\u0027: 2015, \u0027Acronym\u0027: \u0027\u0027}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "2610", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 2610\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Extended-release Guanfacine HCl (Intuniv, SPD503) (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 3\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 215, \u0027BriefTitle\u0027: \u0027Access to Extended Release Guanfacine HCl for Subjects Who Participated in Studies SPD503-315 or SPD503-316 in Europe\u0027, \u0027Abstract\u0027: \u0027For subjects in Europe that have already participated in either Study SPD503-315 or SPD503-316. This is an extension study that will allow participants access to Extended-release Guanfacine Hydrochloride (HCl) for up to 2 years. This study will help the sponsor evaluate long-term safety and tolerability of Extended-release Guanfacine HCl (SPD503).\u0027, \u0027Title\u0027: \u0027A Phase 3, Open-label, Multicentre Study to Provide Access to Guanfacine Hydrochloride Extended-release for European Subjects With Attention-deficit/Hyperactivity Disorder (ADHD) Who Participated in Study SPD503-315 or SPD503-316\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT01500694\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2015, 9, 15), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT01500694\u0027, \u0027minAgeYears\u0027: 6.0, \u0027StartDate\u0027: neo4j.time.Date(2012, 3, 20), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027StartYear\u0027: 2012, \u0027TrialID\u0027: \u0027NCT01500694\u0027, \u0027CompletionYear\u0027: 2015, \u0027Acronym\u0027: \u0027\u0027, \u0027maxAgeYears\u0027: 17.0}"}, {"color": "#ADD8E6", "font": {"color": "white"}, "id": "2612", "label": "ClinicalTrial", "shape": "dot", "title": "ID: 2612\nLabels: ClinicalTrial\nProperties: {\u0027Intervention\u0027: \u0027Imatinib mesylate (Drug)\u0027, \u0027Phase\u0027: \u0027Phase 4\u0027, \u0027StudyType\u0027: \u0027Interventional\u0027, \u0027NumberOfParticipants\u0027: 112, \u0027BriefTitle\u0027: \u0027Validation of Digital-PCR Analysis Through Programmed Imatinib Interruption in PCR Negative CML Patients\u0027, \u0027Abstract\u0027: \u0027The purpose of this study is to assess the capability of the dPCR technique to predict the absence of disease relapses after imatinib discontinuation in CML patients with negative Q-RT-PCR results for longer than 18 months.\\n\\nDetailed Description\\nThis study will recruit approximately 100 CML patients under imatinib therapy in complete molecular remission with a history of at least 18 months of consecutive negative standard Q-RT-PCR as performed in their own centers. After signing the informed consent form (ICF), the patients will be tested for dPCR and will discontinue imatinib therapy. Then they will be monitored by standard Q-RT-PCR to assess the maintenance of the molecular remission; collection of data will be prospective as each center will collect the data for 36 months. At the end of this period, a peripheral blood sample for dPCR analysis will be obtained from those patients who will still have undetectable BCR-ABL transcripts by Q-RT-PCR to verify CML eradication. The maintenance of molecular remission by Q-RT-PCR and the survival will be monitored every six months during an additional follow-up of 24 months. Patients found to be positive to BCR-ABL transcripts by standard Q-RTPCR will repeat the test every 2 to 4 weeks until the loss of molecular remission, defined as two consecutive BCR-ABL positive tests with at least one with BCR-ABL/BCR value above 0.1%, or until the end of the study, whichever come first.\u0027, \u0027Title\u0027: \u0027Validation of Digital-PCR Analysis Through Programmed Imatinib Interruption in PCR Negative CML Patients (ISAV)\u0027, \u0027SourceLinkout\u0027: \u0027https://clinicaltrials.gov/show/NCT01578213\u0027, \u0027Gender\u0027: \u0027All\u0027, \u0027Registry\u0027: \u0027ClinicalTrials.gov\u0027, \u0027EndDate\u0027: neo4j.time.Date(2018, 11, 28), \u0027DimensionsURL\u0027: \u0027https://app.dimensions.ai/details/clinical_trial/NCT01578213\u0027, \u0027minAgeYears\u0027: 18.0, \u0027StartDate\u0027: neo4j.time.Date(2011, 11, 9), \u0027RecruitmentStatus\u0027: \u0027Completed\u0027, \u0027StartYear\u0027: 2011, \u0027TrialID\u0027: \u0027NCT01578213\u0027, \u0027CompletionYear\u0027: 2018, \u0027Acronym\u0027: \u0027ISAV\u0027}"}]);
                  edges = new vis.DataSet([]);

                  nodeColors = {};
